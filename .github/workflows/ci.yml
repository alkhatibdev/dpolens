name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, imports, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The contract check compares against the base branch, which needs more
          # than the one commit a shallow checkout gives.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # From the lock file, so the tools that decide whether this build passes
        # are the versions the lock names. Resolving fresh on every run means a
        # release of a linter can fail a commit that was green an hour earlier.
        run: uv sync --frozen --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Import boundaries
        run: uv run lint-imports

      - name: API contract
        # The specification is committed, so a contract change is a diff in the
        # pull request. A changed contract also needs a changelog line.
        run: |
          uv run python scripts/api_contract.py \
            ${{ github.base_ref && format('--base origin/{0}', github.base_ref) || '' }}

      - name: Client configuration
        # The MCP server's instructions, the Claude Code plugin and the Cursor
        # rules file have to say the same thing, and the Compose file has to be
        # valid. None of that is exercised by running the server.
        env:
          # Only to satisfy the two variables the file refuses to start without.
          DPOLENS_OWNER_PASSWORD: checking-the-file-only
          DPOLENS_APP_PASSWORD: checking-the-file-only
        run: |
          uv run python scripts/client_text.py
          docker compose config --quiet

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('packages/dpolens/src/dpolens/engine/embedding/models.py') }}

      - name: Tests
        # Docker is available on the runner, so integration tests start their
        # own Postgres via testcontainers, built from deploy/postgres.
        run: uv run pytest

  contract:
    name: breaking API changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reported rather than refused. A breaking change before 1.0 is allowed and
      # sometimes right; what matters is that the pull request says so out loud.
      - name: Compare the specification with the base branch
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with:
          base: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.base_ref }}/dpolens/docs/openapi.json
          revision: docs/openapi.json
          fail-on-diff: false

  evals:
    name: retrieval evals
    runs-on: ubuntu-latest
    env:
      DPOLENS_DATABASE_URL: postgresql+psycopg://dpolens:dpolens@localhost:5432/dpolens
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # From the lock file, so the tools that decide whether this build passes
        # are the versions the lock names. Resolving fresh on every run means a
        # release of a linter can fail a commit that was green an hour earlier.
        run: uv sync --frozen --all-packages

      - name: Start Postgres
        # Built here rather than declared under services:, which starts its
        # containers before any step has run and so cannot use an image this
        # repository builds. pg_isready is asked for TCP, because the entry
        # point runs a temporary socket-only server while it initialises.
        run: |
          docker build -t dpolens-postgres deploy/postgres
          docker run -d --name dpolens-db -p 5432:5432 \
            -e POSTGRES_USER=dpolens \
            -e POSTGRES_PASSWORD=dpolens \
            -e POSTGRES_DB=dpolens \
            dpolens-postgres
          for _ in $(seq 60); do
            if docker exec dpolens-db pg_isready -h localhost -U dpolens -d dpolens; then
              exit 0
            fi
            sleep 1
          done
          docker logs dpolens-db
          exit 1

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('packages/dpolens/src/dpolens/engine/embedding/models.py') }}

      - name: Load the pack and build the index
        run: |
          uv run alembic upgrade head
          uv run dpolens pack load packs/gdpr
          uv run dpolens index build

      - name: Score retrieval against the published result
        # Fails when recall drops below the last published interval. The pack
        # and the model are fixed, so a drop can only come from a change here.
        run: uv run python scripts/check_evals.py
