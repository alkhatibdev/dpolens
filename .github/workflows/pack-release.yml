name: Pack release

# A law has releases of its own, because a law is amended on the legislature's
# schedule and not on ours. A tag `packs/<slug>/<version>`, such as
# `packs/gdpr/2026.2`, opens a draft release of that pack's archive and its
# checksum for a person to read and publish, and `dpolens pack update gdpr`
# downloads it from there. The tag has to be on main and name the version in the
# pack's own pack.yaml. A tag `pack/<slug>/<version>` is refused: DPOLens 0.2.0
# reads releases under it, and it would read this format's names wrongly.

on:
  push:
    tags: ["packs/**", "pack/**"]

permissions:
  contents: read

# Each action is pinned to a commit, because this workflow writes releases, and
# a tag can be moved to point at different code.
jobs:
  pack:
    name: law pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Refuse the tag DPOLens 0.2.0 reads
        if: startsWith(github.ref_name, 'pack/')
        run: |
          echo "::error::$GITHUB_REF_NAME is the tag DPOLens 0.2.0 reads, and it would read this pack's names wrongly. Tag packs/<slug>/<version> instead."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release only what is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main, and only main is released."
            exit 1
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The command refuses a tag that does not name the pack's own version.
      - name: Write the pack archive
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          slug=$(cut -d/ -f2 <<< "$TAG")
          uv run --frozen --package dpolens dpolens pack archive "packs/$slug" --tag "$TAG" --out dist
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Attest where the archive came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SLUG: ${{ steps.archive.outputs.slug }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          title="$RUNNER_TEMP/title.txt"
          uv run --frozen --package dpolens python - "packs/$SLUG" "$GITHUB_REPOSITORY" "$title" > "$notes" <<'NOTES'
          import sys
          from pathlib import Path

          from dpolens.engine.packs.format import read_pack_metadata

          # The engine's own reader, which knows the names a pack gives in each language.
          pack = read_pack_metadata(Path(sys.argv[1]))
          slug, version, repository = pack.slug, pack.version, sys.argv[2]
          law = pack.name.get("en") or pack.name[pack.authoritative_language]
          Path(sys.argv[3]).write_text(f"{law}, pack {version}", encoding="utf-8")
          name = f"dpolens-pack-{slug}-{version}.tar.gz"
          print(f"**{law}**, pack version {version}, in force from {pack.effective_date:%-d %B %Y}.")
          print()
          print("To load it into an instance that has an earlier version of this pack:")
          print()
          print(f"    docker compose exec api dpolens pack update {slug}")
          print()
          print(f"On a server with no way to the internet, put {name} and its .sha256 side by side")
          print(f"where the instance can read them, and run `dpolens pack import {name}`.")
          print()
          print(f"To check that the file was built here: `gh attestation verify {name} --repo {repository}`.")
          NOTES
          gh release create "$TAG" dist/* --draft --verify-tag --title "$(cat "$title")" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
