# A whole DPOLens instance: a database, a one off setup, the HTTP API, a worker
# for background jobs, the dashboard and the MCP server your editor connects to.
#
#   printf 'DPOLENS_OWNER_PASSWORD=%s\nDPOLENS_APP_PASSWORD=%s\n' \
#     "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
#   docker compose up -d
#
# Then set it up: it asks for your email address, your name and a password for
# the dashboard, then which laws apply to your organisation.
#
#   docker compose exec api dpolens init
#
# The dashboard is at http://localhost:8080, and Tokens makes the token for your
# editor.
#
# Each service names the image of the version this checkout is, and `up`
# downloads it from GitHub's container registry. A version with nothing to
# download, one not released yet, is built from source, and `--build` always
# builds. DPOLENS_VERSION picks another version, and gives a branch built from
# source a name of its own, so it never replaces another checkout's images.

name: dpolens

x-application: &application
  DPOLENS_DATABASE_URL: postgresql://dpolens_app:${DPOLENS_APP_PASSWORD:?generate one, see the top of this file}@db:5432/dpolens

x-database: &database
  <<: *application
  DPOLENS_MIGRATION_DATABASE_URL: postgresql://dpolens_owner:${DPOLENS_OWNER_PASSWORD:?generate one, see the top of this file}@db:5432/dpolens

services:
  db:
    image: ghcr.io/alkhatibdev/dpolens-postgres:${DPOLENS_VERSION:-0.1.0-rc.3}
    build: ./deploy/postgres
    environment:
      POSTGRES_DB: dpolens
      POSTGRES_USER: dpolens_owner
      POSTGRES_PASSWORD: ${DPOLENS_OWNER_PASSWORD:?generate one, see the top of this file}
      # Read by the script that creates the application role, once, when the
      # database is first initialised.
      DPOLENS_APP_PASSWORD: ${DPOLENS_APP_PASSWORD:?generate one, see the top of this file}
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username dpolens_owner --dbname dpolens"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Migrates, loads every pack in the image and the sample policy, and embeds
  # what is not embedded yet. It runs as the role that owns the tables and then
  # exits, which is why the API can run as a role that cannot rewrite its own
  # audit log.
  setup:
    image: ghcr.io/alkhatibdev/dpolens:${DPOLENS_VERSION:-0.1.0-rc.3}
    build:
      context: .
      dockerfile: deploy/dpolens/Dockerfile
    command: ["setup.sh"]
    environment: *database
    volumes:
      - originals:/var/lib/dpolens/originals
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/alkhatibdev/dpolens:${DPOLENS_VERSION:-0.1.0-rc.3}
    build:
      context: .
      dockerfile: deploy/dpolens/Dockerfile
    environment:
      <<: *database
      DPOLENS_SURFACE_TOKEN_FILE: /run/dpolens/surface-token
      # Shown next to a new token. Set it to the address AI assistants really use
      # when the MCP server sits behind a proxy or on another host.
      DPOLENS_PUBLIC_MCP_URL: ${DPOLENS_PUBLIC_MCP_URL:-http://localhost:${DPOLENS_MCP_PORT:-8765}/mcp}
      # Where people open the dashboard, which `dpolens init` names when it is done.
      DPOLENS_PUBLIC_DASHBOARD_URL: ${DPOLENS_PUBLIC_DASHBOARD_URL:-http://localhost:${DPOLENS_DASHBOARD_PORT:-8080}}
      # Passed on from .env when set there, and otherwise left to the defaults that
      # https://dpolens.com/docs/configuration lists, with what each one does.
      DPOLENS_QUERY_LOG_RETENTION_DAYS:
      DPOLENS_REDACTION_PATTERNS:
      DPOLENS_SESSION_IDLE_MINUTES:
      DPOLENS_SESSION_LIFETIME_HOURS:
      DPOLENS_RATE_LIMIT_PER_MINUTE:
      DPOLENS_INTRA_OP_NUM_THREADS:
      # Read by `dpolens pack update`, which runs here, and by nothing else.
      DPOLENS_PACKS_REPOSITORY:
      HTTPS_PROXY:
      NO_PROXY:
    volumes:
      # The credential the API provisions for the MCP server. Both containers
      # run as the same user, because the file is readable by its owner alone.
      - surface:/run/dpolens
      # Uploaded policies' original files, which the worker reads too.
      - originals:/var/lib/dpolens/originals
    ports:
      - "${DPOLENS_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Embeds a policy's clauses once it is published, and runs the daily purge:
  # questions past their retention, ended sessions, used sign-in links, and
  # original files no version points at. It needs no port, and it connects as
  # the application role only.
  worker:
    image: ghcr.io/alkhatibdev/dpolens:${DPOLENS_VERSION:-0.1.0-rc.3}
    build:
      context: .
      dockerfile: deploy/dpolens/Dockerfile
    command: ["dpolens", "worker"]
    environment:
      <<: *application
      # The daily purge deletes by these, so they are the API's values.
      DPOLENS_QUERY_LOG_RETENTION_DAYS:
      DPOLENS_SESSION_IDLE_MINUTES:
      DPOLENS_SESSION_LIFETIME_HOURS:
      DPOLENS_INTRA_OP_NUM_THREADS:
    volumes:
      - originals:/var/lib/dpolens/originals
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # The dashboard's files, and a forward from /v1 to the API, so the browser
  # sees one origin and the session cookie never crosses sites.
  dashboard:
    image: ghcr.io/alkhatibdev/dpolens-dashboard:${DPOLENS_VERSION:-0.1.0-rc.3}
    build:
      context: .
      dockerfile: deploy/dashboard/Dockerfile
    ports:
      - "${DPOLENS_DASHBOARD_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    image: ghcr.io/alkhatibdev/dpolens-mcp:${DPOLENS_VERSION:-0.1.0-rc.3}
    build:
      context: .
      dockerfile: deploy/mcp/Dockerfile
    environment:
      DPOLENS_MCP_API_URL: http://api:8000
      DPOLENS_MCP_SURFACE_TOKEN_FILE: /run/dpolens/surface-token
      # Listening on every interface inside the container, so the published port
      # reaches it. It still answers only to localhost in the Host header; a
      # team instance behind a hostname adds that name to
      # DPOLENS_MCP_ALLOWED_HOSTS.
      DPOLENS_MCP_HOST: 0.0.0.0
      DPOLENS_MCP_ALLOWED_HOSTS: ${DPOLENS_MCP_ALLOWED_HOSTS:-[]}
    volumes:
      - surface:/run/dpolens:ro
    ports:
      - "${DPOLENS_MCP_PORT:-8765}:8765"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/live')"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  database:
  surface:
  originals:
