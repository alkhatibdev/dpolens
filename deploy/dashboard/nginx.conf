# The dashboard: its files, and the API on the same origin.
#
# Forwarding /v1 to the API means the browser talks to one origin, so the
# session cookie is first-party, SameSite=Strict holds, and no cross-origin
# rules are needed anywhere.

# Each request is logged by its path alone. The query string carries what
# somebody asked: the search page keeps the question there, and a filter on the
# questions log keeps its words and the name or email address it looks for.
map $request_uri $path_only {
    ~^(?<path>[^?]*) $path;
}

log_format path_only '$remote_addr [$time_local] "$request_method $path_only $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log path_only;
    # An error about a request names its whole line, query string included, in a
    # format nobody can change. A call the API failed still shows as a 502 above.
    error_log /var/log/nginx/error.log crit;

    # Nothing here loads from anywhere else: no fonts, scripts or styles from a
    # CDN, so a strict policy costs nothing and stops injected scripts running.
    # Styles may be inline, because the menus add a small style element to stop
    # the page scrolling behind them, and static files cannot carry a nonce.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Uploading a policy sends the file itself, up to the 25 MB the API takes.
    location ~ ^/v1/policies(/[a-z0-9-]+/versions)?$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Built files carry a hash in their names, so they never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every other path is a page of the app, which reads it from the address.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
