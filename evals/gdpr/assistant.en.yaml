  - id: courier.handed-on
    topic: courier.handed-on
    question: >-
      sharing customer name and delivery address with a courier third party processor when
      an order is placed
    lang: en
    expected_keys: [gdpr:art-6:para-1, gdpr:art-28:para-1, gdpr:art-28:para-3]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf
    quote: >-
      Article 6(1) of the General Data Protection Regulation ... specifies that processing
      shall be lawful only on the basis of one of six specified conditions set out in
      Article 6(1)(a) to (f)
    note: >-
      Handing a name and address to a courier needs a lawful basis, Article 6(1), here the
      contract with the customer. The query calls the courier a processor, and where it is
      one Article 28 governs the arrangement, so either counts.

  - id: saved-address.kept-for-reuse
    topic: saved-address.kept-for-reuse
    question: >-
      storing a customer's saved delivery postal address on their account for reuse at next
      order
    lang: en
    expected_keys: [gdpr:art-6:para-1, gdpr:art-5:para-1:pt-b, gdpr:art-6:para-4, gdpr:art-5:para-1:pt-e, gdpr:art-17:para-1:pt-a, gdpr:art-25:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf
    quote: >-
      Article 6(1) of the General Data Protection Regulation ... specifies that processing
      shall be lawful only on the basis of one of six specified conditions set out in
      Article 6(1)(a) to (f)
    note: >-
      Keeping an address for the next order needs a lawful basis, Article 6(1). The new use
      has to fit the first one: point (b) of Article 5(1), with its test in Article 6(4).
      And it may be kept no longer than that use lasts: point (e) of Article 5(1), point (a)
      of Article 17(1) and Article 25(2). Any of them counts.

  - id: copy-of-data.copy
    topic: copy-of-data.copy
    question: >-
      what has to happen when somebody asks for a copy of their data
    lang: en
    expected_keys: [gdpr:art-15:para-1, gdpr:art-15:para-3]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf
    quote: >-
      While all elements of Art. 15(1) and (2) together define the content of the right of
      access, Art.15(3) deals with the modalities of access
    note: >-
      A copy of somebody's data is the right of access: Article 15(1) for what it covers,
      Article 15(3) for the copy.

  - id: copy-of-data-format.copy
    topic: copy-of-data-format.copy
    question: >-
      what has to happen when a customer asks for a copy of their data, export format and
      contents
    lang: en
    expected_keys: [gdpr:art-15:para-1, gdpr:art-15:para-3]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf
    quote: >-
      While all elements of Art. 15(1) and (2) together define the content of the right of
