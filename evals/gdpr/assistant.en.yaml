  - id: error-monitoring-service.outside-service
    topic: error-monitoring-service.outside-service
    question: >-
      can we send user id, email and name to an error monitoring service like Sentry
    lang: en
    expected_keys: [gdpr:art-28:para-1, gdpr:art-28:para-3]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      The obligation to use only processors "providing sufficient guarantees" contained in
      Article 28(1) GDPR is a continuous obligation. ... the agreement in place complies
      with Article 28(3) of the GDPR
    note: >-
      Handing personal data to a service that processes it for you is the use of a
      processor: Article 28(1) on choosing one, Article 28(3) on the contract.

