    question: >-
      customer closes account: anonymise personal data but retain order records for
      accounting
    lang: en
    expected_keys: [gdpr:art-17:para-3:pt-b, gdpr:art-6:para-1:pt-c]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf
    quote: >-
      compliance with a legal obligation pursuant to Article 17(3)(b) ... a legal obligation
      in national law to retain certain personal data for accounting purposes for a
      specified number of years. The appropriate legal basis is Article 6(1)(c), and
      retention will take place even if the contract is terminated.
    note: >-
      Keeping records the law requires, such as for accounting, is the exception in point
      (b) of Article 17(3), on the legal basis of point (c) of Article 6(1). Either counts.

