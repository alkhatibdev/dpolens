  - id: dietary-requirements.special-category-inferred
    topic: dietary-requirements.special-category-inferred
    question: >-
      storing customers' dietary requirements such as allergies and halal on their account
    lang: en
    expected_keys: [gdpr:art-9:para-1]
    source: https://www.edpb.europa.eu/system/files/2021-04/edpb_guidelines_082020_on_the_targeting_of_social_media_users_en.pdf
    quote: >-
      Processing of these data are in principle prohibited according to Article 9(1). ... it
      may be possible to infer someone's state of health from the records of their food
      shopping
    note: >-
      Details that reveal health or religious belief are a special category, which Article
      9(1) forbids processing unless an exemption applies.

  - id: dietary-requirements.when-allowed
    topic: dietary-requirements.when-allowed
    question: >-
      storing customers' dietary requirements such as allergies and halal on their account
    lang: en
    expected_keys: [gdpr:art-9:para-2]
    source: https://www.edpb.europa.eu/system/files/2021-04/edpb_guidelines_082020_on_the_targeting_of_social_media_users_en.pdf
    quote: >-
      rely on an exemption in Article 9(2) GDPR, such as explicit consent according to
      Article 9(2)(a) GDPR
    note: >-
      When a special category may be processed is the list of exemptions in Article 9(2).

