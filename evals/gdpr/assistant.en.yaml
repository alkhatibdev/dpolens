  - id: country-from-ip.new-use
    topic: country-from-ip.new-use
    question: >-
      can we use a customer's IP address at signup to determine their country and store it
    lang: en
    expected_keys: [gdpr:art-6:para-1, gdpr:art-5:para-1:pt-b, gdpr:art-6:para-4]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf
    quote: >-
      Article 6(1) of the General Data Protection Regulation ... specifies that processing
      shall be lawful only on the basis of one of six specified conditions set out in
      Article 6(1)(a) to (f)
    note: >-
      Deriving something new from data already held needs a lawful basis, Article 6(1), and
      has to fit the purpose the data was collected for: point (b) of Article 5(1), with the
      test of a new purpose in Article 6(4). Any of them counts.

