  - id: delivery-addresses.kept-then-erased
    topic: delivery-addresses.kept-then-erased
    question: >-
      how long can we keep customer delivery addresses on past orders, and when must they be
      erased
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-e, gdpr:art-17:para-1, gdpr:art-25:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
    quote: >-
      The controller shall limit the retention period to what is necessary for the purpose.
      If personal data is no longer necessary for the purpose of the processing, then it
      shall by default be deleted or anonymized. The length of the period of retention will
      therefore depend on the purpose of the processing in question. This obligation is
      directly related to the principle of storage limitation in Article 5(1)(e)
    note: >-
      How long data may be kept and when it has to go are one rule, stated twice: storage
      limitation, point (e) of Article 5(1), and the duty to erase what is no longer needed,
      Article 17(1). Article 25(2) makes it the default a system must have. Any of them
      counts.

