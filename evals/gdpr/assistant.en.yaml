  - id: marketing-existing-customers.consent-or-another-basis
    topic: marketing-existing-customers.consent-or-another-basis
    question: >-
      can we send marketing emails to existing customers who ordered before about new
      products, or is consent required
    lang: en
    expected_keys: [gdpr:art-6:para-1, gdpr:art-21:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf
    quote: >-
      Consent remains one of six lawful bases to process personal data, as listed in Article
      6 of the GDPR.
    note: >-
      Whether consent is required is answered by the lawful bases of Article 6(1), of which
      consent is one. Article 21(2), the right to object to direct marketing, is there
      because marketing can rest on another basis, so it counts too.

