  - id: copy-of-data-format.format
    topic: copy-of-data-format.format
    question: >-
      what has to happen when a customer asks for a copy of their data, export format and
      contents
    lang: en
    expected_keys: [gdpr:art-15:para-3, gdpr:art-20:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf
    quote: >-
      Whilst the right of data portability under Art. 20 GDPR requires that the information
      is provided in a machine readable format, the right to information under Art. 15 does
      not.
    note: >-
      The form a copy takes is Article 15(3), a commonly used electronic form. A
      machine-readable export is the right to portability, Article 20(1), so either counts.

