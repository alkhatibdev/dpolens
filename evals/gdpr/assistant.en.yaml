      marketing emails consent at signup, recording the customer's choice
    lang: en
    expected_keys: [gdpr:art-6:para-1:pt-a, gdpr:art-4:pt-11, gdpr:art-7:para-2, gdpr:art-7:para-4]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf
    quote: >-
      Consent remains one of six lawful bases to process personal data, as listed in Article
      6 of the GDPR.
    note: >-
