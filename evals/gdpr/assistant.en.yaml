  - id: request-bodies-logged.no-more-than-needed
    topic: request-bodies-logged.no-more-than-needed
    question: >-
      can we log full request bodies containing customer personal data for debugging
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-c, gdpr:art-25:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
    quote: >-
      Limit the amount of personal data collected to what is necessary for the purpose ...
      Art. 5(1)(c) GDPR
    note: >-
      Logging or storing more than the purpose needs is the question of data minimisation,
      point (c) of Article 5(1). Article 25(2) makes the same limit the default a system
      must have, so it counts too.

