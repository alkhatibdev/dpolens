      accounting
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-e, gdpr:art-17:para-1, gdpr:art-25:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
    quote: >-
      the principle of storage limitation in Article 5(1)(e) ... The personal data shall be
      deleted when the membership is terminated and there is no legal basis for further
      storage of the data.
    note: >-
      What happens to personal data when an account closes is storage limitation, point (e)
      of Article 5(1), and the duty to erase what is no longer needed, Article 17(1).
      Article 25(2) makes it the default a system must have. Any of them counts.

  - id: account-closed-orders-kept.kept-by-law
