# GDPR practice set, in the words AI assistants send.
#
# An AI assistant typed these queries: Claude Code, working through the coding tasks of
# the trigger test (../trigger). They are used while improving retrieval, as tuning.en.yaml
# is, and produce no published score.
#
# Such a query is often a description, not a question, and often asks two things at
# once. Each thing a query asks is a part, with an entry of its own under the same
# words. `topic` names the group and the part, so the same part asked in other words is
# one topic, and a query is answered when each of its parts is.
#
# Up to two wordings of a group are kept, the shortest and the longest that were sent.
#
# Every label is tied to an EDPB guideline: `quote` gives its own words, with the words
# that name the article, and `note` says why that rule is the one the part asks about.
# Where more than one clause answers a part, each is listed and any one counts. A label
# follows what the guidance says of the nearest case, and a clause counts only when
# reading it alone answers the part.
# See ../README.md before adding one.

questions:
  - id: ip-logs.allowed
    topic: ip-logs.allowed
    question: >-
      IP address logging legal basis and retention
    lang: en
    expected_keys: [gdpr:art-6:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf
    quote: >-
      Article 6(1) of the General Data Protection Regulation ... specifies that processing
      shall be lawful only on the basis of one of six specified conditions set out in
      Article 6(1)(a) to (f)
    note: >-
      Whether it may be done at all is the question of a lawful basis, and Article 6(1)
      lists them.

  - id: ip-logs.how-long-logs
    topic: ip-logs.how-long-logs
    question: >-
      IP address logging legal basis and retention
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-e, gdpr:art-17:para-1:pt-a, gdpr:art-25:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
    quote: >-
      the principle of storage limitation in Article 5(1)(e) ... Controllers shall determine
      what personal data and length of storage is necessary for back-ups and logs.
    note: >-
      How long a log may be kept is storage limitation, point (e) of Article 5(1), which the
      EDPB applies to logs by name. Point (a) of Article 17(1) says the same from the other
      side, erase what the purpose no longer needs, and Article 25(2) makes it the default a
      system must have, so they count too.

