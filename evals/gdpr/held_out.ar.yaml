# GDPR: questions people ask, written blind (in Arabic).
#
# A person wrote these in their own words, the way they would ask while building a product,
# before reading any eval set or search result, and without looking anything up. Nobody searched
# them before these labels were fixed. A question that asks two things answered by different
# rules is an entry for each, under the same words.
#
# Every label rests on the words of the EDPB in `quote`; `note` says why that clause answers.
# Where the guide gives the rule without the article's number, the note says so. Where more
# than one clause answers, each is listed and any one counts.

questions:

  - id: q03
    topic: q03
    question: >-
      لو شلنا الاسم وحطينا user ID بس لسه نقدر نعرف الشخص، هل البيانات دي تعتبر personal data؟
    lang: ar
    expected_keys: [gdpr:art-4:pt-1, gdpr:art-4:pt-5]
    source: https://www.edpb.europa.eu/system/files/2025-01/edpb_guidelines_202501_pseudonymisation_en.pdf
    quote: >-
      pseudonymised data, which could be attributed to a natural person by the use of additional
      information, remains information related to an identifiable natural person, and thus is
      personal data (Rec. 26 GDPR). ... Art. 4(5) GDPR defines pseudonymisation as a manner of
      processing with prescribed effects
    note: >-
      Data that can still be tied to a person through an ID is pseudonymised, Article 4(5), and
      stays personal data, Article 4(1). Either counts.

  - id: q05
    topic: q05
    question: >-
      هل نقدر نعتمد على legitimate interests عشان نستخدم بيانات المستخدمين في fraud detection؟
    lang: ar
    expected_keys: [gdpr:art-6:para-1:pt-f]
    source: https://www.edpb.europa.eu/system/files/2024-10/edpb_guidelines_202401_legitimateinterest_en.pdf
    quote: >-
      According to Recital 47 GDPR, data processing in the field of fraud prevention may find
      its legal basis in Article 6(1)(f) GDPR.
    note: >-
      Legitimate interests is point (f) of Article 6(1), which the EDPB names as the basis fraud
      prevention may rest on.

  - id: q07
    topic: q07
    question: >-
      شنو لازم نوضح في privacy notice قبل ما نجمع بيانات التسجيل؟
    lang: ar
    expected_keys: [gdpr:art-13:para-1, gdpr:art-13:para-2]
    source: https://ec.europa.eu/newsroom/article29/redirection/document/51025
    quote: >-
      Articles 13 and 14 set out information which must be provided to the data subject at the
      commencement phase of the processing cycle ... Article 13 applies to the scenario where
      the data is collected from the data subject.
    note: >-
      What people are told when their data is collected from them is Article 13: paragraph 1
      lists the information, paragraph 2 adds what fairness and transparency need. Either
      counts.

  - id: q14
    topic: q14
    question: >-
      لو التطبيق رفض طلب أو اتخذ قرار مهم عن المستخدم بشكل automated بالكامل، شنو حقوقه؟
    lang: ar
    expected_keys: [gdpr:art-22:para-1, gdpr:art-22:para-3]
    source: https://ec.europa.eu/newsroom/article29/redirection/document/49826
    quote: >-
      Article 22(1) establishes a general prohibition for decision-making based solely on
      automated processing. ... safeguards, such as the right to obtain human intervention and
      the right to challenge the decision (addressed in Article 22(3)).
    note: >-
      A decision made solely by automated means with a significant effect is Article 22(1);
      where one of its exceptions applies, Article 22(3) gives the rights to human intervention,
      to express a view and to contest it. Either counts.

  - id: q21
    topic: q21
    question: >-
      هل بيانات health اللي المستخدم بيدخلها في التطبيق محتاجة شروط أو موافقات إضافية بموجب
      GDPR؟
    lang: ar
    expected_keys: [gdpr:art-9:para-1, gdpr:art-9:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf
    quote: >-
      Article 9(2) does not recognize "necessary for the performance of a contract" as an
      exception to the general prohibition to process special categories of data. ... Should
      none of the exceptions (b) to (j) apply, obtaining explicit consent in accordance with the
      conditions for valid consent in the GDPR remains the only possible lawful exception to
      process such data.
    note: >-
      Health data is a special category: Article 9(1) forbids processing it unless an exception
      in Article 9(2) applies, explicit consent among them. Either counts.

  - id: q30
    topic: q30
    question: >-
      متى لازم نسوي Data Protection Impact Assessment قبل إطلاق feature جديدة؟
    lang: ar
    expected_keys: [gdpr:art-35:para-1, gdpr:art-35:para-3]
    source: https://ec.europa.eu/newsroom/article29/redirection/document/47711
    quote: >-
      A DPIA is only required when the processing is " likely to result in a high risk to the
      rights and freedoms of natural persons " (Article 35(1) ).
    note: >-
      An impact assessment is needed before processing likely to result in a high risk, Article
      35(1); Article 35(3) lists cases where it is always needed. Either counts.
