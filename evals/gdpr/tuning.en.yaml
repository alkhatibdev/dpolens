# GDPR tuning set.
#
# These questions are used while improving retrieval. The published score comes
# from held_out.en.yaml, which this set never touches.
#
# Every entry names the guidance that ties the question to the clause. The
# expected keys come from that guidance, not from what the search happens to
# return today. See ../README.md before adding one.
#
# Fifty topics. The first twenty are labelled from the ICO's guidance. The thirty
# after them were drawn at random from the clauses no question used, leaving out any
# close to a held-out topic, and each is labelled from an EDPB guideline,
# recommendation or report, quoting its own words. The ICO's pages refuse automated
# reading, and the source check can read the EDPB's.

questions:
  - id: erasure-request
    question: A user asked us to delete their account and all their data. Do we have to?
    lang: en
    expected_keys: [gdpr:art-17:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/individual-rights/right-to-erasure/

  - id: retention-period
    question: How long are we allowed to keep personal data we collected?
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-e]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/storage-limitation/
    note: The storage limitation principle. Phrased the way a developer asks it.

  - id: lawful-basis
    question: What makes processing lawful in the first place?
    lang: en
    expected_keys: [gdpr:art-6:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/lawful-basis/a-guide-to-lawful-basis/
    note: The six lawful bases the guide sets out are Article 6(1).

  - id: breach-deadline
    question: We had a data breach. How quickly must we tell the regulator?
    lang: en
    expected_keys: [gdpr:art-33:para-1]
    source: https://ico.org.uk/for-organisations/report-a-breach/personal-data-breach/personal-data-breaches-a-guide/

  - id: dpo-required
    question: Do we need a DPO?
    lang: en
    expected_keys: [gdpr:art-37:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/accountability-and-governance/guide-to-accountability-and-governance/accountability-and-governance/data-protection-officers/
    note: >-
      The corpus never writes "DPO", only "data protection officer". Kept
      deliberately as an abbreviation the text does not contain.

  - id: subject-access
    question: Someone wants a copy of everything we hold about them.
    lang: en
    expected_keys: [gdpr:art-15:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/individual-rights/right-of-access/
    note: The right to a copy of one's personal data is Article 15(1).

  - id: security-measures
    question: What security do we actually have to implement?
    lang: en
    expected_keys: [gdpr:art-32:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/security/a-guide-to-data-security/

  - id: export-data
    question: Do we have to let users export their data to another service?
    lang: en
    expected_keys: [gdpr:art-20:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/individual-rights/right-to-data-portability/

  - id: childrens-consent
    question: Can a 13 year old sign up without a parent?
    lang: en
    expected_keys: [gdpr:art-8:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/childrens-information/children-and-the-uk-gdpr/what-are-the-rules-about-an-iss-and-consent/

  - id: when-dpia
    question: When do we have to run a data protection impact assessment?
    lang: en
    expected_keys: [gdpr:art-35:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/accountability-and-governance/data-protection-impact-assessments-dpias/when-do-we-need-to-do-a-dpia/

  - id: records-of-processing
    question: Do we have to keep a record of what processing we do?
    lang: en
    expected_keys: [gdpr:art-30:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/accountability-and-governance/documentation/

  - id: transfer-abroad
    question: Can we host user data on servers outside Europe?
    lang: en
    expected_keys: [gdpr:art-46:para-1, gdpr:art-44]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/international-transfers/
    note: Either the general principle or the safeguards clause answers this.

  - id: privacy-notice
    question: What do we have to tell people when we collect their data?
    lang: en
    expected_keys: [gdpr:art-13:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/individual-rights/right-to-be-informed/
    note: The information to give when collecting data from the person is Article 13(1).

  - id: automated-decisions
    question: Can we let an algorithm decide whether to approve someone?
    lang: en
    expected_keys: [gdpr:art-22:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/automated-decision-making-and-profiling/
    note: The right not to be subject to a solely automated decision is Article 22(1).

  - id: proving-consent
    question: Do we need to keep proof that a user agreed?
    lang: en
    expected_keys: [gdpr:art-7:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/lawful-basis/consent/what-is-valid-consent/

  - id: collect-less
    question: Can we store extra fields we might need later?
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-c]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/data-minimisation/
    note: Data minimisation, collecting no more than is necessary, is point (c) of Article 5(1).

  - id: keep-data-accurate
    question: Whose job is it to keep the data correct and up to date?
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-d]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/accuracy/
    note: The accuracy principle is point (d) of Article 5(1).

  - id: object-to-processing
    question: Can someone tell us to stop processing their data altogether?
    lang: en
    expected_keys: [gdpr:art-21:para-1]
    source: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/individual-rights/individual-rights/right-to-object/

  - id: complain-about-us
    question: Where can a user complain if they think we mishandled their data?
    lang: en
    expected_keys: [gdpr:art-77:para-1]
    source: https://ico.org.uk/make-a-complaint/data-protection-complaints/
    note: The right to lodge a complaint with a supervisory authority is Article 77(1).

  - id: sue-for-damages
    question: Can someone claim compensation from us for a breach?
    lang: en
    expected_keys: [gdpr:art-82:para-1]
    source: https://ico.org.uk/make-a-complaint/data-protection-complaints/
    note: The right to compensation for damage caused by an infringement is Article 82(1).

  - id: new-subprocessor
    question: We're a SaaS vendor processing data for our customers. Can we start using a new subcontractor without asking them first?
    lang: en
    expected_keys: [gdpr:art-28:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      Article 28(2) GDPR stipulates that the processor shall not engage another processor
      without prior specific or general written authorisation of the controller

  - id: consult-regulator-first
    question: Our impact assessment found a high risk we can't bring down. Do we have to go to the regulator before we launch?
    lang: en
    expected_keys: [gdpr:art-36:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/2023-06/edpb_recommendations_20221_bcr-c_v2_en.pdf
    quote: >-
      prior to processing, consult the Competent SA (see Article 36 GDPR)
    note: The EDPB's recommendations on binding corporate rules, stating for a member acting as a controller the duty Article 36(1) gives every controller.

  - id: storing-is-processing
    question: We only store the data on our servers and never look at it. Does that still count as processing?
    lang: en
    expected_keys: [gdpr:art-4:pt-2]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      Article 4(2) GDPR defines the processing of personal data as "any operation or set
      of operations which is performed on personal data or on sets of personal data"

  - id: consent-stands-out
    question: Our sign-up page asks for consent inside a long block of legal text. Does the consent request have to stand out on its own?
    lang: en
    expected_keys: [gdpr:art-7:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf
    quote: >-
      Article 7(2) addresses ... the request for consent should be clearly distinguishable
      from the other matters
    note: Kept to how the request is presented, not whether consent can be a condition of the service, which the held-out set asks.

  - id: choosing-a-vendor
    question: What should we check before we pick a cloud provider to handle our users' data?
    lang: en
    expected_keys: [gdpr:art-28:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      The obligation to use only processors "providing sufficient guarantees" contained in
      Article 28(1) GDPR is a continuous obligation.

  - id: controller-measures
    question: As the company that collects the data, what does the law expect us to put in place ourselves?
    lang: en
    expected_keys: [gdpr:art-24:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      Article 24, which states that the controller shall implement appropriate technical
      and organisational measures to ensure and to be able to demonstrate that processing
      is performed in accordance with the GDPR.
    note: Hard because Articles 25(1) and 32(1) also ask for appropriate technical and organisational measures, for design and for security. The controller's general duty to have them, and to be able to show it, is Article 24(1).

  - id: dpo-other-roles
    question: Can our head of IT also be our data protection officer?
    lang: en
    expected_keys: [gdpr:art-38:para-6]
    source: https://www.edpb.europa.eu/system/files/documents/2024-01/edpb_report_20240116_cef_dpo_en.pdf
    quote: >-
      While Article 38(6) GDPR does allow DPOs to fulfil other tasks and duties, it is up
      to the controller or processor to ensure that they do not result in a conflict of
      interests
    note: The EDPB's 2024 report on the position of DPOs, from its coordinated enforcement action.

  - id: prove-compliance
    question: Is it enough to follow the rules, or do we also have to be able to prove that we do?
    lang: en
    expected_keys: [gdpr:art-5:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      The GDPR, in Article 5(2), explicitly introduces the accountability principle

  - id: decide-purpose-first
    question: Do we have to decide what the data is for before we collect it, or can we work that out later?
    lang: en
    expected_keys: [gdpr:art-5:para-1:pt-b]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf
    quote: >-
      Article 5(1)(b) of the GDPR provides for the purpose limitation principle ... not
      further processed in a manner that is incompatible with those purposes.

  - id: eu-representative
    question: We're a startup in Canada with no office in Europe, but we have users there. Do we need someone to represent us in the EU?
    lang: en
    expected_keys: [gdpr:art-27:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_3_2018_territorial_scope_after_public_consultation_en_1.pdf
    quote: >-
      In accordance with Article 27, the data controller will have to designate a
      representative in the Union.

  - id: group-transfer-rules
    question: We're a group of companies in several countries. Can one set of internal rules cover sending staff data from our EU offices to our offices outside Europe?
    lang: en
    expected_keys: [gdpr:art-47:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/2023-06/edpb_recommendations_20221_bcr-c_v2_en.pdf
    quote: >-
      The approval confirms that the requirements set out in Article 47 GDPR are met
    note: Binding corporate rules. Paragraph 1 is their approval and what they must do, which is what makes them usable.

  - id: keep-despite-erasure
    question: A customer wants everything deleted, but we have to keep invoices for tax. Can we refuse to delete those?
    lang: en
    expected_keys: [gdpr:art-17:para-3]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf
    quote: >-
      including compliance with a legal obligation pursuant to Article 17(3)(b), or the
      establishment, exercise or defence of legal claims, pursuant to Article 17(3)(e)

  - id: largest-fines
    question: What's the biggest fine we could get for breaking GDPR?
    lang: en
    expected_keys: [gdpr:art-83:para-5, gdpr:art-83:para-6]
    source: https://www.edpb.europa.eu/system/files/documents/2023-06/edpb_guidelines_042022_calculationofadministrativefines_en.pdf
    quote: >-
      infringements punishable under Article 83(5) and (6) GDPR
    note: Article 83(6) sets the same maximum for not complying with an order of the supervisory authority, so either counts.

  - id: research-safeguards
    question: We want to use customer data for research and statistics. What safeguards does the law expect from us?
    lang: en
    expected_keys: [gdpr:art-89:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf
    quote: >-
      As long as appropriate safeguards are in place, such as the requirements under
      Article 89(1)

  - id: what-consent-is
    question: What actually counts as valid consent? Is ticking a box enough?
    lang: en
    expected_keys: [gdpr:art-4:pt-11]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf
    quote: >-
      Article 4(11) of the GDPR defines consent as: "any freely given, specific, informed
      and unambiguous indication of the data subject's wishes

  - id: regulator-asks
    question: The regulator emailed us asking how we handle customer data. Do we have to answer?
    lang: en
    expected_keys: [gdpr:art-31]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_3_2018_territorial_scope_after_public_consultation_en_1.pdf
    quote: >-
      cooperate with the supervisory authority in the performance of its tasks, as per
      Article 31

  - id: make-rights-easy
    question: Can we make people send a letter by post to use their privacy rights, instead of doing it in the app?
    lang: en
    expected_keys: [gdpr:art-12:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf
    quote: >-
      in line with its obligation to facilitate the exercise of data subjects rights (Art.
      12(2) GDPR)

  - id: private-by-default
    question: Should new user profiles be public or private by default?
    lang: en
    expected_keys: [gdpr:art-25:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
    quote: >-
      Article 25(2) further states that personal data shall not be made accessible,
      without the individual's intervention

  - id: staff-on-instructions
    question: Can our support staff look at customer accounts for their own reasons, outside what we tell them to do?
    lang: en
    expected_keys: [gdpr:art-29]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      In accordance with Article 29, they are also bound by the controller's instructions.

  - id: is-it-a-breach
    question: A laptop with customer records was stolen, but nobody has opened the files. Is that a data breach?
    lang: en
    expected_keys: [gdpr:art-4:pt-12]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202209_personal_data_breach_notification_v2.0_en.pdf
    quote: >-
      The GDPR defines a "personal data breach" in Article 4(12) as: "a breach of security
      leading to the accidental or unlawful destruction, loss, alteration, unauthorised
      disclosure of, or access to, personal data transmitted, stored or otherwise
      processed."

  - id: copy-format
    question: Someone asked by email for a copy of their data. What format should we send it in?
    lang: en
    expected_keys: [gdpr:art-15:para-3]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf
    quote: >-
      other formats may also be considered to be commonly used within the meaning of
      Article 15(3)

  - id: dpo-independence
    question: Can management tell our DPO what conclusions to reach, or let them go for raising problems?
    lang: en
    expected_keys: [gdpr:art-38:para-3]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_3_2018_territorial_scope_after_public_consultation_en_1.pdf
    quote: >-
      Article 38(3) establishes some basic guarantees to help ensure that DPOs are able to
      perform their tasks with a sufficient degree of autonomy within their organisation.

  - id: new-purpose-compatible
    question: We want to use customer data we already have for something new. How do we know if the new use is allowed?
    lang: en
    expected_keys: [gdpr:art-6:para-4]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
    quote: >-
      Controllers should also be careful not to extend the boundaries of "compatible
      purposes" of Article 6(4)

  - id: are-we-controller
    question: We decide what user data our app collects and why. Does that make us the controller?
    lang: en
    expected_keys: [gdpr:art-4:pt-7]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      A controller is defined by Article 4(7) GDPR as "the natural or legal person, public
      authority, agency or other body which, alone or jointly with others, determines the
      purposes and means of the processing of personal data

  - id: privacy-by-design
    question: What does privacy by design mean in practice when we build a new feature?
    lang: en
    expected_keys: [gdpr:art-25:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
    quote: >-
      the requirements to data protection by design in Article 25(1)

  - id: refusing-a-request
    question: We've decided not to act on a user's request about their data. Do we have to tell them why?
    lang: en
    expected_keys: [gdpr:art-12:para-4]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf
    quote: >-
      they have to inform the data subject of the reasons without delay and at the latest
      within one month (Art. 12(4) GDPR)
    note: Kept to the reasons. When a request must be answered at all is Article 12(3), which the held-out set asks.

  - id: dpo-qualifications
    question: What skills or qualifications does our data protection officer need?
    lang: en
    expected_keys: [gdpr:art-37:para-5]
    source: https://www.edpb.europa.eu/system/files/documents/2024-01/edpb_report_20240116_cef_dpo_en.pdf
    quote: >-
      Article 37(5) GDPR explicitly requires that the DPO have 'expert knowledge'
    note: The EDPB's 2024 report on the position of DPOs, from its coordinated enforcement action.

  - id: eu-office-processing-abroad
    question: We're based in Berlin, but all our processing runs on servers outside the EU. Does GDPR still apply to it?
    lang: en
    expected_keys: [gdpr:art-3:para-1]
    source: https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_3_2018_territorial_scope_after_public_consultation_en_1.pdf
    quote: >-
      Article 3 of the GDPR defines the territorial scope of the Regulation on the basis
      of two main criteria
    note: The establishment criterion, Article 3(1), applies whether or not the processing takes place in the Union.

  - id: processor-breach
    question: We host data for our clients and just had a breach. Who do we tell first, the regulator or the client?
    lang: en
    expected_keys: [gdpr:art-33:para-2]
    source: https://www.edpb.europa.eu/system/files/documents/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf
    quote: >-
      has a duty to notify the controller without undue delay after becoming aware of a
      personal data breach (Article 33(2))

  - id: verify-requester
    question: Someone emailed asking for all their data, but we're not sure it's really them. Can we ask for proof of identity?
    lang: en
    expected_keys: [gdpr:art-12:para-6]
    source: https://www.edpb.europa.eu/system/files/documents/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf
    quote: >-
      the controller may request the provision of additional information necessary to
      confirm the identity of the data subject (Art.12(6) GDPR)
