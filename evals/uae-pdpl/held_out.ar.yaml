# The UAE's data protection law: questions people ask, written blind (in Arabic).
#
# A person wrote these in their own words, the way they would ask while building a product,
# before reading any eval set or search result, and without looking anything up. Nobody searched
# them before these labels were fixed. A question that asks two things answered by different
# rules is an entry for each, under the same words.
#
# Every label rests on the words of a law firm's published guide in `quote`; `note` says why that clause answers.
# Where the guide gives the rule without the article's number, the note says so. Where more
# than one clause answers, each is listed and any one counts.

questions:

  - id: q03
    topic: q03
    question: >-
      هل رقم الهاتف أو device ID يعتبر personal data لو بنقدر نربطه بحساب المستخدم؟
    lang: ar
    expected_keys: [uae-pdpl:art-1:def-personal-data]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      "Personal Data" is defined as any data relating to an identified natural person, or one
      who can be identified directly or indirectly by way of linking data, using identifiers
      such as name, voice, picture, identification number, online identifier, geographic
      location
    note: >-
      Whether a phone number or a device ID linked to an account is personal data is the
      definition in Article 1: data about a person who can be identified directly or indirectly
      by linking data. The guide gives the definition without numbering the article.

  - id: q04
    topic: q04
    question: >-
      هل نحتاج consent منفصل عشان نستخدم analytics غير الضرورية داخل التطبيق؟
    lang: ar
    expected_keys: [uae-pdpl:art-4, uae-pdpl:art-6:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases
    note: >-
      Analytics the service does not need rests on consent unless a case in Article 4 applies,
      and Article 6(1) sets what valid consent requires. Either counts.

  - id: q06
    topic: q06
    question: >-
      هل نقدر نستخدم بيانات الحجز عشان نرسل للمستخدم عروض لخدمات ثانية؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-2, uae-pdpl:art-4, uae-pdpl:art-17:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      General Data Protection Controls (Article 5) Under the PDPL, Personal Data must be
      processed according to the following controls: ... Personal Data must be collected for a
      specific and clear purpose, and may not be processed at any subsequent time in a manner
      incompatible with that purpose. ... Personal Data may not be kept after fulfilling the
      purpose of Processing thereof.
    note: >-
      Using booking data to offer other services is a later use, which has to fit the purpose it
      was collected for, Article 5(2), and needs a basis, Article 4. Article 17(1), the right to
      stop processing for direct marketing, counts too.

  - id: q07
    topic: q07
    question: >-
      شنو المعلومات اللي لازم نوضحها للمستخدم في privacy notice قبل ما نجمع بياناته؟
    lang: ar
    expected_keys: [uae-pdpl:art-13:para-2, uae-pdpl:art-13:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      per Article 13 of the PDPL, the Controller is required to, in all cases and prior to the
      commencement of processing, provide Data Subjects with information regarding: the purposes
      of the processing; the targeted sectors or establishments with whom the personal data will
      be shared, both within and outside the UAE; and the protection measures for cross-border
      processing.
    note: >-
      Article 13(2) requires the purposes, who the data is shared with, and the safeguards for
      cross-border processing to be given before processing starts; Article 13(1) lists what a
      person may ask for. Either counts.

  - id: q10
    topic: q10
    question: >-
      هل يقدر المستخدم يطلب نسخة من بياناته الشخصية بصيغة إلكترونية قابلة للقراءة؟
    lang: ar
    expected_keys: [uae-pdpl:art-14:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Right to request Personal Data transfer ('data portability') (Article 14) The Data Subject
      has the right to obtain his / her Personal Data provided to the Controller for Processing
      in a structured and machine-readable manner, so long as the Processing is based on the
      Consent of the Data Subject or is necessary for the fulfillment of a contractual
      obligation and is made by automated means.
    note: >-
      Receiving one's data in an orderly, machine-readable form is Article 14(1).

  - id: q13
    topic: q13
    question: >-
      هل يقدر المستخدم يعترض على استخدام بياناته في direct marketing؟
    lang: ar
    expected_keys: [uae-pdpl:art-17:para-1]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 17 of the PDPL allows data subjects to refuse or request the cessation of
      processing of their personal data in cases involving direct marketing
    note: >-
      Objecting to direct marketing and stopping it is Article 17(1).

  - id: q15
    topic: q15
    question: >-
      كم مدة نقدر نحتفظ ببيانات حسابات المستخدمين الـ inactive قبل ما نحذفها؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-7, uae-pdpl:art-7:para-3]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      General Data Protection Controls (Article 5) Under the PDPL, Personal Data must be
      processed according to the following controls: ... Personal Data may not be kept after
      fulfilling the purpose of Processing thereof. It may only be kept in the event that the
      identity of the Data Subject is anonymized using the "Anonymization" feature
    note: >-
      How long data may be kept is Article 5(7): not after the purpose of processing is
      exhausted, unless the person can no longer be identified. Article 7(3) makes the storage
      period a setting a controller must limit by default. Either counts.

  - id: q16
    topic: q16
    question: >-
      هل لازم نحذف بيانات المستخدم من backups لما ينتهي الغرض من معالجتها؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-7]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      General Data Protection Controls (Article 5) Under the PDPL, Personal Data must be
      processed according to the following controls: ... Personal Data may not be kept after
      fulfilling the purpose of Processing thereof. It may only be kept in the event that the
      identity of the Data Subject is anonymized using the "Anonymization" feature
    note: >-
      Data may not be kept once the purpose of processing is exhausted, wherever it is held:
      Article 5(7). The law has no rule for backups by name.

  - id: q18
    topic: q18
    question: >-
      شنو الإجراءات الأمنية المطلوبة لحماية personal data من unauthorized access أو disclosure؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-6, uae-pdpl:art-20:para-1, uae-pdpl:art-7:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      General Data Protection Controls (Article 5) Under the PDPL, Personal Data must be
      processed according to the following controls: ... Personal Data must be kept securely and
      protected from any breach, infringement, or illegal or unauthorized Processing by
      establishing and applying appropriate technical and organizational measures and procedures
    note: >-
      Protecting data from unauthorised access or disclosure is Article 5(6), with the
      controller's and processor's measures in Article 20(1) and Article 7(1). Any of them
      counts.

  - id: q20
    topic: q20
    question: >-
      هل لازم نبلغ المستخدمين المتأثرين لو حصل data breach ممكن يسبب ليهم ضرر؟
    lang: ar
    expected_keys: [uae-pdpl:art-9:para-2]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 9 requires controllers to notify the Data Office of personal data breaches "at the
      time it becomes aware" of any breach likely to prejudice data security or privacy. ...
      Controllers also must notify affected data subjects when a bre
    note: >-
      Telling the person whose data was breached is Article 9(2).

  - id: q21.sensitive
    topic: q21.sensitive
    question: >-
      هل health records تعتبر sensitive personal data وتحتاج شروط إضافية للمعالجة؟
    lang: ar
    expected_keys: [uae-pdpl:art-1:def-sensitive-personal-data]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      "Sensitive Personal Data" is defined as any data that directly or indirectly reveals a
      natural person's family, racial origin, political or philosophical opinions, religious
      beliefs, criminal records, biometric data, or any data related to the health of such
      person
    note: >-
      Data related to health is sensitive personal data by the definition in Article 1. The
      guide gives the definition without numbering the article.

  - id: q21.conditions
    topic: q21.conditions
    question: >-
      هل health records تعتبر sensitive personal data وتحتاج شروط إضافية للمعالجة؟
    lang: ar
    expected_keys: [uae-pdpl:art-10:para-1, uae-pdpl:art-21:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Unlike the GDPR, the PDPL does not impose more stringent controls around processing of
      Sensitive Personal Data, however if a Controller or Processor is Processing that involves
      a systematic and comprehensive assessment of Sensitive Personal Data, including profiling
      and automated processing, or if the Processing will be made on a large amount of Sensitive
      Personal Data, then the Controller or Processor must appoint a Data Protection Officer
      (Article 10). Article 21 also requires that DPIAs be conducted before Processing that will
      use any of the modern technologies that would pose a high risk to the privacy and
      confidentiality of the Personal Data of the Data Subject, if the Processing will be made
      on a large amount of Sensitive Personal Data (Article 21).
    note: >-
      The law sets no stricter basis for sensitive data; what it adds is an officer, Article
      10(1), and an impact assessment, Article 21(2), when much sensitive data is processed.
      Either counts.

  - id: q25
    topic: q25
    question: >-
      هل نقدر نسمح للـ cloud provider يضيف subprocessor بدون موافقتنا؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-1, uae-pdpl:art-8:para-10]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(1) states that the Data Processor shall carry out the processing in accordance
      with the instructions of the Controller and the contracts and agreements concluded between
      them. ... If a Data Processor subcontracts processing, all sub-processors must be bound by
      the same obligations, and multiple processors must have a written agreement delineating
      responsibilities [ Article 8(10) ].
    note: >-
      The law has no rule on authorising a subprocessor by name. A processor acts only on the
      controller's instructions and their contract, Article 8(1), and several processors need a
      written agreement setting out their roles, Article 8(10). Either counts.

  - id: q26
    topic: q26
    question: >-
      هل نقدر ننقل بيانات المستخدمين لدولة خارج الإمارات لو ما عندها مستوى حماية كافي؟
    lang: ar
    expected_keys: [uae-pdpl:art-23:para-1]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 22 of the PDPL permits the transfer of personal data to countries with robust data
      protection laws in place or where the specific country has acceded to bilateral or
      multilateral agreements relating to the protection of personal data. ... Article 23 of the
      PDPL allows personal data to be transferred to countries lacking
    note: >-
      Transfers to a country without adequate protection are Article 23(1), in the cases it
      lists.

  - id: q29
    topic: q29
    question: >-
      هل لازم نعيّن Data Protection Officer لو الشركة بتعالج بيانات حساسة أو على نطاق واسع؟
    lang: ar
    expected_keys: [uae-pdpl:art-10:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      if a Controller or Processor is Processing that involves a systematic and comprehensive
      assessment of Sensitive Personal Data, including profiling and automated processing, or if
      the Processing will be made on a large amount of Sensitive Personal Data, then the
      Controller or Processor must appoint a Data Protection Officer (Article 10).
    note: >-
      When an officer must be appointed is Article 10(1): high risk from new technology or
      volume, systematic assessment of sensitive data, or a large volume of it.
