# The UAE's data protection law: questions people ask, written blind.
#
# A person wrote these in their own words, the way they would ask while building a product,
# before reading any eval set or search result, and without looking anything up. Nobody searched
# them before these labels were fixed. A question that asks two things answered by different
# rules is an entry for each, under the same words.
#
# Every label rests on the words of a law firm's published guide in `quote`; `note` says why that clause answers.
# Where the guide gives the rule without the article's number, the note says so. Where more
# than one clause answers, each is listed and any one counts.

questions:

  - id: q01
    topic: q01
    question: >-
      Our startup is registered in DIFC. Does the federal UAE PDPL apply to our customer
      database?
    lang: en
    expected_keys: [uae-pdpl:art-2:para-2:pt-g]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 2 of the PDPL provides that the Decree Law governs personal data processing by
      anyone within the State or by entities outside the State handling data of individuals
      within the State. Exceptions include government data, certain government authorities and
      organizations/entities with their own data protection laws (such as DIFC)
    note: >-
      Companies in free zones that have their own data protection legislation, as the DIFC has,
      are outside this law: point (g) of Article 2(2).

  - id: q02
    topic: q02
    question: >-
      Does the UAE PDPL apply to a foreign company that processes personal data of people living
      in the UAE?
    lang: en
    expected_keys: [uae-pdpl:art-2:para-1:pt-c, uae-pdpl:art-2:para-1:pt-a]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 2 of the PDPL provides that the Decree Law governs personal data processing by
      anyone within the State or by entities outside the State handling data of individuals
      within the State. Exceptions include government data, certain government authorities and
      organizations/entities with their own data protection laws (such as DIFC)
    note: >-
      A controller or processor outside the State processing data of people in it is point (c)
      of Article 2(1); point (a) covers every data subject residing in the State. Either counts.

  - id: q05
    topic: q05
    question: >-
      Can we process personal data without consent when it is necessary to perform a contract
      with the user?
    lang: en
    expected_keys: [uae-pdpl:art-4:para-9]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases ... if the Processing is
      necessary to perform a contract to which the Data Subject is a party or to take, at the
      request of the Data Subject, procedures for concluding, amending or terminating a contract
    note: >-
      Processing without consent because it is needed to perform a contract with the person is
      Article 4(9).

  - id: q08
    topic: q08
    question: >-
      When collecting personal data from another company, what information must we provide to
      the person and when?
    lang: en
    expected_keys: [uae-pdpl:art-13:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      per Article 13 of the PDPL, the Controller is required to, in all cases and prior to the
      commencement of processing, provide Data Subjects with information regarding: the purposes
      of the processing; the targeted sectors or establishments with whom the personal data will
      be shared, both within and outside the UAE; and the protection measures for cross-border
      processing.
    note: >-
      The law has no rule of its own for data obtained from another company. Article 13(2)
      applies in all cases, before processing starts, so it answers both what is given and when.
      One rule, so one entry.

  - id: q09
    topic: q09
    question: >-
      Must we tell users which categories of third parties receive their personal data?
    lang: en
    expected_keys: [uae-pdpl:art-13:para-2, uae-pdpl:art-13:para-1:pt-d]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      per Article 13 of the PDPL, the Controller is required to, in all cases and prior to the
      commencement of processing, provide Data Subjects with information regarding: the purposes
      of the processing; the targeted sectors or establishments with whom the personal data will
      be shared, both within and outside the UAE; and the protection measures for cross-border
      processing.
    note: >-
      The sectors or establishments the data is shared with are point (d) of Article 13(1),
      which Article 13(2) requires to be given before processing starts. Either counts.

  - id: q11
    topic: q11
    question: >-
      Can a user request correction of inaccurate personal data held in their account?
    lang: en
    expected_keys: [uae-pdpl:art-15:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      (Article 15) The Data Subject has the right to request the correction or completion of his
      / her inaccurate Personal Data held with the Controller, and has the right to request the
      erasure of his / her Personal Data held with the Controller in any of the following cases
    note: >-
      Correcting inaccurate data is Article 15(1).

  - id: q12
    topic: q12
    question: >-
      What should we do when a user requests deletion of their personal data?
    lang: en
    expected_keys: [uae-pdpl:art-15:para-2, uae-pdpl:art-15:para-3]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      (Article 15) The Data Subject has the right to request the correction or completion of his
      / her inaccurate Personal Data held with the Controller, and has the right to request the
      erasure of his / her Personal Data held with the Controller in any of the following cases
    note: >-
      Erasure on request is Article 15(2), in the cases it lists; Article 15(3) says when it is
      refused. Either counts.

  - id: q14
    topic: q14
    question: >-
      Can users challenge a decision that significantly affects them if it is made entirely
      through automated processing?
    lang: en
    expected_keys: [uae-pdpl:art-18:para-1, uae-pdpl:art-18:para-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      The right not to be subject to automated decision making, including profiling (Article 18)
      The Data Subject has the right to object to decisions issued with respect to Automated
      Processing that have legal consequences or seriously affect the Data Subject, including
      Profiling.
    note: >-
      Objecting to a decision made by automated processing is Article 18(1); Article 18(4) gives
      a human review on request. Either counts.

  - id: q17
    topic: q17
    question: >-
      Can we retain transaction records after account closure to meet another UAE legal
      retention requirement?
    lang: en
    expected_keys: [uae-pdpl:art-4:para-10, uae-pdpl:art-15:para-3:pt-c]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases ... if the Processing is
      necessary to fulfill obligations imposed by other laws of the State on Controllers
    note: >-
      Keeping records another law requires is processing to fulfil obligations other laws place
      on the controller, Article 4(10); a request to erase them is refused where it contradicts
      other legislation, point (c) of Article 15(3). Either counts.

  - id: q19
    topic: q19
    question: >-
      Does the UAE PDPL set a specific deadline for notifying the UAE Data Office about a
      personal data breach?
    lang: en
    expected_keys: [uae-pdpl:art-9:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Article 9 of the PDPL requires that the Controller shall, immediately upon becoming aware
      of any infringement or breach of the Personal Data of the Data Subject that would
      prejudice the privacy, confidentiality and security of such data, report such infringement
      or breach and the results of the investigation to the Office within such period and in
      accordance with such procedures and conditions as set by the Executive Regulations. At the
      date of writing this update, the Executive Regulations have not yet been published.
    note: >-
      Notifying the Office of a breach is Article 9(1), which leaves the period to the Executive
      Regulations.

  - id: q22
    topic: q22
    question: >-
      Do face templates used to identify a person count as sensitive biometric data under the
      UAE PDPL?
    lang: en
    expected_keys: [uae-pdpl:art-1:def-biometric-data, uae-pdpl:art-1:def-sensitive-personal-data]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      "Biometric Data" is defined as Personal Data resulting from Processing, using a specific
      technique, relating to the physical, physiological or behavioral characteristics of a Data
      Subject, which allows or confirms the unique identification of the Data Subject, such as
      facial images ... "Sensitive Personal Data" is defined as any data that directly or
      indirectly reveals a natural person's family, racial origin, political or philosophical
      opinions, religious beliefs, criminal records, biometric data
    note: >-
      A face template used to identify somebody is biometric data, and biometric data is
      sensitive personal data, both by the definitions in Article 1. The guide gives them
      without numbering the article. Either counts.

  - id: q24
    topic: q24
    question: >-
      What clauses must our agreement with a cloud hosting provider include under the UAE PDPL?
    lang: en
    expected_keys: [uae-pdpl:art-8:para-1]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(1) states that the Data Processor shall carry out the processing in accordance
      with the instructions of the Controller and the contracts and agreements concluded between
      them. This means a Data Processor cannot process data beyond the Controller's directive.
      It also implies that the controller-processor contract must clearly specify the processing
      details (scope, nature, category of data, etc.).
    note: >-
      What the agreement with a processor has to specify is Article 8(1): the scope, subject,
      purpose and nature of the processing, the type of data and the category of people.

  - id: q27
    topic: q27
    question: >-
      Can we transfer personal data to a country recognized as providing adequate protection
      under the UAE PDPL?
    lang: en
    expected_keys: [uae-pdpl:art-22]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 22 of the PDPL permits the transfer of personal data to countries with robust data
      protection laws in place or where the specific country has acceded to bilateral or
      multilateral agreements relating to the protection of personal data. ... Article 23 of the
      PDPL allows personal data to be transferred to countries lacking
    note: >-
      Transfers to a country with adequate protection, or covered by an agreement the State has
      joined, are Article 22.

  - id: q28
    topic: q28
    question: >-
      Do we need to maintain records of processing activities under the UAE PDPL?
    lang: en
    expected_keys: [uae-pdpl:art-7:para-4, uae-pdpl:art-8:para-7]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 7(4) mandates that the controller keep a "special record" of all personal data
      activities
    note: >-
      The controller's record is Article 7(4), the processor's Article 8(7). Either counts.

  - id: q30
    topic: q30
    question: >-
      Is a Data Protection Impact Assessment required before launching a feature involving
      high-risk personal data processing?
    lang: en
    expected_keys: [uae-pdpl:art-21:para-1, uae-pdpl:art-21:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Article 21 also requires that DPIAs be conducted before Processing that will use any of
      the modern technologies that would pose a high risk to the privacy and confidentiality of
      the Personal Data of the Data Subject, if the Processing will be made on a large amount of
      Sensitive Personal Data (Article 21).
    note: >-
      An impact assessment before processing that poses a high risk is Article 21(1); Article
      21(2) names the cases where it is required. Either counts.
