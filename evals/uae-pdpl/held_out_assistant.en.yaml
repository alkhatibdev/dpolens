      order history, including transfer to another country
    lang: en
    expected_keys: [uae-pdpl:art-8:para-1, uae-pdpl:art-7:para-5]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(1) states that the Data Processor shall carry out the processing in accordance
      with the instructions of the Controller and the contracts and agreements concluded between
