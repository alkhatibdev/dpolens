  - id: stop-whatsapp.stop-marketing
    topic: stop-whatsapp.stop-marketing
    question: >-
      customer replies STOP to a WhatsApp marketing message: remove phone number from offers
      list and tell the agency that holds the number to delete it
    lang: en
    expected_keys: [uae-pdpl:art-17:para-1, uae-pdpl:art-6:para-2]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 17 of the PDPL allows data subjects to refuse or request the cessation of
      processing of their personal data in cases involving direct marketing
    note: >-
      Somebody who asks to stop receiving marketing is using the right of Article 17(1), and
      withdrawing the consent the marketing rested on, Article 6(2). Either counts.

  - id: stop-whatsapp.erased-at-processor
    topic: stop-whatsapp.erased-at-processor
    question: >-
      customer replies STOP to a WhatsApp marketing message: remove phone number from offers
      list and tell the agency that holds the number to delete it
    lang: en
    expected_keys: [uae-pdpl:art-8:para-1, uae-pdpl:art-8:para-4]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(3) and (4) govern Data Retention ... Upon expiry of the processing term or at
      the Controller's direction, the processor must erase or return all personal data.
    note: >-
      An agency that holds the number for us is a processor: it acts on the controller's
      instructions, Article 8(1), and erases what it holds when its processing ends, Article
      8(4). Either counts.
