  - id: support-team-abroad.abroad
    topic: support-team-abroad.abroad
    question: >-
      giving a third-party outsourced support company staff access to customer profiles and
      order history, including transfer to another country
    lang: en
    expected_keys: [uae-pdpl:art-22, uae-pdpl:art-23]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 22 of the PDPL permits the transfer of personal data to countries with robust data
      protection laws in place or where the specific country has acceded to bilateral or
      multilateral agreements relating to the protection of personal data. ... Article 23 of the
      PDPL allows personal data to be transferred to countries lacking
    note: >-
      Data reaching people in another country is a transfer outside the State: Article 22 for
      countries with data protection laws or agreements, Article 23 for the others. Either
      counts.

  - id: support-team-abroad.reached-2
    topic: support-team-abroad.reached
    question: >-
      access control for staff to personal data, least privilege and audit logging of access
    lang: en
    expected_keys: [uae-pdpl:art-5:para-6, uae-pdpl:art-7:para-1, uae-pdpl:art-7:para-3, uae-pdpl:art-20:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      General Data Protection Controls (Article 5) Under the PDPL, Personal Data must be
      processed according to the following controls: ... Personal Data must be kept securely and
      protected from any breach, infringement, or illegal or unauthorized Processing by
      establishing and applying appropriate technical and organizational measures and procedures
    note: >-
      Who on the staff may reach personal data, and keeping a record of it, is keeping the data
      secure: Article 5(6), with the controller's measures in Articles 7(1) and 20(1). Article
      7(3) limits accessibility by default. Any of them counts.

