  - id: support-team-abroad.abroad
    topic: support-team-abroad.abroad
    question: >-
      giving a third-party outsourced support provider in another country access to customer
      profiles and order history
    lang: en
    expected_keys: [uae-pdpl:art-22, uae-pdpl:art-23]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 22 of the PDPL permits the transfer of personal data to countries with robust data
      protection laws in place or where the specific country has acceded to bilateral or
      multilateral agreements relating to the protection of personal data. ... Article 23 of the
      PDPL allows personal data to be transferred to countries lacking
    note: >-
      Data reaching people in another country is a transfer outside the State: Article 22 for
      countries with data protection laws or agreements, Article 23 for the others. Either
      counts.

  - id: whatsapp-weekly-offers.marketing
    topic: whatsapp-weekly-offers.marketing
    question: >-
      sending marketing messages to customers by phone number, consent and right to object to
      direct marketing
    lang: en
    expected_keys: [uae-pdpl:art-17:para-1, uae-pdpl:art-4]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 17 of the PDPL allows data subjects to refuse or request the cessation of
      processing of their personal data in cases involving direct marketing
    note: >-
      Whether marketing messages may be sent, and on whose consent, is Article 4: consent,
      unless one of its cases applies. Article 17(1), the right to stop processing for direct
      marketing, counts too.

  - id: whatsapp-weekly-offers.stop-marketing
    topic: whatsapp-weekly-offers.stop-marketing
    question: >-
      sending marketing messages to customers by phone number, consent and right to object to
      direct marketing
    lang: en
    expected_keys: [uae-pdpl:art-17:para-1, uae-pdpl:art-6:para-2]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 17 of the PDPL allows data subjects to refuse or request the cessation of
      processing of their personal data in cases involving direct marketing
    note: >-
      The right to object to direct marketing is Article 17(1); withdrawing the consent the
      marketing rested on is Article 6(2). Either counts.

