  - id: driver-route-history.allowed
    topic: driver-route-history.allowed
    question: >-
      continuously tracking employees' location every few seconds during working hours and
      keeping the full history to evaluate their performance
    lang: en
    expected_keys: [uae-pdpl:art-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases
    note: >-
      Whether employees' locations may be tracked is Article 4, whose paragraph 8 covers what
      employment requires.

  - id: driver-route-history.retention
    topic: driver-route-history.retention
    question: >-
      continuously tracking employees' location every few seconds during working hours and
      keeping the full history to evaluate their performance
    lang: en
    expected_keys: [uae-pdpl:art-5:para-7, uae-pdpl:art-7:para-3]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      General Data Protection Controls (Article 5) Under the PDPL, Personal Data must be
      processed according to the following controls: ... Personal Data may not be kept after
      fulfilling the purpose of Processing thereof. It may only be kept in the event that the
      identity of the Data Subject is anonymized using the "Anonymization" feature
    note: >-
      How long data may be kept is Article 5(7): not after the purpose of processing is
      exhausted, unless the person can no longer be identified. Article 7(3) makes the storage
      period one of the settings a controller must limit by default, so it counts too.

