  - id: erase-on-request.erasure-request
    topic: erase-on-request.erasure-request
    question: >-
      what must happen when a data subject asks for erasure of their personal data, including
      data shared with processors
    lang: en
    expected_keys: [uae-pdpl:art-15:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      (Article 15) The Data Subject has the right to request the correction or completion of his
      / her inaccurate Personal Data held with the Controller, and has the right to request the
      erasure of his / her Personal Data held with the Controller in any of the following cases
    note: >-
      A request to erase all of someone's data is the right of Article 15(2), in the cases it
      lists. The law has no rule of its own for passing the request on to processors.

