# The UAE's data protection law: the assistant-style held-out set, as sent to the community version.
#
# Claude Code (claude-sonnet-5-5) typed these queries while working, once each, through the
# coding tasks of ../trigger/queries.yaml, on an instance set up as the community version,
# holding both laws, and added as the community page adds it; each query is labelled under the
# law its task was written for. A run stops when its first search comes back, so each query
# was written before any result was read. Nobody searched them before these labels were fixed.
#
# Each thing a query asks is a part, with an entry of its own under the same words; `topic`
# names the task and the part. A query that only describes what the code does asks whether it
# may be done. Every label rests on the words of a law firm's published guide that name the article, in `quote`; `note`
# says why that rule is the one the part asks about. Where more than one clause answers a
# part, each is listed and any one counts.

questions:
  - id: uae-pass-sign-in.allowed
    topic: uae-pass-sign-in.allowed
    question: >-
      collecting and storing national identity number, full name, mobile number and nationality
      from a government identity provider at sign-in
    lang: en
    expected_keys: [uae-pdpl:art-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases
    note: >-
      Whether it may be done at all is Article 4: processing needs the person's consent unless
      one of the cases it lists applies.

  - id: selfie-match.allowed
    topic: selfie-match.allowed
    question: >-
      collecting a photo of a person's face and an identity document photo, and processing them
      with a third-party face-matching service to verify identity before an order
    lang: en
    expected_keys: [uae-pdpl:art-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases
    note: >-
      Whether a face photo and an identity document may be collected is Article 4. A face is
      biometric data, which the law counts as sensitive, but it sets no stricter basis for it:
      an impact assessment (Article 21) and an officer (Article 10) depend on other conditions,
      and neither decides whether it may be done.

  - id: selfie-match.outside-service
    topic: selfie-match.outside-service
    question: >-
      collecting a photo of a person's face and an identity document photo, and processing them
      with a third-party face-matching service to verify identity before an order
    lang: en
    expected_keys: [uae-pdpl:art-8:para-1, uae-pdpl:art-7:para-5]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(1) states that the Data Processor shall carry out the processing in accordance
      with the instructions of the Controller and the contracts and agreements concluded between
      them.
    note: >-
      Handing data to a company that processes it for us is the use of a processor: Article 7(5)
      on choosing one with sufficient guarantees, Article 8(1) on processing only under the
      controller's instructions and their contract. Either counts.

  - id: kids-under-parent.allowed
    topic: kids-under-parent.allowed
    question: >-
      parent creates account for a child aged 12 or older, storing the child's name, age and
      school
    lang: en
    expected_keys: [uae-pdpl:art-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases
    note: >-
      The law has no rule for children. Whether a child's name, age and school may be collected
      is Article 4: consent, unless one of the cases it lists applies.

  - id: map-pin-checkout.kept-for-reuse
    topic: map-pin-checkout.kept-for-reuse
    question: >-
      storing a customer's precise GPS location coordinates for delivery and reusing them for
      future orders
    lang: en
    expected_keys: [uae-pdpl:art-5:para-2, uae-pdpl:art-5:para-7, uae-pdpl:art-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      General Data Protection Controls (Article 5) Under the PDPL, Personal Data must be
      processed according to the following controls: ... Personal Data must be collected for a
      specific and clear purpose, and may not be processed at any subsequent time in a manner
      incompatible with that purpose. ... Personal Data may not be kept after fulfilling the
      purpose of Processing thereof.
    note: >-
      Keeping a location for later orders needs a basis, Article 4. The later use has to fit the
      purpose it was collected for, Article 5(2), and it may not be kept once that purpose is
      exhausted, Article 5(7). Any of them counts.

  - id: family-members.allowed
    topic: family-members.allowed
    question: >-
      collecting and storing names, ages and family relationships of household members including
      children, added by the account holder
    lang: en
    expected_keys: [uae-pdpl:art-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases
    note: >-
      Whether details of a customer's household, children among them, may be kept is Article 4:
      the consent of the people they are about, unless one of its cases applies. Family details
      count as sensitive, for which the law sets no stricter basis.

  - id: prescription-photos.health
    topic: prescription-photos.health
    question: >-
      storing images of medical prescriptions (health data) uploaded by customers and showing
      them to a pharmacist
    lang: en
    expected_keys: [uae-pdpl:art-4, uae-pdpl:art-2:para-2:pt-e]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal Data without
      the consent of the Data Subject, except in the following cases
    note: >-
      Whether a prescription may be kept is Article 4, whose paragraphs 4 and 5 cover health
      care. Article 2(2)(e) takes health data out of this law where other legislation regulates
      it, which decides whether this law applies at all. Either counts.

