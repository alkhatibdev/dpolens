# UAE PDPL tuning set, in Arabic, the language of the law.
#
# These questions are used while improving retrieval. The first twenty-nine topics are each
# asked twice: formally, and the way people type in chat, under the same id with -chat after
# it. A chat question keeps to one dialect, Gulf or Levantine, as developers in the UAE do,
# and uses English terms where they would. The nineteen after them were the held-out set
# until DPOLens 0.3.0, and are each asked once, as the comment above them says.
# tuning.en.yaml asks them all in English under the same ids, so the two languages can be
# compared question by question.
#
# Of the first twenty-nine, ten were drawn at random from twenty-five. The nineteen after
# them were drawn at random from the paragraphs no question used, leaving out any on one of
# the last nineteen topics, and kept where a law firm's published guide answers them.
#
# No regulator guidance names this law's articles, so each label comes from a law
# firm's published guide, and `quote` gives that guide's own words, including the words
# that name the article. Seven of the nineteen come from a guide that answers without
# printing the article's number, and their note says why that clause is the answer.
# See ../README.md before adding one.

questions:
  - id: automated-decision
    question: نريد أن يوافق نموذج ذكاء اصطناعي على طلبات القروض أو يرفضها بنفسه دون أي مراجعة بشرية. هل هذا مسموح؟
    lang: ar
    expected_keys: [uae-pdpl:art-18:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      The right not to be subject to automated decision making, including profiling
      (Article 18)

  - id: dpia
    question: سنطلق قريباً محرك توصيات يبني ملفاً عن اهتمامات كل مستخدم. هل يجب أن نقيّم مخاطر الخصوصية قبل الإطلاق؟
    lang: ar
    expected_keys: [uae-pdpl:art-21:para-1, uae-pdpl:art-21:para-2]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      As per Article 21 of the PDPL, the Controller is required to assess the impact of
      data processing on personal data protection before initiating any high-risk
      processing activities
    note: Paragraph 1 is the duty, paragraph 2 when it applies.

  - id: erasure
    question: أغلق أحد العملاء حسابه ويطلب حذف كل بياناته لدينا. هل نحن ملزمون بذلك؟
    lang: ar
    expected_keys: [uae-pdpl:art-15:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Right to correction or erasure ('right to be forgotten') (Article 15)
    note: Erasure is paragraph 2. The law says محو where a developer says حذف, so the words do not match.

  - id: notice-before-processing
    question: ما الذي يجب أن نخبر به المستخدمين قبل أن نبدأ باستخدام بياناتهم؟
    lang: ar
    expected_keys: [uae-pdpl:art-13:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      per Article 13 of the PDPL, the Controller is required to, in all cases and prior
      to the commencement of processing, provide Data Subjects with information
    note: That duty is paragraph 2.

  - id: purpose-limitation
    question: جمعنا أرقام الهواتف من أجل التحقق بخطوتين عند تسجيل الدخول. هل يمكننا استخدامها في الحملات التسويقية أيضاً؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Personal Data must be collected for a
      specific and clear purpose, and may not be processed at any subsequent time in a
      manner incompatible with that purpose
    note: Marketing may pull the search towards the right to object.

  - id: retention
    question: إلى متى يجوز لنا الاحتفاظ ببيانات المستخدم بعد توقفه عن استخدام التطبيق؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-7]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Personal Data may not be kept after
      fulfilling the purpose of Processing thereof

  - id: scope-free-zone
    question: شركتنا مرخّصة في مركز دبي المالي العالمي. هل ينطبق علينا قانون حماية البيانات الشخصية الاتحادي؟
    lang: ar
    expected_keys: [uae-pdpl:art-2:para-2:pt-g]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 2 of the PDPL provides that the Decree Law governs personal data
      processing ... Exceptions include ... organizations/entities with their own data
      protection laws (such as DIFC)
    note: The law says free zones with their own legislation and never names the DIFC.

  - id: transfer-abroad
    question: هل يمكننا استضافة بيانات عملائنا على خوادم AWS في أوروبا؟
    lang: ar
    expected_keys: [uae-pdpl:art-22, uae-pdpl:art-23]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 22 of the PDPL permits the transfer of personal data to countries with
      robust data protection laws ... Article 23 of the PDPL allows personal data to be
      transferred to countries lacking adequate data protection
    note: Either article answers.

  - id: transfer-no-adequacy
    question: فريق خدمة العملاء لدينا يعمل من دولة ليس فيها قانون لحماية البيانات. هل يجوز أن نرسل إليهم بيانات العملاء؟
    lang: ar
    expected_keys: [uae-pdpl:art-23:para-1]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 23 of the PDPL allows personal data to be transferred to countries lacking
      adequate data protection if the transfer is necessary for the conclusion or
      implementation of a contract

  - id: vendor-instructions
    question: نرسل بيانات عملائنا إلى شركة خارجية لتعالجها لصالحنا. هل يحق لها أن تستخدمها كما تشاء؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-1]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(1) states that the Data Processor shall carry out the processing in
      accordance with the instructions of the Controller and the contracts and
      agreements concluded between them

  - id: automated-decision-chat
    question: نبي الموديل يقبل أو يرفض طلبات القروض لحاله بدون ما أحد يراجع، يصير؟
    lang: ar
    expected_keys: [uae-pdpl:art-18:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      The right not to be subject to automated decision making, including profiling
      (Article 18)
    note: The same as automated-decision, asked the way people type in chat.

  - id: dpia-chat
    question: بدنا نطلق recommendation engine بيعمل بروفايل لكل يوزر حسب اهتماماته، لازم نعمل تقييم لمخاطر الخصوصية قبل ما ننزله؟
    lang: ar
    expected_keys: [uae-pdpl:art-21:para-1, uae-pdpl:art-21:para-2]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      As per Article 21 of the PDPL, the Controller is required to assess the impact of
      data processing on personal data protection before initiating any high-risk
      processing activities
    note: The same as dpia, asked the way people type in chat.

  - id: erasure-chat
    question: واحد سكر حسابه وبدو نمسح كل الداتا تبعته، مجبورين؟
    lang: ar
    expected_keys: [uae-pdpl:art-15:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Right to correction or erasure ('right to be forgotten') (Article 15)
    note: The same as erasure, asked the way people type in chat.

  - id: notice-before-processing-chat
    question: قبل ما نبدأ نستخدم بيانات اليوزرز، شو لازم نقولهم؟
    lang: ar
    expected_keys: [uae-pdpl:art-13:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      per Article 13 of the PDPL, the Controller is required to, in all cases and prior
      to the commencement of processing, provide Data Subjects with information
    note: The same as notice-before-processing, asked the way people type in chat.

  - id: purpose-limitation-chat
    question: جمعنا أرقام الموبايل عشان الـ OTP، نقدر نستخدمها بالتسويق؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Personal Data must be collected for a
      specific and clear purpose, and may not be processed at any subsequent time in a
      manner incompatible with that purpose
    note: The same as purpose-limitation, asked the way people type in chat.

  - id: retention-chat
    question: كم مدة نقدر نحتفظ ببيانات اليوزر بعد ما يوقف استخدام التطبيق؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-7]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Personal Data may not be kept after
      fulfilling the purpose of Processing thereof
    note: The same as retention, asked the way people type in chat.

  - id: scope-free-zone-chat
    question: شركتنا في الـ DIFC، القانون الاتحادي لحماية البيانات ينطبق علينا ولا لا؟
    lang: ar
    expected_keys: [uae-pdpl:art-2:para-2:pt-g]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 2 of the PDPL provides that the Decree Law governs personal data
      processing ... Exceptions include ... organizations/entities with their own data
      protection laws (such as DIFC)
    note: The same as scope-free-zone, asked the way people type in chat.

  - id: transfer-abroad-chat
    question: عادي نحط داتا العملاء على سيرفرات AWS في أوروبا؟
    lang: ar
    expected_keys: [uae-pdpl:art-22, uae-pdpl:art-23]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 22 of the PDPL permits the transfer of personal data to countries with
      robust data protection laws ... Article 23 of the PDPL allows personal data to be
      transferred to countries lacking adequate data protection
    note: The same as transfer-abroad, asked the way people type in chat.

  - id: transfer-no-adequacy-chat
    question: فريق السبورت عندنا في بلد ما فيه قانون حماية بيانات، بنقدر نبعتلهم بيانات العملاء؟
    lang: ar
    expected_keys: [uae-pdpl:art-23:para-1]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 23 of the PDPL allows personal data to be transferred to countries lacking
      adequate data protection if the transfer is necessary for the conclusion or
      implementation of a contract
    note: The same as transfer-no-adequacy, asked the way people type in chat.

  - id: vendor-instructions-chat
    question: بنعطي داتا العملاء لشركة برا تعالجها لنا، يحق لهم يستخدموها على كيفهم؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-1]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(1) states that the Data Processor shall carry out the processing in
      accordance with the instructions of the Controller and the contracts and
      agreements concluded between them
    note: The same as vendor-instructions, asked the way people type in chat.

  - id: dpia-contents
    question: ما الذي يجب أن يتضمنه تقييم أثر حماية البيانات الذي نعدّه؟
    lang: ar
    expected_keys: [uae-pdpl:art-21:para-3]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      As per Article 21 of the PDPL ... should cover the explanation of the proposed
      processing operations on the protection of personal data and the purpose of
      processing them, necessity, risks, and measures to address potential issues
    note: Paragraph 3 is what the assessment must include at a minimum.

  - id: dpo-contact-details
    question: عيّنا مسؤولاً لحماية البيانات. هل يجب أن نحدد بيانات التواصل معه ونبلغ بها مكتب البيانات؟
    lang: ar
    expected_keys: [uae-pdpl:art-10:para-3]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      By virtue of Article 10 of the PDPL ... their contact details must be shared with
      the Data Office
    note: Specifying the DPO's contact details and notifying the Bureau of them is paragraph 3.

  - id: fair-and-transparent
    question: تتتبع أداة التحليلات لدينا سلوك المستخدمين بطرق لا يتوقعونها، رغم أنه لا شيء فيها مخالف للقانون. هل في ذلك مشكلة؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-1, uae-pdpl:art-13:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Processing must be made in a fair,
      transparent and lawful manner ... per Article 13 of the PDPL, the Controller is
      required to, in all cases and prior to the commencement of processing, provide
      Data Subjects with information
    note: Fair, transparent and lawful processing is Article 5(1). DLA Piper ties transparency to the information Article 13(2) requires before processing begins, so either counts.

  - id: pseudonymise-user-data
    question: نحتفظ بأسماء المستخدمين وبريدهم الإلكتروني إلى جانب كل نشاطهم في قاعدة بياناتنا الرئيسية. هل يتوقع منا القانون أن نطبّق إخفاء الهوية الجزئي (pseudonymisation) على هذه البيانات؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-2]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Undertaking mechanisms
      like Pseudonymisation while processing data and ensuring accurate compliance with
      the Data Protection Law.
    note: ABS Partners lists the controller's duties in the order of Article 7's paragraphs, and this is paragraph 2, measures when the means of processing are set and while processing, pseudonymisation among them. Kept to pseudonymising the controller's own users' data, away from processor-security, which asks a vendor about building protection in at the design stage.

  - id: dpo-outside-uae
    question: هل يجب أن يكون مسؤول حماية البيانات موظفاً لدينا مقيماً في الدولة، أم يمكن أن نستعين بمستشار من الخارج؟
    lang: ar
    expected_keys: [uae-pdpl:art-10:para-2]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      By virtue of Article 10 of the PDPL ... The DPO can be based inside or outside
      the UAE
    note: Multilaw names Article 10 and, in the same answer, says where the DPO may be based, which is paragraph 2. DLA Piper says it too, in a section that names no article.

  - id: data-office-court-request
    question: طلب منا مكتب البيانات معلومات عن معالجتنا للبيانات بناءً على قرار من جهة قضائية. هل يجب أن نقدمها؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-6]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Providing the Bureau
      with all the necessary information pursuant to a request from a competent judicial
      authority.
    note: ABS Partners lists the controller's duties in the order of Article 7's paragraphs, and this is paragraph 6, giving the Bureau the information it asks for on a decision of the competent judicial authority.

  - id: choosing-a-processor
    question: ما الذي يجب أن نراعيه عند اختيار شركة تعالج بيانات العملاء نيابة عنا؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-5]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Appointing a processor
      by ensuring lawful and secure data processing.
    note: ABS Partners lists the controller's duties in the order of Article 7's paragraphs, and this is paragraph 5, appointing a processor with sufficient guarantees.

  - id: valid-consent
    question: ما الشروط التي يجب أن تستوفيها الموافقة حتى يُعتدّ بها؟
    lang: ar
    expected_keys: [uae-pdpl:art-6:para-1]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      if any processing is based on consent, the controller must be able to demonstrate
      that consent was freely given, specific, informed and unambiguous. Consent under
      the PDPL must be clear and easily accessible
    note: ABS Partners gives the conditions for valid consent without the article's number, partly in the GDPR's terms. Article 6(1) asks that the controller can prove consent, that it is clear, simple, unambiguous and easily accessible, and that it says how to withdraw it.

  - id: when-in-force
    question: منذ متى أصبح القانون الاتحادي لحماية البيانات الشخصية سارياً؟
    lang: ar
    expected_keys: [uae-pdpl:art-31]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      The PDPL will take effect from 2 January 2022.
    note: Article 31 sets the day the law came into force. Bird & Bird gives the day without the article's number.

  - id: complain-to-data-office
    question: يقول أحد المستخدمين إننا أسأنا استخدام بياناته. هل يمكنه تقديم شكوى ضدنا إلى مكتب البيانات؟
    lang: ar
    expected_keys: [uae-pdpl:art-24:para-1]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      Data subjects can file a complaint with the UAE Data Office if they have reason to
      believe that the PDPL has been breached by a controller or processor.
    note: The right to complain to the Data Office is Article 24(1). Bird & Bird states it without the number.

  - id: automated-decision-exceptions
    question: نظام تقييم الائتمان لدينا آلي بالكامل، ووافق عليه المستخدمون ضمن شروط العقد. هل يحق لهم مع ذلك الاعتراض على قراراته؟
    lang: ar
    expected_keys: [uae-pdpl:art-18:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      The right not to be subject to automated decision making, including profiling
      (Article 18) ... However, the Data Subject may not object to the decisions issued
      with respect to Automated Processing in the following cases
    note: Paragraph 2 is the cases in which there is no right to object.

  - id: dpo-role
    question: سيبدأ مسؤول حماية البيانات الجديد عمله لدينا الأسبوع المقبل. ما الذي يُفترض أن يقوم به بحسب القانون؟
    lang: ar
    expected_keys: [uae-pdpl:art-11:para-1]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      who has sufficient skills and knowledge in data protection to oversee compliance
      (Articles 10 and 11)
    note: Bird & Bird names Articles 10 and 11 together, which the source check does not read as Article 11. Overseeing compliance is the role Article 11(1) gives the DPO. Worded apart from dpo-duties in GDPR's tuning set, which asks the same of that law.

  - id: limit-to-purpose-by-default
    question: هل يجب أن تقتصر الإعدادات الافتراضية في تطبيقنا على جمع ما تحتاجه كل ميزة فقط، أم يكفي أن يتمكن المستخدم من إيقاف الجمع الإضافي بنفسه؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-3]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Restricting the
      processing of personal data only to the intended purposes.
    note: ABS Partners lists the controller's duties in the order of Article 7's paragraphs, and this is paragraph 3, settings that keep processing to its intended purpose.

  - id: several-processors
    question: تعالج شركتان من مزودينا بيانات عملائنا معاً. هل يلزم وجود عقد مكتوب بينهما يحدد مسؤوليات كل منهما؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-10]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      multiple processors must have a written agreement delineating responsibilities ...
      Article 8(10)

  - id: processor-confidentiality
    question: نعالج بيانات لصالح أحد العملاء. هل يجوز لفريقنا مشاركة نتائج تلك المعالجة مع عملاء آخرين؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-5]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(5) explicitly requires Data Processors to maintain confidentiality

  - id: withdraw-consent
    question: يريد أحد المستخدمين سحب موافقته. هل يحق له ذلك، وهل يؤثر السحب على ما قمنا به سابقاً ببياناته؟
    lang: ar
    expected_keys: [uae-pdpl:art-6:para-2]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      the data subject has a right to withdraw consent at any time
    note: Withdrawing consent at any time is Article 6(2), which also keeps lawful what was done before. ABS Partners states it without the number.

  - id: grace-period
    question: كم من الوقت لدى الشركات لتصبح ملتزمة بأحكام القانون؟
    lang: ar
    expected_keys: [uae-pdpl:art-29]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      Whilst the PDPL provides for an implementation period of six months from the
      publication of the Executive Regulations
    note: Article 29 gives controllers and processors six months to bring their processing into line, which may be extended. Bird & Bird gives the period without the article's number.

  - id: processor-breach-notice
    question: نتولى معالجة الرواتب لصالح شركة عميلة، واكتشفنا للتو اختراق أحد خوادمنا. هل يجب أن نُعلم العميل بذلك؟
    lang: ar
    expected_keys: [uae-pdpl:art-9:para-3]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 9 of the PDPL ... the Processor must inform the controller immediately of
      any breaches
    note: The processor's duty to tell the controller of a breach is paragraph 3. Kept to the processor telling its client, not to reporting to the Data Office or telling users, which breach-report and breach-tell-users ask.

  - id: dpo-resources
    question: يقول مسؤول حماية البيانات لدينا إنه لا يستطيع أداء عمله دون ميزانية وصلاحية الوصول إلى أنظمتنا. هل يجب أن نوفر له ذلك؟
    lang: ar
    expected_keys: [uae-pdpl:art-12:para-1]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      resources should be made available to the DPO
    note: Bird & Bird states it without the article's number. Giving the DPO the means to carry out the tasks in Article 11, resources and support among them, is Article 12(1).

  - id: dpia-contents-chat
    question: تقييم الأثر حق الخصوصية، وش لازم يكون فيه بالضبط؟ فيه حد أدنى؟
    lang: ar
    expected_keys: [uae-pdpl:art-21:para-3]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      As per Article 21 of the PDPL ... should cover the explanation of the proposed
      processing operations on the protection of personal data and the purpose of
      processing them, necessity, risks, and measures to address potential issues
    note: The same as dpia-contents, asked the way people type in chat.

  - id: dpo-contact-details-chat
    question: عينا DPO، لازم نبعت معلومات التواصل تبعه لمكتب البيانات ولا شي؟
    lang: ar
    expected_keys: [uae-pdpl:art-10:para-3]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      By virtue of Article 10 of the PDPL ... their contact details must be shared with
      the Data Office
    note: The same as dpo-contact-details, asked the way people type in chat.

  - id: fair-and-transparent-chat
    question: الأناليتكس عندنا يتتبع اليوزرز بطريقة ما يتوقعونها، بس ما فيها شي مخالف. فيها مشكلة؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-1, uae-pdpl:art-13:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Processing must be made in a fair,
      transparent and lawful manner ... per Article 13 of the PDPL, the Controller is
      required to, in all cases and prior to the commencement of processing, provide
      Data Subjects with information
    note: The same as fair-and-transparent, asked the way people type in chat.

  - id: pseudonymise-user-data-chat
    question: لازم نعمل pseudonymisation لداتا اليوزرز تبعنا، ولا هيدا شي اختياري؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-2]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Undertaking mechanisms
      like Pseudonymisation while processing data and ensuring accurate compliance with
      the Data Protection Law.
    note: The same as pseudonymise-user-data, asked the way people type in chat.

  - id: dpo-outside-uae-chat
    question: الـ DPO لازم يكون موظف عندنا في الإمارات، ولا عادي يكون استشاري برا؟
    lang: ar
    expected_keys: [uae-pdpl:art-10:para-2]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      By virtue of Article 10 of the PDPL ... The DPO can be based inside or outside
      the UAE
    note: The same as dpo-outside-uae, asked the way people type in chat.

  - id: data-office-court-request-chat
    question: مكتب البيانات طالب معلومات عن كيف منعالج الداتا، ومعه قرار من المحكمة. لازم نعطيهن؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-6]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Providing the Bureau
      with all the necessary information pursuant to a request from a competent judicial
      authority.
    note: The same as data-office-court-request, asked the way people type in chat.

  - id: choosing-a-processor-chat
    question: بنختار شركة تعالج داتا العملاء عنا، وش لازم نتأكد منه قبل؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-5]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Appointing a processor
      by ensuring lawful and secure data processing.
    note: The same as choosing-a-processor, asked the way people type in chat.

  - id: valid-consent-chat
    question: شو لازم يكون بالـ consent flow تبعنا لحتى تنحسب الموافقة؟
    lang: ar
    expected_keys: [uae-pdpl:art-6:para-1]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      if any processing is based on consent, the controller must be able to demonstrate
      that consent was freely given, specific, informed and unambiguous. Consent under
      the PDPL must be clear and easily accessible
    note: The same as valid-consent, asked the way people type in chat. ABS Partners gives the conditions for valid consent without the article's number, partly in the GDPR's terms. Article 6(1) asks that the controller can prove consent, that it is clear, simple, unambiguous and easily accessible, and that it says how to withdraw it. It does not ask whether a checkbox is enough, which turns on Article 1's definition of consent.

  - id: when-in-force-chat
    question: قانون حماية البيانات الإماراتي من متى صار ساري؟
    lang: ar
    expected_keys: [uae-pdpl:art-31]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      The PDPL will take effect from 2 January 2022.
    note: The same as when-in-force, asked the way people type in chat. Article 31 sets the day the law came into force. Bird & Bird gives the day without the article's number.

  - id: complain-to-data-office-chat
    question: يوزر عم يقول إنو استعملنا بياناته غلط، فيه يشتكي علينا عند مكتب البيانات؟
    lang: ar
    expected_keys: [uae-pdpl:art-24:para-1]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      Data subjects can file a complaint with the UAE Data Office if they have reason to
      believe that the PDPL has been breached by a controller or processor.
    note: The same as complain-to-data-office, asked the way people type in chat. The right to complain to the Data Office is Article 24(1). Bird & Bird states it without the number.

  - id: automated-decision-exceptions-chat
    question: تقييم الائتمان عندنا كله أوتوماتيك وموجود في الشروط اللي وافقوا عليها، يحق لهم يعترضون برضو؟
    lang: ar
    expected_keys: [uae-pdpl:art-18:para-2]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      The right not to be subject to automated decision making, including profiling
      (Article 18) ... However, the Data Subject may not object to the decisions issued
      with respect to Automated Processing in the following cases
    note: The same as automated-decision-exceptions, asked the way people type in chat.

  - id: dpo-role-chat
    question: الـ DPO الجديد بيبلش الأسبوع الجاي، شو المفروض يعمل كل يوم؟
    lang: ar
    expected_keys: [uae-pdpl:art-11:para-1]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      who has sufficient skills and knowledge in data protection to oversee compliance
      (Articles 10 and 11)
    note: The same as dpo-role, asked the way people type in chat. Bird & Bird names Articles 10 and 11 together, which the source check does not read as Article 11. Overseeing compliance is the role Article 11(1) gives the DPO.

  - id: limit-to-purpose-by-default-chat
    question: الإعدادات الافتراضية في التطبيق، لازم تجمع بس اللي تحتاجه كل ميزة؟ ولا عادي اليوزر يطفي الزيادة بنفسه؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-3]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Their obligations (Art. 7) under the PDPL Law include: ... Restricting the
      processing of personal data only to the intended purposes.
    note: The same as limit-to-purpose-by-default, asked the way people type in chat.

  - id: several-processors-chat
    question: عنا شركتين عم يعالجوا داتا الزباين سوا، لازم يكون في عقد مكتوب بيناتهن مين بيعمل شو؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-10]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      multiple processors must have a written agreement delineating responsibilities ...
      Article 8(10)
    note: The same as several-processors, asked the way people type in chat.

  - id: processor-confidentiality-chat
    question: نعالج داتا لعميل، يصير نشارك النتايج مع عملاء ثانيين؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-5]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(5) explicitly requires Data Processors to maintain confidentiality
    note: The same as processor-confidentiality, asked the way people type in chat.

  - id: withdraw-consent-chat
    question: يوزر بدو يسحب موافقته، فيه؟ وهيك بيصير يلي عملناه قبل غلط؟
    lang: ar
    expected_keys: [uae-pdpl:art-6:para-2]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      the data subject has a right to withdraw consent at any time
    note: The same as withdraw-consent, asked the way people type in chat. Withdrawing consent at any time is Article 6(2), which also keeps lawful what was done before. ABS Partners states it without the number.

  - id: grace-period-chat
    question: كم المهلة اللي عندنا عشان نصير متوافقين مع قانون حماية البيانات؟
    lang: ar
    expected_keys: [uae-pdpl:art-29]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      Whilst the PDPL provides for an implementation period of six months from the
      publication of the Executive Regulations
    note: The same as grace-period, asked the way people type in chat. Article 29 gives controllers and processors six months to bring their processing into line, which may be extended. Bird & Bird gives the period without the article's number.

  - id: processor-breach-notice-chat
    question: احنا نعالج داتا لعميل وصار عندنا اختراق، لازم نخبر العميل؟
    lang: ar
    expected_keys: [uae-pdpl:art-9:para-3]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 9 of the PDPL ... the Processor must inform the controller immediately of
      any breaches
    note: The same as processor-breach-notice, asked the way people type in chat.

  - id: dpo-resources-chat
    question: الـ DPO عنا عم يطلب ميزانية وأكسس على السيستمات، مجبورين نعطيه؟
    lang: ar
    expected_keys: [uae-pdpl:art-12:para-1]
    source: https://www.twobirds.com/en/insights/2021/uae/how-does-the-new-uae-federal-decree-law-on-personal-data-protection-compare-against-the-gdpr
    quote: >-
      resources should be made available to the DPO
    note: The same as dpo-resources, asked the way people type in chat. Bird & Bird states it without the article's number. Giving the DPO the means to carry out the tasks in Article 11, resources and support among them, is Article 12(1).

  # The nineteen topics below were the held-out set that the UAE law's published scores came
  # from until DPOLens 0.3.0. Changes to search have been judged on them since November 2026, so
  # they are tuning questions now. They are each duty and right that one of the guides names by
  # article, except those asked above and two whose fuller answer is in another article:
  # security and fair processing. Each is asked once, in id order: formally at odd positions, and
  # the way people type in chat at even ones, the chat questions alternating Gulf and Levantine.

  - id: access-request
    question: طلب أحد المستخدمين أن يعرف ما البيانات الشخصية التي نحتفظ بها عنه ولماذا نستخدمها. هل يجب أن نجيبه، وهل يمكننا أن نطلب رسوماً مقابل ذلك؟
    lang: ar
    expected_keys: [uae-pdpl:art-13:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Right to obtain information ('data access') (Article 13) A Data Subject is
      entitled to request access to and obtain the following information without
      charge
    note: The right to ask is paragraph 1, and it is free of charge.

  - id: accuracy
    question: لازم نحدث عناوين العملاء أول بأول، ولا عادي نخلي اللي عطونا ياه وقت التسجيل؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Personal Data must be accurate and
      correct and must be updated whenever necessary
    note: Point 4 of the controls in Article 5.

  - id: breach-report
    question: اخترق شخص ما قاعدة بياناتنا ونسخ سجلات المستخدمين. لمن يجب أن نبلغ عن ذلك، وخلال كم من الوقت؟
    lang: ar
    expected_keys: [uae-pdpl:art-9:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Article 9 of the PDPL requires that the Controller shall, immediately upon
      becoming aware of any infringement or breach of the Personal Data of the Data
      Subject that would prejudice the privacy, confidentiality and security of such
      data, report such infringement or breach and the results of the investigation to
      the Office
    note: >-
      Paragraph 1 is the report to the Bureau, the UAE Data Office; paragraph 2 is
      telling the people affected.

  - id: breach-tell-users
    question: بعد ما صار عنا تسريب، لازم كمان نخبر اليوزرز اللي تسربت الداتا تبعهم؟
    lang: ar
    expected_keys: [uae-pdpl:art-9:para-2]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 9 requires controllers to notify the Data Office of personal data
      breaches ... Controllers also must notify affected data subjects when a breach
      poses a risk to their privacy, informing them of the measures taken
    note: Paragraph 2.

  - id: controller-or-processor
    question: نستضيف قوائم عملاء عملائنا على منصتنا. هل نحن المتحكم أم المعالج؟
    lang: ar
    expected_keys: [uae-pdpl:art-1:def-controller, uae-pdpl:art-1:def-processor]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Under Article 1 (Definitions) of the PDPL, a Data Controller is defined as an
      establishment or natural person who has Personal Data and who, given the nature
      of his/her activity, specifies the method, criteria and purpose of Processing
    note: Article 1 defines both, the Controller and the Processor, each a clause of its own.

  - id: correction
    question: واحد من اليوزرز يقول اسمه وتاريخ ميلاده في البروفايل غلط ويبينا نعدلها، لازم؟
    lang: ar
    expected_keys: [uae-pdpl:art-15:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Right to correction or erasure ('right to be forgotten') (Article 15) The Data
      Subject has the right to request the correction or completion of his / her
      inaccurate Personal Data held with the Controller
    note: Correction is paragraph 1; erasure, paragraph 2, is what erasure asks.

  - id: dpo-required
    question: نتعامل مع كمية كبيرة من البيانات الصحية. هل يجب علينا تعيين مسؤول لحماية البيانات؟
    lang: ar
    expected_keys: [uae-pdpl:art-10:para-1]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      By virtue of Article 10 of the PDPL, the Controller and Processor must designate
      a Data Protection Officer (DPO)
    note: Paragraph 1 lists when one must be appointed.

  - id: legal-bases
    question: لازم ناخد موافقة اليوزر على كل شي بنعمله بالداتا تبعه، ولا في حالات ما بدها موافقة؟
    lang: ar
    expected_keys: [uae-pdpl:art-4]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Legal Bases for Processing (Article 4) The PDPL prohibits Processing Personal
      Data without the consent of the Data Subject, except in the following cases
    note: Article 4 lists the cases that need no consent, and any of them answers.

  - id: minimisation
    question: هل يمكننا أن نطلب بيانات إضافية عند التسجيل، مثل تاريخ الميلاد والجنس، تحسباً لحاجتنا إليها لاحقاً؟
    lang: ar
    expected_keys: [uae-pdpl:art-5:para-3]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Data Protection Controls (Article 5) ... Personal Data must be sufficient for
      and limited to the purpose for which the Processing is made
    note: Point 3 of the controls in Article 5.

  - id: penalties
    question: شو يصير لو خالفنا قانون حماية البيانات؟ فيه غرامات؟
    lang: ar
    expected_keys: [uae-pdpl:art-26]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      may impose administrative penalties stated in Article 26 of the PDPL
    note: Article 26 leaves the violations and their penalties to a Cabinet decision.

  - id: portability
    question: يريد أحد العملاء الحصول على كل بياناته في ملف يستطيع استيراده إلى تطبيق منافس. هل يجب أن نوفره له؟
    lang: ar
    expected_keys: [uae-pdpl:art-14]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Right to request Personal Data transfer ('data portability') (Article 14) The
      Data Subject has the right to obtain his / her Personal Data provided to the
      Controller for Processing in a structured and machine-readable manner
    note: >-
      Either paragraph answers: receiving the data, or having it sent to another
      controller.

  - id: processor-end-of-contract
    question: العقد مع الفندور اللي بيعالج داتا العملاء عنا بيخلص الشهر الجاي، شو لازم يعملوا بالداتا؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-4]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(3) and (4) govern Data Retention ... the processor must erase or
      return all personal data
    note: >-
      Paragraph 4: erase the data, or hand it to the controller, once the processing
      period ends.

  - id: processor-records
    question: نعالج بيانات شخصية نيابة عن عملائنا. هل يجب علينا أيضاً أن نحتفظ بسجل لعمليات المعالجة هذه؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-7]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(7) imposes on Processors a requirement very similar to the
      controller's record-keeping. Data Processors must maintain a special record of
      Personal Data which is processed on behalf of the Controller
    note: >-
      Paragraph 7 of the processor's obligations; the controller's own record is
      Article 7(4).

  - id: processor-security
    question: شركتنا نعالج البيانات الخاصة بعملائنا، لازم نحط حماية البيانات في النظام من مرحلة التصميم؟
    lang: ar
    expected_keys: [uae-pdpl:art-8:para-2]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 8(2) obliges processors to apply the appropriate technical and
      organizational procedures and measures to protect Personal Data at the design
      stage and throughout processing
    note: Paragraph 2 of the processor's obligations.

  - id: records-of-processing
    question: هل يجب أن نحتفظ بسجل مكتوب للبيانات الشخصية التي نعالجها وسبب معالجتها؟
    lang: ar
    expected_keys: [uae-pdpl:art-7:para-4]
    source: https://abspartners.ae/uae-pdpl-duties-of-data-controllers-processors/
    quote: >-
      Article 7(4) mandates that the controller keep a "special record" of all
      personal data activities
    note: Paragraph 4 of the controller's obligations.

  - id: restriction
    question: يوزر بيقول إن الداتا اللي عندنا عنه غلط، فيه يجبرنا نوقف نستخدمها لحتى نتأكد منها؟
    lang: ar
    expected_keys: [uae-pdpl:art-16:para-1]
    source: https://www.dlapiperdataprotection.com/countries/uae-general/law.html
    quote: >-
      Right to restriction of Processing (Article 16) The Data Subject has the right
      to oblige the Controller to restrict and stop Processing in any of the following
      cases: if the Data Subject objects to the accuracy of his / her Personal Data
    note: Paragraph 1 lists the cases, a dispute over accuracy first.

  - id: scope-health-data
    question: نعمل على تطبيق للعيادات. هل ينطبق قانون حماية البيانات الشخصية على البيانات الصحية للمرضى، أم يحكمها قانون آخر؟
    lang: ar
    expected_keys: [uae-pdpl:art-2:para-2:pt-e]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 2 of the PDPL provides that the Decree Law governs personal data
      processing ... Exceptions include ... data covered by specific legislation like
      health or banking data
    note: >-
      Point (e): health data that has its own legislation is outside the law.

  - id: scope-outside-uae
    question: شركتنا في السعودية بس كثير من اليوزرز عندنا ساكنين في الإمارات، القانون الإماراتي يطبق علينا ولا لا؟
    lang: ar
    expected_keys: [uae-pdpl:art-2:para-1:pt-c]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 2 of the PDPL provides that the Decree Law governs personal data
      processing by anyone within the State or by entities outside the State handling
      data of individuals within the State
    note: >-
      Point (c) of paragraph 1: a controller or processor outside the State,
      processing the data of people in it.

  - id: stop-marketing
    question: طلب منا أحد المستخدمين التوقف عن إرسال رسائل البريد الإلكتروني الترويجية إليه. هل يجب أن نتوقف؟
    lang: ar
    expected_keys: [uae-pdpl:art-17:para-1]
    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      Article 17 of the PDPL allows data subjects to refuse or request the cessation
      of processing of their personal data in cases involving direct marketing
    note: >-
      Paragraph 1: direct marketing.
