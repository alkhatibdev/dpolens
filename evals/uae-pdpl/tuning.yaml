    note: The same as valid-consent, asked the way people type in chat. ABS Partners gives the conditions for valid consent without the article's number, partly in the GDPR's terms. Article 6(1) asks that the controller can prove consent, that it is clear, simple, unambiguous and easily accessible, and that it says how to withdraw it. It does not ask whether a checkbox is enough, which turns on Article 1's definition of consent, a held-out label.

