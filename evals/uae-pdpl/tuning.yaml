    source: https://www.multilaw.com/Multilaw/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_United_Arab_Emirates.aspx
    quote: >-
      As per Article 21 of the PDPL, the Controller is required to assess the impact of
      data processing on personal data protection before initiating any high-risk
