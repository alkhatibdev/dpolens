[project]
name = "dpolens-mcp"
version = "0.0.0"
description = "MCP server for DPOLens. Talks to the HTTP API and nothing else."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.2",
]

[project.scripts]
dpolens-mcp = "dpolens_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpolens_mcp"]
