[project]
name = "dpolens"
version = "0.0.0"
description = "Engine, HTTP API, worker and CLI for DPOLens"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=25.1",
    "typer>=0.15",
]

[project.scripts]
dpolens = "dpolens.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpolens"]
