clauses:
- key: gdpr:art-1:para-1
  text: 53b2edf01ec0c13d
  en:
  - What kind of things do EU data protection rules cover for an app that collects user info?
  - We're building a SaaS that stores customer details; is the rulebook about both protecting people and
    letting data move around?
  - Do these privacy rules only deal with how we handle personal data, or also with sharing it across
    borders?
  ar:
  - ما هو نطاق القواعد التي تنظم حماية بيانات الأشخاص عند معالجتها في تطبيقنا؟
  - هل هذا النظام يتناول فقط حماية الأفراد أم يشمل أيضاً حرية انتقال البيانات الشخصية؟
  - احنا عندنا متجر إلكتروني ونجمع بيانات الزباين، شو بالضبط اللي بتغطيه قوانين الخصوصية الأوروبية؟
- key: gdpr:art-1:para-2
  text: 6b3e348a1c5a66b6
  en:
  - What is the main goal of the EU privacy law for people whose data our app processes?
  - A teammate says privacy is just a compliance checkbox; does the law actually aim to protect fundamental
    rights?
  ar:
  - ما الحقوق التي يهدف هذا التنظيم إلى حمايتها للأفراد الذين نعالج بياناتهم؟
  - هل يُعتبر الحق في حماية البيانات الشخصية حقاً أساسياً للمستخدمين؟
  - ليش قانون الخصوصية مهم للمستخدمين؟ يعني هو بس شغلة قانونية ولا حق أساسي لهم؟
- key: gdpr:art-1:para-3
  text: cfb981412ea1ab1e
  en:
  - Can an EU country block us from moving user data to our servers in another EU country because of privacy
    concerns?
  - We run a clinic app with servers in Germany and support staff in Spain; can privacy rules stop data
    flowing between them?
  - Are there limits on member states banning personal data transfers inside the EU in the name of data
    protection?
  ar:
  - هل يجوز لدولة في الاتحاد الأوروبي منع نقل البيانات الشخصية إلى دولة أخرى في الاتحاد بحجة حماية الخصوصية؟
  - هل يمكن تقييد تدفق بيانات المستخدمين بين فروع شركتنا داخل الاتحاد الأوروبي لأسباب تتعلق بحماية البيانات؟
  - يعني ممكن بلد أوروبي يمنعنا ننقل بيانات العملاء لسيرفر في بلد أوروبي ثاني؟
- key: gdpr:art-2:para-1
  text: 6b2179ea441c395b
  en:
  - Does our app's user data handling fall under the data protection rules if everything is processed
    automatically on our servers?
  - We keep customer info in paper folders sorted by name at our clinic. Do the privacy rules still apply
    to that?
  - Which kinds of processing of personal data are covered by this regulation, digital only or manual
    records too?
  ar:
  - هل تنطبق قواعد حماية البيانات على تطبيقنا الذي يعالج بيانات المستخدمين آليًا على الخوادم؟
  - هل يشمل النظام الملفات الورقية المنظمة لدينا في العيادة أم يقتصر على البيانات الإلكترونية؟
  - عندنا ملفات الزبائن ورقية ومرتبة بالأسماء، هل لازم نلتزم بقانون حماية البيانات ولا بس للأنظمة الإلكترونية؟
- key: gdpr:art-2:para-2
  text: 7ab4781bba44c2d3
  en:
  - Are there any situations where the data protection regulation doesn't apply to our data processing
    at all?
  - What are the exceptions to the scope of the GDPR that could exempt my product?
  - Can we be exempt from GDPR for some of the personal data we handle, and in what cases?
  ar:
  - هل هناك حالات تُستثنى فيها معالجة البيانات الشخصية من نطاق اللائحة العامة لحماية البيانات؟
  - ما هي الاستثناءات التي تُخرج نشاط شركتنا الرقمي من تطبيق اللائحة؟
  - هل في حالات ما بنكون معفيين من الـ GDPR؟ وشو هي؟
- key: gdpr:art-2:para-2:pt-a
  text: 3da599277d87a5cd
  en:
  - We process data for an activity that has nothing to do with EU law. Is it exempt from GDPR?
  - Does GDPR cover data handling in areas where the EU has no legal competence?
  - Our app handles data for an activity outside EU law's reach, do we still need to comply?
  ar:
  - هل تُستثنى معالجة البيانات في نشاط يقع خارج نطاق قانون الاتحاد الأوروبي من اللائحة؟
  - نعالج بيانات ضمن نشاط لا يخضع أصلًا لقانون الاتحاد الأوروبي، فهل يلزمنا الامتثال؟
  - شركتي تشتغل بنشاط برّا اختصاص قانون الاتحاد الأوروبي، هل الـ GDPR بينطبق علينا؟
- key: gdpr:art-2:para-2:pt-b
  text: bcb5842df80dd03c
  en:
  - Do EU countries have to follow GDPR when processing data for common foreign and security policy activities?
  - Is data processing by a member state for EU foreign and security policy work excluded from GDPR?
  - Does the regulation apply to government data handling under the EU's common security and foreign policy
    chapter?
  ar:
  - هل تخضع معالجة الدول الأعضاء للبيانات في إطار السياسة الخارجية والأمنية المشتركة للاتحاد للائحة؟
  - هل تُستثنى أنشطة الدول الأعضاء المتعلقة بالفصل الثاني من الباب الخامس من معاهدة الاتحاد من اللائحة؟
  - لو دولة عضو تعالج بيانات ضمن السياسة الخارجية والأمنية المشتركة، هل الـ GDPR يسري عليها؟
- key: gdpr:art-2:para-2:pt-c
  text: a2cd909994c07931
  en:
  - I keep a contact list of friends and family in my own personal app. Does GDPR apply to me?
  - Does GDPR apply to an individual who stores personal data just for private use at home?
  ar:
  - هل تنطبق اللائحة على شخص يحتفظ ببيانات أصدقائه وعائلته لاستخدامه الشخصي فقط؟
  - هل يُعفى الفرد الذي يعالج بيانات لأغراض شخصية أو منزلية بحتة من اللائحة؟
  - أنا مخزّن أرقام وصور الأهل والأصحاب لاستعمالي الخاص، لازم أتقيد بالـ GDPR ولا لأ؟
- key: gdpr:art-2:para-2:pt-d
  text: 8afd262f637af1d4
  en:
  - Does GDPR apply when police or authorities process data to investigate or prosecute crimes?
  - A police department asked our app for user data for a criminal investigation. Is their processing
    under GDPR?
  - Are law enforcement bodies exempt from the regulation when they handle data to prevent threats to
    public security?
  ar:
  - هل تسري اللائحة على السلطات المختصة عندما تعالج البيانات للتحقيق في الجرائم أو ملاحقتها؟
  - هل تُستثنى معالجة الجهات الأمنية للبيانات بغرض منع التهديدات للأمن العام من اللائحة؟
  - الشرطة طلبت بيانات مستخدمين من تطبيقنا للتحقيق بجريمة، هل معالجتهم تخضع للـ GDPR؟
- key: gdpr:art-2:para-3
  text: 9dd80603f84530ea
  en:
  - Which rules apply to personal data processed by EU institutions and agencies, GDPR or something else?
  - We're building software for an EU agency. Is their data handling governed by GDPR or a separate regulation?
  - Is the old Regulation 45/2001 still relevant for EU bodies' data processing?
  ar:
  - ما القواعد التي تحكم معالجة البيانات الشخصية من قبل مؤسسات الاتحاد الأوروبي ووكالاته؟
  - نطور نظامًا لوكالة تابعة للاتحاد الأوروبي، هل تخضع بياناتها للائحة العامة أم للائحة أخرى؟
  - هل مؤسسات الاتحاد الأوروبي تطبّق الـ GDPR ولا لها قانون ثاني خاص فيها؟
- key: gdpr:art-2:para-4
  text: 438b491f7e337e4f
  en:
  - Does GDPR change the liability rules for hosting providers and other intermediaries under the e-commerce
    directive?
  - We run a platform hosting user content. Does GDPR override the intermediary liability protections?
  - How does GDPR relate to the E-Commerce Directive for online service providers?
  ar:
  - هل تؤثر اللائحة العامة لحماية البيانات على قواعد مسؤولية مزودي الخدمات الوسيطة في توجيه التجارة الإلكترونية؟
  - نشغّل منصة تستضيف محتوى المستخدمين، هل تلغي اللائحة حماية المسؤولية الخاصة بالوسطاء؟
  - شو علاقة الـ GDPR بتوجيه التجارة الإلكترونية بالنسبة لمزودي الاستضافة؟
- key: gdpr:art-3:para-1
  text: be56f0652f1073f6
  en:
  - Our company has an office in Germany but our servers and data processing run on cloud machines in
    the US. Does the EU privacy law still apply to us?
  - Does having a branch or subsidiary in an EU country mean all our user data handling falls under European
    data rules, even if it's processed elsewhere?
  - We're a SaaS vendor with a team in Ireland that handles customer accounts. Does it matter that the
    database is hosted outside Europe?
  ar:
  - شركتنا لديها مكتب في فرنسا لكن خوادمنا ومعالجة البيانات تتم في أمريكا، هل ينطبق علينا قانون حماية
    البيانات الأوروبي؟
  - هل وجود فرع أو شركة تابعة لنا داخل دولة في الاتحاد الأوروبي يعني أن معالجة بيانات المستخدمين تخضع
    للائحة حتى لو تمت خارج أوروبا؟
  - عندنا فريق في أيرلندا وسيرفرات التطبيق برا أوروبا، هل لسه لازم نلتزم بقانون الخصوصية الأوروبي؟
- key: gdpr:art-3:para-2
  text: 01aa6ea5da8a7498
  en:
  - We're a startup based outside Europe but we have users in the EU. When do we have to follow EU data
    protection rules?
  - Does the GDPR apply to my app if my company has no EU office or entity but people located in Europe
    use it?
  - Which kinds of activities by a non-EU business toward people in Europe pull it under European privacy
    law?
  ar:
  - نحن شركة ناشئة خارج أوروبا ولدينا مستخدمون في دول الاتحاد الأوروبي، متى يجب علينا الالتزام بقواعد
    حماية البيانات الأوروبية؟
  - هل تسري اللائحة العامة لحماية البيانات على تطبيقي إذا لم يكن لشركتي أي مكتب في أوروبا لكن أشخاصاً
    موجودين هناك يستخدمونه؟
  - شركتي مو في أوروبا بس في ناس من أوروبا يسجلون في موقعنا، هل لازم نطبق قانون GDPR؟
- key: gdpr:art-3:para-2:pt-a
  text: 394643e6d594b183
  en:
  - We run an online shop in Canada and ship to customers in France and Spain. Do we have to comply with
    EU privacy rules?
  - Our app is free, with no payment from users, but it's available in EU countries and has European language
    options. Does GDPR still cover us?
  - If we sell a subscription to people located in Europe from a company outside the EU, does that make
    us subject to European data law?
  ar:
  - نملك متجراً إلكترونياً في كندا ونشحن إلى عملاء في فرنسا وإسبانيا، هل يجب أن نلتزم بقواعد الخصوصية
    الأوروبية؟
  - تطبيقنا مجاني ولا يدفع المستخدمون شيئاً، لكنه متاح في دول أوروبية وبه لغات أوروبية. هل ما زالت اللائحة
    تنطبق علينا؟
  - لو بعنا اشتراك لناس في أوروبا من شركة برا الاتحاد، هل هذا يخضعنا لقانون GDPR؟
- key: gdpr:art-3:para-2:pt-b
  text: 5c311884b1cd38c5
  en:
  - We're a US analytics company that tracks website visitors' behavior, and some of them are in the EU.
    Are we covered by GDPR?
  - Does using cookies or session recording to track what users in Europe do on our site bring us under
    EU data rules even without an EU office?
  - Our ad-tech tool profiles app users' habits, including people located in Germany. Do European privacy
    rules apply to us?
  ar:
  - نحن شركة تحليلات أمريكية نتتبع سلوك زوار المواقع وبعضهم في أوروبا، هل ينطبق علينا قانون حماية البيانات
    الأوروبي؟
  - هل استخدام الكوكيز أو تسجيل جلسات المستخدمين لتتبع ما يفعله أشخاص في أوروبا على موقعنا يخضعنا للائحة
    حتى بدون مكتب في أوروبا؟
  - أداتنا الإعلانية تحلل عادات مستخدمين موجودين في ألمانيا، يعني لازم نلتزم بخصوصية أوروبا؟
- key: gdpr:art-3:para-3
  text: 394d860dd82bde2f
  en:
  - Our company is outside the EU but operates at an embassy or consulate of an EU country abroad. Does
    the EU data law apply to our processing there?
  - Does GDPR reach a non-EU controller working in a location where an EU member state's law applies under
    international law, like an embassy?
  ar:
  - شركتنا خارج الاتحاد الأوروبي لكنها تعمل في سفارة أو قنصلية لدولة أوروبية في الخارج، هل ينطبق قانون
    البيانات الأوروبي على معالجتنا هناك؟
  - هل تمتد اللائحة إلى جهة مسؤولة عن البيانات غير مقيمة في أوروبا وتعمل في مكان يطبق فيه قانون دولة عضو
    بموجب القانون الدولي مثل السفارات؟
- key: gdpr:art-4
  text: 3942cf02a3624b32
  en:
  - Where can I find the official meanings of terms like controller, processor and personal data for my
    app?
  - I'm reading our privacy policy and don't understand the legal jargon, where are the key terms defined?
  - Which definitions apply when working out my company's data protection duties?
  ar:
  - أين أجد التعريفات الرسمية لمصطلحات مثل المتحكم والمعالج والبيانات الشخصية في نظام حماية البيانات الأوروبي؟
  - وين ألاقي شرح المصطلحات القانونية اللي تنقال في سياسة الخصوصية تبع تطبيقي؟
  - ما هي التعريفات التي يجب الرجوع إليها لفهم التزامات شركتي الناشئة في حماية البيانات؟
- key: gdpr:art-4:pt-1
  text: 23d9b3a75c38f9f0
  en:
  - Is an IP address or device ID in our app's logs considered personal data?
  - Do we need to treat user emails and location pings as protected personal information?
  - If we store only a cookie ID with no name, can that still identify a person?
  ar:
  - هل عنوان IP ومعرّف الجهاز في سجلات تطبيقنا يُعدّان بيانات شخصية؟
  - شو يعتبر بيانات شخصية عندي في المتجر الإلكتروني؟ بس الإيميل ولا حتى رقم الجهاز؟
  - هل يمكن اعتبار معرّف الكوكيز دون اسم صاحبه معلومة تحدد هوية شخص؟
- key: gdpr:art-4:pt-2
  text: 987bbf0749429e27
  en:
  - Does simply storing customer data in our database count as processing?
  - Is deleting user records or sending data to an analytics tool considered processing?
  - What kinds of things we do with user data in our app count as data processing?
  ar:
  - هل مجرد تخزين بيانات العملاء في قاعدة بياناتنا يُعدّ معالجة؟
  - هل حذف سجلات المستخدمين أو إرسال بياناتهم لأداة تحليلات يعتبر معالجة للبيانات؟
  - ايش الأشياء اللي نسويها ببيانات المستخدمين في التطبيق وتنحسب معالجة؟
- key: gdpr:art-4:pt-3
  text: b8fd26ca1769808e
  en:
  - What does it mean to restrict processing of a user's data in our system?
  - A user asked us to freeze their data but not delete it, is flagging the records enough?
  - How is restricting data different from deleting it in our database?
  ar:
  - ماذا يعني تقييد معالجة بيانات مستخدم في نظامنا؟
  - مستخدم طلب نوقف استخدام بياناته بدون ما نحذفها، هل يكفي نحط علامة على السجلات؟
  - شو الفرق بين تقييد المعالجة وحذف البيانات من قاعدة البيانات؟
- key: gdpr:art-4:pt-4
  text: cff92cf0956c4e65
  en:
  - Is our recommendation engine that predicts what users will buy considered profiling?
  - We score users' creditworthiness automatically in our lending app, does that count as profiling?
  - Does tracking user behavior to predict interests or location make us profile people?
  ar:
  - هل محرك التوصيات عندنا الذي يتوقع ما سيشتريه المستخدم يُعتبر تحليل سمات (بروفايلنغ)؟
  - نحسب تقييم ائتماني للعملاء تلقائياً في تطبيق التمويل، هل هذا يعد تنميط؟
  - لو نتتبع سلوك المستخدمين عشان نتوقع اهتماماتهم، هل نعتبر نسوي بروفايلنج؟
- key: gdpr:art-4:pt-5
  text: 9e1b0251a1bbbed2
  en:
  - If we replace user names with random IDs and keep the lookup table separate, is that pseudonymisation?
  - What must we do to make pseudonymised data count as properly separated from identities?
  - Is hashing user emails enough to call our dataset pseudonymised?
  ar:
  - إذا استبدلنا أسماء المستخدمين برموز عشوائية وحفظنا جدول المطابقة منفصلاً، فهل هذا يسمى استخدام اسم
    مستعار للبيانات؟
  - شو لازم نسوي عشان تنعتبر بياناتنا مجهّلة جزئياً بالمعرّفات المستعارة؟
  - هل تشفير الإيميلات بالهاش يكفي لنقول إن البيانات مستعارة الهوية؟
- key: gdpr:art-4:pt-6
  text: 676e3dc2b35421d1
  en:
  - Do paper forms or spreadsheets organized by customer name count as a filing system?
  - Does our scattered data across several servers still count as one structured set?
  ar:
  - هل الملفات الورقية أو جداول الإكسل المرتبة حسب اسم العميل تعتبر نظام حفظ؟
  - بياناتنا موزعة على عدة سيرفرات، هل لسا تعتبر مجموعة منظمة؟
- key: gdpr:art-4:pt-7
  text: aa1262006e7fcaaa
  en:
  - Are we the controller if we decide why and how our app collects user data?
  - Can two companies be joint controllers of the same customer data?
  - Who counts as the controller when a law itself sets what data a body must process?
  ar:
  - هل نُعتبر المتحكم بالبيانات إذا كنا نحدد سبب وكيفية جمع تطبيقنا لبيانات المستخدمين؟
  - هل ممكن شركتين تكونان متحكمتين مشتركتين في نفس بيانات العملاء؟
  - مين يعتبر مسؤول التحكم لما القانون نفسه يحدد ليش وكيف تتعالج البيانات؟
- key: gdpr:art-4:pt-8
  text: f018a8e869f8ecb2
  en:
  - We host and process data for client companies on their instructions, are we a processor?
  - Is our SaaS vendor that handles our customer emails a processor?
  - What makes a company a processor rather than a controller?
  ar:
  - نحن نستضيف ونعالج بيانات لشركات عملاء بتعليماتهم، هل نُعتبر معالجاً للبيانات؟
  - هل مزود خدمة البريد الذي يرسل رسائل عملائنا يعتبر معالجاً؟
  - شو اللي يخلي الشركة معالج بيانات مو متحكم؟
- key: gdpr:art-4:pt-9
  text: a2f1db446b0dd047
  en:
  - Is a payment provider that we send customer details to a recipient?
  - Does a recipient have to be an outside company, or can it be an internal team too?
  - Are tax authorities who request data in an investigation counted as recipients?
  ar:
  - هل مزود الدفع الذي نرسل له بيانات العملاء يُعدّ مستلماً للبيانات؟
  - هل لازم المستلم يكون شركة خارجية ولا ممكن يكون قسم داخلي؟
  - هل الجهات الرسمية التي تطلب البيانات ضمن تحقيق معين تعتبر مستلمة؟
- key: gdpr:art-4:pt-10
  text: 4ab17204b6af84c4
  en:
  - Who counts as a third party when we share user data with an advertising partner?
  - Are our own employees who handle user data treated as third parties?
  - Is a vendor other than our processor considered a third party?
  ar:
  - من يُعتبر طرفاً ثالثاً عندما نشارك بيانات المستخدمين مع شريك إعلاني؟
  - هل موظفونا الذين يتعاملون مع بيانات المستخدمين يُعدّون طرفاً ثالثاً؟
  - وش يعني طرف ثالث، وهل أي شركة غير المعالج تنحسب كذا؟
- key: gdpr:art-4:pt-11
  text: a42af442e710167a
  en:
  - Does a pre-ticked checkbox count as valid consent in our signup form?
  - What makes user consent valid for our app's tracking?
  - Is silence or continued scrolling on our site enough to count as consent?
  ar:
  - هل مربع الموافقة المعبأ مسبقاً في نموذج التسجيل يُعدّ موافقة صحيحة؟
  - ما الشروط التي تجعل موافقة المستخدم على التتبع في تطبيقنا صالحة؟
  - هل يكفي أن المستخدم يكمل التصفح في موقعنا عشان نعتبره وافق؟
- key: gdpr:art-4:pt-12
  text: 31ff05c671df8623
  en:
  - Our database was hacked and customer data leaked, is that a personal data breach?
  - Does an employee accidentally deleting user records count as a breach?
  - We emailed a customer list to the wrong person, is this a data breach?
  ar:
  - تم اختراق قاعدة بياناتنا وتسربت بيانات العملاء، هل يُعدّ هذا خرقاً للبيانات الشخصية؟
  - هل حذف موظف سجلات المستخدمين بالخطأ يعتبر خرق بيانات؟
  - أرسلنا قائمة عملاء للشخص الغلط بالإيميل، هل هذا يعتبر تسريب بيانات؟
- key: gdpr:art-4:pt-13
  text: 8ba962f36dd53768
  en:
  - Is DNA test data from our ancestry app genetic data?
  - What counts as genetic data for a health-tech product?
  - Do saliva sample analysis results we store fall under genetic data?
  ar:
  - هل نتائج فحص الحمض النووي في تطبيقنا للأنساب تُعدّ بيانات جينية؟
  - ما الذي يُعتبر بيانات جينية في منتج تقني صحي؟
  - نتائج تحليل عينات اللعاب اللي نخزنها، هل تدخل ضمن البيانات الوراثية؟
- key: gdpr:art-4:pt-14
  text: 118196648992c146
  en:
  - Is face recognition login in our app biometric data?
  - Do fingerprints used for employee clock-in count as biometric data?
  - Are plain photos of users biometric data or only when used for identification?
  ar:
  - هل تسجيل الدخول ببصمة الوجه في تطبيقنا يعتبر بيانات حيوية؟
  - هل بصمات الأصابع المستخدمة لتسجيل حضور الموظفين تُعدّ بيانات بيومترية؟
  - هل الصور العادية للمستخدمين تعتبر بيانات حيوية أم فقط إذا استخدمت للتعرف على الهوية؟
- key: gdpr:art-4:pt-15
  text: 6312675e10193de1
  en:
  - Does our fitness app's heart rate and sleep data count as health data?
  - Are appointment records at our clinic booking system data concerning health?
  - Is a user's note that they have diabetes in their profile health data?
  ar:
  - هل بيانات نبضات القلب والنوم في تطبيق اللياقة تُعتبر بيانات صحية؟
  - هل سجلات المواعيد في نظام حجز العيادة تُعدّ بيانات تتعلق بالصحة؟
  - لو مستخدم كتب في ملفه إنه عنده سكري، هل هذي بيانات صحية؟
- key: gdpr:art-4:pt-16
  text: 29ee95af0cf6e029
  en:
  - How do I figure out which of our offices is the main establishment in the EU?
  - Which entity counts as our main establishment if we operate in many countries?
  ar:
  - كيف أحدد أي مكتب من مكاتبنا هو المقر الرئيسي في الاتحاد الأوروبي؟
  - ما المقصود بالمنشأة الرئيسية للشركة التي لها عدة مكاتب أوروبية؟
  - أي كيان يُعتبر مقرنا الرئيسي إذا نشتغل في دول كثيرة؟
- key: gdpr:art-4:pt-16:pt-a
  text: ffb04d6daf208196
  en:
  - Our HQ is in Germany but product decisions on data are made in our Dublin office, which is the main
    establishment?
  - For a controller with offices in several EU countries, is the main establishment always the head office?
  - Which office is our main establishment when the data decisions are taken elsewhere than central administration?
  ar:
  - مقرنا الرئيسي في ألمانيا لكن قرارات البيانات تُتخذ في مكتب دبلن، أي مكتب هو المنشأة الرئيسية؟
  - بالنسبة للمتحكم الذي له مكاتب في عدة دول أوروبية، هل المقر الرئيسي دائماً هو الإدارة المركزية؟
  - وين يكون مقرنا الرئيسي لو قرارات البيانات تنأخذ بمكتب غير الإدارة المركزية؟
- key: gdpr:art-4:pt-16:pt-b
  text: 4f8d2dbd0c04c7ca
  en:
  - We are a cloud processor with offices in several EU states, which one is our main establishment?
  - What if a processor has no central administration in the EU, where is its main establishment?
  - How is the main establishment decided for a data processor rather than a controller?
  ar:
  - نحن معالج سحابي لنا مكاتب في عدة دول أوروبية، أي مكتب يُعتبر منشأتنا الرئيسية؟
  - ماذا لو لم يكن للمعالج إدارة مركزية في الاتحاد الأوروبي، أين تكون منشأته الرئيسية؟
  - كيف نحدد المقر الرئيسي لو كنا معالج بيانات مو متحكم؟
- key: gdpr:art-4:pt-17
  text: 2b1142ecd6a0d96d
  en:
  - Who qualifies as an EU representative for a non-EU company and how are they appointed?
  - Can a law firm in Europe act as our representative for data protection?
  ar:
  - من يمكن أن يكون ممثلاً في الاتحاد الأوروبي لشركة من خارجه وكيف يتم تعيينه؟
  - ممكن مكتب محاماة في أوروبا يكون ممثلنا بخصوص حماية البيانات؟
- key: gdpr:art-4:pt-18
  text: 319af227d556d768
  en:
  - Does a small freelancer or partnership count as an enterprise?
  - Is a nonprofit running an economic activity treated as an enterprise?
  - What counts as an enterprise regardless of whether we're a company or sole trader?
  ar:
  - هل المستقل الفرد أو الشراكة الصغيرة تُعتبر مؤسسة؟
  - هل الجمعية التي تمارس نشاطاً اقتصادياً تُعد منشأة تجارية؟
  - شو يعتبر مؤسسة بغض النظر عن شكلها القانوني؟
- key: gdpr:art-4:pt-19
  text: 6d26a89bce390c24
  en:
  - Is our parent company with its subsidiaries a group of undertakings?
  - What does group of undertakings mean when we share data between sister companies?
  - Do subsidiaries controlled by one holding company form a group?
  ar:
  - هل شركتنا الأم مع فروعها التابعة تُعتبر مجموعة مؤسسات؟
  - ماذا تعني مجموعة المؤسسات عندما نتبادل البيانات بين الشركات الشقيقة؟
  - هل الشركات التابعة لشركة قابضة واحدة تشكل مجموعة؟
- key: gdpr:art-4:pt-20
  text: 6a1ff8f42f07baa4
  en:
  - What are binding corporate rules for sending data between our offices in different countries?
  - What does BCR mean in data transfers within a company group?
  ar:
  - ما هي القواعد المؤسسية الملزمة لنقل البيانات بين مكاتب شركتنا في دول مختلفة؟
  - شو معنى BCR في نقل البيانات داخل مجموعة الشركات؟
- key: gdpr:art-4:pt-21
  text: 0ec6d6c522b43dd1
  en:
  - Is the national data protection regulator the same as a supervisory authority?
  - Who is the data protection authority in each EU country?
  ar:
  - هل الجهة الوطنية لحماية البيانات هي نفسها سلطة الرقابة؟
  - مين هي هيئة حماية البيانات المستقلة في كل دولة أوروبية؟
- key: gdpr:art-4:pt-22
  text: 2c7c7e6503fa4c18
  en:
  - Which regulators count as concerned when we run an app across several EU countries?
  - When is a data protection authority considered concerned in a case involving our company?
  - Why would a regulator in another country be involved in our data processing?
  ar:
  - أي الجهات الرقابية تُعتبر معنية عندما نشغّل تطبيقاً في عدة دول أوروبية؟
  - متى تُعدّ هيئة حماية البيانات جهة معنية في قضية تخص شركتنا؟
  - ليش ممكن تتدخل هيئة رقابية من دولة ثانية في معالجتنا للبيانات؟
- key: gdpr:art-4:pt-22:pt-a
  text: 61ac728befbaca35
  en:
  - Our company is registered in Spain, is the Spanish regulator concerned by our processing?
  - Does having an office in a country make that country's regulator involved?
  - Is the authority where our entity is established automatically concerned?
  ar:
  - شركتنا مسجلة في إسبانيا، هل الهيئة الإسبانية معنية بمعالجتنا للبيانات؟
  - هل وجود مكتب لنا في بلد ما يجعل هيئة ذلك البلد معنية؟
  - هل الهيئة الموجودة في البلد الذي تأسست فيه شركتنا تُعتبر معنية تلقائياً؟
- key: gdpr:art-4:pt-22:pt-b
  text: e0398a105f823ffe
  en:
  - Our app has many users in France though we're based elsewhere, does the French regulator get involved?
  - If our data processing substantially affects residents of another country, is that country's authority
    concerned?
  - Could a regulator be concerned just because their residents are likely to be affected by our feature?
  ar:
  - تطبيقنا له مستخدمون كثيرون في فرنسا رغم أن مقرنا في بلد آخر، هل تصبح الهيئة الفرنسية معنية؟
  - إذا أثرت معالجتنا بشكل كبير على المقيمين في دولة أخرى، هل تكون هيئتها معنية؟
  - ممكن هيئة رقابية تصير معنية بس لأن سكان بلدها ممكن يتأثرون بميزة عندنا؟
- key: gdpr:art-4:pt-22:pt-c
  text: b6760c7af1d3b980
  en:
  - A user in Italy filed a complaint about us, does the Italian regulator become concerned?
  - If someone lodges a complaint with a regulator in a country where we have no office, is it involved?
  - Does the place where a complaint is filed affect which authority is concerned?
  ar:
  - مستخدم في إيطاليا قدّم شكوى ضدنا، هل تصبح الهيئة الإيطالية معنية؟
  - إذا قدم شخص شكوى لدى هيئة في بلد ليس لنا فيه مكتب، هل تعتبر معنية؟
  - هل مكان تقديم الشكوى يؤثر على الهيئة التي تعتبر معنية؟
- key: gdpr:art-4:pt-23
  text: 0e92f538772a2046
  en:
  - When does our data processing count as cross-border within the EU?
  - We run one app serving customers in many EU countries, is that cross-border processing?
  - What makes processing cross-border for a company with one or several offices?
  ar:
  - متى تُعتبر معالجتنا للبيانات عابرة للحدود داخل الاتحاد الأوروبي؟
  - نشغل تطبيقاً واحداً يخدم عملاء في دول أوروبية كثيرة، هل هذه معالجة عابرة للحدود؟
  - ما الذي يجعل المعالجة عابرة للحدود لشركة لها مكتب واحد أو عدة مكاتب؟
- key: gdpr:art-4:pt-23:pt-a
  text: 6fac9921baeea219
  en:
  - We have offices in Poland and Sweden both handling customer data, is that cross-border processing?
  - If our company is established in several EU states and processes data in each, does this count as
    cross-border?
  - Does processing by branches in different member states make it cross-border?
  ar:
  - لدينا مكتبان في بولندا والسويد يعالجان بيانات العملاء، هل هذه معالجة عابرة للحدود؟
  - إذا كانت شركتنا مؤسسة في عدة دول أوروبية وتعالج البيانات في كل منها، هل يعد هذا عبر الحدود؟
  - هل معالجة الفروع في دول أعضاء مختلفة تجعلها عابرة للحدود؟
- key: gdpr:art-4:pt-23:pt-b
  text: 622990a3936f1aca
  en:
  - We have only one office in Ireland but our app affects users across the EU, is that cross-border processing?
  - Can a single-location company still be doing cross-border processing?
  - If a new feature from our one EU entity likely affects users in several countries, does that count?
  ar:
  - لدينا مكتب واحد فقط في أيرلندا لكن تطبيقنا يؤثر على مستخدمين في كل أوروبا، هل هذه معالجة عابرة للحدود؟
  - هل يمكن لشركة بمقر واحد أن تقوم بمعالجة عابرة للحدود؟
  - لو ميزة جديدة من كيانّا الأوروبي الوحيد ممكن تأثر على مستخدمين بعدة دول، هل تنحسب كذا؟
- key: gdpr:art-4:pt-24
  text: daa59cf5d42aa8e1
  en:
  - What counts as a relevant and reasoned objection when a regulator disagrees with a draft decision
    about us?
  - What must an objection to a draft decision show to be valid?
  ar:
  - ما الذي يُعد اعتراضاً وجيهاً ومسبباً عندما تختلف هيئة رقابية مع مشروع قرار يخصنا؟
  - ماذا يجب أن يبين الاعتراض على مشروع قرار حتى يكون صحيحاً؟
- key: gdpr:art-4:pt-26
  text: 0074dcb02a8e0a10
  en:
  - Is the UN or another body set up by treaty an international organisation?
  - We send data to an international agency, does it count as an international organisation?
  - What qualifies as an international organisation when transferring data outside the EU?
  ar:
  - هل الأمم المتحدة أو أي جهة أنشئت بمعاهدة تُعتبر منظمة دولية؟
  - نرسل بيانات لوكالة دولية، هل تُعد منظمة دولية؟
  - ما الذي يؤهل جهة لتكون منظمة دولية عند نقل البيانات خارج أوروبا؟
- key: gdpr:art-5:para-1
  text: 1588acdf3c75d47c
  en:
  - What basic rules does my app have to follow whenever it handles users' personal information?
  - We're building a SaaS product that collects customer data. What are the core principles we need to
    design around?
  - Is there a general checklist of data protection principles that covers collecting, storing and securing
    user data?
  ar:
  - ما هي المبادئ الأساسية التي يجب أن يلتزم بها تطبيقي عند التعامل مع البيانات الشخصية للمستخدمين؟
  - ما القواعد العامة التي تحكم جمع البيانات الشخصية وتخزينها وحمايتها في منتج برمجي؟
  - شو المبادئ الأساسية اللي لازم أمشي عليها لما أجمع بيانات الناس في تطبيقي؟
- key: gdpr:art-5:para-1:pt-a
  text: f6573eb394a64a5c
  en:
  - Do I have to tell users in plain language what my app does with their data?
  - Our online shop quietly shares customer emails with a partner without saying so. Is that a problem?
  ar:
  - هل يجب أن أوضح للمستخدمين بشكل صريح كيف يتم استخدام بياناتهم داخل التطبيق؟
  - هل يجوز لمتجري الإلكتروني معالجة بيانات العملاء بطريقة غير عادلة أو دون إعلامهم؟
  - يعني لازم أقول للمستخدم شو بسوي ببياناته؟ ولا أقدر أسوي اللي بدي ياه من دون ما أخبره؟
- key: gdpr:art-5:para-1:pt-b
  text: 3da4a8e717ae0b57
  en:
  - We collected emails for order confirmations and now marketing wants to use them for promotions. Can
    we?
  - Do I need to decide and state why I'm collecting data before I start collecting it?
  - Can we reuse old user data for a new feature or analytics project that wasn't the original reason
    we collected it?
  ar:
  - جمعنا عناوين البريد لتأكيد الطلبات والآن يريد التسويق استخدامها في العروض الترويجية، هل يجوز ذلك؟
  - هل يجب تحديد الغرض من جمع البيانات بوضوح قبل البدء بجمعها؟
  - هل أقدر أستخدم بيانات المستخدمين القديمة لمشروع جديد غير السبب اللي جمعناها عشانه؟
- key: gdpr:art-5:para-1:pt-c
  text: 61cd0a23bf064277
  en:
  - Our signup form asks for birthday and home address even though we don't need them. Is that allowed?
  - How do I decide which fields to collect so I don't gather too much user data?
  - Is it a violation to collect extra data just in case it's useful later?
  ar:
  - نموذج التسجيل لدينا يطلب تاريخ الميلاد والعنوان دون حاجة فعلية، هل هذا مسموح؟
  - كيف أحدد البيانات التي أجمعها حتى لا أجمع أكثر من اللازم من المستخدمين؟
  - ليش ما يصير أجمع بيانات زيادة بس احتياط يمكن نحتاجها بعدين؟
- key: gdpr:art-5:para-1:pt-d
  text: 9e9432aef1f710a1
  en:
  - A customer's address in our database is outdated. Do we have to fix it?
  - Are we obliged to keep user records up to date and correct wrong data quickly?
  - What should my app do when it finds out that stored personal data is incorrect?
  ar:
  - عنوان أحد العملاء في قاعدة بياناتنا قديم، هل نلتزم بتصحيحه؟
  - هل يجب علينا إبقاء سجلات المستخدمين محدثة وتصحيح البيانات الخاطئة بسرعة؟
  - وايش أسوي لو اكتشفت إن بيانات شخصية مخزنة عندي غلط؟ لازم أصلحها فوراً؟
- key: gdpr:art-5:para-1:pt-e
  text: af2cb23c919ead0b
  en:
  - How long can we keep user data after they stop using our app?
  - Can we keep identifiable data forever for statistics or research purposes?
  ar:
  - كم من الوقت يمكننا الاحتفاظ ببيانات المستخدم بعد أن يتوقف عن استخدام التطبيق؟
  - كم مدة أحتفظ ببيانات الزبون بعد ما يلغي حسابه؟ ممكن أخليها للأبد؟
- key: gdpr:art-5:para-1:pt-f
  text: 572ba9d6d8187aa8
  en:
  - What security measures do we need to protect user data from hackers or accidental loss?
  - Our clinic app database was accidentally deleted with no backup. Does that breach data protection
    rules?
  ar:
  - ما إجراءات الأمان المطلوبة لحماية بيانات المستخدمين من الاختراق أو الفقدان العرضي؟
  - حُذفت قاعدة بيانات عيادتنا بالخطأ دون نسخة احتياطية، هل يعد ذلك مخالفة لقواعد حماية البيانات؟
- key: gdpr:art-5:para-2
  text: 29b8f23782ea09cb
  en:
  - Who is responsible for making sure our app follows the data protection principles?
  - If a regulator asks us to prove we comply, what do we need to be able to show?
  - Is it enough to follow the rules, or do we also need documentation that proves it?
  ar:
  - من المسؤول عن التأكد من أن تطبيقنا يلتزم بمبادئ حماية البيانات؟
  - إذا طلبت الجهة الرقابية إثبات امتثالنا، ما الذي يجب أن نكون قادرين على إظهاره؟
  - هل يكفي أن نلتزم بالقواعد أم يجب أيضاً أن نوثق ما يثبت ذلك؟
- key: gdpr:art-6:para-1
  text: 8fedf4c1e60d9d52
  en:
  - What are the legal reasons that let my app collect and use people's personal data in the first place?
  - We're launching a newsletter signup and user accounts; do we need some specific justification before
    handling customer data?
  - Can I process user data just because it's useful for my business, or does it need one of a fixed set
    of grounds?
  ar:
  - ما هي الأسس القانونية التي تسمح لتطبيقي بجمع بيانات المستخدمين الشخصية ومعالجتها؟
  - هل يجوز لمتجري الإلكتروني معالجة بيانات العملاء دون وجود مبرر قانوني محدد من بين مبررات معينة؟
  - شو الأسباب اللي تخليني أقدر أستخدم بيانات الناس في تطبيقي بشكل قانوني؟
- key: gdpr:art-6:para-1:pt-a
  text: 44f585b8da4f0614
  en:
  - Do I need a user's permission before using their email for marketing in my app?
  - If a user ticks a box agreeing to us using their data, is that enough, and does it cover any purpose
    we like?
  - We want to use signup data for both analytics and promotions; can one consent cover both?
  ar:
  - هل أحتاج إلى موافقة المستخدم قبل استخدام بريده الإلكتروني في التسويق عبر تطبيقي؟
  - إذا وافق المستخدم على معالجة بياناته، هل تكفي موافقة واحدة لعدة أغراض مختلفة أم يجب تحديد كل غرض؟
  - لازم آخذ موافقة العميل عشان أستخدم بياناته ولا أقدر أشتغل بدونها؟
- key: gdpr:art-6:para-1:pt-b
  text: 61aeeb860bce0bad
  en:
  - Can I use a customer's address and payment details to ship their order without asking for separate
    consent?
  - A person asked for a quote on our subscription plan before signing up; may we process their data to
    prepare it?
  - Does needing data to fulfil our service agreement with the user count as a valid reason to process
    it?
  ar:
  - هل يمكنني استخدام عنوان العميل وبيانات الدفع لتوصيل طلبه دون طلب موافقة منفصلة؟
  - طلب شخص عرض سعر لاشتراك في خدمتنا قبل التسجيل، هل يجوز لنا معالجة بياناته لإعداده؟
  - وشلون أبرر معالجة بيانات المستخدم إذا كنت محتاجها عشان أنفذ العقد معه؟
- key: gdpr:art-6:para-1:pt-c
  text: 9b8d2cd0f0cd615c
  en:
  - Our bank app must keep transaction records because tax law says so; can we process that data without
    consent?
  - A law requires my online shop to keep invoices with customer details; is that a valid basis for holding
    the data?
  - Is a legal duty on my company enough justification to process personal data?
  ar:
  - يفرض القانون على تطبيقنا المصرفي الاحتفاظ بسجلات المعاملات، فهل يجوز معالجة هذه البيانات دون موافقة
    العميل؟
  - القانون يلزم متجري الإلكتروني بحفظ الفواتير مع بيانات الزبائن، هل هذا أساس سليم للمعالجة؟
  - اذا في قانون يجبرني أخزن بيانات الناس، أقدر أعالجها بدون ما أسألهم؟
- key: gdpr:art-6:para-1:pt-d
  text: 3319858dad3c4b5a
  en:
  - A patient collapsed and the clinic app needs to share their data with paramedics; is that allowed
    without consent?
  - Can we use someone's data to protect their life in an emergency when they can't agree?
  - Is it lawful to process a person's data to save a different person, like a third party in danger?
  ar:
  - انهار مريض وتحتاج عيادتنا إلى مشاركة بياناته مع المسعفين، هل يجوز ذلك دون موافقته؟
  - هل يمكن معالجة بيانات شخص لحماية حياته في حالة طارئة وهو غير قادر على الموافقة؟
  - لو لازم أستخدم بيانات واحد عشان أنقذ حياة شخص ثاني، هل هذا مسموح؟
- key: gdpr:art-6:para-1:pt-e
  text: 8e42e6c6ee4f21e7
  en:
  - We run a public school's portal; can we process student data as part of our official public task?
  - Does a government agency's app need consent from citizens to handle their data for its official duties?
  - Our company was assigned a public-interest task by authorities; does that give us grounds to process
    data?
  ar:
  - نشغّل بوابة إلكترونية لمدرسة حكومية، فهل يمكن معالجة بيانات الطلاب ضمن مهمتنا العامة الرسمية؟
  - هل يحتاج تطبيق جهة حكومية إلى موافقة المواطنين لمعالجة بياناتهم أثناء أداء مهامها الرسمية؟
  - شركتنا كلفتها السلطات بمهمة للمصلحة العامة، هل هذا يعطينا أساس لمعالجة البيانات؟
- key: gdpr:art-6:para-1:pt-f
  text: 3b96b139d0db83eb
  en:
  - Can my online shop use customer data for fraud prevention based on our own business interest rather
    than consent?
  - We want to profile teen users of our game for ads; does the business-interest basis still work when
    children are involved?
  ar:
  - هل يمكن لمتجري الإلكتروني استخدام بيانات العملاء لمنع الاحتيال استنادًا إلى مصلحتنا المشروعة بدلًا
    من الموافقة؟
  - ابغى أستخدم بيانات الأطفال في لعبتنا للإعلانات بحجة مصلحة الشركة، هل يسمح؟
- key: gdpr:art-6:para-1:sub-2
  text: 63b885975d097b5f
  en:
  - Can a government agency rely on its own legitimate business interests to process citizens' data?
  - Does the legitimate interest ground work for a public authority running an app for its duties?
  - We build software for a municipality; can they use legitimate interest as their reason to process
    residents' data?
  ar:
  - هل يمكن لجهة حكومية الاستناد إلى المصلحة المشروعة للمعالجة أثناء أداء مهامها؟
  - نبني برنامجًا لبلدية، هل يحق لها اعتماد المصلحة المشروعة كأساس لمعالجة بيانات السكان؟
  - الجهات العامة تقدر تستخدم اساس المصلحة المشروعة في شغلها ولا لا؟
- key: gdpr:art-6:para-2
  text: 52eae2680678f3d0
  en:
  - Can individual EU countries add their own stricter rules for processing data needed for legal duties
    or public tasks?
  - Our app operates in several EU states; might national rules differ for public-interest or legal-obligation
    processing?
  - Do national laws get to fine-tune how data processing for legal obligations is handled?
  ar:
  - هل يحق للدول الأعضاء وضع قواعد وطنية أدق لمعالجة البيانات اللازمة للالتزامات القانونية أو المهام العامة؟
  - يعمل تطبيقنا في عدة دول أوروبية، فهل قد تختلف القواعد الوطنية لمعالجة البيانات بحكم الالتزام القانوني؟
  - كل دولة في الاتحاد تقدر تحط تفاصيل زيادة على شروط المعالجة للمهام العامة؟
- key: gdpr:art-6:para-3
  text: 64ead5ed84ce6939
  en:
  - Where must the legal basis come from when we process data because of a legal obligation or public
    task?
  - Can a company's internal policy serve as the foundation for processing under a legal duty?
  - Which kind of law has to set out the grounds for public-interest data processing?
  ar:
  - من أين يجب أن يأتي الأساس القانوني عندما نعالج البيانات بسبب التزام قانوني أو مهمة عامة؟
  - هل تكفي سياسة شركتنا الداخلية كأساس للمعالجة بداعي التزام قانوني؟
  - أي قانون لازم ينص على أساس معالجة البيانات للمصلحة العامة؟
- key: gdpr:art-6:para-3:pt-a
  text: 48ebc4836c0929d2
  en:
  - Can EU-level legislation be the source of the legal basis for processing data for a legal duty?
  - Does an EU regulation count as the foundation for public-task data processing?
  - Is Union law enough to set up the basis for processing needed to comply with a legal obligation?
  ar:
  - هل يمكن أن يكون تشريع الاتحاد الأوروبي مصدر الأساس القانوني لمعالجة البيانات تنفيذًا لالتزام قانوني؟
  - هل تعتبر لائحة أوروبية أساسًا لمعالجة البيانات في مهمة عامة؟
  - يكفي قانون الاتحاد الأوروبي كأساس للمعالجة المطلوبة قانونيًا؟
- key: gdpr:art-6:para-3:pt-b
  text: a6aa051263010827
  en:
  - Can a national law of the country where we operate be the legal basis for processing data under a
    legal duty?
  - We're subject to local law requiring us to keep user data; does that count as the required foundation?
  - Does the law of a single EU country work as the basis for public-task processing by our company?
  ar:
  - هل يمكن أن يكون القانون الوطني للدولة التي نعمل فيها أساسًا قانونيًا لمعالجة البيانات تنفيذًا لالتزام
    قانوني؟
  - نخضع لقانون محلي يلزمنا بحفظ بيانات المستخدمين، فهل يعد ذلك الأساس المطلوب؟
  - القانون حق دولة وحدة من الاتحاد يصلح أساس لمعالجة مهمة عامة تقوم فيها شركتنا؟
- key: gdpr:art-6:para-3:sub-2
  text: 280c7c1abb17952e
  en:
  - What details can a law include when it authorises processing for a legal duty, like retention periods
    or who data can be shared with?
  - Does a law that creates a public-interest processing basis have to be proportionate?
  - Who decides the purpose of the processing when it's based on a legal obligation, and what must the
    law set out?
  ar:
  - ما التفاصيل التي يمكن أن يتضمنها القانون الذي يجيز المعالجة بسبب التزام قانوني، مثل مدد التخزين والجهات
    التي تُكشف لها البيانات؟
  - هل يجب أن يكون القانون الذي ينشئ أساس المعالجة للمصلحة العامة متناسبًا مع الهدف؟
  - مين يحدد غرض المعالجة لما تكون مبنية على التزام قانوني وايش لازم يحدده القانون؟
- key: gdpr:art-6:para-4
  text: b01e0389f1beb8fc
  en:
  - We collected emails for order receipts and now want to use them for something else; how do we decide
    if that's allowed?
  - What must I check before reusing data for a new purpose when users never agreed to it?
  - Is there a compatibility test for using collected data in a new feature of our app?
  ar:
  - جمعنا البريد الإلكتروني لإرسال إيصالات الطلبات ونريد استخدامه لغرض آخر، فكيف نقرر إن كان ذلك جائزًا؟
  - ما الذي يجب أن أفحصه قبل إعادة استخدام البيانات لغرض جديد لم يوافق عليه المستخدمون؟
  - كيف أعرف إذا كان استخدام البيانات المجمعة في ميزة جديدة بتطبيقنا متوافقًا مع الغرض الأصلي؟
- key: gdpr:art-6:para-4:pt-a
  text: 384e944ff74ddd10
  en:
  - How closely related must a new use of data be to the original reason we collected it?
  - We collected data for delivery and now want delivery-feedback surveys; does the connection between
    the purposes matter?
  - Does a link between old and new purposes help justify reusing customer data?
  ar:
  - ما مدى ارتباط الاستخدام الجديد للبيانات بالغرض الأصلي الذي جُمعت من أجله؟
  - جمعنا البيانات للتوصيل ونريد إرسال استبيانات عن التوصيل، فهل تهم العلاقة بين الغرضين؟
  - هل وجود صلة بين الغرض القديم والجديد يساعد في تبرير إعادة استخدام بيانات العملاء؟
- key: gdpr:art-6:para-4:pt-b
  text: e3c9caae26881953
  en:
  - Does the way and setting in which we originally got user data affect whether we can reuse it?
  - Would users reasonably expect us to use their data this way, given their relationship with our app?
  - Does it matter that patients gave data to our clinic in confidence when we consider a new use?
  ar:
  - هل يؤثر سياق جمع بيانات المستخدمين والعلاقة بيننا وبينهم على جواز إعادة استخدامها؟
  - هل يتوقع مستخدمو تطبيقنا بشكل معقول أن نستخدم بياناتهم بهذه الطريقة بحكم علاقتهم بنا؟
  - هل يهم أن المرضى أعطوا بياناتهم لعيادتنا بسرية عند النظر في استخدام جديد؟
- key: gdpr:art-6:para-4:pt-c
  text: fc2a0a7e620bd8e2
  en:
  - Does reusing health data or criminal record data for a new purpose need extra caution?
  - When checking if a new use of data is compatible, how does the sensitivity of the data matter?
  - Our app holds health information; does that make repurposing it harder to justify?
  ar:
  - هل تتطلب إعادة استخدام البيانات الصحية أو السجل الجنائي لغرض جديد حذرًا إضافيًا؟
  - عند فحص توافق استخدام جديد للبيانات، كيف تؤثر حساسية هذه البيانات؟
  - تطبيقنا يحتفظ بمعلومات صحية، هل هذا يصعّب تبرير استخدامها لغرض ثاني؟
- key: gdpr:art-6:para-4:pt-d
  text: dba0d1ad2c4864c0
  en:
  - Should we think about how a new use of data could affect our users negatively before launching it?
  - If repurposing data might harm users, like raising their prices, does that count against it?
  - What impact on people do I need to weigh when deciding to reuse their data?
  ar:
  - هل يجب أن نفكر في الآثار السلبية المحتملة على المستخدمين قبل إطلاق استخدام جديد لبياناتهم؟
  - إذا كان تغيير غرض البيانات قد يضر المستخدمين كرفع أسعارهم، فهل يُحسب ذلك ضده؟
  - ايش العواقب على الناس اللي لازم أوزنها قبل ما أعيد استخدام بياناتهم؟
- key: gdpr:art-6:para-4:pt-e
  text: 2fd547bbabe80d34
  en:
  - Does encrypting or pseudonymising data help when deciding if we can use it for a new purpose?
  - What safeguards make it easier to justify reusing customer data for analytics?
  - Can masking user identities in our database make a secondary use more acceptable?
  ar:
  - هل يساعد تشفير البيانات أو استخدام أسماء مستعارة عند تقرير جواز استخدامها لغرض جديد؟
  - ما الضمانات التي تسهّل تبرير إعادة استخدام بيانات العملاء في التحليلات؟
  - اذا شفرنا بيانات المستخدمين أو أخفينا هوياتهم، هل يصير الاستخدام الثانوي أقبل؟
- key: gdpr:art-7:para-1
  text: 169b32ec0a42cac4
  en:
  - A user says they never agreed to our marketing emails. What proof do we need to keep that they opted
    in?
  - Do we have to store logs of when and how each person ticked the consent box in our app?
  - Regulator asks us to show that a customer agreed to tracking. What should we be able to produce?
  ar:
  - ما الذي يجب أن نحتفظ به لإثبات أن المستخدم وافق فعلاً على معالجة بياناته؟
  - هل يلزمني تسجيل وقت وطريقة موافقة كل مستخدم على تطبيقي حتى أقدر أثبتها عند الطلب؟
  - واحد من الزباين يقول ما وافقت على الإيميلات الترويجية، كيف أثبت إنه وافق؟
- key: gdpr:art-7:para-2
  text: 4d77a2b74ebbf037
  en:
  - Our terms of service include a checkbox for data use mixed in with everything else. How should the
    consent request be shown?
  - Can we bury the consent for analytics inside a long privacy policy or sign-up agreement?
  - If part of our sign-up agreement breaks data protection rules, is the user still bound by that part?
  ar:
  - عندما يكون طلب الموافقة ضمن شروط الاستخدام الطويلة، كيف يجب عرضه حتى يكون صحيحاً؟
  - هل يجوز دمج الموافقة على جمع البيانات داخل بنود عقد التسجيل دون تمييزها عن باقي البنود؟
  - شو لازم أسوي عشان طلب الموافقة في تطبيقي يكون واضح وبلغة بسيطة وما يضيع بين باقي الشروط؟
- key: gdpr:art-7:para-3
  text: aa509b37584d6380
  en:
  - A user wants to take back their consent for personal data use in our app. Can they do it whenever
    they want?
  - We let people sign up with one click but make them email support to opt out. Is that allowed?
  - If someone withdraws consent, do we have to treat what we already processed before that as unlawful?
  ar:
  - هل يحق للمستخدم سحب موافقته على استخدام بياناته في أي وقت؟
  - اشتراك المستخدم يتم بضغطة واحدة لكن الإلغاء يتطلب مراسلة الدعم، هل هذا مقبول؟
  - شنو يصير للمعالجة اللي صارت قبل ما الزبون يسحب موافقته، تصير غير قانونية؟
- key: gdpr:art-7:para-4
  text: ba279d0b8e4e1111
  en:
  - Can we refuse to give someone our app unless they agree to share their data with advertisers?
  - Does forcing users to accept data collection that isn't needed for the service make their consent
    invalid?
  - We offer a free account only if people accept profiling for ads. Is that consent really voluntary?
  ar:
  - هل يجوز أن أربط استخدام خدمتي بموافقة المستخدم على مشاركة بياناته لأغراض إعلانية غير لازمة للخدمة؟
  - متى تعتبر الموافقة غير حرة إذا اشترط المتجر الإلكتروني الموافقة على جمع بيانات إضافية لإتمام الشراء؟
  - اذا ما خليت الزبون يستخدم التطبيق إلا لما يوافق على تتبعه، هل موافقته تنحسب؟
- key: gdpr:art-8:para-1
  text: cfa7f137ed09b7cc
  en:
  - Our kids' game app relies on user consent to collect data. Do we need a parent to approve if the player
    is 14?
  - What is the minimum age at which a teenager can agree to our app processing their data without a parent's
    permission?
  - We're worried that kids under 16 are signing up for our social app and ticking the consent box themselves.
    Is that valid?
  ar:
  - ما هو السن الذي يستطيع فيه المستخدم الموافقة بنفسه على معالجة بياناته في تطبيقنا دون إذن ولي الأمر؟
  - عندنا تطبيق تعليمي للأطفال ونعتمد على الموافقة لجمع البيانات، هل لازم نحصل على موافقة الأب أو الأم
    إذا كان عمر الطفل أقل من 16؟
  - يعني لو واحد عمره 15 سنة سجّل في تطبيقنا ووافق على الشروط بنفسه، هل موافقته تُحسب ولا لازم ولي أمره
    يوافق؟
- key: gdpr:art-8:para-1:sub-2
  text: 7e215e2f664532d5
  en:
  - Can our country set the age of digital consent lower than 16 for apps?
  - What's the lowest age a country can set for kids to consent to data collection by an online service?
  - We launch our app in several EU countries. Is the age for needing parental consent the same everywhere,
    or can it be 13 in some?
  ar:
  - هل يحق لكل دولة أن تخفض سن الموافقة الرقمية عن 16 سنة في التطبيقات؟
  - ما هو أدنى سن يمكن أن يحدده القانون الوطني لموافقة الطفل على جمع بياناته عبر خدمة إلكترونية؟
  - احنا بنطلق التطبيق في كذا دولة أوروبية، هل سن موافقة الأهل يختلف من بلد لبلد وممكن يوصل 13؟
- key: gdpr:art-8:para-2
  text: 63dc2f6213599bd4
  en:
  - What effort are we expected to put into checking parental authorisation, given what tech we have available?
  ar:
  - شو المطلوب منا نسويه للتأكد من موافقة الأهل، وهل نستخدم التقنيات المتوفرة؟
- key: gdpr:art-8:para-3
  text: d887013115c40a0f
  en:
  - Does the child consent age rule decide whether a minor can legally enter a contract to buy things
    in our shop?
  - If a 15-year-old buys a subscription in our app, is the contract validity governed by national contract
    law rather than the data consent age?
  - Does getting a parent's consent for data processing also make a kid's in-app purchase contract valid?
  ar:
  - هل قاعدة سن موافقة الطفل على البيانات تحدد إذا كان القاصر يقدر يبرم عقد شراء في متجرنا؟
  - إذا اشترك مراهق عمره 15 سنة في خدمتنا، هل صحة العقد تخضع للقانون المدني الوطني وليس لسن الموافقة على
    البيانات؟
  - وافق ولي الأمر على معالجة بيانات ابنه في التطبيق، هل هذا يعني أن عقد الشراء مع القاصر صار صحيح؟
- key: gdpr:art-9:para-1
  text: d1d33beeaa128cab
  en:
  - Can my app store users' health data or fingerprints just like any other data, or are there extra restrictions?
  - Are face scans for login, DNA test results and union membership treated as a more sensitive class
    of data?
  ar:
  - ما هي أنواع البيانات الحساسة التي يمنع التعامل معها كقاعدة عامة في تطبيقي؟
  - هل يجوز لتطبيقنا جمع بيانات صحية أو بصمة الوجه من المستخدمين بدون شروط خاصة؟
  - شو الداتا اللي ممنوع نعالجها في التطبيق زي الدين والميول الجنسية والأمراض؟
- key: gdpr:art-9:para-2
  text: a95e3955ecd9a72a
  en:
  - When can we legally process sensitive data like health or biometrics despite the general ban?
  - What are the possible exceptions that let a startup handle special category data?
  - Is there a list of grounds I need to pick from before collecting sensitive user information?
  ar:
  - ما هي الحالات التي يُستثنى فيها معالجة البيانات الحساسة من المنع العام؟
  - نبي نجمع بيانات صحية من المستخدمين، شو الاستثناءات اللي تسمحلنا؟
  - هل لازم أحدد سبب قانوني من قائمة معينة قبل معالجة البيانات الحساسة في منصتي؟
- key: gdpr:art-9:para-2:pt-a
  text: e03ee71b31d61978
  en:
  - Can users consent to us processing their sensitive data for a specific feature, and can any country's
    law stop them from agreeing?
  - What kind of consent do I need for using facial recognition on users in my app?
  ar:
  - ما نوع الموافقة المطلوبة لمعالجة البيانات الحساسة لغرض محدد؟
  - يعني لازم الموافقة تكون صريحة عشان آخذ بيانات حساسة من المستخدم؟
- key: gdpr:art-9:para-2:pt-b
  text: a8f1d8b188529191
  en:
  - Can our HR software process employee sick leave or union data to meet employment law obligations?
  - Does payroll or social security compliance let us handle employees' health information without consent?
  - We build an HR tool; what allows an employer to process sensitive data under labour law or a collective
    agreement?
  ar:
  - هل يجوز لنظام الموارد البشرية معالجة بيانات الإجازات المرضية للموظفين تنفيذاً لقانون العمل؟
  - متى يسمح لصاحب العمل معالجة بيانات حساسة للموظفين بسبب الضمان الاجتماعي أو اتفاقية جماعية؟
  - نظام الرواتب عندنا يحتاج بيانات صحية للموظفين، هل نقدر نعالجها بدون موافقة؟
- key: gdpr:art-9:para-2:pt-c
  text: 03d5757baa405f08
  en:
  - A user is unconscious and a medical app needs to share their blood type with paramedics. Is that allowed?
  - Can we process sensitive data without consent in a life-threatening emergency?
  - When someone can't give consent, can we use their health data to protect their life or another person's?
  ar:
  - مستخدم فاقد الوعي وتطبيق طبي يريد مشاركة فصيلة دمه مع المسعفين، هل يجوز ذلك؟
  - هل نستطيع معالجة بيانات حساسة بدون موافقة لإنقاذ حياة شخص؟
  - لو المستخدم ما يقدر يوافق بسبب حالته وخطر على حياته، نقدر نستخدم بياناته الصحية؟
- key: gdpr:art-9:para-2:pt-d
  text: dd801d1edab54ac1
  en:
  - We run a nonprofit church or union membership app; can we keep member records revealing beliefs?
  - Can a political party's association process data about its members and share it with outside partners?
  - Does a charity with a religious aim need consent to process data on people who regularly attend its
    events?
  ar:
  - نحن جمعية دينية ولدينا تطبيق للأعضاء، هل يجوز معالجة بيانات أعضائنا التي تكشف معتقداتهم؟
  - هل يحق لنقابة أو حزب معالجة بيانات أعضائه وإرسالها لجهات خارجية؟
  - جمعيتنا غير ربحية، نقدر نحتفظ ببيانات الأعضاء السابقين بدون موافقة؟
- key: gdpr:art-9:para-2:pt-e
  text: 7fb4e7315e759f85
  en:
  - A user posted their own health condition publicly on their profile; can we use that data freely?
  - Can we scrape sensitive details that people openly shared on social media?
  - If someone publicly announced their religion or politics, does the ban on sensitive data still apply
    to us?
  ar:
  - مستخدم نشر حالته الصحية علناً في ملفه، هل يجوز لنا استخدام هذه البيانات؟
  - هل نقدر نجمع بيانات حساسة نشرها الناس بأنفسهم على السوشيال ميديا؟
  - اذا الشخص أعلن ميوله السياسية للعلن، هل يسمح لنا نعالجها؟
- key: gdpr:art-9:para-2:pt-f
  text: 4be51a111070e20c
  en:
  - A customer is suing us and we need to keep their medical records as evidence. Is that allowed?
  - Can we process sensitive data to defend against a legal claim or lawsuit?
  - Do courts and lawyers need consent to use sensitive personal data in litigation?
  ar:
  - عميل رفع علينا دعوى ونحتاج بياناته الصحية كدليل، هل يجوز ذلك؟
  - هل يمكن معالجة بيانات حساسة للدفاع عن حق أمام القضاء؟
  - نبي نستخدم بيانات حساسة في قضية قانونية، لازم موافقة صاحبها؟
- key: gdpr:art-9:para-2:pt-g
  text: 6ede275ea158d75e
  en:
  - Can we process sensitive data for a government-backed public interest project without user consent?
  - What conditions must a national law meet to allow sensitive data processing for substantial public
    interest?
  - Our platform works for a public authority on a social programme; what makes sensitive data use legal
    there?
  ar:
  - هل يجوز معالجة بيانات حساسة لمشروع حكومي ذي مصلحة عامة جوهرية بدون موافقة؟
  - ما الشروط التي يجب أن يستوفيها القانون الوطني للسماح بمعالجة البيانات الحساسة للمصلحة العامة؟
  - منصتنا تشتغل مع جهة حكومية، متى يصير قانوني نعالج بيانات حساسة؟
- key: gdpr:art-9:para-2:pt-h
  text: 211317473a4bc84b
  en:
  - Our telemedicine app handles diagnoses; what lets us process patients' health data without separate
    consent?
  - Can a clinic software vendor process health records for treatment and managing care services?
  - Can an occupational health tool assess whether an employee is fit to work using their medical data?
  ar:
  - تطبيق الطب عن بعد عندنا يعالج تشخيصات المرضى، ما الأساس القانوني لذلك؟
  - هل يجوز لنظام إدارة عيادة معالجة السجلات الصحية لأغراض العلاج وإدارة الخدمات الصحية؟
  - نبي نقيّم قدرة موظف على العمل من خلال بياناته الطبية، هل مسموح؟
- key: gdpr:art-9:para-2:pt-i
  text: eef9e5303ea023c7
  en:
  - Can a health app share data to help fight a cross-border disease outbreak?
  - Is processing sensitive data allowed for monitoring the safety of medicines or medical devices?
  - Does public health protection allow us to use health data if national law has safeguards like professional
    secrecy?
  ar:
  - هل يجوز مشاركة بيانات صحية لمواجهة تفشي وباء عابر للحدود؟
  - هل يسمح بمعالجة بيانات حساسة لمراقبة سلامة الأدوية والأجهزة الطبية؟
  - متى تسمح المصلحة العامة في الصحة العامة باستخدام البيانات الصحية؟
- key: gdpr:art-9:para-2:pt-j
  text: e1d28b82437ce5c0
  en:
  - We're a research startup analysing genetic data for a study; can we do it without consent?
  - Can we use sensitive data for statistics or historical research in our analytics product?
  - What is needed to process special category data for scientific research or archiving?
  ar:
  - نحن شركة أبحاث ونحلل بيانات جينية لدراسة علمية، هل يجوز ذلك بدون موافقة؟
  - هل يمكن استخدام بيانات حساسة لأغراض إحصائية أو بحث تاريخي؟
  - شو المطلوب عشان نعالج بيانات حساسة لغرض البحث العلمي أو الأرشفة؟
- key: gdpr:art-9:para-3
  text: 2f898b757e587c24
  en:
  - Who is allowed to handle health data for treatment purposes, like a doctor or a software vendor working
    for them?
  - Do staff at our clinic software company need to be bound by confidentiality to process patient data?
  - Does medical data processing require a professional secrecy obligation?
  ar:
  - من الذي يُسمح له بمعالجة البيانات الصحية لأغراض العلاج؟
  - هل يجب أن يكون موظفو شركتنا ملزمين بالسرية المهنية لمعالجة بيانات المرضى؟
  - ابغى اعرف هل لازم يكون عندنا التزام بسرية المهنة عشان نتعامل مع بيانات طبية؟
- key: gdpr:art-9:para-4
  text: e2889b56295ae6cb
  en:
  - Can individual countries add stricter rules for biometric or health data than the general rules?
  - We launch a fingerprint login in several EU countries; could local laws add extra conditions?
  - Do national laws on genetic data differ, and can they limit what my app does?
  ar:
  - هل يحق لكل دولة وضع شروط إضافية على معالجة البيانات البيومترية أو الصحية؟
  - سنطلق تسجيل دخول ببصمة الإصبع في عدة دول أوروبية، هل قد تفرض قوانينها المحلية قيوداً إضافية؟
  - القوانين المحلية ممكن تحط قيود زيادة على البيانات الجينية؟ وكيف يأثر هذا على تطبيقنا؟
- key: gdpr:art-10
  text: a49ebc4575682fde
  en:
  - We're building a background check feature for a hiring platform that shows applicants' criminal records.
    Are we allowed to process that data just because we have a legitimate business reason?
  - Can our app keep a database of everyone's past criminal convictions that we collect from public court
    sources?
  - What conditions must be met before a company can handle data about someone's criminal offences or
    related security measures?
  ar:
  - هل يجوز لتطبيقنا معالجة بيانات السوابق الجنائية للمستخدمين، وما هي الشروط القانونية لذلك؟
  - هل يسمح لشركة خاصة بإنشاء سجل شامل للإدانات الجنائية، أم أن ذلك مقصور على جهة رسمية؟
  - عندنا منصة توظيف ونبي نفحص سجل الجرائم للمتقدمين، هل نقدر نسوي كذا بدون إذن من القانون؟
- key: gdpr:art-11:para-1
  text: 9c517f442411a39c
  en:
  - Our analytics app only stores random device IDs and no names or emails. Do we have to start collecting
    people's identity details just so we can handle GDPR requests?
  - Do we need to keep extra personal info, like linking records back to real people, only to be able
    to comply with privacy rules?
  - We used to need customer names but now we've stopped needing them for our service. Can we drop the
    identifying data and not rebuild it later for compliance purposes?
  ar:
  - هل يلزمني كمسؤول عن تطبيق تحليلات يخزن معرّفات أجهزة عشوائية فقط أن أجمع بيانات تعرّف بهوية المستخدمين
    لمجرد الامتثال للائحة؟
  - هل أنا مجبر أحتفظ بمعلومات إضافية أو أحصل عليها عشان أعرف مين صاحب البيانات بس علشان أطبّق قواعد الخصوصية؟
  - إذا لم تعد أغراض المعالجة تتطلب تحديد هوية الشخص، فهل يجب على الجهة الاستمرار في الاحتفاظ بمعلومات
    تتيح تحديد هويته؟
- key: gdpr:art-11:para-2
  text: 2f716eec306f57a8
  en:
  - A user asked for a copy of their data but we can't tell which anonymous records are theirs. Do we
    still have to give them access?
  - If we can prove we can't identify the person making a deletion or access request, do we have to tell
    them that, and are we off the hook?
  - What happens if the requester then sends us extra details, like a device ID or account token, that
    let us match them to their records? Do we have to handle their request then?
  ar:
  - وصلنا طلب من مستخدم يريد نسخة من بياناته، لكننا لا نستطيع معرفة أي السجلات المجهولة تخصه. هل يجب علينا
    مع ذلك تلبية طلب الاطلاع؟
  - لو ما نقدر نحدد هوية اللي طالب حذف بياناته أو الوصول إليها، لازم نخبره بهالشي؟ وهل نتخلص من الالتزام؟
  - إذا قدّم صاحب الطلب معلومات إضافية تمكّننا من تحديد هويته، فهل تعود حقوقه في الاطلاع والحذف ونقل البيانات
    قابلة للتطبيق؟
- key: gdpr:art-12:para-1
  text: 34cf983d069c5711
  en:
  - How should I word our app's privacy notice so ordinary users, including teenagers, can actually understand
    it?
  - Can a customer ask us to explain how we use their data over the phone instead of sending something
    written?
  - Is it okay to give users privacy information only through an in-app screen, or does it have to be
    a written document?
  ar:
  - ما الطريقة المطلوبة لصياغة إشعار الخصوصية في تطبيقنا بحيث يفهمه المستخدم العادي والأطفال؟
  - هل يجوز أن أشرح للعميل كيف نستخدم بياناته شفهياً إذا طلب ذلك، وماذا أتحقق منه قبلها؟
  - شلون أكتب سياسة الخصوصية بلغة سهلة وبسيطة؟ ولو التطبيق موجه للأطفال لازم أسوي شي خاص؟
- key: gdpr:art-12:para-2
  text: a6b4680c549094dc
  en:
  - A user emailed asking for a copy of their data, and we don't link their account to a name. Can we
    just ignore the request?
  - What do we have to do to make it easy for users to exercise their data rights in our product?
  - When can we refuse a data request because we can't work out who the person is in our system?
  ar:
  - ما التزامات الشركة لتسهيل ممارسة المستخدمين لحقوقهم في بياناتهم مثل الاطلاع والحذف؟
  - هل يحق لي رفض طلب مستخدم لأنني لا أستطيع تحديد هويته ضمن بياناتنا المجهولة؟
  - المستخدم طلب يحذف بياناته وإحنا ما نقدر نربطه بحسابه، نقدر نرفض الطلب ولا لا؟
- key: gdpr:art-12:para-3
  text: 648070ff511656ac
  en:
  - How long do we have to reply to a user who asks for their data or wants it deleted?
  - We got a huge number of complex access requests at once. Can we take longer than a month to respond?
  - If a customer sent their request through our web form, do we have to answer by email or can we send
    a letter?
  ar:
  - كم المدة المسموحة للرد على طلب مستخدم يريد نسخة من بياناته أو حذفها؟
  - وصلتنا طلبات كثيرة ومعقدة دفعة واحدة، هل يمكن تمديد مدة الرد وماذا يجب إبلاغ العميل به؟
  - وصلني طلب من العميل عن طريق الفورم، كم يوم عندي أرد عليه وهل لازم يكون بالإيميل؟
- key: gdpr:art-12:para-4
  text: f24aa7aafb851439
  en:
  - We decided to turn down a user's deletion request. What must we tell them and by when?
  - Do we have to explain to a customer why we said no to their data request?
  - Must our rejection reply mention that the user can complain to the regulator or go to court?
  ar:
  - قررنا رفض طلب مستخدم، ما المعلومات التي يجب إرسالها له وخلال كم من الوقت؟
  - هل يلزمني أن أبين للعميل سبب عدم تنفيذ طلبه الخاص ببياناته؟
  - لو رفضنا الطلب لازم نقول للعميل إنه يقدر يشتكي للجهة الرقابية أو المحكمة؟
- key: gdpr:art-12:para-5
  text: af3f5e07081c6855
  en:
  - Can we charge users a fee when they ask for a copy of their personal data?
  - One former customer keeps sending us the same data access request every week. Can we refuse or charge?
  ar:
  - هل يجوز أن نأخذ رسوماً من المستخدم مقابل إعطائه نسخة من بياناته الشخصية؟
  - عميل يرسل نفس طلب الاطلاع على بياناته كل أسبوع، هل نستطيع رفضه أو فرض رسوم معقولة؟
- key: gdpr:art-12:para-5:pt-a
  text: 30d530a49ce13073
  en:
  - When can we charge a fee for handling a user's data request, and how do we work out the amount?
  - Our app gets repetitive data access requests from one user. Can we bill them for the admin work?
  - Is it allowed to charge a reasonable fee instead of refusing an abusive data request?
  ar:
  - متى يجوز لنا فرض رسوم على معالجة طلب مستخدم يتعلق ببياناته وكيف نحدد المبلغ؟
  - مستخدم يكرر طلبات الاطلاع على بياناته في تطبيقنا، هل نحاسبه على الجهد الإداري؟
  - هل يمكن أن آخذ رسماً معقولاً بدل رفض طلب مبالغ فيه؟
- key: gdpr:art-12:para-5:pt-b
  text: 87f18fd9c61c1287
  en:
  - Can we simply refuse a data request that is clearly abusive or repeated over and over?
  - When are we allowed to say no to a user's request about their data without doing anything?
  - A customer floods our support with pointless data requests. Are we allowed to stop answering them?
  ar:
  - هل يمكننا رفض طلب بيانات واضح أنه تعسفي أو مكرر مرات كثيرة؟
  - متى يحق لنا أن نرفض تنفيذ طلب المستخدم المتعلق ببياناته؟
  - عميل يغرق الدعم بطلبات بيانات بلا فائدة، يحق لنا نتوقف عن الرد عليه؟
- key: gdpr:art-12:para-5:sub-2
  text: 54adf0f60559c8cc
  en:
  - If we refuse a request as excessive and the user disputes it, who must prove it was excessive?
  ar:
  - إذا رفضنا طلباً بحجة أنه مبالغ فيه واعترض المستخدم، على من يقع عبء الإثبات؟
- key: gdpr:art-12:para-6
  text: 6d7ab8730392529c
  en:
  - Someone emails claiming to be a customer and asks for all their data, but we're not sure it's really
    them. Can we ask for ID?
  - What extra proof can we ask for before handing over personal data to a requester?
  - How do we avoid sending a user's data to an impersonator who submits an access request?
  ar:
  - وصلنا بريد من شخص يدّعي أنه عميل ويطلب بياناته ولسنا متأكدين، هل يمكننا طلب إثبات هوية؟
  - ما المعلومات الإضافية التي يجوز طلبها للتأكد من هوية صاحب الطلب قبل تسليم البيانات؟
  - أخاف أرسل بيانات عميل لشخص منتحل، أقدر أطلب منه هوية أو أي إثبات؟
- key: gdpr:art-12:para-7
  text: 787545564f50528f
  en:
  - Can we use little icons in our app's privacy notice to summarize how we use data?
  - If we show privacy icons on our website, do they need to be readable by machines?
  - Are we allowed to add pictograms to a privacy policy instead of only long text?
  ar:
  - هل يجوز استخدام أيقونات بسيطة في إشعار الخصوصية بتطبيقنا لتلخيص كيفية استخدام البيانات؟
  - إذا عرضنا أيقونات الخصوصية في موقعنا هل يجب أن تكون قابلة للقراءة آلياً؟
- key: gdpr:art-12:para-8
  text: bfb411f052e3396c
  en:
  - Who decides what the standardised data protection icons should show?
  - Can the European Commission set rules for privacy icons later that we'd need to follow?
  ar:
  - من الجهة التي تحدد المعلومات التي تعرضها أيقونات حماية البيانات الموحدة؟
  - هل تستطيع المفوضية الأوروبية إصدار قواعد لاحقة بشأن أيقونات الخصوصية يجب علينا الالتزام بها؟
- key: gdpr:art-13:para-1
  text: 1dac2e1c4a94f304
  en:
  - What do I have to tell users about their data when they sign up in my app and give me their details?
  - When exactly must I show a privacy notice to someone whose data I collect directly through my web
    form?
  - Is it too late to tell customers how we use their data after they've already submitted the checkout
    form?
  ar:
  - ما المعلومات التي يجب أن أقدمها للمستخدم عند جمع بياناته الشخصية منه مباشرة أثناء التسجيل في تطبيقي؟
  - 'متى يجب عرض إشعار الخصوصية على المستخدم: قبل جمع البيانات أم بعده؟'
  - لازم أقول للمستخدم إيش بنسوي ببياناته وقت ما يعبي الفورم ولا أقدر أبلغه بعدين؟
- key: gdpr:art-13:para-1:pt-a
  text: 30bda799e5db0e89
  en:
  - Do I need to put my company name and contact address in the privacy policy of my app?
  - We're a non-EU startup serving EU customers; do we have to list our EU representative in the notice
    to users?
  - What contact details must users see so they know who is responsible for their data in our online shop?
  ar:
  - هل يجب أن أذكر اسم شركتي وبيانات التواصل معها في سياسة الخصوصية الخاصة بتطبيقي؟
  - شركتنا خارج الاتحاد الأوروبي وعندنا مستخدمون أوروبيون، هل يلزم ذكر الممثل في الاتحاد ضمن الإشعار للمستخدمين؟
  - لازم أحط إيميل ورقم الشركة في صفحة الخصوصية عشان المستخدم يعرف مين المسؤول عن بياناته؟
- key: gdpr:art-13:para-1:pt-b
  text: ea771648d8c7896a
  en:
  - Must our privacy notice include the email of our DPO?
  - We appointed a data protection officer for our clinic app; do users need to be given their contact
    info?
  - If we have no DPO, do we still have to list one in the sign-up privacy text?
  ar:
  - هل يجب أن يتضمن إشعار الخصوصية بيانات التواصل مع مسؤول حماية البيانات لدينا؟
  - عيّنا مسؤول حماية بيانات لتطبيق العيادة، هل نعطي المستخدمين طريقة التواصل معه؟
  - شو لازم أكتب بالإشعار عن مسؤول حماية البيانات إذا عندنا واحد؟
- key: gdpr:art-13:para-1:pt-c
  text: ed33246246bb26f2
  en:
  - Do I have to explain why we collect users' data and what legal ground we rely on?
  - What should our privacy notice say about the reasons we use customer data in our online shop?
  - Is it enough to say we use data to improve our services, or must we also name the legal basis?
  ar:
  - هل يجب أن أشرح للمستخدمين لماذا نجمع بياناتهم وما الأساس القانوني الذي نعتمد عليه؟
  - ماذا يجب أن يذكر إشعار الخصوصية عن أغراض استخدام بيانات عملاء متجرنا الإلكتروني؟
  - لازم أكتب في الإشعار ليش نجمع البيانات وعلى أي أساس قانوني، ولا يكفي أقول لتحسين الخدمة؟
- key: gdpr:art-13:para-1:pt-d
  text: 695a6f5c01e9db3a
  en:
  - We process user data because of our own business interests; do we need to spell out what those interests
    are in the notice?
  - What must we tell users if we rely on legitimate interest for analytics or fraud prevention in our
    app?
  - Do we have to describe the interests of a third party if we share data with them under legitimate
    interest?
  ar:
  - نعالج بيانات المستخدمين لمصلحة مشروعة لشركتنا، هل يجب توضيح هذه المصلحة في الإشعار؟
  - ماذا نخبر المستخدمين إذا اعتمدنا على المصلحة المشروعة في التحليلات أو منع الاحتيال في تطبيقنا؟
  - إذا استخدمنا المصلحة المشروعة، لازم نشرح للمستخدم شو هي مصلحتنا أو مصلحة الطرف الثالث؟
- key: gdpr:art-13:para-1:pt-e
  text: 61feeb3ea2e3152a
  en:
  - Do I need to tell users which companies receive their data, like payment providers or analytics tools?
  - Can the privacy notice just list types of recipients instead of naming each vendor?
  - We send customer emails to a mailing service; must that be disclosed to users at signup?
  ar:
  - هل يجب أن أخبر المستخدمين بالجهات التي تتلقى بياناتهم مثل مزودي الدفع وأدوات التحليل؟
  - هل يكفي في إشعار الخصوصية ذكر فئات المستلمين بدل تسمية كل مزود؟
  - نرسل إيميلات العملاء لخدمة بريد تسويقي، هل لازم نفصح عن ذلك للمستخدمين؟
- key: gdpr:art-13:para-1:pt-f
  text: 8a4372d73201bc6c
  en:
  - Our app stores user data on US cloud servers; what do we have to disclose to users about that?
  - Do I need to tell users if their data goes outside the EU and what safeguards like SCCs protect it?
  - How should the notice explain where users can get a copy of the transfer safeguards we use?
  ar:
  - يخزّن تطبيقنا بيانات المستخدمين على خوادم سحابية في أمريكا، ما الذي يجب الإفصاح عنه لهم؟
  - هل يجب إبلاغ المستخدمين بنقل بياناتهم خارج الاتحاد الأوروبي والضمانات المعتمدة مثل البنود التعاقدية
    النموذجية؟
  - كيف أبيّن للمستخدم وين يلاقي نسخة من ضمانات نقل البيانات للخارج اللي نستخدمها؟
- key: gdpr:art-13:para-2
  text: 4e9a1fc9a7309065
  en:
  - Besides the basics like who we are and why we collect data, what extra things must a privacy notice
    tell users?
  - What additional transparency information do we owe users when they give us their data in our app?
  - Is there a second set of details we must give people at signup to keep our processing fair?
  ar:
  - إلى جانب الأساسيات مثل هويتنا وسبب جمع البيانات، ما المعلومات الإضافية التي يجب أن يتضمنها إشعار الخصوصية؟
  - ما معلومات الشفافية الإضافية الواجب تقديمها للمستخدمين عند تسليمنا بياناتهم في التطبيق؟
  - فيه معلومات ثانية لازم نعطيها للناس وقت التسجيل عشان تكون المعالجة عادلة وشفافة؟
- key: gdpr:art-13:para-2:pt-a
  text: 028088fd9d1807bb
  en:
  - Do we have to tell users how long we keep their account data?
  - We can't say exactly when we'll delete old customer records; what can we put in the notice instead?
  - Should our privacy policy state retention periods for order history and logs?
  ar:
  - هل يجب أن نخبر المستخدمين كم من الوقت سنحتفظ ببيانات حساباتهم؟
  - لا نستطيع تحديد موعد دقيق لحذف سجلات العملاء القديمة، ماذا نكتب في الإشعار بدلاً من ذلك؟
  - كم مدة الاحتفاظ بالبيانات لازم أذكرها في سياسة الخصوصية للطلبات والسجلات؟
- key: gdpr:art-13:para-2:pt-b
  text: 895bb644d19040d2
  en:
  - Do we need to inform users that they can ask to see, fix, delete or export their data?
  - What user rights must be listed in our app's privacy notice?
  - Must the notice mention that people can object to processing or ask us to restrict it?
  ar:
  - هل يلزمنا إعلام المستخدمين بأنه يمكنهم طلب الاطلاع على بياناتهم أو تصحيحها أو حذفها أو نقلها؟
  - ما هي حقوق المستخدمين التي يجب إدراجها في إشعار الخصوصية لتطبيقنا؟
  - هل لازم نذكر في الإشعار إن الناس يقدروا يعترضوا على المعالجة أو يطلبوا تقييدها؟
- key: gdpr:art-13:para-2:pt-c
  text: be4a2d107d63fcb1
  en:
  - If we collect data based on a consent checkbox, do we need to tell users they can take consent back
    anytime?
  - What should the notice say about withdrawing consent for our newsletter signup?
  - Does withdrawing consent undo what we already did with the data before, and must we say so?
  ar:
  - إذا جمعنا البيانات بناءً على خانة الموافقة، هل يجب إبلاغ المستخدمين بأن لهم سحب موافقتهم في أي وقت؟
  - ماذا يجب أن يقول الإشعار عن سحب الموافقة على الاشتراك في نشرتنا البريدية؟
  - لو المستخدم سحب موافقته، هل المعالجة السابقة تبقى سليمة وهل لازم نذكر هذا له؟
- key: gdpr:art-13:para-2:pt-d
  text: 2020bb6110a51937
  en:
  - Do we have to tell users they can complain to a data protection authority?
  - Should our privacy policy mention that people can file a complaint with the regulator?
  - What do we need to say about where users can complain if they're unhappy with how we handle data?
  ar:
  - هل يجب أن نخبر المستخدمين بحقهم في تقديم شكوى إلى هيئة حماية البيانات؟
  - هل ينبغي أن تذكر سياسة الخصوصية أن بإمكان الأشخاص رفع شكوى لدى الجهة الرقابية؟
  - لازم نكتب للمستخدم إنه يقدر يشتكي للجهة المختصة بحماية البيانات لو مش راضي عن تعاملنا مع بياناته؟
- key: gdpr:art-13:para-2:pt-e
  text: 4f1d5d8f0a6967cd
  en:
  - Do we need to say whether users must give us certain data, like phone number, and what happens if
    they don't?
  - Our signup form has required fields; what must we tell users about why they're mandatory?
  - If data is needed for a contract or by law, how should we explain that in the privacy notice?
  ar:
  - هل يجب أن نوضح للمستخدمين ما إذا كان تقديم بيانات معينة مثل رقم الهاتف إلزامياً وما نتيجة الامتناع
    عن ذلك؟
  - في نموذج التسجيل حقول إلزامية، ما الذي يجب إخبار المستخدمين به عن سبب إلزاميتها؟
  - لو البيانات مطلوبة بسبب عقد أو قانون، كيف أشرح هالشي للمستخدم بالإشعار؟
- key: gdpr:art-13:para-2:pt-f
  text: 8014c683a8f2e2c9
  en:
  - Our bank app uses an algorithm to auto-reject loan applications; what must we tell applicants?
  - Do we need to explain to users how our profiling or automated scoring works?
  - What do we disclose if our system makes automatic decisions about customers without human review?
  ar:
  - يستخدم تطبيق البنك لدينا خوارزمية لرفض طلبات القروض تلقائياً، ماذا يجب أن نخبر المتقدمين؟
  - هل يجب أن نشرح للمستخدمين كيف يعمل التنميط أو التقييم الآلي لدينا؟
  - شو لازم نفصح عنه لو نظامنا ياخذ قرارات تلقائية عن العملاء بدون تدخل بشري؟
- key: gdpr:art-13:para-3
  text: 61f8e58b24bad4aa
  en:
  - We want to reuse the data we collected for a new purpose, like training a model; do we need to tell
    users first?
  - When must users be informed if we change what we use their data for after collecting it?
  - Can we start using customer data for a different feature before notifying them?
  ar:
  - نريد إعادة استخدام البيانات المجمعة لغرض جديد مثل تدريب نموذج، هل يجب إخبار المستخدمين أولاً؟
  - متى يجب إعلام المستخدمين إذا غيّرنا الغرض من استخدام بياناتهم بعد جمعها؟
  - نقدر نبدأ نستخدم بيانات العملاء لميزة ثانية قبل ما نبلغهم؟
- key: gdpr:art-13:para-4
  text: 22b04bb0054edae1
  en:
  - If users already know how we use their data, do we still have to repeat the privacy notice?
  - Can we skip giving the information when the customer was already told earlier?
  - Is there an exception to the notice duty when the person already has all those details?
  ar:
  - إذا كان المستخدمون يعرفون مسبقاً كيف نستخدم بياناتهم، هل ما زال علينا تكرار إشعار الخصوصية؟
  - هل يمكننا عدم تقديم المعلومات إذا كان العميل قد أُبلغ بها سابقاً؟
  - في استثناء من واجب الإشعار لو الشخص عنده كل هالمعلومات من قبل؟
- key: gdpr:art-14:para-1
  text: 08ff79c8fdeb1769
  en:
  - We bought a lead list from a data broker and want to email those people. What do we have to tell them
    about how we're using their data?
  - What basic info must I give people whose data I got from somewhere other than them?
  - Our app pulled user profiles from a partner company; what notice do those individuals need to receive
    from us?
  ar:
  - ما هي المعلومات التي يجب أن نقدمها للأشخاص الذين حصلنا على بياناتهم من جهة أخرى وليس منهم مباشرة؟
  - اشترينا قائمة عملاء محتملين من شركة وسيطة، ايش لازم نخبر هالناس عن بياناتهم؟
  - يا جماعة لو جبت بيانات ناس من طرف ثالث مو منهم، شو لازم أقولهم عنها؟
- key: gdpr:art-14:para-1:pt-a
  text: 30bda799e5db0e89
  en:
  - Do I need to put our company name and contact address in the notice sent to people whose data we got
    from a third party?
  - Our company is based outside the EU and has an EU representative; do we list them in the notice to
    people we didn't collect data from directly?
  - Who should the notice say is responsible for the data when we scraped it from another source?
  ar:
  - هل يجب أن يتضمن الإشعار اسم شركتنا وبيانات التواصل معنا عندما نحصل على البيانات من طرف آخر؟
  - شركتنا برا الاتحاد الأوروبي وعندنا ممثل هناك، لازم نكتب بياناته في الإشعار؟
  - هل لازم أحط اسم الشركة وإيميلها في الرسالة اللي أبعثها للناس اللي جبت بياناتهم من مكان ثاني؟
- key: gdpr:art-14:para-1:pt-b
  text: ea771648d8c7896a
  en:
  - We have a DPO; do we need to include their contact details in the notice to people whose data came
    from a partner?
  - Is giving the data protection officer's email mandatory when informing individuals we didn't collect
    data from?
  - What if we don't have a DPO, do we still have to list one in the notice?
  ar:
  - عندنا مسؤول حماية بيانات، هل يلزم ذكر بيانات التواصل معه في الإشعار للأشخاص الذين استلمنا بياناتهم
    من جهة أخرى؟
  - هل لازم أحط إيميل الـ DPO في الإشعار لو البيانات ما جت من الشخص نفسه؟
  - اذا ما عندنا مسؤول حماية بيانات، لازم نذكره بالإشعار؟
- key: gdpr:art-14:para-1:pt-c
  text: ed33246246bb26f2
  en:
  - Do we have to tell people why we're using their data and what legal ground we rely on when we got
    it from a third party?
  - Our CRM imported contacts from a data vendor; must the notice explain what we use them for?
  - Do I need to state the lawful basis, like legitimate interest, in the message to people I didn't collect
    data from?
  ar:
  - هل يجب إخبار الأشخاص بسبب استخدام بياناتهم والأساس القانوني لذلك إذا حصلنا عليها من طرف ثالث؟
  - استوردنا جهات اتصال من مزود بيانات، لازم نشرح لهم ليش نستخدمها؟
  - شو لازم أكتب عن الغرض والأساس القانوني للمعالجة لما البيانات ما أخذتها من الشخص نفسه؟
- key: gdpr:art-14:para-1:pt-d
  text: 4a9cf3bac148869c
  en:
  - Do I need to list what kinds of data we hold (email, job title, location) when notifying people we
    got data about from elsewhere?
  - Must the notice say which types of personal data we received from the third party?
  - A user asks what sort of information we have on them that came from a data broker; is that something
    we must tell them upfront?
  ar:
  - هل يجب أن نذكر أنواع البيانات الشخصية التي لدينا (إيميل، وظيفة، موقع) عند إشعار أشخاص حصلنا على بياناتهم
    من مصدر آخر؟
  - لازم الإشعار يوضح أي فئات من البيانات استلمناها من الطرف الثالث؟
  - ايش نوع المعلومات اللي لازم أقول للشخص إني أملكها عنه لما جبتها من وسيط؟
- key: gdpr:art-14:para-1:pt-e
  text: 61feeb3ea2e3152a
  en:
  - Do we have to name who we share people's data with, like our analytics vendor or ad partners, in the
    notice?
  - If we pass the data we got from a third party to other companies, must we tell the individuals?
  - Can the notice just list categories of recipients instead of naming each company?
  ar:
  - هل علينا ذكر الجهات التي نشارك معها البيانات مثل شركة التحليلات أو شركاء الإعلانات في الإشعار؟
  - إذا مررنا البيانات التي استلمناها من طرف ثالث إلى شركات أخرى، هل نخبر أصحابها؟
  - ممكن أكتفي بذكر أنواع الجهات اللي بشاركها البيانات بدل أسماء الشركات؟
- key: gdpr:art-14:para-1:pt-f
  text: 9b4aa4ce23176527
  en:
  - Our servers and support vendor are in the US; do we need to mention that in the notice to people whose
    data we got indirectly?
  - What must we say about safeguards like standard contractual clauses when sending data abroad?
  - Do we have to tell people whether the EU has an adequacy decision for the country we send their data
    to?
  ar:
  - خوادمنا ومزود الدعم في أمريكا، هل يجب ذكر ذلك في الإشعار للأشخاص الذين حصلنا على بياناتهم بشكل غير
    مباشر؟
  - ماذا يجب أن نقول عن الضمانات مثل البنود التعاقدية النموذجية عند نقل البيانات إلى خارج الاتحاد الأوروبي؟
  - لازم أخبر الناس إذا كان في قرار كفاية للدولة اللي برسل لها بياناتهم وكيف يحصلون على نسخة من الضمانات؟
- key: gdpr:art-14:para-2
  text: af55fccaded1540c
  en:
  - Besides the basics, what extra details must we give people whose data we got from a third party so
    the processing is fair and transparent?
  - What else should go into a privacy notice for data we collected indirectly, beyond who we are and
    why we use it?
  - We're writing a privacy notice for data from a partner feed; what additional items about rights and
    retention do we need?
  ar:
  - إضافة للمعلومات الأساسية، ما التفاصيل الأخرى التي يجب تقديمها للأشخاص الذين حصلنا على بياناتهم من
    طرف ثالث لضمان معالجة عادلة وشفافة؟
  - شو البنود الإضافية اللي لازم تكون بسياسة الخصوصية للبيانات اللي ما جمعناها من الشخص مباشرة؟
  - أكتب إشعار خصوصية لبيانات جاية من شريك، ايش لازم أضيف غير هوية الشركة والغرض؟
- key: gdpr:art-14:para-2:pt-a
  text: 028088fd9d1807bb
  en:
  - How long do we have to say we'll keep the data in the notice? We don't know exactly yet.
  - Can we describe the criteria for retention instead of a fixed number of months?
  - A person asks how long we'll hold the profile we got from a data vendor; must we have told them?
  ar:
  - هل يجب أن نذكر مدة الاحتفاظ بالبيانات في الإشعار وإن كنا لا نعرفها بالضبط؟
  - ممكن نكتب معايير تحديد مدة التخزين بدل رقم ثابت من الأشهر؟
  - واحد يسأل قديش بنحتفظ ببياناته اللي جبناها من وسيط، هل كان لازم نقوله؟
- key: gdpr:art-14:para-2:pt-b
  text: 695a6f5c01e9db3a
  en:
  - We rely on legitimate interest to market to purchased contacts; do we have to explain what that interest
    is in the notice?
  - Must the notice describe our business interest when that's our legal basis for using data from a third
    party?
  - If a third party's interest justifies the processing, do we need to state it to individuals?
  ar:
  - نعتمد على المصلحة المشروعة للتسويق لجهات اتصال مشتراة، هل يجب شرح هذه المصلحة في الإشعار؟
  - هل لازم الإشعار يوضح مصلحتنا التجارية لما تكون هي الأساس القانوني لاستخدام بيانات من طرف ثالث؟
  - اذا كانت مصلحة طرف ثالث هي المبرر، لازم نقولها للأشخاص؟
- key: gdpr:art-14:para-2:pt-c
  text: 9d27152310176e02
  en:
  - Do we have to tell people they can ask to see, fix, delete or move their data when we got it from
    someone else?
  - Does the notice need to mention the right to object and data portability?
  - What rights should our privacy message list for people whose data came via a partner?
  ar:
  - هل يجب أن نخبر الأشخاص بأن لهم حق الاطلاع على بياناتهم وتصحيحها وحذفها ونقلها حين حصلنا عليها من جهة
    أخرى؟
  - هل يلزم أن يذكر الإشعار حق الاعتراض وحق نقل البيانات؟
  - ايش الحقوق اللي لازم أذكرها بالرسالة للناس اللي بياناتهم وصلتني عن طريق شريك؟
- key: gdpr:art-14:para-2:pt-d
  text: 28e9ac96d96c3d1b
  en:
  - If we use consent as our basis, do we need to tell people they can withdraw it any time?
  - Must the notice say that pulling consent doesn't undo what we already did with their data?
  - Our newsletter relies on consent collected by a partner; what do we say about withdrawing it?
  ar:
  - إذا كان أساسنا القانوني هو الموافقة، هل يجب إخبار الأشخاص أنه يمكنهم سحبها في أي وقت؟
  - هل لازم نوضح بالإشعار أن سحب الموافقة لا يؤثر على المعالجة السابقة؟
  - نشرتنا البريدية تعتمد على موافقة جمعها شريك، شو لازم نقول عن سحبها؟
- key: gdpr:art-14:para-2:pt-e
  text: 2020bb6110a51937
  en:
  - Do we have to tell people they can complain to the data protection regulator?
  - Does our privacy notice for third-party data need to mention the right to file a complaint with an
    authority?
  - A user wants to report us; must we have told them where they can complain?
  ar:
  - هل يجب إخبار الأشخاص بحقهم في تقديم شكوى إلى هيئة حماية البيانات؟
  - هل لازم يذكر إشعار الخصوصية حق رفع شكوى لدى السلطة الرقابية؟
  - لازم نخبر الناس إنهم يقدرون يشتكون علينا عند الجهة المسؤولة عن حماية البيانات؟
- key: gdpr:art-14:para-2:pt-f
  text: b7d8573d93035501
  en:
  - Do we need to tell people where we got their data from, like a data broker or a public website?
  - Someone asks how we got their email; must the notice have named the source?
  - If we scraped data from public profiles, do we have to say so in the notice?
  ar:
  - هل يجب أن نخبر الأشخاص من أين حصلنا على بياناتهم، مثل وسيط بيانات أو موقع عام؟
  - شخص يسأل كيف وصلنا إيميله، هل كان لازم الإشعار يذكر المصدر؟
  - اذا سحبنا البيانات من حسابات عامة على الإنترنت، لازم نصرّح بهالشي؟
- key: gdpr:art-14:para-2:pt-g
  text: 8014c683a8f2e2c9
  en:
  - Our app auto-scores loan applicants using data from a credit bureau; what must we tell them about
    the automated decision?
  - Do we need to explain the logic of our profiling algorithm to people whose data we got from others?
  - What do we have to say about the consequences of automated decisions in the notice?
  ar:
  - تطبيقنا يقيّم طالبي القروض آلياً ببيانات من مكتب ائتمان، ماذا يجب أن نخبرهم عن القرار الآلي؟
  - هل يجب شرح منطق خوارزمية التنميط للأشخاص الذين حصلنا على بياناتهم من جهات أخرى؟
  - شو لازم نكتب عن القرارات الآلية وتأثيرها على الشخص في الإشعار؟
- key: gdpr:art-14:para-3
  text: 764da2b2e9fba7f7
  en:
  - When exactly do we have to send the privacy notice to people whose data we got from a third party?
  - What's the deadline for informing individuals after we receive their data indirectly?
  - Is there a time limit for giving this information, and does it change depending on what we do with
    the data?
  ar:
  - متى بالضبط يجب إرسال إشعار الخصوصية للأشخاص الذين حصلنا على بياناتهم من طرف ثالث؟
  - ما هي المهلة لإبلاغ الأفراد بعد استلام بياناتهم بشكل غير مباشر؟
  - في مدة محددة لازم نعطي فيها المعلومات للناس؟ وهل تتغير حسب استخدامنا للبيانات؟
- key: gdpr:art-14:para-3:pt-a
  text: 19169ad297b13801
  en:
  - Can we wait a few weeks to send the notice after importing a purchased list? Is there a maximum?
  - Is one month the longest we can take to inform people about data we received from a partner?
  - How do we decide a reasonable time to notify people if we just store the data and don't contact them?
  ar:
  - هل نقدر ننتظر كم أسبوع قبل إرسال الإشعار بعد استيراد قائمة مشتراة؟ وهل في حد أقصى؟
  - هل شهر واحد هو أقصى مدة لإبلاغ الأشخاص ببيانات استلمناها من شريك؟
  - كيف نحدد المدة المعقولة لإبلاغ الناس إذا فقط نخزّن البيانات ولا نتواصل معهم؟
- key: gdpr:art-14:para-3:pt-b
  text: 2c527b78cf1eff41
  en:
  - We plan to email people from a purchased list; when must they get the privacy information?
  - Can the privacy notice be included in our first outreach email to a lead?
  - If our first contact with someone is a cold message, does the notice have to come with it at the latest?
  ar:
  - ننوي مراسلة أشخاص من قائمة مشتراة، متى يجب أن يصلهم إشعار الخصوصية؟
  - هل ممكن أضمّن إشعار الخصوصية في أول رسالة بريد أرسلها لعميل محتمل؟
  - اذا أول تواصل مع الشخص رسالة تسويقية، هل لازم الإشعار يكون معها على الأكثر؟
- key: gdpr:art-14:para-3:pt-c
  text: 94ec605ef83ab0e1
  en:
  - We're about to share data we got from a partner with an ad network; by when must individuals be told?
  - Does the notice have to be given before we first pass the data to another company?
  - If we plan to sell or hand over indirectly collected data to a third party, what's the latest moment
    to inform people?
  ar:
  - سنشارك بيانات حصلنا عليها من شريك مع شبكة إعلانية، قبل متى يجب إبلاغ أصحابها؟
  - هل يجب إعطاء الإشعار قبل أول مرة نمرر فيها البيانات لشركة أخرى؟
  - اذا بنسلّم بيانات جمعناها بشكل غير مباشر لطرف ثاني، آخر وقت نبلّغ فيه الناس متى؟
- key: gdpr:art-14:para-4
  text: 571d9ef06ab2d699
  en:
  - We got data for one purpose but now want to use it for something new, like training a recommendation
    model. Do we need to tell people first?
  - Do we have to notify individuals before reusing indirectly collected data for a different purpose?
  - When our use of the data changes, what must we tell the affected people and when?
  ar:
  - حصلنا على البيانات لغرض معين ونريد الآن استخدامها لغرض جديد مثل تدريب نموذج توصيات، هل نخبر الناس
    أولاً؟
  - هل يجب إبلاغ الأفراد قبل إعادة استخدام بيانات جمعناها بشكل غير مباشر لغرض مختلف؟
  - اذا تغير استخدامنا للبيانات، ايش لازم نقول للناس ومتى؟
- key: gdpr:art-14:para-5
  text: bd3e09e69aeb9984
  en:
  - Are there cases where we don't have to send a privacy notice for data we got from someone else?
  - When can we skip informing people about data we obtained indirectly?
  - What exceptions exist to the duty to notify individuals whose data came from a third party?
  ar:
  - هل توجد حالات لا نكون فيها ملزمين بإرسال إشعار خصوصية للبيانات التي حصلنا عليها من طرف آخر؟
  - متى يمكننا تجاوز إبلاغ الأشخاص ببيانات حصلنا عليها بشكل غير مباشر؟
  - ما هي الاستثناءات من واجب إبلاغ أصحاب البيانات التي جاءت من طرف ثالث؟
- key: gdpr:art-14:para-5:pt-a
  text: b6779c33532f35ae
  en:
  - The partner already told users everything about our use of their data; do we still need to send our
    own notice?
  - If people already know the information, can we skip sending it again?
  - Is a notice unnecessary when the individual has already received those details?
  ar:
  - الشريك أخبر المستخدمين مسبقاً بكل شيء عن استخدامنا لبياناتهم، هل ما زلنا بحاجة لإرسال إشعارنا؟
  - إذا كان الأشخاص يعرفون المعلومات أصلاً، هل نستطيع عدم إرسالها مرة أخرى؟
  - هل يسقط الإشعار لو الشخص أصلاً عنده هالمعلومات؟
- key: gdpr:art-14:para-5:pt-b
  text: edb99391d7d4615e
  en:
  - We hold old records with no contact details, so we can't reach people. Are we excused from notifying
    them?
  - Would notifying millions of people be too much effort, and what must we do instead, like publishing
    a notice?
  - For a research project using data from other sources, can we skip individual notices if it would defeat
    the study?
  ar:
  - لدينا سجلات قديمة بدون بيانات تواصل ولا نستطيع الوصول للأشخاص، هل نُعفى من إبلاغهم؟
  - هل إبلاغ ملايين الأشخاص جهد غير متناسب، وماذا نفعل بدلاً من ذلك مثل نشر الإشعار علناً؟
  - في مشروع بحثي يستخدم بيانات من مصادر أخرى، هل نقدر نتخطى الإشعارات الفردية إذا كانت ستفسد الدراسة؟
- key: gdpr:art-14:para-5:pt-c
  text: bb6f5503083a7e72
  en:
  - A law requires us to get customer data from a government registry; do we still have to notify the
    people?
  - Does a legal obligation to collect or disclose data remove the duty to inform individuals?
  - When national law expressly says we must obtain the data, can we skip the notice?
  ar:
  - قانون يلزمنا بالحصول على بيانات العملاء من سجل حكومي، هل ما زال علينا إبلاغ الأشخاص؟
  - هل الالتزام القانوني بجمع البيانات أو الإفصاح عنها يلغي واجب إبلاغ الأفراد؟
  - لو القانون الوطني ينص صراحة على أخذنا للبيانات، نقدر نتخطى الإشعار؟
- key: gdpr:art-14:para-5:pt-d
  text: ab9b97d512de81ba
  en:
  - We're a law firm and got client-related data from a third party that is covered by professional secrecy;
    do we need to notify the person?
  - Does a legal duty of confidentiality let us skip telling individuals about data we received?
  - If the data must stay secret under professional secrecy rules, are we exempt from sending the notice?
  ar:
  - نحن مكتب محاماة وحصلنا على بيانات من طرف ثالث مشمولة بالسر المهني، هل يجب إخطار الشخص؟
  - هل واجب السرية القانوني يسمح لنا بعدم إبلاغ الأفراد بالبيانات التي استلمناها؟
  - اذا لازم تبقى البيانات سرية بحكم السر المهني، نكون معفيين من إرسال الإشعار؟
- key: gdpr:art-15:para-1
  text: 6f44fa4a136123b6
  en:
  - A user emailed our app asking if we have any of their data at all and, if so, to see it. Do we have
    to answer that?
  - What exactly must I give someone who files a data access request with my online shop?
  - Can a customer ask us to confirm whether we're processing their personal data, and what do we owe
    them besides the data itself?
  ar:
  - يحق للمستخدم أن يسأل تطبيقنا هل نعالج بياناته الشخصية أم لا، وأن يطلع عليها؟
  - شو لازم أعطي العميل إذا طلب يشوف كل بياناته عندنا في المتجر؟
  - واحد مستخدم بعتلنا يسأل إذا عندنا بيانات عنه ولا لا، لازم نرد عليه ونوريه البيانات؟
- key: gdpr:art-15:para-1:pt-a
  text: 7398d2affad4e69c
  en:
  - If a user asks for their data, do we have to tell them why we're using it, like for marketing or analytics?
  - Does an access request require us to explain what we use the person's data for in our app?
  - A customer wants to know the reasons we process their information. Must we say?
  ar:
  - لازم نخبر المستخدم ليش بنستخدم بياناته (تسويق، تحليلات) لما يطلب الوصول لها؟
  - هل يجب أن نبين للعميل أغراض معالجة بياناته عند طلبه الاطلاع عليها؟
  - عميل يسأل ليش عندكم بياناته وشو بتسوو فيها، لازم نجاوبه؟
- key: gdpr:art-15:para-1:pt-b
  text: 4a9cf3bac148869c
  en:
  - When answering a data request, do we need to list the types of data we hold, like email, location,
    payment info?
  - Must our reply to a user's access request say what categories of data we have on them?
  - A user asks what kind of information about them our clinic app stores. Do we have to spell that out?
  ar:
  - هل يلزمنا أن نذكر للمستخدم أنواع البيانات التي نحتفظ بها عنه مثل البريد والموقع وبيانات الدفع؟
  - لما يطلب العميل بياناته، لازم نقوله فئات المعلومات اللي عندنا عنه؟
  - مستخدم سأل أي نوع من المعلومات مخزنة عنه في تطبيق العيادة، هل علينا توضيح ذلك؟
- key: gdpr:art-15:para-1:pt-c
  text: 6032c74bd9aac92f
  en:
  - Do we have to tell a user which third parties, like analytics vendors or ad networks, received their
    data?
  - A customer asks who we've shared their data with, including companies abroad. What must we disclose?
  - Does an access request cover naming the recipients or types of recipients of the data, such as cloud
    providers outside the EU?
  ar:
  - هل يجب أن نخبر المستخدم بالجهات الخارجية التي شاركنا بياناته معها مثل شركات التحليلات والإعلانات؟
  - عميل يسأل مع مين شاركتوا بياناته، حتى لو شركات برا الاتحاد الأوروبي، لازم نقوله؟
  - هل يشمل طلب الاطلاع بيان المستلمين أو فئاتهم، خصوصاً في دول ثالثة؟
- key: gdpr:art-15:para-1:pt-d
  text: bb89de9f1b309a0a
  en:
  - A user wants to know how long we'll keep their data. Do we have to say, and what if we have no fixed
    period?
  - What do we tell someone about retention when they ask for their data and we don't have a set deletion
    date?
  - Do we need to give the storage duration of personal data in our reply to an access request?
  ar:
  - مستخدم يسأل كم مدة بنحتفظ ببياناته، هل لازم نجاوب وماذا لو ما في مدة ثابتة؟
  - هل يجب ذكر مدة تخزين البيانات أو معايير تحديدها عند الرد على طلب الاطلاع؟
  - شو نقول للعميل عن مدة الاحتفاظ إذا ما عندنا تاريخ حذف محدد؟
- key: gdpr:art-15:para-1:pt-e
  text: 32a4f4b150b045a9
  en:
  - Do we have to inform users who ask for their data that they can correct it, delete it, or object to
    how we use it?
  - In our reply to a data access request, must we mention the user's rights to fix, erase or limit processing?
  - Customer asked for their data; do we need to tell them they can ask us to stop using it?
  ar:
  - هل لازم نعرّف المستخدم عند طلبه بياناته أنه يقدر يطلب تصحيحها أو حذفها أو الاعتراض على استخدامها؟
  - هل يجب أن يتضمن ردنا الإشارة إلى حقوق التصحيح والمحو وتقييد المعالجة؟
  - واحد طلب بياناته، لازم نقوله إن له حق يوقفنا عن استخدامها؟
- key: gdpr:art-15:para-1:pt-f
  text: 2020bb6110a51937
  en:
  - Do we have to tell users they can complain to the data protection regulator when they request their
    data?
  - Must our answer to a data access request mention the right to file a complaint with the authority?
  ar:
  - هل يلزمنا إخبار المستخدم بحقه في تقديم شكوى لجهة حماية البيانات عند طلبه الاطلاع؟
  - لازم نذكر في ردنا إنه يقدر يشتكي عند الهيئة الرقابية؟
- key: gdpr:art-15:para-1:pt-g
  text: 4ff6e4a3e9f0a564
  en:
  - We bought a contact list and a person asks where we got their data. Do we have to say?
  - If we didn't collect the data from the user ourselves, must we tell them the source?
  - A user asks how we got their details when they never signed up. What do we owe them?
  ar:
  - اشترينا قائمة جهات اتصال وشخص يسأل من وين جبنا بياناته، لازم نقوله؟
  - إذا ما جمعنا البيانات من المستخدم نفسه، هل يجب إخباره بمصدرها؟
  - شخص ما سجّل عندنا أبداً ويسأل كيف حصلنا على بياناته، شو واجبنا تجاهه؟
- key: gdpr:art-15:para-1:pt-h
  text: 8014c683a8f2e2c9
  en:
  - Our app auto-scores loan applicants. Do we have to explain to them how the algorithm decided when
    they request their data?
  - A user asks if a profiling or automated decision system affects them. What must we tell them about
    the logic and consequences?
  - Do access requests require giving meaningful information about automated decisions, like AI-based
    approvals or rejections?
  ar:
  - تطبيقنا يقيّم طلبات القروض آلياً، هل يجب أن نشرح للمتقدم منطق القرار عند طلبه بياناته؟
  - مستخدم يسأل هل نستخدم قراراً آلياً أو تحليل سلوك عليه، شو لازم نخبره عن المنطق والنتائج؟
  - هل يشمل حق الاطلاع معلومات مفيدة عن القرارات الآلية مثل الرفض بواسطة الذكاء الاصطناعي؟
- key: gdpr:art-15:para-2
  text: 4769369fd845fff4
  en:
  - We store user data on servers in another country. Do we have to tell users what safeguards protect
    it when they ask?
  - If a customer's data is sent outside the EU, what must we tell them about how the transfer is protected?
  - A user asks whether the transfer of their data to our US vendor is secured. Are we obliged to explain
    the safeguards?
  ar:
  - نخزن بيانات المستخدمين على سيرفرات في دولة ثانية، هل لازم نخبرهم بالضمانات اللي تحميها إذا سألوا؟
  - إذا انتقلت بيانات العميل خارج الاتحاد الأوروبي، شو يجب أن نبلغه عن حماية النقل؟
  - مستخدم يسأل هل نقل بياناته لمزوّدنا الأمريكي مؤمَّن، هل يجب أن نوضح الضمانات؟
- key: gdpr:art-15:para-3
  text: 633489c3205ca951
  en:
  - Does a user get a copy of their data for free, and can we charge if they ask for more copies?
  - A customer sent their access request by email. In what format should we send the data back?
  - Can I bill a user for extra copies of their personal data, and how much?
  ar:
  - هل نعطي المستخدم نسخة من بياناته مجاناً، وهل نقدر نحاسبه إذا طلب نسخ إضافية؟
  - عميل أرسل طلب الاطلاع بالإيميل، بأي صيغة نرسل له بياناته؟
  - هل يجوز أن أفرض رسماً على نسخ إضافية من البيانات الشخصية وكم يكون؟
- key: gdpr:art-15:para-4
  text: 2a205bb4bc8d479d
  en:
  - Can we hide other people's details when giving a user a copy of their data, like names in chat messages?
  - A user's data export would expose another customer's information. Do we still have to hand it all
    over?
  - Does the right to a copy of data have limits when it would harm someone else's privacy or rights?
  ar:
  - هل نقدر نخفي بيانات أشخاص آخرين لما نعطي المستخدم نسخة من بياناته، مثل أسماء في المحادثات؟
  - تصدير بيانات مستخدم راح يكشف معلومات عميل ثاني، هل لازم نسلمه كله؟
  - هل حق الحصول على نسخة له حدود إذا كان يضر بحقوق أو خصوصية الآخرين؟
- key: gdpr:art-16
  text: a5b5dfe288e0c8a6
  en:
  - A customer of our online shop says the address we have on file is wrong and wants it fixed. How quickly
    do we have to correct it?
  - Can a user force us to add missing details to their profile, like a note explaining their situation,
    if our records are incomplete?
  - Do we have to fix wrong personal data in our app's database when a user points out a mistake?
  ar:
  - يطلب مني مستخدم في تطبيقنا تصحيح اسمه المسجل لأنه مكتوب بشكل خاطئ، فهل يجب علينا تعديله وخلال أي مدة؟
  - هل يحق للعميل أن يطلب استكمال بياناته الناقصة في سجلاتنا وأن يضيف إفادة توضيحية مكملة؟
  - عميل بعتلي يقول إن رقم تلفونه وتاريخ ميلاده غلط عندكم بالنظام، لازم أصححهم له ولا أقدر أرفض؟
- key: gdpr:art-17:para-1
  text: 2482193962c2c69d
  en:
  - A user asked us to delete all their personal data from our app. Do we have to do it, and how fast?
  - When can someone force a company to erase the data it holds about them?
  - Are we obliged to wipe a customer's data on our own initiative if one of the legal grounds for deletion
    applies?
  ar:
  - ما هو حق المستخدم في طلب حذف بياناته الشخصية من التطبيق، ومتى يلتزم المسؤول عن المعالجة بحذفها دون
    تأخير؟
  - مستخدم طلب مني أمسح كل بياناته من الموقع، لازم أنفذ ولا لأ؟
  - شو الحالات اللي لازم فيها أحذف بيانات العميل من نظامنا بدون ما أتأخر؟
- key: gdpr:art-17:para-1:pt-a
  text: 564944606fe28ecc
  en:
  - Do we have to delete user data that we collected for a feature we've since shut down?
  - Our online shop still keeps old customer details long after the order was completed. Do we need to
    remove them?
  - Is it a problem to keep data just in case we need it later, when the original reason for collecting
    it is gone?
  ar:
  - هل يجب حذف بيانات المستخدمين التي جمعناها لميزة لم تعد موجودة في تطبيقنا؟
  - متجرنا الإلكتروني يحتفظ ببيانات العملاء بعد انتهاء الطلب بفترة طويلة، هل يلزمنا حذفها؟
  - خلص الغرض اللي جمعنا عشانه البيانات، لازم نمسحها ولا نقدر نخليها؟
- key: gdpr:art-17:para-1:pt-b
  text: 28ef5fccad91a868
  en:
  - A user withdrew their consent to our marketing tracking. Must we delete their data?
  - If someone clicks 'revoke consent' in our app, do we have to erase what we collected on that basis?
  - We process health data in our clinic app based on consent and the patient took it back, but we also
    have a contract with them. Does deletion still apply?
  ar:
  - مستخدم سحب موافقته على التتبع التسويقي في تطبيقنا، هل يجب علينا حذف بياناته؟
  - ما الذي يحصل لبيانات العميل إذا سحب موافقته ولم يكن لدينا أساس قانوني آخر لمعالجتها؟
  - واحد لغى موافقته على استخدام بياناته، لازم نمسحها كلها ولا نقدر نبقيها؟
- key: gdpr:art-17:para-1:pt-c
  text: a3c6542d3d8de61c
  en:
  - A user objected to us profiling them for personalised ads. Do we have to delete their data?
  - Someone told our SaaS to stop using their data for direct marketing and wants it erased. Must we comply?
  - When can we refuse to delete data after a user objects to processing based on our legitimate interests?
  ar:
  - مستخدم اعترض على استخدام بياناته للإعلانات المخصصة، هل علينا حذفها؟
  - هل يجب حذف البيانات إذا اعترض صاحبها على معالجتها للتسويق المباشر؟
  - واحد اعترض على معالجة بياناته وقال امسحوها، متى لازم أمسح ومتى أقدر أرفض؟
- key: gdpr:art-17:para-1:pt-d
  text: 804834cca672c7c2
  en:
  - We discovered we've been storing user data without any valid legal basis. Do we need to delete it?
  - Our team collected emails by scraping a site and now someone complains. Must we erase that data?
  - If our app processed data illegally, does the user get to demand it be deleted?
  ar:
  - اكتشفنا أننا نخزّن بيانات مستخدمين دون أساس قانوني سليم، هل يجب حذفها؟
  - هل من حق المستخدم المطالبة بالحذف إذا عالجنا بياناته بطريقة غير قانونية؟
  - جمعنا إيميلات الناس بطريقة مو قانونية، لازم نمسحها؟
- key: gdpr:art-17:para-1:pt-e
  text: cfd18a8fed8d9027
  en:
  - A law in our country requires us to delete certain customer records after a period. Is that covered
    as a deletion duty?
  - Our bank app must purge data when a regulation says so. Does that count as a reason to erase?
  - If a court or national law orders us to delete user data, are we obliged to do it?
  ar:
  - قانون في بلدنا يلزمنا بحذف سجلات العملاء بعد مدة معينة، هل هذا يعد سببا للحذف؟
  - هل نلتزم بمسح بيانات المستخدمين إذا فرض علينا القانون الوطني ذلك؟
  - في قانون يجبرنا نشيل بيانات العملاء بعد فترة، هل هذا يدخل ضمن أسباب الحذف؟
- key: gdpr:art-17:para-1:pt-f
  text: aeccbef010e6f3ab
  en:
  - Our kids' game app collected data from children who signed up online. Do we have to delete it if they
    or their parents ask?
  - Can a person demand deletion of data we collected from them when they were a minor using our social
    app?
  - We offer an online service to teenagers and collected their data. Does that give them a stronger right
    to deletion?
  ar:
  - تطبيق الألعاب الخاص بالأطفال جمع بيانات منهم عبر التسجيل، هل نحذفها إذا طلبوا هم أو أهلهم؟
  - هل يحق لشخص طلب حذف بيانات جُمعت منه وهو قاصر عبر خدمة إلكترونية؟
  - عندنا تطبيق للمراهقين وجمعنا بياناتهم، هل لهم حق الحذف بسبب إنهم كانوا صغار؟
- key: gdpr:art-17:para-2
  text: 972756d3fc999fdf
  en:
  - We published a user's profile publicly and shared it with partners. After a deletion request, do we
    have to tell others who copied it?
  - What must we do about third-party sites that republished or linked to personal data we're now deleting?
  - How far do we need to go technically to get copies of erased data removed elsewhere?
  ar:
  - نشرنا ملف مستخدم علنا وشاركناه مع شركاء، وبعد طلب الحذف هل علينا إبلاغ الجهات الأخرى التي نسخته؟
  - ما الواجب علينا تجاه المواقع الأخرى التي أعادت نشر بيانات شخصية نحذفها الآن؟
  - لو بياناتنا انتشرت عند جهات ثانية وصاحبها طلب حذفها، شو لازم نسوي؟
- key: gdpr:art-17:para-3
  text: 04e9f43d73d42089
  en:
  - Are there situations where we can refuse a deletion request?
  - When don't the deletion and notify-others duties apply to us?
  - A user wants all data erased but we still need some of it. What exceptions exist?
  ar:
  - هل توجد حالات يمكننا فيها رفض طلب حذف البيانات؟
  - متى لا ينطبق واجب الحذف وإبلاغ الجهات الأخرى علينا؟
  - مستخدم يبي نحذف كل بياناته بس نحتاج جزء منها، وش الاستثناءات؟
- key: gdpr:art-17:para-3:pt-a
  text: d33bfabd6952eac7
  en:
  - Someone asks us to delete a news article or forum post about them. Can we keep it for free speech
    reasons?
  - Our platform hosts user comments and a person wants theirs removed, but it's part of public discussion.
    Can we refuse?
  - Does freedom of expression override a deletion request?
  ar:
  - شخص يطلب حذف مقال أو منشور عنه على منصتنا، هل يمكننا إبقاؤه بحجة حرية التعبير؟
  - هل تتغلب حرية التعبير والمعلومات على طلب حذف البيانات؟
  - منصتنا فيها تعليقات ناس وواحد يبي يمسح اللي عنه، نقدر نرفض بسبب حرية الرأي؟
- key: gdpr:art-17:para-3:pt-b
  text: d088e221723daea3
  en:
  - We have to keep invoices and tax records by law. Can we refuse when a customer asks for deletion?
  - Our app is run for a public authority. Can we decline erasure requests for data tied to that public
    task?
  - Does a legal retention requirement let us keep data despite a user's deletion request?
  ar:
  - القانون يلزمنا بالاحتفاظ بالفواتير والسجلات الضريبية، هل نرفض طلب العميل بحذفها؟
  - هل يجوز رفض الحذف إذا كانت البيانات لازمة لمهمة عامة أو لسلطة رسمية؟
  - عندنا التزام قانوني نحتفظ بالبيانات، نقدر نتجاهل طلب المسح من المستخدم؟
- key: gdpr:art-17:para-3:pt-c
  text: ef0a692b37eb7453
  en:
  - Our health platform handles data used for public health monitoring. Can we refuse deletion requests
    for it?
  - Can a hospital app keep patient data for public health reasons even if the patient asks for erasure?
  - Is there an exception to deletion for disease surveillance or health safety purposes?
  ar:
  - منصتنا الصحية تعالج بيانات للرصد الصحي العام، هل يمكننا رفض طلبات الحذف؟
  - هل يجوز لتطبيق مستشفى الاحتفاظ ببيانات المريض لأسباب الصحة العامة رغم طلبه الحذف؟
  - في حاجة اسمها استثناء للحذف بسبب الصحة العامة؟ كيف تشتغل؟
- key: gdpr:art-17:para-3:pt-d
  text: 4d6d0fa34efa17d7
  en:
  - We use user data for a university research study. Can we keep it after someone asks to be deleted?
  - Can we refuse erasure if deleting one person's data would ruin our statistical dataset?
  - Does a deletion request apply to data kept in a historical archive or scientific research?
  ar:
  - نستخدم بيانات المستخدمين في دراسة بحثية جامعية، هل يمكننا الاحتفاظ بها بعد طلب الحذف؟
  - هل نرفض الحذف إذا كان حذف بيانات شخص سيفسد مجموعة بياناتنا الإحصائية؟
  - هل ينطبق طلب الحذف على بيانات محفوظة للأرشفة أو البحث العلمي؟
- key: gdpr:art-17:para-3:pt-e
  text: 1d73f282bd1597dc
  en:
  - A customer is suing us and also demands we delete their data. Can we keep the records for the dispute?
  - Can we hold on to user data that we need to defend ourselves in a possible lawsuit?
  - Does a pending legal claim let us refuse erasure?
  ar:
  - عميل يقاضينا ويطلب في الوقت نفسه حذف بياناته، هل يمكننا الاحتفاظ بالسجلات للنزاع؟
  - هل يجوز الاحتفاظ ببيانات المستخدم لازمة للدفاع عن أنفسنا في دعوى قضائية؟
  - فيه قضية بيني وبين مستخدم، أقدر أرفض طلبه بمسح بياناته؟
- key: gdpr:art-18:para-1
  text: 121843df568a229f
  en:
  - In what situations can a user force us to freeze how we use their data without deleting it?
  - A customer emailed asking us to 'pause' processing of their account data instead of deleting it. Do
    we have to do that?
  - What are the grounds on which someone can demand we restrict processing of their personal data?
  ar:
  - ما هي الحالات التي يحق فيها للمستخدم أن يطلب منا تقييد معالجة بياناته الشخصية؟
  - هل يلزمني كمسؤول عن التطبيق إيقاف معالجة بيانات عميل مؤقتاً إذا طلب ذلك بدل الحذف؟
  - يعني متى يقدر المستخدم يطلب مني أجمّد بياناته وما أمسحها؟ وش الحالات؟
- key: gdpr:art-18:para-1:pt-a
  text: 472f39ff7cf0c9a4
  en:
  - A user says the address in their profile is wrong and disputes our records. Do we have to stop using
    that data while we check?
  - How long must processing be restricted when a customer challenges whether their data is correct?
  - Our online shop got a complaint that the stored phone number is inaccurate; can we keep using it for
    marketing until we verify?
  ar:
  - اعترض مستخدم على صحة بياناته المسجلة لدينا، فهل يجب إيقاف استخدامها خلال فترة التحقق منها؟
  - ما مدة تقييد المعالجة عندما يطعن العميل في دقة بياناته الشخصية؟
  - العميل يقول إن معلوماته عندنا غلط، هل لازم أوقف استخدامها لين أتأكد؟
- key: gdpr:art-18:para-1:pt-b
  text: 4579984c7d322fb0
  en:
  - We processed a user's data unlawfully, but the user doesn't want it deleted. Can they ask us to just
    restrict it?
  - A customer wants us to keep their data but not use it because our processing was illegal. Is that
    allowed?
  - Can someone choose restriction instead of erasure when our handling of their data had no legal basis?
  ar:
  - عالجنا بيانات مستخدم بشكل غير قانوني لكنه لا يريد حذفها، هل يمكنه طلب تقييد استخدامها بدلاً من ذلك؟
  - هل يحق للعميل رفض مسح بياناته وطلب تجميد استعمالها إذا كانت المعالجة مخالفة للقانون؟
  - المستخدم ما يبي نحذف بياناته مع إن طريقة استخدامنا لها غلط، يقدر يطلب نوقف استخدامها بس؟
- key: gdpr:art-18:para-1:pt-c
  text: c7e4129a875882f7
  en:
  - We no longer need a former customer's data, but they asked us to keep it because they're preparing
    a lawsuit. Must we?
  - Can a user ask us to hold onto data we'd otherwise delete because they need it as evidence in a dispute?
  - Our retention period ended, but a user needs their records for a legal claim against a third party.
    What are our obligations?
  ar:
  - لم نعد بحاجة إلى بيانات عميل سابق لكنه طلب إبقاءها لأنه يحتاجها في دعوى قضائية، هل علينا ذلك؟
  - هل يحق للمستخدم أن يطلب منا الاحتفاظ ببيانات كنا سنحذفها لأنه يحتاجها دليلاً في نزاع؟
  - انتهت مدة الاحتفاظ بس العميل يقول يحتاج بياناته عشان قضية، نسوي إيش؟
- key: gdpr:art-18:para-1:pt-d
  text: a3463cd00bdf4281
  en:
  - A user objected to us processing their data based on our legitimate interest. Do we have to pause
    it while we decide?
  - While we assess whether our business interests outweigh a user's objection, can we keep processing
    their data?
  - Someone opted out of analytics tracking that we run under legitimate interests; must we stop in the
    meantime?
  ar:
  - اعترض مستخدم على معالجة بياناته بناءً على مصلحتنا المشروعة، هل نوقف المعالجة أثناء دراسة الاعتراض؟
  - هل نستمر في معالجة بيانات شخص اعترض ونحن نقيّم ما إذا كانت مصلحتنا تتغلب على مصلحته؟
  - واحد اعترض على التتبع التحليلي عندنا، لازم أوقفه لين نقرر هل اعتراضه مقبول؟
- key: gdpr:art-18:para-2
  text: a41be42802c59acf
  en:
  - Once a user's data is restricted, what can we still do with it besides storing it?
  - Can we use restricted data if the user gives consent, or if we need it for a court case?
  - A user's account data is under restriction but we're being sued by another person; are we allowed
    to use that data?
  ar:
  - بعد تقييد معالجة بيانات المستخدم، ما الذي يسمح لنا بفعله بها غير تخزينها؟
  - هل يجوز استخدام البيانات المقيّدة إذا وافق صاحبها أو لحاجتنا إليها في دعوى قضائية؟
  - البيانات موقوفة بطلب من العميل، متى أقدر أستخدمها مع ذلك؟ مثلاً لو وافق أو في قضية؟
- key: gdpr:art-18:para-3
  text: cebef59106a30106
  en:
  - Do we have to tell a user before we start processing their data again after a restriction?
  - Our team finished verifying a customer's disputed data and wants to lift the restriction. Do we need
    to notify them first?
  - What notice is owed to someone whose restricted data is about to be unfrozen?
  ar:
  - هل يجب إخطار المستخدم قبل رفع التقييد عن معالجة بياناته؟
  - أنهينا التحقق من بيانات العميل المعترض عليها ونريد استئناف استخدامها، هل نبلغه أولاً؟
  - لازم أعلم العميل قبل ما أرجّع معالجة بياناته بعد التجميد؟
- key: gdpr:art-19
  text: 35b3c8e57660ebcf
  en:
  - A user made us correct their email and phone number in our app. We had already sent that data to our
    analytics and mailing vendors. Do we have to tell those vendors about the fix?
  - When we delete a customer's account data on request, do we have to pass that deletion on to third
    parties we shared it with, or can we skip it if it's too much work?
  - A customer asked us to list which companies received their data. Are we obliged to tell them who the
    recipients are?
  ar:
  - طلب منا مستخدم تصحيح بياناته أو حذفها في تطبيقنا، وكنا قد شاركناها مع جهات خارجية مثل شركة التسويق
    بالبريد. هل يجب علينا إبلاغ هذه الجهات بالتعديل أو الحذف؟
  - شو لازم أعمل لما واحد يطلب مني أحذف بياناته وأنا مرسلها لشركات ثانية؟ وهل لازم أقوله مين هالشركات
    لو سألني؟
- key: gdpr:art-20:para-1
  text: 2909b072a6116ca1
  en:
  - A user wants to download all the data they gave our app and move it to a competing service. Do we
    have to let them?
  - What format do I need to export a customer's data in when they ask for a copy to take elsewhere?
  - Can I refuse to help when a user asks us to send their profile data to another company, or must we
    not get in the way?
  ar:
  - ما هي الصيغة التي يجب أن أصدّر بها بيانات المستخدم عندما يطلب نسخة منها لنقلها إلى خدمة أخرى؟
  - هل يحق للمستخدم أن يحصل على البيانات التي قدّمها لتطبيقنا وينقلها إلى منافس دون أن نعرقله؟
  - عميل طلب مني يطلع بياناته من الموقع ويودّيها لشركة ثانية، لازم أوافق ولا أقدر أرفض؟
- key: gdpr:art-20:para-1:pt-a
  text: 1c4904e0f0e7bd24
  en:
  - Does the export right apply when users signed up through our terms of service, or only if they ticked
    a consent box?
  - Our shop collects customer data based on the purchase contract. Do customers still get to take that
    data with them?
  - We process health data in our clinic app based on explicit consent. Can patients ask to receive it
    in a portable form?
  ar:
  - هل حق نقل البيانات ينطبق على بيانات جمعناها بناءً على عقد الاشتراك في تطبيقنا؟
  - نحن نعالج بيانات المستخدمين بناءً على موافقتهم الصريحة، فهل يحق لهم طلب نسخة قابلة للنقل؟
  - لو معالجة البيانات عندنا مبنية على مصلحة مشروعة مو على موافقة أو عقد، هل لازم أعطي المستخدم بياناته
    للنقل؟
- key: gdpr:art-20:para-1:pt-b
  text: ae36bdc7f3769a36
  en:
  - If some of our records are kept on paper files rather than in software, do they have to be included
    in a data export request?
  - Does the data export right cover only data handled by our automated systems?
  - We manually process some customer info in spreadsheets by hand; is that subject to a portability request?
  ar:
  - هل حق نقل البيانات يشمل فقط البيانات التي تُعالج بشكل آلي في أنظمتنا؟
  - عندنا ملفات ورقية للعملاء، هل يجب إدراجها عند طلب تصدير البيانات؟
  - لو بعض البيانات نعالجها يدوي مو بالنظام، هل ينطبق عليها طلب نقل البيانات؟
- key: gdpr:art-20:para-2
  text: ed36e78ae937640d
  en:
  - Can a user ask us to send their data straight to another provider instead of downloading it themselves?
  - Do we need to build an API that pushes user data directly to a competitor's platform when the user
    asks?
  - What if direct transfer to the other company isn't technically possible with our system?
  ar:
  - هل يمكن للمستخدم أن يطلب منا إرسال بياناته مباشرة إلى مزوّد خدمة آخر بدلاً من تنزيلها بنفسه؟
  - هل يلزمني بناء واجهة برمجية لنقل بيانات المستخدم مباشرة إلى منصة أخرى عند طلبه؟
  - إذا المستخدم يبي ننقل بياناته مباشرة للشركة الثانية بس نظامنا ما يدعم هالشي، شنو نسوي؟
- key: gdpr:art-20:para-3
  text: ef3b8dc277d833f7
  en:
  - If a user exports their data to switch services, do we still have to delete it when they ask for erasure?
  - Does the portability right apply to a government agency's app that processes data for a public task?
  - A user requested a data export and also deletion of their account; does one request cancel the other?
  ar:
  - هل تصدير المستخدم لبياناته للانتقال إلى خدمة أخرى يمنع حقه في طلب حذفها لاحقاً؟
  - هل ينطبق حق نقل البيانات على تطبيق جهة حكومية تعالج البيانات لأداء مهمة عامة؟
  - المستخدم طلب تصدير بياناته وبعدها طلب حذف حسابه، هل الطلب الأول يلغي الثاني؟
- key: gdpr:art-20:para-4
  text: 6bdb0860f2616d45
  en:
  - A user's export would include other people's info, like messages from other members. Can we hold that
    back?
  - How do I handle a data portability request when the data also contains details about third parties?
  - Does a user's right to take their data override the privacy of other people in our platform?
  ar:
  - تصدير بيانات مستخدم سيتضمن معلومات أشخاص آخرين مثل رسائلهم، هل يجوز لنا حجبها؟
  - كيف أتعامل مع طلب نقل البيانات إذا كانت تحتوي على تفاصيل تخص أطرافاً ثالثة؟
  - لو المستخدم يطلب بياناته وفيها معلومات ناس ثانيين في المنصة، هل حقه يتقدم على خصوصيتهم؟
- key: gdpr:art-21:para-1
  text: 939a9f0c7d6744d4
  en:
  - A user of our app says they don't want us analysing their data anymore because of their personal circumstances,
    and we were relying on legitimate interest. Do we have to stop?
  - When can we keep processing someone's data after they object, even though they asked us to stop?
  - Does a customer's objection also cover profiling and personalised recommendations we run based on
    our business interests?
  ar:
  - هل يحق للمستخدم أن يعترض على معالجة بياناته التي نجريها بناءً على مصلحتنا المشروعة، ومتى يجوز لنا
    الاستمرار رغم اعتراضه؟
  - عميل في متجرنا الإلكتروني اعترض على تحليل بياناته وتصنيفه بسبب ظروفه الخاصة، فهل يلزمنا التوقف عن
    المعالجة؟
  - يا جماعة واحد من المستخدمين قال لي وقّف معالجة بياناتي، وإحنا شغالين بالمصلحة المشروعة، لازم أوقف
    ولا أقدر أكمل؟
- key: gdpr:art-21:para-2
  text: e0f3bc277677f727
  en:
  - Can people tell us to stop using their data for marketing at any time?
  - A subscriber of our newsletter wants us to stop profiling them for targeted promotions. Do we have
    to honour that?
  - Is there any condition a customer must meet to opt out of our promotional campaigns, like giving a
    reason?
  ar:
  - هل يحق للعميل في أي وقت أن يطلب إيقاف استخدام بياناته لأغراض التسويق المباشر بما فيها التنميط؟
  - مستخدم في تطبيقنا يريد التوقف عن تلقي العروض الترويجية المبنية على تحليل سلوكه، هل نلتزم بطلبه؟
  - أبغى أعرف هل العميل لازم يعطيني سبب عشان يوقف التسويق عليه، ولا من حقه يرفض بدون سبب؟
- key: gdpr:art-21:para-3
  text: 11c77d2cc5ed5161
  en:
  - After a customer objects to marketing, can we still keep them on our promo email list?
  - A user objected to direct marketing but we still want to use their data for the ads campaign. Is that
    allowed?
  - Once someone opts out of marketing, do we have to stop using their data for it completely?
  ar:
  - بعد أن يعترض العميل على التسويق المباشر، هل يجوز أن نبقيه في قائمة الرسائل الترويجية؟
  - مستخدم اعترض على التسويق لكننا نريد استخدام بياناته في حملة إعلانية أخرى، هل هذا جائز؟
  - لو العميل قال ما أبغى تسويق، هل لازم أوقف كل استخدام لبياناته لهالغرض؟ وش المطلوب مني؟
- key: gdpr:art-21:para-4
  text: e8bd6cdd36741347
  en:
  - When and how do we have to tell users they can object to our processing or marketing?
  - Can we hide the objection option inside our long privacy policy text?
  - We're onboarding new customers and sending a first welcome email. Do we need to mention their right
    to object right there?
  ar:
  - متى وكيف يجب إبلاغ المستخدمين بأن لهم حق الاعتراض على المعالجة أو التسويق؟
  - هل يجوز أن ندرج خيار الاعتراض ضمن نص سياسة الخصوصية الطويلة دون إبراز؟
  - عند أول رسالة نرسلها لعميل جديد في تطبيقنا، هل يجب أن نذكر له حقه في الاعتراض بشكل منفصل وواضح؟
- key: gdpr:art-21:para-5
  text: 450fabec4263e16c
  en:
  - Can we let users object to processing through a button or setting in our app instead of emailing us?
  - Is it acceptable to handle objection requests automatically through technical settings on our website?
  - We run an online service and want to build an automated opt-out for processing. Does the law allow
    users to object that way?
  ar:
  - هل يمكن السماح للمستخدمين بالاعتراض على المعالجة عبر زر أو إعداد داخل التطبيق بدل مراسلتنا؟
  - هل يجوز التعامل مع طلبات الاعتراض آلياً عبر إعدادات تقنية في موقعنا الإلكتروني؟
  - نبي نسوي خيار اعتراض أوتوماتيكي في الموقع، هل القانون يسمح للمستخدم يعترض بهالطريقة؟
- key: gdpr:art-21:para-6
  text: a6ad5d0220abf145
  en:
  - We use customers' data for statistical analysis and research. Can participants object to that?
  - Can a person opt out of our university study using their data if the research serves a public interest
    task?
  - Our analytics team processes data for historical or scientific research; do we have to respect an
    objection from a data subject?
  ar:
  - نستخدم بيانات العملاء في أبحاث وإحصاءات، فهل يحق لهم الاعتراض على ذلك؟
  - هل يمكن لشخص الانسحاب من دراسة بحثية تستخدم بياناته إذا كانت المعالجة لمهمة تخدم المصلحة العامة؟
  - فريق التحليل عندنا يستخدم البيانات لأغراض بحث علمي وإحصائي، وواحد اعترض، لازم نستجيب له ولا لا؟
- key: gdpr:art-22:para-1
  text: fb3d96cdf5fe8211
  en:
  - Can our app automatically reject loan applicants with an algorithm and no person looking at it?
  - A user says they don't want a bot deciding whether their account gets banned or their insurance quote.
    Do they have that right?
  - We score job candidates with software and auto-drop low scorers. Is that a problem if no recruiter
    reviews it?
  ar:
  - هل يحق للمستخدم أن يرفض أن يتم اتخاذ قرار بشأنه بواسطة خوارزمية فقط، مثل رفض طلب تمويل في تطبيقنا؟
  - نظامنا يقيّم المتقدمين للوظائف ويستبعد تلقائياً أصحاب الدرجات المنخفضة دون تدخل بشري، هل هذا مسموح؟
  - يا جماعة، عندنا بوت يوقف حسابات الناس لحاله من غير ما حدا يراجع، هل الزبون يقدر يعترض على هيك شي؟
- key: gdpr:art-22:para-2
  text: 59853bce654f9400
  en:
  - When are we allowed to use fully automated decisions on users even though people generally have a
    right to avoid them?
  - What are the exceptions that let our online shop make automatic decisions about customers with no
    human involved?
  - Is there any situation where a purely algorithmic decision about a user is fine?
  ar:
  - ما هي الحالات التي يجوز فيها اتخاذ قرارات آلية بالكامل بحق المستخدمين رغم الحظر العام؟
  - متى أقدر أستخدم قرارات أوتوماتيكية بالكامل على عملائي في المتجر الإلكتروني بدون مراجعة بشرية؟
  - في استثناءات تسمح لي أخلي النظام يقرر لحاله عن المستخدمين؟ شو هي؟
- key: gdpr:art-22:para-2:pt-a
  text: 6be509b0ca80dbb9
  en:
  - Our fintech app has to run an automatic credit check to open an account. Can that be fully automated
    because it's needed for the contract?
  - Is automated decision-making okay when it's necessary to sign up a customer or deliver the service
    they bought?
  - We auto-approve or decline subscription plans based on a risk algorithm as part of onboarding. Does
    the contract exception cover us?
  ar:
  - تطبيقنا المالي يجري فحصاً ائتمانياً آلياً قبل فتح الحساب، هل يجوز ذلك بحجة أنه ضروري لإبرام العقد؟
  - هل يُسمح بالقرار الآلي الكامل إذا كان لازماً لتنفيذ عقد مع العميل؟
  - احنا نقبل أو نرفض الاشتراكات أوتوماتيك حسب تقييم المخاطر وقت التسجيل، هل العقد يغطينا؟
- key: gdpr:art-22:para-2:pt-b
  text: e33c1546e346a870
  en:
  - Can we automate decisions if a national law requires us to, like automatic fraud screening a bank
    must do?
  - Does a legal requirement in an EU country let our software decide on users without human review?
  - What must a law contain before it can be relied on to allow automated decisions about people?
  ar:
  - هل يجوز لنا اتخاذ قرارات آلية إذا كان قانون وطني أو أوروبي يفرض ذلك على البنك مثل كشف الاحتيال؟
  - ما الشروط التي يجب أن يتضمنها القانون حتى يسمح بالقرارات الآلية بحق الأفراد؟
  - في قانون بالبلد يخلّيني أخلي النظام يقرر أوتوماتيك على الزبائن بدون بشر؟ وشو لازم يكون فيه؟
- key: gdpr:art-22:para-2:pt-c
  text: 2393852d1873d429
  en:
  - If a user ticks a box agreeing to automated decisions about them, can our app go ahead without human
    review?
  - Can we use an algorithm to decide on users if they gave explicit consent?
  - What kind of consent do we need to run solely automated profiling-based decisions in our app?
  ar:
  - إذا وافق المستخدم صراحةً على القرارات الآلية بشأنه، هل يمكن لتطبيقنا المضي دون مراجعة بشرية؟
  - ما نوع الموافقة المطلوبة لاعتماد قرارات آلية بالكامل مبنية على التحليل في خدمتنا؟
  - المستخدم ضغط موافق على إنه النظام يقرر عنه أوتوماتيك، يكفي هالشي؟
- key: gdpr:art-22:para-3
  text: c0ce9767af02d549
  en:
  - A customer wants a real person to review an automatic rejection by our system. Do we have to allow
    that?
  - What safeguards must we build into an automated decision flow, like an appeal button?
  - Do users have to be able to argue against and contest a decision our algorithm made based on their
    contract or consent?
  ar:
  - عميل يطلب أن يراجع موظف حقيقي قراراً آلياً صدر برفض طلبه، هل يلزمنا ذلك؟
  - ما الضمانات التي يجب إضافتها في نظام القرارات الآلية مثل زر الاعتراض أو الاستئناف؟
  - لازم نخلي المستخدم يقدر يعترض ويشرح وجهة نظره على قرار النظام الأوتوماتيكي؟
- key: gdpr:art-22:para-4
  text: 6622c41c2f68a90a
  en:
  - Can our automated decision system use health data or religion as inputs?
  - We want to use sensitive data like ethnicity or biometrics in an algorithm that approves users. Is
    that allowed?
  - When can automated decisions rely on special category data, such as with explicit consent?
  ar:
  - هل يجوز أن يعتمد نظام القرار الآلي لدينا على بيانات صحية أو دينية للمستخدمين؟
  - نرغب باستخدام بيانات حساسة مثل العرق أو البصمة الحيوية في خوارزمية قبول المستخدمين، هل ذلك مسموح؟
  - شو الشروط عشان القرار الأوتوماتيكي يستخدم بيانات حساسة زي الصحة؟
- key: gdpr:art-23:para-1
  text: 9edfa8b1959c90e3
  en:
  - Can a country's national law limit the access, deletion or transparency rights my app's users normally
    have over their data?
  - A government agency told us local law means we don't have to answer a user's data access request.
    When can a law actually take away those user rights?
  - What conditions must a law meet to narrow user privacy rights and breach notification duties, and
    does that also affect the profiling or data-minimisation principles?
  ar:
  - هل يحق لقانون وطني أن يقيّد حقوق مستخدمي تطبيقي في الاطلاع على بياناتهم أو حذفها؟
  - هل يجوز للدول الأعضاء تقييد التزامات الشفافية وإشعار الخرق بموجب تشريع، وبأي شروط يكون ذلك مشروعاً؟
  - جهة حكومية قالتلنا إن القانون المحلي يعفينا من الرد على طلب وصول لبيانات مستخدم، متى فعلاً يصير هالشي
    مسموح؟
- key: gdpr:art-23:para-1:pt-a
  text: d51dbaaf65aa27b9
  en:
  - Can a national security law let us refuse a user's request to see their data in our app?
  - Intelligence services asked us not to tell a user about data handling; is national security a valid
    ground to limit privacy rights?
  - Does protecting state security allow a country to override a customer's right to delete or access
    their data?
  ar:
  - هل يمكن لقانون الأمن القومي أن يعفيني من الرد على طلب مستخدم يريد الاطلاع على بياناته؟
  - هل الأمن الوطني سبب مشروع لتقييد حقوق الأشخاص في بياناتهم الشخصية؟
  - جاني طلب من جهة أمنية وقالوا لا تخبر المستخدم، هل الأمن القومي يبرر تقييد حقوقه؟
- key: gdpr:art-23:para-1:pt-b
  text: 25ea48ba98d0aa86
  en:
  - Can defence-related legislation limit users' data rights in a software product used by the military?
  - We build software for a defence contractor; can national defence needs restrict data subject rights?
  - Is defence a permitted reason for a law to cut back transparency or access obligations?
  ar:
  - هل يجوز تقييد حقوق أصحاب البيانات بقانون لأغراض الدفاع؟
  - نطور برنامج لمقاول دفاعي، هل تسمح متطلبات الدفاع الوطني بالحد من حقوق المستخدمين؟
  - شنو الحالات اللي الدفاع يكون فيها سبب لتقييد حقوق الخصوصية بقانون؟
- key: gdpr:art-23:para-1:pt-c
  text: 462b271d69cb43c8
  en:
  - Can a law restrict user data rights for public security reasons, like in a city surveillance app?
  - Is public safety a valid ground for limiting a person's right to know how their data is used?
  - Our platform handles emergency incident reports; may legislation limit data subject rights to protect
    public security?
  ar:
  - هل يجوز تقييد حقوق الأفراد في بياناتهم بقانون لحماية الأمن العام؟
  - تطبيقنا يتعامل مع بلاغات الطوارئ، هل السلامة العامة تبرر الحد من حق المستخدم في معرفة بياناته؟
  - هل الأمن العام يعتبر مبرر قانوني لتقييد التزامات الشفافية؟
- key: gdpr:art-23:para-1:pt-d
  text: 785b089e65708d3a
  en:
  - Police asked our app for user data; can a law let us skip telling the user or answering their access
    request during a criminal investigation?
  - Can data subject rights be limited to avoid tipping off a suspect in a fraud or crime investigation?
  - Does preventing and prosecuting crime count as a valid reason to restrict users' privacy rights?
  ar:
  - الشرطة طلبت بيانات مستخدم، هل يسمح القانون بتقييد حقه في معرفة ذلك أثناء التحقيق الجنائي؟
  - هل منع الجرائم والتحقيق فيها يعتبر سبباً لتقييد حقوق صاحب البيانات؟
  - في تحقيق بقضية احتيال، ممكن نرفض طلب المستخدم يشوف بياناته عشان ما ينكشف التحقيق؟
- key: gdpr:art-23:para-1:pt-e
  text: 9ed82de4955af2ba
  en:
  - Can tax or social security laws limit what users can ask about their data in our payroll or finance
    app?
  - Is public health or budgetary interest a valid reason for a country to restrict data subject rights?
  - A tax authority requires secrecy about its audits; can legislation restrict access rights for important
    economic or financial interests?
  ar:
  - هل يجوز تقييد حقوق المستخدمين بقانون لأسباب ضريبية أو مالية عامة؟
  - هل الصحة العامة أو الضمان الاجتماعي مبرر لتقييد حقوق الأفراد في بياناتهم؟
  - تطبيق الرواتب عندنا، هل ممكن قانون الضرائب يمنعنا من إعطاء الموظف بياناته المرتبطة بالتدقيق؟
- key: gdpr:art-23:para-1:pt-f
  text: afde2186c391e4c4
  en:
  - Can data rights be restricted to protect the independence of courts and ongoing court cases?
  - We provide a case management tool for courts; can a law limit users' access to data about judicial
    proceedings?
  - Does protecting judges and legal proceedings justify limiting transparency duties to data subjects?
  ar:
  - هل يمكن تقييد حقوق البيانات لحماية استقلال القضاء والإجراءات القضائية؟
  - نوفر نظام إدارة قضايا للمحاكم، هل يجوز لقانون الحد من اطلاع الأفراد على بيانات الدعاوى؟
  - هل حماية سير العدالة تبرر تقييد التزامات الشفافية تجاه أصحاب البيانات؟
- key: gdpr:art-23:para-1:pt-g
  text: c843c43de7dd0091
  en:
  - Can a professional body keep an ethics investigation secret from the doctor or lawyer by limiting
    their data access rights?
  - Our platform runs a licensing board's complaints; can law restrict data rights when investigating
    professional misconduct?
  - Is prosecuting ethics breaches in regulated professions a valid ground to restrict privacy rights?
  ar:
  - هل يجوز لهيئة مهنية تقييد حق طبيب أو محامٍ في الاطلاع على بياناته أثناء التحقيق في مخالفة أخلاقية؟
  - منصتنا تدير شكاوى نقابة مهنية، هل يسمح القانون بتقييد حقوق البيانات في قضايا سوء السلوك المهني؟
  - هل مخالفات أخلاقيات المهن المنظمة سبب لتقييد حقوق الخصوصية؟
- key: gdpr:art-23:para-1:pt-h
  text: 760d5343df046c7b
  en:
  - Can a regulator's inspection or audit function justify limiting data subject rights, even if it only
    happens occasionally?
  - We help a financial supervisor run inspections; can user rights be restricted for that oversight work?
  - Does a monitoring or inspection role linked to official authority allow restricting access and transparency
    rights?
  ar:
  - هل تبرر مهام الرقابة والتفتيش التابعة لسلطة رسمية تقييد حقوق أصحاب البيانات ولو كانت عرضية؟
  - نساعد جهة رقابية في عمليات التفتيش، هل يمكن تقييد حقوق المستخدمين لأجل ذلك؟
  - هل وظيفة المراقبة المرتبطة بالسلطة العامة تسمح للقانون بتقييد الحق في الوصول للبيانات؟
- key: gdpr:art-23:para-1:pt-i
  text: 103f4a748a0cffea
  en:
  - Can we hold back a user's data in an access request to protect another person's privacy, like a third
    party in a chat?
  - Is protecting the rights and freedoms of others a reason to limit a user's data rights?
  - A patient asked for their file but it reveals a vulnerable person's info; can the law restrict the
    request to protect them?
  ar:
  - هل حماية حقوق وحريات الآخرين سبب لتقييد حقوق صاحب البيانات؟
  - مريض طلب ملفه وفيه معلومات عن شخص آخر، هل القانون يسمح بتقييد الطلب لحمايته؟
- key: gdpr:art-23:para-1:pt-j
  text: f3a7ff6630271140
  en:
  - We're in a lawsuit with a customer; can they use a data access request to get evidence, or can the
    law restrict that?
  - Does enforcing civil claims, like debt collection, justify restricting a person's data rights?
  - Can legislation limit data subject rights so a company can pursue or defend a civil legal claim?
  ar:
  - عندنا قضية مدنية مع عميل، هل يجوز تقييد حقه في طلب بياناته حتى لا يستخدمه كوسيلة لجمع الأدلة؟
  - هل تنفيذ المطالبات المدنية مثل تحصيل الديون يبرر تقييد حقوق البيانات؟
  - هل يسمح القانون بتقييد حقوق الأفراد لحماية حق شركة في رفع دعوى مدنية أو الدفاع فيها؟
- key: gdpr:art-23:para-2
  text: d02b8b178325b32e
  en:
  - What must a law include when it restricts users' data rights, so it's not just a vague blanket exemption?
  - If a country passes a law limiting privacy rights, what details does it have to spell out?
  - How do I check whether a national restriction on data subject rights is properly drafted?
  ar:
  - ما الذي يجب أن يتضمنه التشريع الذي يقيّد حقوق البيانات حتى يكون صحيحاً؟
  - إذا أصدرت دولة قانوناً يحد من حقوق الخصوصية، ما التفاصيل التي يلزم أن يحددها؟
  - شنو لازم يكون موجود بالقانون اللي يقيّد حقوق المستخدمين عشان نعتبره سليم؟
- key: gdpr:art-23:para-2:pt-a
  text: 2f33083fa987ccda
  en:
  - Does a law restricting user rights have to say which kinds of processing or purposes it covers?
  - Must a restriction law name the specific processing activities it applies to, like fraud checks in
    our app?
  - How specific must the restriction be about why the data is processed?
  ar:
  - هل يجب أن يحدد القانون المقيِّد للحقوق أغراض المعالجة أو أنواعها التي يشملها؟
  - هل لازم القانون يذكر أنشطة المعالجة المحددة اللي ينطبق عليها التقييد؟
  - إلى أي مدى يلزم أن يوضح التشريع الغرض من معالجة البيانات المقيّدة؟
- key: gdpr:art-23:para-2:pt-b
  text: 52d765cd3e7722b2
  en:
  - Does a restriction law need to list which categories of personal data it affects?
  - Should the law say whether it applies to all user data or only certain types, like financial or location
    data?
  - How do I know which types of data a legal restriction on user rights covers?
  ar:
  - هل يجب أن يحدد القانون فئات البيانات الشخصية التي يشملها التقييد؟
  - هل لازم يوضح التشريع إذا كان التقييد على كل بيانات المستخدم ولا أنواع معينة مثل الموقع أو المالية؟
  - كيف أعرف أي أنواع البيانات يغطيها التقييد القانوني على الحقوق؟
- key: gdpr:art-23:para-2:pt-c
  text: b90241dbf8896c54
  en:
  - Does a law limiting user data rights have to define how far the restriction goes?
  - Which user rights are affected and how much, should that be stated in the restriction law?
  - Can a restriction be open-ended, or must it clearly set its scope?
  ar:
  - هل يلزم أن يحدد القانون نطاق التقييد الذي يفرضه على الحقوق؟
  - أي حقوق للمستخدم تتأثر وإلى أي حد، وهل يجب أن ينص القانون على ذلك؟
  - هل يجوز أن يكون التقييد مفتوحاً أم يجب تحديد نطاقه بوضوح؟
- key: gdpr:art-23:para-2:pt-d
  text: d91cb6f00a7e9f37
  en:
  - What protections against misuse or unlawful transfer must a law include when it restricts user rights?
  - Does a restriction law need safeguards to stop abuse of the data, like unauthorised access by officials?
  - If data is kept under a restriction, what security guarantees should the legislation require?
  ar:
  - ما الضمانات ضد إساءة الاستخدام أو النقل غير المشروع التي يجب أن يتضمنها قانون التقييد؟
  - هل يلزم أن ينص التشريع على حماية من الوصول غير المشروع للبيانات المقيّدة؟
  - إذا تم تقييد حقوق المستخدمين، شنو الضمانات اللي لازم القانون يفرضها لمنع التسريب أو سوء الاستخدام؟
- key: gdpr:art-23:para-2:pt-e
  text: eae2511b80771bda
  en:
  - Does a restriction law have to say which controllers or types of organisations it applies to?
  - Is it enough for a law to restrict rights generally, or must it name who the restriction binds, like
    banks or agencies?
  - How can I tell if my company is one of the controllers covered by a legal restriction?
  ar:
  - هل يجب أن يحدد قانون التقييد الجهات المسؤولة عن المعالجة التي ينطبق عليها؟
  - هل يكفي تقييد عام أم يلزم تسمية الجهات المشمولة مثل البنوك أو الجهات الحكومية؟
  - كيف أعرف إذا كانت شركتي من الجهات المشمولة بتقييد قانوني على الحقوق؟
- key: gdpr:art-23:para-2:pt-f
  text: 7a195b9a7826da54
  en:
  - Does a law restricting user rights have to set how long data may be stored?
  - Should retention periods and safeguards be spelled out when rights are limited?
  ar:
  - هل يجب أن يحدد قانون التقييد مدة تخزين البيانات؟
  - هل يجب بيان فترات الاحتفاظ والضمانات المصاحبة عند تقييد الحقوق؟
- key: gdpr:art-23:para-2:pt-g
  text: d6d702d9ba981dee
  en:
  - Must a restriction law address the risks it creates for people whose data is affected?
  - Does the legislation have to consider how the limit on rights could harm users?
  - Where a country limits privacy rights, is it required to assess the risk to individuals?
  ar:
  - هل يجب أن يتناول قانون التقييد المخاطر على حقوق وحريات أصحاب البيانات؟
  - هل على التشريع أن يراعي الضرر المحتمل على المستخدمين من تقييد حقوقهم؟
  - عند تقييد الحقوق، هل مطلوب تقدير المخاطر على الأفراد؟
- key: gdpr:art-23:para-2:pt-h
  text: 3e6b6f11e2b522cd
  en:
  - If a person's rights are restricted, do they still have the right to be told about it?
  - Can we hide from a user that their data rights are restricted, or only if telling them would harm
    the purpose?
  - When is it okay not to inform someone that their data is being handled under a restriction?
  ar:
  - إذا تم تقييد حقوق شخص، هل يبقى له الحق في أن يعرف بوجود هذا التقييد؟
  - هل يجوز إخفاء التقييد عن المستخدم أم فقط لو إخباره يضر بغرض التقييد؟
  - متى يجوز عدم إبلاغ الشخص بأن بياناته تُعالج ضمن تقييد؟
- key: gdpr:art-24:para-1
  text: ad591bb6f4caf5b1
  en:
  - We run an online shop that collects customer data; what security and organisational steps do we have
    to put in place, and do they depend on how risky our data use is?
  - How can my company prove to a regulator that our app handles personal data the way the rules require?
  - Do we need to revisit our privacy and security setup from time to time, or is it enough to set it
    up once at launch?
  ar:
  - ما الذي يجب على شركتنا فعله من إجراءات تقنية وتنظيمية لضمان أن معالجة بيانات عملاء تطبيقنا مطابقة
    للقانون، وكيف نثبت ذلك؟
  - هل يجب علينا مراجعة وتحديث إجراءات حماية البيانات في منتجنا بشكل دوري أم يكفي إعدادها مرة واحدة؟
  - شركتنا صغيرة وعندنا تطبيق بيجمع بيانات المستخدمين، شو لازم نسوي عشان نقدر نثبت للجهات الرقابية إننا
    ملتزمين؟
- key: gdpr:art-24:para-2
  text: 6e16e4298297107c
  en:
  - Does our startup need to write formal data protection policies, or is that only for big companies?
  - When is having a written privacy policy for internal data handling expected as part of our compliance
    measures?
  - We're a small clinic app with limited data processing; how much documented policy work is reasonable
    for us?
  ar:
  - هل يلزم شركتنا الناشئة أن تضع سياسات رسمية مكتوبة لحماية البيانات داخلياً؟
  - متى تكون سياسات حماية البيانات جزءاً مطلوباً من الإجراءات التي يجب أن نطبقها كمسؤول عن المعالجة؟
  - احنا شركة صغيرة ومعالجتنا للبيانات بسيطة، لازم نكتب سياسات حماية بيانات ولا بس للشركات الكبيرة؟
- key: gdpr:art-24:para-3
  text: b2a2311169927a67
  en:
  - Can following an approved industry code of conduct help us show that our app complies with data protection
    duties?
  - If our SaaS gets a recognised privacy certification, does that count as proof of compliance?
  - Does having a certification mean we're automatically compliant, or is it just one piece of evidence?
  ar:
  - هل يمكن أن يساعدنا الالتزام بمدونة سلوك معتمدة في إثبات امتثال منتجنا لواجبات حماية البيانات؟
  - إذا حصلت منصتنا على شهادة معتمدة في حماية الخصوصية، هل تُعتبر دليلاً على الامتثال؟
  - لو أخذنا شهادة خصوصية معتمدة، يعني خلاص نحن ملتزمين تلقائي ولا هي بس جزء من الإثبات؟
- key: gdpr:art-25:para-1
  text: 7fc478d7f0a4a753
  en:
  - We're designing a new signup flow for our app. Do we have to build privacy protections in from the
    start, and not just bolt them on later?
  - Does pseudonymising user data in our database count as a required safeguard, and how do we decide
    which technical measures are enough for our product?
  - Can the cost of implementing privacy controls or the size of our startup be a reason to skip them,
    or do we have to weigh them against the risk to users?
  ar:
  - كيف نطبق مبدأ الخصوصية من التصميم في تطبيقنا الجديد، وهل لازم نفكر فيها قبل ما نبدأ البرمجة؟
  - هل يلزمنا قانونياً أن نستخدم تقنيات مثل إخفاء الهوية المستعار وتقليل البيانات عند تصميم نظام المتجر
    الإلكتروني وأثناء تشغيله؟
  - شو لازم أسوي كمدير منتج عشان أضمن إن التطبيق يحمي بيانات المستخدمين من أول يوم؟ وهل التكلفة تعتبر
    عذر؟
- key: gdpr:art-25:para-2
  text: 080df5def9ed31e9
  en:
  - In our app's settings, should the most privacy-friendly options be on by default, so users don't have
    to change anything?
  - Do we have to limit how much data our signup form collects and how long we keep it unless it's really
    needed for the feature?
  - Our users' profiles are public as soon as they register. Is that allowed, or must profiles stay private
    until the user chooses to share them?
  ar:
  - هل يجب أن تكون الإعدادات الافتراضية في تطبيقنا هي الأكثر حماية للخصوصية بحيث لا يضطر المستخدم لتغيير
    شيء؟
  - هل يُلزم النظام بجمع الحد الأدنى فقط من البيانات في نموذج التسجيل وتحديد مدة الاحتفاظ بها وحصر من
    يستطيع الوصول إليها؟
  - يعني لازم الملفات الشخصية تكون مو ظاهرة للكل تلقائي لين المستخدم يقرر ينشرها؟ ولا عادي نخليها عامة
    من البداية؟
- key: gdpr:art-25:para-3
  text: 32f4cd1dd77d5a7c
  en:
  - Can getting an approved privacy certification help us prove to a regulator that our product follows
    privacy by design and default?
  - Is a certification enough evidence that our app meets the built-in privacy and default settings requirements?
  - We're thinking of certifying our SaaS platform. Would that count toward showing we handle data minimisation
    and default settings properly?
  ar:
  - هل يمكن استخدام شهادة اعتماد معتمدة لإثبات امتثال منتجنا لمتطلبات الخصوصية من التصميم وبشكل افتراضي؟
  - هل تكفي شهادة الاعتماد كدليل أمام الجهة الرقابية على أن تطبيقنا يلتزم بالإعدادات الافتراضية الحامية
    للبيانات؟
  - لو حصلنا على شهادة خصوصية معتمدة لمنصتنا، هل تنفعنا كإثبات إننا ملتزمين بالحماية من التصميم؟
- key: gdpr:art-26:para-1
  text: 6d113c4bdd3d6477
  en:
  - We run a shared loyalty program with a partner company and we both decide what customer data to collect
    and why. Does that make us joint controllers, and what do we have to agree between us?
  - Who handles privacy requests and the privacy notice information when two businesses run one app together?
    Do we need a written deal about it?
  - Can we name a single contact point for users in our agreement with the co-owner of the platform?
  ar:
  - نحن وشركة شريكة نشغّل برنامج ولاء مشترك ونقرر معًا ما البيانات التي نجمعها ولماذا؛ هل نُعد مسؤولي
    معالجة مشتركين وما الذي يجب أن نتفق عليه فيما بيننا؟
  - هل يلزم وجود اتفاق شفاف بين جهتين تديران تطبيقًا واحدًا لتحديد من يتولى طلبات أصحاب البيانات وواجب
    إبلاغهم بكيفية استخدام بياناتهم؟
  - احنا وشركة ثانية مشاركين في تطبيق واحد ونقرر سوا شو نسوي بالبيانات، لازم نكتب اتفاق يوزع المسؤوليات؟
    وهل نقدر نحدد جهة اتصال وحدة للمستخدمين؟
- key: gdpr:art-26:para-2
  text: b7a84a2b0db90eae
  en:
  - Our agreement with a co-controller splits duties between us. Does it have to match how we actually
    deal with users, and do users get to see it?
  - A customer asks to see the data-sharing deal between our shop and the partner platform. Do we have
    to show them the whole contract?
  - Do we need to publish a summary of who is responsible for what when two companies process user data
    together?
  ar:
  - اتفاقنا مع الشريك في تحديد المسؤوليات يجب أن يعكس دور كل طرف الحقيقي تجاه المستخدمين، وهل يحق للمستخدم
    الاطلاع عليه؟
  - عميل طلب الاطلاع على اتفاق مشاركة البيانات بين متجرنا والمنصة الشريكة، هل يلزمنا أن نعطيه العقد كاملًا
    أم جوهره فقط؟
  - هل لازم ننشر للمستخدمين ملخص عن مين مسؤول عن شو لما شركتين تعالجان بياناتهم مع بعض؟
- key: gdpr:art-26:para-3
  text: c1beaccfc31afff9
  en:
  - Our contract with the partner says they handle all user data requests. Can a user still come to us
    to delete their data?
  - If a user complains about a jointly run service, can they pick which company to go after, even if
    our agreement says only one is responsible?
  - Does the split of duties in our co-controller deal limit what users can demand from each of us?
  ar:
  - العقد مع شريكنا ينص على أنه هو من يتولى طلبات المستخدمين، فهل يستطيع المستخدم مع ذلك أن يطلب منا حذف
    بياناته؟
  - إذا اشتكى مستخدم من خدمة نديرها بالاشتراك مع شركة أخرى، هل له أن يختار الجهة التي يمارس حقوقه ضدها
    رغم ما ورد في الاتفاق بيننا؟
  - المستخدم قدم طلب علينا بس اتفاقنا مع الشريك يقول إنه مسؤول عنه هو، هل نقدر نرفض ونحوله عليه؟
- key: gdpr:art-27:para-1
  text: 53bd1a50db93b8aa
  en:
  - Our SaaS company is based in the US but sells subscriptions to customers in France and Germany. Do
    we need to appoint someone in the EU?
  - Do I have to name a local EU representative in writing if my app targets European users from outside
    Europe?
  - Does a non-EU company that processes data for EU users on behalf of another business also need an
    EU rep?
  ar:
  - شركتنا مسجلة خارج أوروبا ونبيع تطبيقنا لمستخدمين في دول الاتحاد الأوروبي، هل يلزمنا تعيين ممثل داخل
    الاتحاد كتابياً؟
  - هل يجب على المتحكم أو المعالج غير المقيم في الاتحاد الأوروبي أن يعيّن ممثلاً له بموجب تعيين مكتوب؟
  - عندنا متجر أونلاين برا أوروبا وزباينه أوروبيين، لازم نحط ممثل بأوروبا ولا لا؟
- key: gdpr:art-27:para-2
  text: 8ffce9ebf3ac08e7
  en:
  - Are there any cases where a company outside the EU doesn't have to appoint an EU representative?
  - We're a non-EU startup, can we skip appointing a representative in Europe, and when?
  - Which kinds of organizations are exempt from the requirement to have an EU rep?
  ar:
  - ما هي الحالات التي يُعفى فيها الكيان غير المقيم في الاتحاد الأوروبي من تعيين ممثل؟
  - نحن شركة ناشئة خارج أوروبا، هل في استثناءات تخلينا ما نعيّن ممثل في الاتحاد؟
  - مين اللي ما يحتاج يعين ممثل بأوروبا؟ في حالات معفية؟
- key: gdpr:art-27:para-2:pt-a
  text: e3425dbae0ac7222
  en:
  - We rarely handle EU users' data, only a few one-off cases and nothing sensitive. Can we skip having
    an EU representative?
  - Does a non-EU clinic app processing health data of many European patients still need a representative?
  - How do I judge whether our occasional processing of EU residents' data is low-risk enough to avoid
    appointing an EU rep?
  ar:
  - نادراً ما نعالج بيانات مستخدمين أوروبيين وبشكل عرضي ولا توجد بيانات حساسة، هل نُعفى من تعيين ممثل؟
  - تطبيق عيادة خارج الاتحاد يعالج بيانات صحية لعدد كبير من الأوروبيين، هل ما زال ملزماً بتعيين ممثل؟
  - احنا بس أحياناً نتعامل مع داتا ناس من أوروبا ومافي داتا حساسة، يعني نقدر نتجنب تعيين ممثل؟
- key: gdpr:art-27:para-2:pt-b
  text: 090e7fe7ace4c599
  en:
  - We're a foreign government agency offering an online service to EU residents. Do we need an EU representative?
  - Is a public body outside the EU exempt from appointing a representative in the Union?
  - Does the exemption for public authorities apply to a state-run school platform used by European students?
  ar:
  - نحن جهة حكومية خارج أوروبا نقدم خدمة إلكترونية لمقيمين في الاتحاد، هل علينا تعيين ممثل؟
  - هل تُعفى السلطة أو الهيئة العامة من واجب تعيين ممثل في الاتحاد الأوروبي؟
  - احنا مؤسسة حكومية وعندنا منصة يستخدمها ناس بأوروبا، لازم نعين ممثل؟
- key: gdpr:art-27:para-3
  text: 62e550a30cb05108
  en:
  - Which EU country should our representative be located in?
  - Our app has users in Spain, Italy and Poland. Can our representative be based in just one of those
    countries?
  - Does the EU rep have to be in the same country where our customers are being tracked or sold to?
  ar:
  - في أي دولة من دول الاتحاد يجب أن يكون مقر الممثل الذي نعيّنه؟
  - تطبيقنا له مستخدمون في إسبانيا وإيطاليا وبولندا، هل يكفي ممثل في دولة واحدة منها؟
  - وين لازم يكون مكان الممثل تبعنا بأوروبا؟ لازم يكون بنفس بلد زباينا؟
- key: gdpr:art-27:para-4
  text: f58472358540dabc
  en:
  - What authority does an EU representative need to have so regulators and users can contact them instead
    of us?
  - A user in Europe emailed our appointed rep with a data request. Is the rep allowed to handle it for
    us?
  - Can a data protection authority deal directly with our EU representative rather than our headquarters?
  ar:
  - ما الصلاحيات التي يجب أن يمنحها المتحكم لممثله ليخاطبه المستخدمون والسلطات الرقابية بدلاً منه؟
  - مستخدم أوروبي راسل ممثلنا في الاتحاد بخصوص بياناته، هل يحق للممثل التعامل مع الطلب نيابة عنا؟
  - هل تقدر الجهة الرقابية تتواصل مع الممثل بدالنا أو معنا مباشرة؟ شو صلاحية الممثل؟
- key: gdpr:art-27:para-5
  text: 80fb6896dfa0a046
  en:
  - If we hire an EU representative, can regulators still take action against our company directly?
  - Does appointing a local rep shield us from lawsuits or fines in Europe?
  - Can a user sue our company itself even though we have an EU representative?
  ar:
  - إذا عيّنا ممثلاً في الاتحاد الأوروبي، هل يمكن مع ذلك رفع دعاوى أو اتخاذ إجراءات ضد شركتنا نفسها؟
  - هل تعيين ممثل محلي يحمينا من المسؤولية والغرامات في أوروبا؟
  - عيّنا ممثل بأوروبا، بس لسا ممكن أي مستخدم يرفع علينا قضية احنا مباشرة؟
- key: gdpr:art-28:para-1
  text: c9da576c281b621f
  en:
  - We're a startup picking a cloud vendor to handle our customers' personal data. What do we need to
    check about them before hiring?
  - Do I have to vet a third-party service that processes user data for my app, or can I just sign up
    with any provider?
  ar:
  - ما الواجب على الجهة المتحكمة التحقق منه في الجهة التي تعالج البيانات الشخصية نيابةً عنها قبل التعاقد
    معها؟
  - هل يجوز لي اختيار أي مزود خدمة لمعالجة بيانات عملائي أم يجب أن يقدم ضمانات كافية؟
  - شو لازم أتأكد منه في الشركة اللي رح تستضيف بيانات مستخدمين تطبيقي قبل ما أشتغل معها؟
- key: gdpr:art-28:para-2
  text: 88bb84c0cbc5ec66
  en:
  - Our SaaS vendor wants to use a new sub-contractor for hosting. Do they need our permission first?
  - As a processor, can I bring in another company to help process client data without telling the client?
  - We gave a general OK for sub-processors. Does the vendor still have to tell us when they swap one
    out, and can we say no?
  ar:
  - هل يحق لمعالج البيانات الاستعانة بمعالج فرعي دون إذن كتابي من الجهة المتحكمة؟
  - إذا أعطيت موافقة عامة على المعالجين الفرعيين، هل على المزود إبلاغي عند إضافة أو استبدال أحدهم وهل
    أستطيع الاعتراض؟
  - مزود الخدمة غيّر شركة الاستضافة اللي يشتغل معها بدون ما يخبرني، هذا مسموح؟
- key: gdpr:art-28:para-3
  text: 85296f9bcb57018e
  en:
  - What must a data processing agreement with my software vendor cover?
  - We're signing up a payment or email service that handles our users' data. What has to be in the contract
    with them?
  - Can we just rely on a handshake or terms of service with our processor, or is a binding contract required
    describing what data and for how long?
  ar:
  - ما الذي يجب أن يتضمنه عقد معالجة البيانات بين الجهة المتحكمة والمعالج؟
  - نبي نتعاقد مع شركة ترسل إيميلات لعملائنا، شنو لازم يكون مكتوب في العقد معاها عن البيانات؟
  - هل يكفي اتفاق شفهي مع مزود الخدمة أم يلزم عقد ملزم يحدد موضوع المعالجة ومدتها وأنواع البيانات؟
- key: gdpr:art-28:para-3:pt-a
  text: 413130610ebf733e
  en:
  - Can our vendor use the customer data we send them for their own purposes, or only as we tell them?
  - Our processor wants to move our users' data to servers in another country. Can they do that without
    our instruction?
  - What if a law forces the processor to hand over or use our data in a way we didn't instruct? Do they
    need to tell us?
  ar:
  - هل يجوز للمعالج استخدام البيانات حسب رغبته أم فقط بناءً على تعليمات موثقة من الجهة المتحكمة؟
  - هل يستطيع مزود الخدمة نقل بيانات مستخدمينا إلى بلد آخر بدون تعليماتنا؟
  - المزود يقول إن القانون أجبره يستخدم بياناتنا، هل لازم يخبرنا قبل؟
- key: gdpr:art-28:para-3:pt-b
  text: ced0a0938173449f
  en:
  - Do the employees of our vendor who access our user data have to sign NDAs?
  - Does a processor need to make sure its staff keep personal data confidential?
  - We're a small contractor handling client data. Must our team members be bound by confidentiality?
  ar:
  - هل يجب أن يلتزم موظفو المعالج الذين يصلون إلى البيانات الشخصية بالسرية؟
  - وش المطلوب من الشركة المعالجة بخصوص تعهد موظفيها بسرية بيانات العملاء؟
  - هل يلزم أن يوقّع العاملون لدى مزود الخدمة اتفاقية سرية قبل الوصول للبيانات؟
- key: gdpr:art-28:para-3:pt-c
  text: c31dded3fbafeb7d
  en:
  - Is the vendor handling our data responsible for security measures like encryption and access control?
  - Does the processor contract have to require the vendor to secure the data?
  - As a hosting provider for client apps, what security obligations must we commit to in the contract?
  ar:
  - هل يجب على المعالج اتخاذ إجراءات الأمن اللازمة مثل التشفير والتحكم بالوصول بموجب العقد؟
  - شو التزامات الأمان اللي لازم يتعهد فيها مزود الخدمة اللي يخزن بيانات عملائنا؟
  - هل ينص عقد المعالجة على التزام المعالج بتأمين البيانات؟
- key: gdpr:art-28:para-3:pt-d
  text: a81382bb9acb53d6
  en:
  - Does our processor's contract have to say they'll follow the rules when they hire sub-processors?
  - If I'm a vendor who wants to use a sub-contractor, what conditions must I commit to following?
  - Can a processor's contract be silent about subcontracting?
  ar:
  - هل يجب أن يتعهد المعالج في العقد باحترام شروط الاستعانة بمعالج فرعي؟
  - أنا مزود خدمة وأبي أستعين بمقاول من الباطن، أي شروط لازم ألتزم فيها حسب العقد؟
  - هل يمكن أن يسكت عقد المعالجة عن موضوع المعالجين الفرعيين؟
- key: gdpr:art-28:para-3:pt-e
  text: 283dd492a34bcf49
  en:
  - A user asked us to export or delete their data, but it sits with our vendor. Must the vendor help
    us respond?
  - Does our processor have to help us handle data access and erasure requests from users?
  - What should a contract say about the vendor supporting us when customers exercise their privacy rights?
  ar:
  - مستخدم طلب حذف بياناته وهي عند مزود الخدمة، هل يلزم المزود مساعدتنا في الاستجابة؟
  - هل على المعالج مساعدة الجهة المتحكمة في الرد على طلبات أصحاب البيانات مثل الاطلاع والمحو؟
  - لو عميل طلب نسخة من بياناته، المزود لازم يساعدنا نجهزها؟
- key: gdpr:art-28:para-3:pt-f
  text: 3f7fedbabc346c6a
  en:
  - We had a data breach at our vendor. Do they have to help us with notification and impact assessments?
  - Must the processor assist us with security, breach reporting and DPIAs?
  - Is the vendor required to give us the info we need for a risk assessment on a new feature?
  ar:
  - حصل اختراق عند المزود، هل يلزمه مساعدتنا في الإبلاغ وتقييم الأثر؟
  - هل على المعالج مساعدة المتحكم في الالتزامات المتعلقة بالأمن والإخطار بالخروقات وتقييم الأثر؟
  - نحتاج معلومات من مزود الخدمة لعمل تقييم المخاطر لميزة جديدة، هل هو ملزم يعطينا؟
- key: gdpr:art-28:para-3:pt-g
  text: 4a27ec1d2702f8e8
  en:
  - We're ending our contract with a SaaS vendor. What happens to our customers' data they hold?
  - Can we require the processor to give back or delete all our data when the service ends?
  - Does the vendor have to wipe backup copies after we cancel, or can they keep them?
  ar:
  - سننهي عقدنا مع مزود خدمة، ماذا يجب أن يفعل ببيانات عملائنا لديه؟
  - هل نستطيع إلزام المعالج بإرجاع أو حذف كل البيانات عند انتهاء الخدمة؟
  - بعد ما ألغيت الاشتراك، المزود لازم يمسح النسخ الاحتياطية ولا يقدر يحتفظ فيها؟
- key: gdpr:art-28:para-3:pt-h
  text: d003c7ea7d3b2f51
  en:
  - Can we audit our cloud vendor to check they handle our users' data properly?
  - Does the processor have to give us proof of compliance when we ask?
  - A client wants to send an auditor to inspect our systems because we process their data. Can we refuse?
  ar:
  - هل يحق لنا تدقيق مزود الخدمة للتأكد من التزامه بحماية البيانات؟
  - هل يلزم المعالج تزويد الجهة المتحكمة بالمعلومات التي تثبت امتثاله؟
  - عميلنا يبي يرسل مدقق يفحص أنظمتنا لأننا نعالج بياناته، نقدر نرفض؟
- key: gdpr:art-28:para-3:sub-2
  text: 875749d78fef376d
  en:
  - Our client told us to do something with their data that looks illegal. What should we do as the processor?
  - Does a processor need to speak up if the customer's instructions break privacy law?
  - If the company we work for asks us to process data in a way that seems non-compliant, do we just follow
    along?
  ar:
  - العميل طلب منا معالجة بياناته بطريقة تبدو مخالفة للقانون، ماذا يجب أن نفعل كمعالج؟
  - هل على المعالج إبلاغ المتحكم فوراً إذا رأى أن تعليماته تخالف قانون حماية البيانات؟
  - الشركة اللي نشتغل لها طلبت شي يخالف الخصوصية، نمشي معاها ولا ننبهها؟
- key: gdpr:art-28:para-4
  text: 42ee4f2a4ccc7f43
  en:
  - We're a processor and hired a subcontractor. What must our contract with them say?
  - If our sub-processor leaks data, are we still responsible to our client?
  - Do the same data protection terms we agreed with our customer have to be passed down to our own vendors?
  ar:
  - استعنت بمعالج فرعي، ما الالتزامات التي يجب أن أفرضها عليه في العقد؟
  - إذا أخل المعالج الفرعي بالتزاماته، هل أبقى مسؤولاً أمام العميل؟
  - لو المقاول من الباطن سرّب بيانات، أنا اللي أتحمل المسؤولية قدام عميلي؟
- key: gdpr:art-28:para-5
  text: d1eb07e065c9c159
  en:
  - Does having an ISO or approved certification help prove our vendor is trustworthy for data protection?
  - Can a processor use an approved code of conduct to show it gives sufficient guarantees?
  - Is a privacy certification enough to satisfy vendor due diligence?
  ar:
  - هل تساعد شهادة اعتماد أو مدونة سلوك معتمدة في إثبات تقديم المعالج ضمانات كافية؟
  - نحن مزود خدمة، هل الحصول على شهادة خصوصية يكفي لإقناع العملاء بأننا نحمي البيانات؟
  - هل الالتزام بمدونة سلوك معتمدة يثبت أن المعالج جدير بالثقة؟
- key: gdpr:art-28:para-6
  text: bd83d1d1a1512991
  en:
  - Can we use standard template clauses instead of drafting a custom data processing agreement?
  - Is it OK to base our processor contract on pre-approved standard clauses?
  - Can we add our own terms on top of standard contractual clauses for vendors?
  ar:
  - هل يمكننا الاعتماد على بنود تعاقدية نموذجية بدلاً من صياغة عقد معالجة مخصص؟
  - هل يجوز أن يستند عقد المعالج كلياً أو جزئياً إلى البنود القياسية؟
  - ممكن نستخدم قالب جاهز للعقد مع المزود ونضيف عليه شروطنا؟
- key: gdpr:art-28:para-7
  text: 6958ca3604030ce4
  en:
  - Who can publish standard contractual clauses between controllers and processors at EU level?
  - Can the European Commission issue ready-made contract terms for vendor data processing?
  ar:
  - من يملك صلاحية وضع بنود تعاقدية قياسية بين المتحكم والمعالج على مستوى الاتحاد؟
- key: gdpr:art-28:para-8
  text: 2ad632ce0acdf8a1
  en:
  - Can a national data protection authority publish its own template processor contract?
  - Can a supervisory authority adopt standard clauses for data processing agreements?
  ar:
  - هل يمكن لسلطة حماية البيانات الوطنية إصدار بنود تعاقدية نموذجية لعقود المعالجة؟
  - هل تملك السلطة الإشرافية اعتماد بنود قياسية بآلية الاتساق؟
- key: gdpr:art-28:para-9
  text: 7bfce1e9b7e53fb4
  en:
  - Does our data processing agreement have to be on paper, or is a click-through online contract fine?
  - Can we sign a processor contract electronically?
  - Is a verbal agreement with my vendor enough for data processing?
  ar:
  - هل يجب أن يكون عقد معالجة البيانات مكتوباً أم يكفي توقيعه إلكترونياً؟
  - هل يصح إبرام عقد المعالج عبر الإنترنت بالموافقة الإلكترونية؟
  - الاتفاق الشفهي مع المزود يكفي لمعالجة البيانات ولا لازم كتابة؟
- key: gdpr:art-28:para-10
  text: 2844ddf1c06b52a8
  en:
  - Our vendor started using our customer data for its own ad targeting. Does it become responsible as
    a controller?
  - What happens if a processor decides on its own why and how to use the data it was given?
  - As a service provider, if we go beyond the client's instructions and use their data for our own product,
    what's our status?
  ar:
  - مزود الخدمة بدأ يستخدم بيانات عملائنا لأغراضه الإعلانية، هل يصبح متحكماً؟
  - ماذا يحدث إذا حدد المعالج بنفسه أغراض ووسائل المعالجة بمخالفة اللائحة؟
  - إذا تجاوزنا تعليمات العميل واستخدمنا بياناته لمنتجنا الخاص، هل نعتبر مسؤولين كمتحكم؟
- key: gdpr:art-29
  text: 67ce1f2da3c2f9bf
  en:
  - We host a client's customer data in our SaaS as their vendor. Can my engineers use that data for our
    own analytics or to train our models without the client telling us to?
  - Can a contractor or employee who has database access to user data do whatever they want with it, or
    only what the company that owns the data has asked for?
  - A client's marketing team asked our support staff to export user data for a purpose that isn't in
    our contract. Should we do it, or is there a rule that we only act on instructions?
  ar:
  - بصفتنا مزود خدمة نستضيف بيانات عملاء شركة أخرى، هل يجوز لفريقنا استخدام هذه البيانات لأغراضنا الخاصة
    أو لتدريب نماذجنا دون تعليمات من الشركة صاحبة البيانات؟
  - هل يحق للموظف أو المتعاقد الذي يملك صلاحية الوصول إلى البيانات الشخصية معالجتها كما يشاء، أم أن عليه
    الالتزام بتعليمات الجهة المسؤولة عن البيانات فقط؟
  - شركة عميلة طلبت منا نسخة من بيانات المستخدمين لغرض ما مذكور في العقد، هل نقدر نعالج البيانات بدون
    تعليماتها ولا إلا بتعليمات منها؟ وش الاستثناء؟
- key: gdpr:art-30:para-1
  text: 37fd0ea08ec80dd6
  en:
  - Do we have to keep an internal register of all the ways our app uses personal data?
  - We're a SaaS company acting as the data owner for our customers' users. What documentation about our
    data use must we maintain ourselves?
  - If our company has an EU representative, do they also need to keep a log of our data handling activities?
  ar:
  - هل يجب على شركتنا الاحتفاظ بسجل داخلي لكل أنشطة معالجة البيانات الشخصية في تطبيقنا؟
  - بصفتنا الجهة المسؤولة عن بيانات مستخدمي المتجر الإلكتروني، ما المعلومات التي يجب أن يحتويها سجل أنشطة
    المعالجة لدينا؟
  - شركتنا عندها ممثل في أوروبا، هل لازم هو كمان يحتفظ بسجل لأنشطة معالجة البيانات؟
- key: gdpr:art-30:para-1:pt-a
  text: 55ea70ade65dd087
  en:
  - Whose contact details go in our data processing register, like a DPO or a co-owner of the data?
  - We run a shared customer database with a partner company. Do we list them in our processing log?
  - Do I have to put our data protection officer's name and email in the register of processing?
  ar:
  - ما بيانات الاتصال التي يجب إدراجها في سجل المعالجة، مثل مسؤول حماية البيانات والمسؤول المشترك؟
  - نحن نشارك قاعدة بيانات العملاء مع شركة شريكة، هل نذكرها في سجل أنشطة المعالجة؟
  - لازم أكتب اسم وإيميل مسؤول حماية البيانات عندنا في سجل المعالجة؟
- key: gdpr:art-30:para-1:pt-b
  text: 7398d2affad4e69c
  en:
  - Do I need to write down why we collect each type of user data in our processing register?
  - Our clinic app collects patient info for appointments and billing. Should each reason be recorded
    in the register?
  - What do I put in the purposes field of our data processing log?
  ar:
  - هل يجب أن أدوّن سبب جمع كل نوع من بيانات المستخدمين في سجل المعالجة؟
  - تطبيق عيادتنا يجمع بيانات المرضى للمواعيد والفواتير، هل نسجل كل غرض في السجل؟
  - شو لازم أكتب في خانة الغرض من المعالجة بسجل البيانات؟
- key: gdpr:art-30:para-1:pt-c
  text: 17103e49e1f0cc96
  en:
  - Should our processing register list the types of people whose data we hold, like customers, employees
    and students?
  - Do we have to list data types like emails, location and payment info in the record of processing?
  - How detailed must the categories of users and data be in our internal data register?
  ar:
  - هل يجب أن يتضمن سجل المعالجة فئات الأشخاص أصحاب البيانات مثل العملاء والموظفين والطلاب؟
  - هل نذكر أنواع البيانات مثل البريد الإلكتروني والموقع ومعلومات الدفع في سجل المعالجة؟
  - لازم نفصّل أنواع المستخدمين وأنواع البيانات في سجل البيانات الداخلي؟
- key: gdpr:art-30:para-1:pt-d
  text: 855f4b2cdfea2ffa
  en:
  - We share user data with an analytics vendor and a payment provider. Do they have to be listed in our
    processing register?
  - Do I need to record recipients located outside the EU, like a US cloud host, in our register?
  - Should the register name who gets the data, or just the types of recipients?
  ar:
  - نشارك بيانات المستخدمين مع مزود تحليلات ومزود دفع، هل يجب ذكرهم في سجل المعالجة؟
  - هل أسجل الجهات المستلمة خارج الاتحاد الأوروبي مثل استضافة سحابية أمريكية في السجل؟
  - هل يكفي ذكر فئات الجهات اللي تستلم البيانات في السجل ولا لازم أسماءها؟
- key: gdpr:art-30:para-1:pt-e
  text: 7766ac5c9f2dad9b
  en:
  - Our app sends user data to servers in another country. What must we record about that in our register?
  - Do we need to document safeguards for international data transfers in our processing log?
  - If we never send personal data outside the EU, do we still need to fill in a transfers section?
  ar:
  - تطبيقنا يرسل بيانات المستخدمين إلى خوادم في دولة أخرى، ماذا يجب تسجيله عن ذلك في السجل؟
  - هل يجب توثيق ضمانات نقل البيانات الدولي في سجل المعالجة؟
  - إذا ما ننقل بيانات خارج أوروبا، هل لازم نعبي قسم التحويلات بالسجل؟
- key: gdpr:art-30:para-1:pt-f
  text: ed1526aed90dca17
  en:
  - Do I have to note how long we keep each kind of user data in the processing register?
  - What retention periods should be written in our record of processing activities?
  - We don't have a fixed deletion schedule yet. Do we still need to put deletion timelines in the register?
  ar:
  - هل يجب أن أذكر مدة الاحتفاظ بكل نوع من بيانات المستخدمين في سجل المعالجة؟
  - ما فترات الاحتفاظ التي ينبغي كتابتها في سجل أنشطة المعالجة؟
  - ما عندنا جدول حذف ثابت للبيانات لسا، هل نكتب مواعيد الحذف بالسجل برضو؟
- key: gdpr:art-30:para-1:pt-g
  text: bd026f19cbb9c143
  en:
  - Should our processing register describe our security setup, like encryption and access controls?
  - How much detail about security measures goes into the record of processing?
  - Do I have to list our security practices in the data register if I can't give every detail?
  ar:
  - هل يجب أن يصف سجل المعالجة إجراءاتنا الأمنية مثل التشفير وضوابط الوصول؟
  - ما مقدار التفصيل المطلوب عن الإجراءات الأمنية في سجل المعالجة؟
  - لازم أكتب ممارسات الأمان عندنا بالسجل حتى لو ما قدرت أعطي كل التفاصيل؟
- key: gdpr:art-30:para-2
  text: 384a2657a7214ed1
  en:
  - We're a software vendor that processes data for client companies. Do we need our own processing register?
  - As a payroll outsourcing service, what records must we keep about the work we do for each client?
  - Does a hosting or cloud provider have to log what processing it does on behalf of customers?
  ar:
  - نحن شركة برمجيات نعالج بيانات لصالح شركات عملاء، هل يلزمنا سجل معالجة خاص بنا؟
  - بصفتنا مزود خدمة رواتب خارجي، ما السجلات التي يجب أن نحتفظ بها عن العمل لكل عميل؟
  - هل على مزود الاستضافة السحابية تسجيل أنشطة المعالجة التي يقوم بها نيابة عن عملائه؟
- key: gdpr:art-30:para-2:pt-a
  text: 332a94cf35dad367
  en:
  - As a processor, whose names and contacts go in our register, including each client we work for?
  - Do we list every client company and their DPO in our service provider processing log?
  - Do we need to put our own DPO and EU representative contacts in the processor record?
  ar:
  - بصفتنا معالج بيانات، أي أسماء وبيانات اتصال يجب إدراجها في السجل بما فيها كل عميل نعمل لصالحه؟
  - هل نذكر كل شركة عميلة ومسؤول حماية البيانات لديها في سجل مزود الخدمة؟
  - لازم نحط بيانات مسؤول الحماية وممثلنا الأوروبي في سجل المعالج؟
- key: gdpr:art-30:para-2:pt-b
  text: cacd8582451b614d
  en:
  - What do we write about the kinds of processing we do for each customer in our processor register?
  - We run email sending and backups for several clients. Should each client's processing types be separately
    recorded?
  - Do I describe the categories of processing per client in the vendor's record?
  ar:
  - ماذا نكتب عن أنواع المعالجة التي نقوم بها لكل عميل في سجل المعالج؟
  - نقدم خدمة إرسال البريد والنسخ الاحتياطي لعدة عملاء، هل نسجل أنواع المعالجة لكل عميل على حدة؟
  - هل أصف فئات المعالجة لكل عميل في سجل مزود الخدمة؟
- key: gdpr:art-30:para-2:pt-c
  text: 7766ac5c9f2dad9b
  en:
  - Our company processes client data and stores it on servers abroad. What must the processor's register
    say about that?
  - Do service providers have to document international transfer safeguards in their own records?
  - Do we need to name the foreign country where we send client data in our processor log?
  ar:
  - شركتنا تعالج بيانات العملاء وتخزنها على خوادم بالخارج، ماذا يجب أن يذكر سجل المعالج عن ذلك؟
  - هل على مزودي الخدمة توثيق ضمانات النقل الدولي في سجلاتهم؟
  - لازم نسمّي الدولة الأجنبية اللي نرسل لها بيانات العملاء في سجل المعالج؟
- key: gdpr:art-30:para-2:pt-d
  text: bd026f19cbb9c143
  en:
  - Does a processor need to describe its security measures in its register?
  - What security information should a SaaS vendor put in its record of processing for clients?
  - Do we need to write our encryption and backup practices in the processor's record?
  ar:
  - هل يجب على المعالج وصف إجراءاته الأمنية في سجله؟
  - ما معلومات الأمان التي ينبغي لمزود SaaS تضمينها في سجل المعالجة لعملائه؟
  - لازم نكتب ممارسات التشفير والنسخ الاحتياطي في سجل المعالج؟
- key: gdpr:art-30:para-3
  text: 11b02f706e1421d1
  en:
  - Can our processing register just be a spreadsheet or does it need to be on paper?
  - Is an electronic file acceptable for the record of processing activities?
  - Does keeping our data processing inventory in a Notion or Excel doc count as a written record?
  ar:
  - هل يمكن أن يكون سجل المعالجة مجرد جدول إكسل أم يلزم أن يكون ورقيًا؟
  - هل الملف الإلكتروني مقبول كسجل لأنشطة المعالجة؟
  - لو خلينا سجل المعالجة في Notion أو إكسل، يعتبر سجل مكتوب؟
- key: gdpr:art-30:para-4
  text: 17d4710260da5099
  en:
  - A data protection regulator emailed asking to see our processing records. Do we have to hand them
    over?
  - Who can demand to see our register of data processing, and when?
  - As a vendor, must we give our processing log to the authority if they ask?
  ar:
  - راسلتنا جهة حماية البيانات وطلبت الاطلاع على سجلات المعالجة، هل يجب أن نسلمها؟
  - من يحق له طلب الاطلاع على سجل أنشطة معالجة البيانات لدينا ومتى؟
  - بصفتنا مزود خدمة، هل يلزمنا تقديم سجل المعالجة للسلطة عند طلبها؟
- key: gdpr:art-30:para-5
  text: f9b8f3a2a7e85cbe
  en:
  - We're a startup with 20 employees. Are we exempt from keeping a processing register?
  - Does the small company exemption still apply if we process health data or do it regularly?
  - Our shop has under 250 staff but we process customer data every day. Do we still need a register?
  ar:
  - نحن شركة ناشئة فيها 20 موظفًا، هل نُعفى من الاحتفاظ بسجل المعالجة؟
  - هل يبقى إعفاء الشركات الصغيرة ساريًا إذا كنا نعالج بيانات صحية أو نعالج البيانات بشكل منتظم؟
  - متجرنا فيه أقل من 250 موظف بس نعالج بيانات العملاء كل يوم، هل لازم سجل برضو؟
- key: gdpr:art-31
  text: 2b6c3e0824d17d64
  en:
  - The data protection regulator emailed us asking for information about how our app handles user data.
    Do we have to respond and help them?
  - Are we obliged to work with a data protection authority investigating our online shop, even if we
    only use a third-party company to process customer data?
  - Our EU representative got a request from the privacy watchdog during their inquiry. Does the duty
    to cooperate apply to them too?
  ar:
  - هل يجب على شركتنا التعاون مع هيئة حماية البيانات عندما تطلب منا معلومات أثناء تحقيقها في تطبيقنا؟
  - نحن مجرد معالج بيانات لعميل عندنا، فهل علينا نتعاون مع الجهة الرقابية إذا طلبت منا؟
  - جاني طلب من الجهة المسؤولة عن الخصوصية وبدهم مني معلومات عن التطبيق، لازم أرد عليهم وأتعاون معهم ولا
    أقدر أتجاهلهم؟
- key: gdpr:art-32:para-1
  text: cbc6e90b82fe7494
  en:
  - What level of security do I need to put in place for the user data my app stores, and what should
    I weigh when deciding?
  - We're a small startup with a limited budget. Do we still have to implement security measures for customer
    data, and how do we decide how much?
  - Does the duty to protect personal data apply to our vendor who hosts and processes data for us, or
    only to us?
  ar:
  - ما مستوى الحماية المطلوب لبيانات المستخدمين المخزنة في تطبيقنا وما العوامل التي نراعيها لتحديده؟
  - نحن شركة ناشئة وميزانيتنا محدودة، هل لازم نطبق إجراءات أمان على بيانات العملاء وكيف نحدد حجمها؟
  - شو لازم نسوي عشان نحمي بيانات الزبائن في متجرنا الإلكتروني، وهل نفس الالتزام على الشركة اللي تستضيف
    لنا البيانات؟
- key: gdpr:art-32:para-1:pt-a
  text: 39a5902f46173076
  en:
  - Are we required to encrypt user data in our database and in transit?
  - Is replacing names and emails with tokens or IDs in our analytics dataset something that counts as
    a security measure?
  - Our clinic app stores patient records in plain text. Should we be encrypting or pseudonymising them?
  ar:
  - هل يجب علينا تشفير بيانات المستخدمين في قاعدة البيانات وأثناء نقلها؟
  - هل استبدال الأسماء والإيميلات برموز أو معرفات في بيانات التحليلات يُعد إجراء أمنياً مطلوباً؟
  - ليش لازم أشفّر بيانات المرضى في تطبيق العيادة؟ هل التشفير إجباري ولا بس مستحسن؟
- key: gdpr:art-32:para-1:pt-b
  text: c9acb8d21b286256
  en:
  - Do we have to make sure our systems stay confidential, accurate, available and resilient against failures
    or attacks?
  - Our online shop went down for hours and customer order data might have been exposed. Which security
    capability should we have had?
  ar:
  - هل يلزمنا ضمان سرية أنظمتنا ودقة بياناتها وتوافرها وقدرتها على الصمود أمام الأعطال والهجمات؟
  - توقف متجرنا الإلكتروني لساعات واحتمال تسربت بيانات الطلبات، ما القدرة الأمنية التي كان يجب أن تتوفر
    لدينا؟
  - يعني إيش المطلوب مني عشان أضمن إن السيرفرات شغالة وبيانات الناس ما تتغير ولا تتسرب؟
- key: gdpr:art-32:para-1:pt-c
  text: 3b51033299b0526d
  en:
  - Do we need backups and a disaster recovery plan so we can get user data back quickly after a server
    crash?
  - Ransomware locked our database. Are we expected to be able to restore access to personal data fast?
  - A fire or outage hit our data centre; how quickly must we be able to bring customer data back online?
  ar:
  - هل يجب أن يكون لدينا نسخ احتياطية وخطة تعافٍ لاستعادة بيانات المستخدمين بسرعة بعد انهيار الخادم؟
  - فيروس فدية قفل قاعدة بياناتنا، هل مطلوب منا القدرة على استعادة الوصول للبيانات الشخصية بسرعة؟
  - إذا طاح السيرفر أو صار حريق في مركز البيانات، لازم يكون عندنا طريقة نرجّع فيها بيانات العملاء بسرعة؟
- key: gdpr:art-32:para-1:pt-d
  text: aa7f564b5504e17f
  en:
  - Do we have to run penetration tests or security audits on our app regularly?
  - How often should we review whether our security controls for user data are actually working?
  - Our security setup was done two years ago and never checked. Are we required to keep testing and evaluating
    it?
  ar:
  - هل مطلوب منا إجراء اختبارات اختراق أو تدقيق أمني دوري على تطبيقنا؟
  - كل كم مرة لازم نراجع إذا كانت ضوابط حماية بيانات المستخدمين فعلاً تشتغل؟
  - أعددنا نظام الحماية قبل سنتين ولم نفحصه أبداً، هل علينا اختباره وتقييمه باستمرار؟
- key: gdpr:art-32:para-2
  text: 5668d5fbcb1eb0f5
  en:
  - When deciding how much security our app needs, which kinds of threats to personal data should we think
    about?
  - Does the security duty cover an employee accidentally deleting or changing customer records, not just
    hackers?
  - We send user data between services and store it in the cloud; what risks to that data must we take
    into account?
  ar:
  - عند تحديد مستوى الأمان اللازم لتطبيقنا، ما أنواع المخاطر على البيانات الشخصية التي يجب أن نأخذها بالحسبان؟
  - هل واجب الحماية يشمل حذف موظف لسجلات العملاء أو تعديلها بالخطأ وليس فقط الاختراق؟
  - نرسل بيانات المستخدمين بين الخدمات ونخزنها في السحابة، ما المخاطر التي لازم نحسب حسابها؟
- key: gdpr:art-32:para-3
  text: d4104a3e4fb50cf5
  en:
  - Can getting an ISO 27001-style security certification help prove we meet our data security obligations?
  - Does following an approved industry code of conduct show regulators that our security is adequate?
  - A client asked us to prove our app's security is compliant. Would an approved certification be enough?
  ar:
  - هل الحصول على شهادة أمنية معتمدة مثل ISO 27001 يساعدنا في إثبات التزامنا بمتطلبات أمن البيانات؟
  - هل اتباع مدونة سلوك معتمدة في مجال عملنا يثبت للجهات الرقابية أن حمايتنا كافية؟
  - عميل طلب منا إثبات أن أمان تطبيقنا مطابق للقانون، هل تكفي شهادة اعتماد؟
- key: gdpr:art-32:para-4
  text: 0d882e6b1f43109d
  en:
  - Can our employees or contractors with database access use customer data however they like, or only
    as we instruct?
  - A support agent looked up customer records for their own purposes. What should we have done to prevent
    staff from using data without instructions?
  - Our freelance developer has access to production data. Are we responsible for making sure they only
    handle it as told?
  ar:
  - هل يحق لموظفينا أو المتعاقدين الذين لديهم صلاحية الوصول لقاعدة البيانات استخدام بيانات العملاء كما
    يشاؤون أم فقط حسب تعليماتنا؟
  - موظف دعم فني فتح سجلات عملاء لأغراضه الشخصية، ما الذي كان علينا فعله لمنع الموظفين من استخدام البيانات
    بدون تعليمات؟
  - المبرمج الفريلانسر عنده وصول لبيانات الإنتاج، هل علينا نتأكد إنه ما يتعامل معها إلا بأوامرنا؟
- key: gdpr:art-33:para-1
  text: b9609382ad6a82c5
  en:
  - Our app's user database was hacked yesterday. How long do we have to tell the data protection regulator?
  - Do we have to report every security incident to the authority, or can we skip it if it's unlikely
    to harm anyone?
  - We only discovered a leak after 5 days. Do we need to explain why we're late when we report it?
  ar:
  - ما هي المدة المحددة لإبلاغ الجهة الرقابية بعد اكتشاف تسرب بيانات المستخدمين في تطبيقنا؟
  - هل يجب على الشركة إبلاغ السلطة المختصة بكل حادث أمني، أم يُستثنى الحادث الذي لا يُرجَّح أن يضر بالأفراد؟
  - اكتشفنا الاختراق متأخرين وعدّى أكتر من ٧٢ ساعة، لازم نكتب سبب التأخير ولا كيف؟
- key: gdpr:art-33:para-2
  text: 9dbcea1cbef834a6
  en:
  - Our company hosts data for clients as a cloud vendor and we found a breach. Do we have to tell the
    clients?
  - When must a subcontractor that handles customer data tell its client about a leak it noticed?
  - I run a payroll SaaS and one of our servers leaked customer data. Who do I inform first, the regulator
    or my customer?
  ar:
  - نحن نعالج بيانات لصالح عميل وحصل تسرب، هل علينا إبلاغ العميل فوراً؟
  - ما التزام معالج البيانات عند علمه بحدوث خرق في البيانات التي يعالجها لجهة أخرى؟
  - شركتنا تقدم خدمة سحابية وطلع عندنا تسريب، نبلغ العميل ولا الجهة الحكومية أول؟
- key: gdpr:art-33:para-3
  text: 64b9cc3698b13867
  en:
  - What information must be included when we send a breach report to the regulator?
  - What should a breach notification to the data protection authority contain at a minimum?
  - We're drafting our incident report for the privacy regulator after a leak. What sections does it need?
  ar:
  - ما هي المعلومات الواجب تضمينها في إخطار خرق البيانات المرسل إلى الجهة الرقابية؟
  - شو لازم يكون موجود بالحد الأدنى في بلاغ التسرب اللي نرسله للسلطة؟
  - نجهز تقرير عن اختراق قاعدة بيانات عملاءنا للجهة المختصة، وش الأشياء اللي لازم نذكرها فيه؟
- key: gdpr:art-33:para-3:pt-a
  text: c41bc519924c65a3
  en:
  - In our breach report, do we need to say how many users and records were affected?
  - What do we need to say about what kind of breach happened and who was affected when notifying the
    regulator?
  - We don't know the exact number of customers whose data leaked. Can we give an estimate in the report?
  ar:
  - هل يجب أن نذكر في بلاغ الخرق عدد المستخدمين والسجلات المتأثرة وفئاتهم؟
  - كيف نصف طبيعة التسرب في الإخطار المقدم للجهة الرقابية؟
  - ما نعرف العدد الدقيق للعملاء اللي تسربت بياناتهم، يكفي نكتب رقم تقريبي في البلاغ؟
- key: gdpr:art-33:para-3:pt-b
  text: d8397499d9c1d8a1
  en:
  - Do we have to give the regulator a contact person when we report a breach?
  - Does our breach report need the DPO's name and contact details?
  - We have no appointed DPO at our startup. Who do we list as the contact in a breach notification?
  ar:
  - هل يلزم ذكر بيانات الاتصال بمسؤول حماية البيانات في إخطار الخرق؟
  - من الشخص الذي نضعه كجهة اتصال في بلاغ التسرب إذا ما عندنا مسؤول حماية بيانات؟
  - لازم نكتب اسم ورقم التواصل لشخص يقدر يعطي تفاصيل أكثر للجهة في بلاغ الاختراق؟
- key: gdpr:art-33:para-3:pt-c
  text: 49468d1e1c3f1f3c
  en:
  - Do we have to explain to the regulator what could happen to users because of the leak?
  - What does the breach report need to say about the likely impact of the incident?
  - Our customers' passwords were exposed. Must the notification describe the potential consequences for
    them?
  ar:
  - هل يجب أن نشرح للجهة الرقابية العواقب المحتملة للتسرب على المستخدمين؟
  - ماذا يجب أن يذكر إخطار الخرق بخصوص الآثار المرجحة للحادثة؟
  - تسربت كلمات مرور عملائنا، هل لازم نكتب في البلاغ شو ممكن يصير لهم؟
- key: gdpr:art-33:para-3:pt-d
  text: 35613fe4a1db3433
  en:
  - What do we have to tell the regulator about the steps we've taken to fix a data breach?
  - Does the breach notification need to include our plan to limit harm to affected users?
  - We patched the vulnerability after the leak. Should the report to the authority mention that and what
    we plan next?
  ar:
  - ما الإجراءات التي يجب أن نذكرها في الإخطار لمعالجة الخرق والحد من أضراره؟
  - هل يتطلب بلاغ التسرب أن نذكر الإجراءات المتخذة أو المقترحة لتقليل الضرر على المستخدمين؟
  - سكرنا الثغرة بعد التسريب، لازم نكتب هالشي مع خطتنا القادمة في التقرير للجهة؟
- key: gdpr:art-33:para-4
  text: 5b0e605a56e20fd4
  en:
  - We're still investigating a breach and don't have all the details yet. Can we send the regulator a
    partial report now?
  - Is it okay to submit the breach information in stages instead of all at once?
  - Our security team needs weeks to figure out what was stolen, but the 72 hours is almost up. What should
    we do?
  ar:
  - ما زلنا نحقق في الاختراق ولا تتوفر لدينا كل المعلومات، هل يجوز إرسال إخطار جزئي الآن؟
  - هل يمكن تقديم معلومات الخرق على مراحل بدل تقديمها دفعة واحدة؟
  - فريق الأمن يحتاج أسابيع يعرف إيش انسرق والـ٧٢ ساعة قربت تخلص، نرسل اللي عندنا ونكمل بعدين؟
- key: gdpr:art-33:para-5
  text: 5c352926cc0b8245
  en:
  - Do we need to keep an internal record of data breaches even if we didn't report them to the regulator?
  - What should our incident log contain for each data leak?
  - Can the regulator ask to see our records of past security incidents to check we complied?
  ar:
  - هل يجب أن نحتفظ بسجل داخلي لكل حوادث خرق البيانات حتى التي لم نبلغ عنها؟
  - ما الذي ينبغي توثيقه عن كل حادثة تسرب بيانات من وقائع وآثار وإجراءات تصحيحية؟
  - يعني ممكن الجهة الرقابية تطلب سجل الحوادث الأمنية عندنا تتأكد إننا ملتزمين؟
- key: gdpr:art-34:para-1
  text: 21045d6ad9040a0a
  en:
  - Our app database got hacked and users' passwords and health info leaked. Do we have to tell the users
    themselves?
  - When exactly must a company notify affected customers about a data leak, and how fast?
  - Is it enough to report a breach to the regulator, or do we also need to email the people whose data
    was exposed?
  ar:
  - حصل اختراق لقاعدة بيانات تطبيقنا وتسربت بيانات المستخدمين الحساسة، هل يلزمنا إبلاغ المستخدمين أنفسهم؟
  - متى يجب على الشركة إخطار الأشخاص المتضررين من تسريب بياناتهم وهل يكون ذلك فورًا؟
  - يا جماعة صار عندنا تسريب بيانات في المتجر، لازم نخبر الزبائن ولا يكفي نبلغ الجهة الرقابية؟
- key: gdpr:art-34:para-2
  text: 6197d9ceec855534
  en:
  - What should the email to our users about a data breach say?
  - Can we write the breach notice to customers in legal jargon, or does it need to be simple?
  - What details must we include when telling affected users their data was leaked, like contact point
    and what we're doing about it?
  ar:
  - ما هي المعلومات التي يجب أن تتضمنها رسالة إبلاغ المستخدمين بحدوث خرق لبياناتهم؟
  - هل يجوز صياغة إشعار الخرق للعملاء بلغة قانونية معقدة أم يجب أن تكون واضحة وبسيطة؟
  - شو لازم أكتب بالإيميل اللي برسله للمستخدمين لما تتسرب بياناتهم؟ وشو لازم يكون فيه؟
- key: gdpr:art-34:para-3
  text: f42c7fe75e2e64b2
  en:
  - In what cases can we skip notifying users after a data breach?
  - Are there exceptions that let a company avoid telling customers about a leak?
  - Do we always have to tell users about a breach even if the risk was dealt with?
  ar:
  - ما هي الحالات التي لا يلزم فيها إبلاغ الأشخاص المتضررين بحدوث خرق للبيانات؟
  - هل هناك استثناءات تعفي الشركة من إخطار العملاء عند تسرب بياناتهم؟
  - وقت يصير تسريب، في حالات ما لازم نخبر المستخدمين فيها؟
- key: gdpr:art-34:para-3:pt-a
  text: 3b3aa86a398d5fc3
  en:
  - Our leaked database was encrypted, so do we still need to notify users?
  - Does having encryption on stolen data mean we don't have to tell customers about the breach?
  - A laptop with customer records was stolen but the disk was encrypted. Do we have to inform the customers?
  ar:
  - قاعدة البيانات المسربة كانت مشفرة، هل ما زال علينا إبلاغ المستخدمين؟
  - هل التشفير للبيانات المسروقة يعفينا من إخطار العملاء بالخرق؟
  - انسرق لابتوب فيه بيانات زبائن بس القرص مشفر، لازم نبلغهم ولا لا؟
- key: gdpr:art-34:para-3:pt-b
  text: f6616179fa95cb4e
  en:
  - After the breach we reset all passwords and revoked access tokens quickly. Can we skip telling users?
  - If we fixed things afterwards so the risk to users is gone, is notification still required?
  - Can follow-up actions we took after a leak remove the duty to inform the affected people?
  ar:
  - بعد الاختراق أعدنا تعيين كل كلمات المرور وألغينا الصلاحيات فورًا، هل نستغني عن إبلاغ المستخدمين؟
  - إذا عالجنا الأمر لاحقًا بحيث زال الخطر على الأشخاص، هل يبقى الإبلاغ واجبًا؟
  - عملنا إجراءات بعد التسريب وخلصت المخاطر على الزبائن، لسه لازم نبلغهم؟
- key: gdpr:art-34:para-3:pt-c
  text: 2abbe5ac0d34ab7d
  en:
  - We have millions of users and no contact details for many of them. Can we post a public notice about
    the breach instead?
  - When is it okay to announce a breach on our website instead of contacting each person?
  - Is individually emailing every affected user too much work to be required, and what's the alternative?
  ar:
  - لدينا ملايين المستخدمين وليس لدينا بيانات اتصال لكثير منهم، هل يمكن نشر إعلان عام عن الخرق بدلًا من
    ذلك؟
  - متى يجوز الإعلان عن التسريب على موقعنا بدل مراسلة كل شخص على حدة؟
  - مستحيل نراسل كل واحد تأثر بالتسريب، شو البديل اللي نقدر نسويه؟
- key: gdpr:art-34:para-4
  text: de739eec59594ba6
  en:
  - We didn't tell users about our breach. Can the data protection authority force us to?
  - Can the regulator decide we don't need to notify customers about a leak?
  - What happens if the regulator thinks the breach is high risk but we haven't informed the affected
    people yet?
  ar:
  - لم نبلغ المستخدمين بالخرق، هل يمكن للجهة الرقابية أن تجبرنا على ذلك؟
  - هل تستطيع سلطة حماية البيانات أن تقرر إعفاءنا من إبلاغ العملاء؟
  - الجهة المنظمة شافت إن التسريب خطير وإحنا ما بلغنا الناس، شو ممكن يصير؟
- key: gdpr:art-35:para-1
  text: d55633df0049b8ef
  en:
  - We're launching an app that uses a new AI feature on users' personal data and it could seriously affect
    them. Do we have to do a risk assessment before we launch?
  - Can I write one risk assessment that covers several similar features in our product, or do I need
    one per feature?
  - When exactly must a company assess privacy impact before starting a new type of data processing?
  ar:
  - ما هو الشرط الذي يوجب على المتحكم في البيانات إجراء تقييم الأثر قبل البدء بمعالجة تستخدم تقنية جديدة
    وتنطوي على مخاطر عالية؟
  - هل يجوز إعداد تقييم واحد يشمل عدة عمليات معالجة متشابهة في تطبيقنا؟
  - شركتنا بتطلق ميزة جديدة بالتطبيق وفيها مخاطرة عالية على خصوصية الناس، لازم نسوي تقييم قبل الإطلاق
    ولا نقدر نكمل عادي؟
- key: gdpr:art-35:para-2
  text: 7941b4c6653fc94a
  en:
  - Our company has a data protection officer. Do we need to ask them for input when we do a privacy risk
    assessment?
  - Who should I consult internally when running a DPIA for our new feature?
  - Is it mandatory to involve the DPO while we assess the privacy impact of a new product?
  ar:
  - هل يجب على المتحكم أن يستشير مسؤول حماية البيانات عند إجراء تقييم الأثر؟
  - عندنا مسؤول حماية بيانات معيّن، هل لازم آخذ رأيه وأنا أعمل تقييم المخاطر للمنتج الجديد؟
  - شو دور الـ DPO لما نجهّز تقييم أثر الخصوصية لميزة جديدة عندنا؟
- key: gdpr:art-35:para-3
  text: fdb5e844df62e59e
  en:
  - What kinds of processing in my app automatically require a full privacy impact assessment?
  - Which situations make a DPIA compulsory rather than optional?
  - We're building a product with user profiling and sensitive data. Which of our activities are on the
    must-assess list?
  ar:
  - ما هي الحالات التي يكون فيها تقييم الأثر على حماية البيانات إلزامياً بوجه خاص؟
  - أي أنواع المعالجة في تطبيقي تحتاج تقييم أثر إجباري؟
  - وين بالضبط لازم أسوي DPIA؟ يعني إيش الحالات اللي تعتبر إلزامية؟
- key: gdpr:art-35:para-3:pt-a
  text: 4c176ec1ce01805b
  en:
  - Our lending app automatically scores users with an algorithm and rejects loans without human review.
    Do we need a privacy impact assessment?
  - Do we need a DPIA if we profile customers automatically and the result decides things like pricing
    or access that really affect them?
  - We use automated profiling to decide who gets hired through our recruiting platform. Is a risk assessment
    required?
  ar:
  - تطبيقنا يقيّم العملاء آلياً ويرفض طلبات التمويل بدون تدخل بشري، هل يلزمنا تقييم أثر؟
  - هل يُشترط تقييم الأثر عند التقييم المنهجي والواسع للأشخاص بالمعالجة الآلية والتنميط إذا ترتبت عليه
    قرارات مؤثرة؟
  - نظامنا يسوي بروفايل للمستخدمين أوتوماتيك ويقرر على أساسه شغلات تأثر عليهم كثير، لازم نعمل تقييم قبل؟
- key: gdpr:art-35:para-3:pt-b
  text: 2f1437f4628a49ed
  en:
  - Our clinic app stores health records for thousands of patients. Do we have to do a DPIA?
  - Does handling biometric or health data at scale in our app trigger a mandatory impact assessment?
  - We process criminal record checks for many job applicants through our platform. Do we need a privacy
    impact assessment first?
  ar:
  - تطبيق عيادتنا يخزن سجلات صحية لآلاف المرضى، هل يلزم إجراء تقييم أثر؟
  - هل تستوجب المعالجة الواسعة للبيانات الحساسة أو بيانات الإدانات الجنائية تقييماً للأثر؟
  - احنا نعالج بيانات صحية وبصمات لعدد كبير من المستخدمين، يعني لازم نسوي تقييم أثر ولا لأ؟
- key: gdpr:art-35:para-3:pt-c
  text: e42a0a8fb560481b
  en:
  - We're installing CCTV cameras with face recognition across a shopping mall. Do we need an impact assessment?
  - Does large-scale camera monitoring of a public space require a DPIA?
  - Our smart city app tracks people in public streets via sensors. Is a risk assessment mandatory?
  ar:
  - سنركّب كاميرات مراقبة في مركز تجاري كبير، هل نحتاج إلى تقييم أثر على حماية البيانات؟
  - هل تتطلب المراقبة المنهجية واسعة النطاق لمنطقة مفتوحة للجمهور إجراء تقييم أثر؟
  - نبي نحط كاميرات تراقب الشارع العام بشكل واسع، لازم نسوي تقييم مخاطر قبل؟
- key: gdpr:art-35:para-4
  text: 7415d451bd166e44
  en:
  - Where can I find the official list of processing activities that need a DPIA in my country?
  - Does the data protection regulator publish examples of what requires an impact assessment?
  - How do I check whether my feature is on the authority's mandatory DPIA list?
  ar:
  - أين أجد القائمة الرسمية لأنواع المعالجة التي تتطلب تقييم أثر في بلدي؟
  - هل تنشر سلطة الرقابة قائمة بالعمليات الخاضعة لتقييم الأثر؟
  - فين ألاقي لستة الجهة الرقابية اللي توضح أي معالجات لازم لها DPIA؟
- key: gdpr:art-35:para-5
  text: 12639338288a7a64
  en:
  - Is there an official list of processing activities that are exempt from needing a DPIA?
  - Can the regulator say that certain kinds of data processing don't need an impact assessment?
  - Where can I check if my app's processing is on a no-assessment-needed list?
  ar:
  - هل يمكن لسلطة الرقابة نشر قائمة بعمليات معالجة لا تتطلب تقييم أثر؟
  - هل في قائمة رسمية بالأنشطة المعفاة من تقييم الأثر؟
  - كيف أعرف إذا نشاطي مو محتاج تقييم أثر لأن الجهة نشرت قائمة استثناءات؟
- key: gdpr:art-35:para-6
  text: 6ad337e3f244bb42
  en:
  - Our service operates in several EU countries. Do the regulators coordinate their DPIA lists?
  - Why do national authorities have to run their DPIA lists through a consistency process when services
    are cross-border?
  - Could one country's DPIA list affect businesses offering services across multiple member states?
  ar:
  - خدمتنا تعمل في عدة دول أوروبية، هل تنسّق السلطات الرقابية قوائم تقييم الأثر فيما بينها؟
  - متى تلتزم سلطة الرقابة بتطبيق آلية الاتساق قبل اعتماد قوائم تقييم الأثر؟
  - تطبيقنا يخدم مستخدمين في أكثر من دولة، هل قوائم الـ DPIA تنراجع على مستوى أوروبا قبل ما تنعتمد؟
- key: gdpr:art-35:para-7
  text: a44aa6294158c905
  en:
  - What should a privacy impact assessment document include at minimum?
  - I'm writing our first DPIA report. What sections do I need?
  - Is there a checklist of required contents for a data protection impact assessment?
  ar:
  - ما هي العناصر الدنيا التي يجب أن يتضمنها تقييم الأثر على حماية البيانات؟
  - أكتب أول تقرير DPIA لنا، ما الأقسام المطلوبة فيه؟
  - إيش لازم يكون موجود بتقرير تقييم أثر الخصوصية على الأقل؟
- key: gdpr:art-35:para-7:pt-a
  text: 6900e92a03c9108c
  en:
  - What do I need to describe about our data flows and purposes in a DPIA?
  - Do I have to mention our legitimate interest in the impact assessment write-up?
  - How detailed should the description of our processing be in the privacy risk assessment?
  ar:
  - ما الذي يجب وصفه عن عمليات المعالجة وأغراضها في تقييم الأثر؟
  - هل أذكر المصلحة المشروعة التي نعتمد عليها داخل تقييم الأثر؟
  - كيف أوصف تدفق بيانات المستخدمين وأهداف استخدامها في وثيقة تقييم المخاطر؟
- key: gdpr:art-35:para-7:pt-b
  text: 04fd9594f781f7ca
  en:
  - Do I need to justify in our DPIA why we collect each piece of user data?
  - How do I show that our data collection is proportionate to what the feature does?
  - Does the assessment have to check whether we could achieve our goal with less data?
  ar:
  - هل يجب أن يتضمن تقييم الأثر تقييماً لضرورة المعالجة وتناسبها مع أغراضها؟
  - كيف أثبت في التقييم أن البيانات التي نجمعها ضرورية فعلاً للميزة؟
  - لازم نبرر بالتقييم ليش نجمع كل هالبيانات وهل في طريقة أقل تدخل؟
- key: gdpr:art-35:para-7:pt-c
  text: 227cf42180dcdb79
  en:
  - What kind of risks to users must I analyze in a DPIA?
  - Do I need to evaluate how our product could harm people's rights if data leaks or is misused?
  - How do I assess risk to users in our privacy impact assessment?
  ar:
  - هل يلزم أن يتضمن التقييم تحليلاً للمخاطر على حقوق وحريات أصحاب البيانات؟
  - كيف أقيّم المخاطر التي قد يتعرض لها المستخدمون بسبب معالجتنا لبياناتهم؟
  - لازم أحلل بالتقييم الأضرار المحتملة على المستخدمين لو تسربت بياناتهم؟
- key: gdpr:art-35:para-7:pt-d
  text: f04733c09282cf77
  en:
  - After identifying risks in our DPIA, what do we have to write about how we'll reduce them?
  - Do I need to list security measures and safeguards in the impact assessment?
  - How can the DPIA help us demonstrate we comply with the rules?
  ar:
  - ما الإجراءات التي يجب أن يوردها تقييم الأثر لمعالجة المخاطر؟
  - هل أضمّن التقييم الضمانات والتدابير الأمنية التي سنطبقها؟
  - شو لازم أكتب عن طرق تقليل المخاطر وإثبات التزامنا بالقانون داخل التقييم؟
- key: gdpr:art-35:para-8
  text: b1b0993b757b5cd5
  en:
  - Does following an approved industry code of conduct count when we assess privacy impact?
  - We signed up to a sector code of conduct. Does that help in our DPIA?
  - Should our impact assessment take into account that our vendor follows an approved code?
  ar:
  - هل يؤخذ الالتزام بمدونة سلوك معتمدة في الحسبان عند تقييم أثر المعالجة؟
  - نحن ملتزمون بمدونة سلوك قطاعية معتمدة، هل يفيدنا هذا في تقييم الأثر؟
  - لو شركتنا أو المعالج عندنا ماشي على كود سلوك معتمد، هل نحسبه ضمن الـ DPIA؟
- key: gdpr:art-35:para-9
  text: ea6236129b8a1f4a
  en:
  - Should we ask our users for their opinion before launching a feature that processes their data?
  - Do we have to consult customers or their representatives during a DPIA?
  - Can we skip consulting users in an impact assessment if it would reveal trade secrets or weaken security?
  ar:
  - هل يجب استطلاع آراء أصحاب البيانات أو ممثليهم بشأن المعالجة المزمعة؟
  - هل يمكننا عدم استشارة المستخدمين في التقييم إذا كان ذلك يضر بأمن المعالجة أو بمصالحنا التجارية؟
  - لازم نسأل عملاءنا أو ممثليهم رأيهم قبل ما نطلق ميزة جديدة تعالج بياناتهم؟
- key: gdpr:art-35:para-10
  text: 04ca26f6d9456773
  en:
  - We process data because a law requires us to, and the lawmakers already did an impact assessment.
    Do we still need our own DPIA?
  - When can a public-sector service skip the DPIA because it was done when the law was passed?
  - Can a member state still require an impact assessment even if one was done when the legal basis was
    adopted?
  ar:
  - نعالج البيانات بموجب التزام قانوني وقد أُجري تقييم أثر عند إصدار القانون، هل نحتاج تقييماً خاصاً بنا؟
  - متى لا تنطبق متطلبات تقييم الأثر لأن أساس المعالجة قانون أُجري له تقييم عام؟
  - خدمتنا حكومية ومبنية على قانون، وانعمل له تقييم أثر وقت إصداره، لسا لازم نسوي DPIA؟
- key: gdpr:art-35:para-11
  text: 7d1e1154972d21ef
  en:
  - We changed how our app uses customer data after the DPIA. Do we need to review the assessment?
  - When do I have to revisit and update our privacy impact assessment?
  - Does a rise in risk after launch mean we have to re-check that we follow our DPIA?
  ar:
  - غيّرنا طريقة استخدام بيانات العملاء بعد إجراء التقييم، هل علينا مراجعته؟
  - متى يجب على المتحكم مراجعة تقييم الأثر للتأكد من أن المعالجة تتم وفقه؟
  - زادت مخاطر المعالجة عندنا بعد الإطلاق، لازم نرجع نراجع الـ DPIA؟
- key: gdpr:art-36:para-1
  text: e63a9822f64a47e1
  en:
  - Our risk assessment for a new facial-recognition login feature shows high risk we can't reduce. Do
    we have to contact the data protection regulator before launch?
  - When must we go to the privacy authority before starting a data processing activity?
  - Is it okay to launch our app's new profiling feature if the DPIA says the risk is still high after
    our safeguards?
  ar:
  - أجرينا تقييم أثر لميزة جديدة في تطبيقنا وتبيّن أن الخطر مرتفع ولا نستطيع تخفيفه، هل يجب استشارة هيئة
    حماية البيانات قبل الإطلاق؟
  - متى يجب على المسؤول عن المعالجة أن يستشير السلطة الرقابية قبل البدء بالمعالجة؟
  - الـ DPIA طلعت إن الخطر عالي حتى بعد الإجراءات اللي سويناها، لازم نراسل الجهة الرقابية قبل ما نشغّل
    الميزة؟
- key: gdpr:art-36:para-2
  text: 500dd57ca7bd4fe6
  en:
  - How long does the regulator take to reply after we submit a prior consultation request for our new
    data processing?
  - Can the data protection authority extend its review time on our consultation, and does it have to
    tell us why?
  - The regulator thinks our planned processing breaks the rules because we didn't handle the risks well.
    What can it do and will we get written advice?
  ar:
  - كم تستغرق السلطة الرقابية للرد على طلب الاستشارة المسبقة الذي قدمناه بخصوص معالجة بياناتنا؟
  - هل يحق للجهة الرقابية تمديد مدة الرد على طلب الاستشارة، وهل يجب أن تبلغنا بالأسباب؟
  - قدمنا طلب استشارة للهيئة وهي طالبة معلومات إضافية منا، هل تتوقف المدة خلال هذا الوقت؟ وايش ممكن تسوي
    لو شافت إن المعالجة مخالفة؟
- key: gdpr:art-36:para-3
  text: a3a0a51dcd3b9f7e
  en:
  - What do we need to send to the data protection authority when we ask for a prior consultation?
  - We're preparing our consultation submission for the regulator for a new health-tracking feature. What
    documents and information should the package include?
  - Does the regulator expect a list of items from us when we request consultation about risky processing?
  ar:
  - ما الذي يجب أن نرسله إلى السلطة الرقابية عند تقديم طلب استشارة مسبقة؟
  - نجهّز ملف الاستشارة للهيئة بخصوص ميزة جديدة عالية الخطورة، إيش المستندات والمعلومات اللي لازم نرفقها؟
  - هل هناك قائمة بالمعلومات المطلوبة من الشركة عند استشارة الجهة الرقابية قبل المعالجة؟
- key: gdpr:art-36:para-3:pt-a
  text: 1ec410a7cbbbe613
  en:
  - Several companies in our group and a cloud vendor are involved in the processing. Do we need to tell
    the regulator who is responsible for what?
  - In a consultation request, do we have to describe the roles of joint controllers and processors?
  - Our subsidiaries share a customer database. Should the consultation file explain which entity does
    what?
  ar:
  - عدة شركات في مجموعتنا ومزود سحابي يشاركون في المعالجة، هل يجب أن نبيّن للهيئة مسؤولية كل طرف؟
  - هل نحتاج في طلب الاستشارة إلى توضيح أدوار المسؤولين المشتركين والمعالجين؟
  - شركاتنا التابعة تشارك قاعدة عملاء وحدة، لازم نوضح في ملف الاستشارة مين المسؤول عن إيش؟
- key: gdpr:art-36:para-3:pt-b
  text: 14e3d07136defb3d
  en:
  - Do we have to explain to the regulator why we are collecting the data and how the system will work?
  - What description of our planned processing should go into the consultation request?
  - Should the consultation file say what the feature is for and what technology it uses?
  ar:
  - هل يجب أن نشرح للهيئة سبب جمع البيانات وكيف سيعمل النظام؟
  - ما الوصف الذي يجب تقديمه عن المعالجة المزمعة في طلب الاستشارة؟
  - هل لازم نكتب في ملف الاستشارة وش هدف الميزة وأي تقنية نستخدم فيها؟
- key: gdpr:art-36:para-3:pt-c
  text: e555d4497a3f9f49
  en:
  - Do we need to show the regulator what security and privacy protections we've put in place for users?
  - What safeguards information must be included when consulting the authority about a risky feature?
  - Should our consultation include the controls we use to protect users' rights, like encryption or opt-outs?
  ar:
  - هل يجب أن نعرض على الهيئة إجراءات الأمان والخصوصية التي وضعناها لحماية المستخدمين؟
  - ما معلومات الضمانات التي يجب تضمينها عند استشارة السلطة بشأن ميزة عالية الخطورة؟
  - هل نذكر في الاستشارة الضوابط اللي نحمي فيها حقوق المستخدمين مثل التشفير وخيارات الرفض؟
- key: gdpr:art-36:para-3:pt-d
  text: 7e6b901bbbc12d2a
  en:
  - If we have a DPO, do we need to give their contact details to the regulator in the consultation?
  - Should our data protection officer's email be part of the consultation request?
  - We appointed a DPO for our fintech app. Is their contact info required when we consult the authority?
  ar:
  - إذا كان لدينا مسؤول حماية بيانات، هل يجب إعطاء الهيئة بيانات التواصل معه في طلب الاستشارة؟
  - هل يجب أن يتضمن طلب الاستشارة بريد مسؤول حماية البيانات لدينا؟
  - عيّنا DPO لتطبيقنا المالي، هل لازم نرسل معلومات التواصل معه للجهة الرقابية؟
- key: gdpr:art-36:para-3:pt-e
  text: a612842ac97157d5
  en:
  - Do we have to hand over our full DPIA report to the regulator when asking for consultation?
  - Is the impact assessment document itself required in the consultation submission?
  - Can we ask for prior consultation without attaching our DPIA?
  ar:
  - هل يجب تسليم تقرير تقييم الأثر كاملاً للسلطة الرقابية عند طلب الاستشارة؟
  - هل مستند تقييم الأثر نفسه مطلوب ضمن ملف الاستشارة؟
  - هل نقدر نطلب الاستشارة المسبقة بدون ما نرفق تقييم الأثر DPIA؟
- key: gdpr:art-36:para-3:pt-f
  text: 35e6378f9ae0d116
  en:
  - The regulator asked us for extra documents about our data processing during consultation. Do we have
    to provide them?
  - Is the authority allowed to ask for more information beyond the standard list in a consultation?
  - What if the privacy authority requests more details about our app's processing after we submit?
  ar:
  - الهيئة طلبت منا مستندات إضافية عن المعالجة أثناء الاستشارة، هل يجب أن نقدمها؟
  - هل يحق للسلطة الرقابية طلب معلومات أخرى غير المذكورة في قائمة الاستشارة؟
  - وش نسوي لو الجهة الرقابية طلبت تفاصيل زيادة عن نظام تطبيقنا بعد ما قدمنا الطلب؟
- key: gdpr:art-36:para-4
  text: aff786670bfe123a
  en:
  - Is the government required to ask the data protection authority for input when drafting a new law
    that involves personal data?
  - Do ministries have to consult the privacy regulator when preparing regulations about data processing?
  - We're building a public service app and a new bill on data use is being drafted. Does the regulator
    get a say during drafting?
  ar:
  - هل الدولة ملزمة باستشارة هيئة حماية البيانات عند صياغة قانون جديد يتعلق بمعالجة البيانات الشخصية؟
  - هل يجب على الجهات الحكومية استشارة السلطة الرقابية عند إعداد لوائح تخص معالجة البيانات؟
  - يجهزون مشروع قانون عن استخدام البيانات، هل لازم تؤخذ رأي هيئة حماية البيانات وقت الصياغة؟
- key: gdpr:art-36:para-5
  text: 18c1bb326094fa93
  en:
  - Can a country require us to get the regulator's approval before running a public health data project?
  - We run a social benefits portal for a government agency. Might national law require authorisation
    before we start processing?
  - Besides consulting, can local law force a controller doing public-interest work to get permission
    from the data authority first?
  ar:
  - هل يمكن لدولة أن تشترط الحصول على موافقة الهيئة الرقابية قبل تشغيل مشروع بيانات صحية عامة؟
  - نشغّل بوابة للمساعدات الاجتماعية لصالح جهة حكومية، هل قد يفرض القانون الوطني إذناً مسبقاً قبل المعالجة؟
  - غير الاستشارة، هل ممكن القانون المحلي يلزم الجهة اللي تشتغل بمهمة للمصلحة العامة تاخذ تصريح من هيئة
    البيانات أول؟
- key: gdpr:art-37:para-1
  text: 334e7f453eec586c
  en:
  - When is my company required to appoint a DPO?
  - We're a SaaS startup handling customer data; do we have to name a data protection officer or can we
    skip it?
  - Which kinds of businesses must have a data protection officer, and what triggers it?
  ar:
  - متى يجب على شركتي تعيين مسؤول حماية بيانات؟
  - هل يلزمنا كشركة برمجيات تعيين مسؤول حماية بيانات أم يمكن الاستغناء عنه؟
  - شنو الحالات اللي لازم فيها نعيّن DPO في شركتنا؟
- key: gdpr:art-37:para-1:pt-a
  text: c9037dd344f9eec2
  en:
  - We build an app for a city council; does it need a DPO because it's a public body?
  - Is a DPO mandatory for a government agency or public hospital running our software?
  - Do courts have to appoint a data protection officer when they process data while judging cases?
  ar:
  - نطوّر تطبيقاً لبلدية، هل يجب أن يكون لديها مسؤول حماية بيانات لأنها جهة عامة؟
  - هل تعيين مسؤول حماية البيانات إلزامي على المؤسسات الحكومية والمستشفيات العامة؟
  - احنا نشتغل مع جهة حكومية، لازم يكون عندهم DPO ولا لا؟
- key: gdpr:art-37:para-1:pt-b
  text: 786057ccb71b83f8
  en:
  - Our app tracks users' location and behavior all the time across thousands of users; do we need a DPO?
  - Do we need a data protection officer if our core business is analytics that profiles website visitors
    at scale?
  - Does an ad-tech or fleet-tracking company that continuously monitors people have to appoint a DPO?
  ar:
  - تطبيقنا يتتبع موقع وسلوك آلاف المستخدمين باستمرار، هل نحتاج مسؤول حماية بيانات؟
  - هل يلزم تعيين مسؤول حماية بيانات إذا كان نشاطنا الأساسي تحليل سلوك زوار المواقع على نطاق واسع؟
  - تطبيقنا يراقب المستخدمين طول الوقت وعندنا ناس كتير، لازم نوظف DPO؟
- key: gdpr:art-37:para-1:pt-c
  text: 2c05df48429dbd77
  en:
  - We run a telehealth app storing lots of patient health records; must we appoint a DPO?
  - Does a background-check service handling criminal record data for many people need a data protection
    officer?
  - Is a DPO required if our main product processes biometric or health data on a large scale?
  ar:
  - نشغّل تطبيق طب عن بعد يخزّن سجلات صحية كثيرة للمرضى، هل يجب تعيين مسؤول حماية بيانات؟
  - هل تحتاج شركة فحص خلفيات تعالج بيانات السوابق الجنائية لعدد كبير من الناس إلى مسؤول حماية بيانات؟
  - منتجنا الأساسي يعالج بيانات صحية وبصمات بكميات كبيرة، لازم عندنا DPO؟
- key: gdpr:art-37:para-2
  text: 049351d2c7398cfd
  en:
  - We're a group of companies with offices in several countries; can we share one DPO?
  - Can a parent company and its subsidiaries appoint a single data protection officer?
  - What condition applies if one DPO covers all the branches of our corporate group?
  ar:
  - نحن مجموعة شركات لها فروع في عدة دول، هل يمكن أن يكون لنا مسؤول حماية بيانات واحد؟
  - هل يجوز للشركة الأم والشركات التابعة تعيين مسؤول حماية بيانات واحد مشترك؟
  - عندنا كذا شركة تابعة، ينفع DPO واحد يغطيهم كلهم ولا لازم لكل وحدة؟
- key: gdpr:art-37:para-3
  text: 4801012162b520e0
  en:
  - We provide software to several municipal offices; can they share one DPO?
  - Can multiple public bodies, like a few small schools, appoint the same data protection officer?
  - How does size or structure affect whether public authorities can share a DPO?
  ar:
  - نوفّر برمجيات لعدة مكاتب بلدية، هل يمكنها الاشتراك في مسؤول حماية بيانات واحد؟
  - هل يجوز لعدة جهات عامة مثل مدارس صغيرة أن تعيّن نفس مسؤول حماية البيانات؟
  - المدارس الحكومية عندنا صغيرة، ممكن كلها تاخد DPO واحد؟
- key: gdpr:art-37:para-4
  text: bf8cecb91eba2cfe
  en:
  - We don't meet the legal triggers for a DPO; can we still appoint one voluntarily?
  - Can an industry association appoint a DPO to act for its member companies?
  - Could national law force us to have a DPO even if the EU rules don't?
  ar:
  - لا تنطبق علينا حالات إلزام تعيين مسؤول حماية بيانات، هل يمكننا تعيين واحد طوعاً؟
  - هل يمكن لاتحاد مهني تعيين مسؤول حماية بيانات يعمل لصالح الشركات الأعضاء؟
  - ممكن قانون بلدنا يجبرنا على DPO حتى لو مو مطلوب من القانون الأوروبي؟
- key: gdpr:art-37:para-5
  text: c1b2335d39ee3566
  en:
  - What qualifications should a person have to be our DPO?
  - Can we just give the DPO title to a developer with no privacy background?
  - What skills and knowledge do we look for when hiring a data protection officer?
  ar:
  - ما المؤهلات المطلوبة فيمن نعيّنه مسؤول حماية بيانات؟
  - هل يمكن أن نعطي لقب DPO لمطوّر ليست لديه خبرة في الخصوصية؟
  - أي خبرات ومعرفة لازم نبحث عنها لما نوظف DPO؟
- key: gdpr:art-37:para-6
  text: a53a7696a83f7eee
  en:
  - Can we hire an outside consultant as our DPO instead of an employee?
  - Does our data protection officer have to be on payroll?
  - Is outsourcing the DPO role to a law firm on a contract allowed?
  ar:
  - هل يمكننا الاستعانة باستشاري خارجي ليكون مسؤول حماية البيانات بدلاً من موظف؟
  - هل يجب أن يكون مسؤول حماية البيانات موظفاً لدينا؟
  - ينفع نتعاقد مع شركة خارجية تكون هي الـ DPO عندنا؟
- key: gdpr:art-37:para-7
  text: 2a3a703057fead1a
  en:
  - Do we need to put our DPO's email on our website or privacy policy?
  - Do we have to tell the data protection authority who our DPO is?
  - We just appointed a DPO; what do we have to do with their contact info?
  ar:
  - هل يجب نشر بريد مسؤول حماية البيانات على موقعنا أو في سياسة الخصوصية؟
  - هل يتوجب إبلاغ سلطة حماية البيانات بتفاصيل التواصل مع مسؤول الحماية؟
  - عيّنا DPO جديد، وش المطلوب نسويه ببيانات التواصل معاه؟
- key: gdpr:art-38:para-1
  text: dc98a48c6d3f6d1b
  en:
  - Do we have to loop in our DPO when we plan a new feature that uses customer data, and when should
    that happen?
  - Our product team launched a tracking feature and only told the privacy officer afterwards. Is that
    a problem?
  - Which decisions in the company need the data protection officer to be involved?
  ar:
  - هل يجب إشراك مسؤول حماية البيانات في وقت مبكر عند تخطيط ميزة جديدة في التطبيق تستخدم بيانات العملاء؟
  - متى لازم نشاور مسؤول حماية البيانات؟ هل نخبره بعد ما نطلق الميزة ولا قبل؟
  - عندنا مسؤول خصوصية بس الفريق ما يرجعله بالقرارات اللي فيها بيانات شخصية، هل هذا مسموح؟
- key: gdpr:art-38:para-2
  text: 5019eacdab2e3634
  en:
  - What resources, like budget, staff and training, do we have to give our data protection officer?
  - Can our DPO demand access to our databases and processing systems to do their job?
  - Does the company need to pay for our DPO's courses and certifications to keep their knowledge current?
  ar:
  - ما الموارد التي يجب على الشركة توفيرها لمسؤول حماية البيانات كي يؤدي مهامه؟
  - هل يحق لمسؤول حماية البيانات الوصول إلى قواعد البيانات وأنظمة المعالجة لدينا؟
  - المسؤول عن الخصوصية عندنا يبي ميزانية وتدريب، لازم نوفرها له ولا اختياري؟
- key: gdpr:art-38:para-3
  text: f9f61b9e1aea076a
  en:
  - Can the CEO tell our DPO what conclusion to reach on a privacy assessment?
  - Can we fire or demote our data protection officer because they blocked a product launch over privacy
    concerns?
  - Who should the DPO report to in the organisation, and does it have to be top management?
  ar:
  - هل يجوز للمدير التنفيذي أن يوجّه مسؤول حماية البيانات إلى نتيجة معينة في تقييمه؟
  - هل يمكن فصل مسؤول حماية البيانات أو معاقبته لأنه اعترض على إطلاق ميزة بسبب الخصوصية؟
  - مسؤول الخصوصية عندنا تابع لمدير القسم، لازم يرفع تقاريره للإدارة العليا مباشرة؟
- key: gdpr:art-38:para-4
  text: 633aa1ef6d96e81a
  en:
  - A user of our app wants to ask about their data and deletion request. Can they write straight to our
    DPO?
  - Can customers go to the DPO instead of regular support when they have a complaint about how their
    data is used?
  ar:
  - مستخدم في تطبيقنا يريد الاستفسار عن بياناته وطلب حذفها، هل يحق له مراسلة مسؤول حماية البيانات مباشرة؟
  - العميل يقدر يكلم مسؤول الخصوصية بدل الدعم العادي إذا عنده شكوى على بياناته؟
- key: gdpr:art-38:para-5
  text: dd48ed6db79dfdc7
  en:
  - Is our DPO required to keep things confidential, like what employees or users report to them?
  - Can the DPO share details of a user's privacy complaint with the sales team?
  - Does our data protection officer have a secrecy obligation about their work?
  ar:
  - هل مسؤول حماية البيانات ملزم بالسرية بشأن ما يُبلَّغ به من موظفين أو مستخدمين؟
  - هل يجوز لمسؤول حماية البيانات إطلاع فريق المبيعات على تفاصيل شكوى خصوصية من مستخدم؟
  - مسؤول الخصوصية عندنا لازم يحافظ على سرية شغله ولا يقدر يشارك التفاصيل؟
- key: gdpr:art-38:para-6
  text: 9f9d9d674d099426
  en:
  - Can our DPO also work as head of IT or marketing at the same time?
  - Our startup wants one person to be both DPO and product lead. Is that allowed?
  ar:
  - هل يمكن أن يعمل مسؤول حماية البيانات في الوقت نفسه مديرًا لتقنية المعلومات أو التسويق؟
  - شركتنا الناشئة تبي شخص واحد يكون مسؤول الخصوصية ومدير المنتج، هل يصير؟
  - هل يجوز لمسؤول حماية البيانات تولي مهام أخرى، وما الحدود حتى لا يحصل تعارض مصالح؟
- key: gdpr:art-39:para-1
  text: a724aaaf95672aed
  en:
  - What are the minimum responsibilities our company's data protection officer has to take on?
  - We just appointed a DPO for our app company; what should we expect them to actually do day to day?
  - Is there a baseline list of duties we can put in our DPO's job description?
  ar:
  - ما هي المهام الأدنى التي يجب أن يتولاها مسؤول حماية البيانات في شركتنا؟
  - عيّنا مسؤول حماية بيانات لتطبيقنا، فما الأعمال التي ينبغي أن يقوم بها على الأقل؟
  - شو المفروض يسوي الـ DPO عندنا؟ يعني وش واجباته الأساسية عشان نكتبها في الوصف الوظيفي؟
- key: gdpr:art-39:para-1:pt-a
  text: 8b67fd11a28567f4
  en:
  - Does our DPO have to advise our developers and support staff on what the privacy rules require of
    them?
  - Our online shop's team keeps asking how to handle customer data legally; is the DPO supposed to guide
    them?
  - Is giving privacy guidance to the company and its employees part of the DPO's job?
  ar:
  - هل على مسؤول حماية البيانات أن يقدّم المشورة للمطورين وفريق الدعم بشأن التزاماتهم في معالجة البيانات؟
  - هل يدخل في مهام مسؤول حماية البيانات إبلاغ الشركة وموظفيها بما يفرضه القانون عليهم؟
  - الموظفين عندنا ما يعرفون وش يسوون ببيانات العملاء، هل الـ DPO هو اللي يوجههم وينصحهم؟
- key: gdpr:art-39:para-1:pt-b
  text: d82a35f9eb4ac628
  en:
  - Is the DPO responsible for checking that our team actually follows our internal privacy policies?
  - Who should run privacy training and audits for staff at our clinic app, and does that fall to the
    DPO?
  - Does the DPO have to assign who is responsible for what in data handling and monitor compliance?
  ar:
  - هل مسؤول حماية البيانات هو من يراقب التزام فريقنا بسياسات الخصوصية الداخلية والقانون؟
  - من المسؤول عن تدريب الموظفين ورفع وعيهم وإجراء التدقيق على حماية البيانات، وهل هذا من عمل المسؤول؟
  - الـ DPO لازم يسوي تدقيق ويدرب الموظفين ويوزع المسؤوليات ولا هذا شغل ثاني؟
- key: gdpr:art-39:para-1:pt-c
  text: eb3ce6fbe86558a9
  en:
  - We're launching a feature that profiles users; should our DPO weigh in on the impact assessment?
  - Does the DPO have to carry out the DPIA, or only advise and check how it's done?
  - Our product team is doing a risk assessment for a new data-heavy feature; what role does the DPO play?
  ar:
  - سنطلق ميزة تحلل سلوك المستخدمين، فهل يقدم مسؤول حماية البيانات المشورة في تقييم الأثر؟
  - هل ينفذ مسؤول حماية البيانات تقييم الأثر بنفسه أم يكتفي بالنصح ومتابعة تنفيذه؟
  - فريق المنتج يسوي DPIA لخاصية جديدة، وش دور الـ DPO فيها؟
- key: gdpr:art-39:para-1:pt-d
  text: 56037a5fe3436648
  en:
  - Is our DPO required to work with the data protection regulator if they come asking questions?
  - A regulator is investigating our app; does the DPO have to cooperate with them?
  - What is the DPO's duty towards the privacy authority?
  ar:
  - هل يلتزم مسؤول حماية البيانات بالتعاون مع هيئة حماية البيانات الرقابية؟
  - هيئة الرقابة بدأت تحقق في تطبيقنا، فهل على مسؤول حماية البيانات التعاون معها؟
  - الـ DPO لازم يتعاون مع الجهة المشرفة على الخصوصية ولا لا؟
- key: gdpr:art-39:para-1:pt-e
  text: 8d0a7ca9f1ad0c5b
  en:
  - Who in our company should be the point of contact for the data protection authority?
  - We need to consult the regulator before launching a risky data processing feature; is the DPO the
    one who handles that?
  - Can the DPO reach out to the authority on other privacy matters too, or only on processing issues?
  ar:
  - من الشخص الذي يجب أن يكون حلقة الوصل بين شركتنا وسلطة حماية البيانات؟
  - نحتاج استشارة الجهة الرقابية مسبقاً قبل إطلاق معالجة عالية الخطورة، فهل يتولى ذلك مسؤول حماية البيانات؟
  - مين يكون نقطة التواصل مع هيئة حماية البيانات عندنا؟ هل هو الـ DPO؟
- key: gdpr:art-39:para-2
  text: 1ebf98c752d9a571
  en:
  - Should our DPO focus more on high-risk data processing than on routine stuff?
  - How should the DPO decide what to prioritize given the size and type of data we handle?
  - We're a small startup with low-risk data; does the DPO's workload depend on how risky our processing
    is?
  ar:
  - هل ينبغي أن يركز مسؤول حماية البيانات على المعالجات الأكثر خطورة أكثر من الروتينية؟
  - كيف يحدد مسؤول حماية البيانات أولوياته بحسب طبيعة ونطاق وغرض معالجة البيانات لدينا؟
  - احنا شركة ناشئة وبياناتنا قليلة المخاطر، هل شغل الـ DPO يعتمد على درجة خطورة المعالجة؟
- key: gdpr:art-40:para-1
  text: 3af785804b040b17
  en:
  - Are regulators supposed to support industry-specific privacy guidelines that help small startups comply?
  - We're a tiny SaaS company and GDPR feels overwhelming; is there any sector-tailored compliance guidance
    meant to take our size into account?
  - Who is expected to promote the creation of sector privacy codes of conduct?
  ar:
  - هل تشجع الجهات الرقابية على إعداد مدونات سلوك خاصة بكل قطاع لتسهيل الامتثال للائحة حماية البيانات؟
  - نحن شركة ناشئة صغيرة ومش قادرين نفهم كل متطلبات حماية البيانات، فيه إرشادات حسب القطاع تراعي حجم الشركات
    الصغيرة؟
  - من الجهات المطلوب منها تحفيز وضع مدونات السلوك في مجال حماية البيانات؟
- key: gdpr:art-40:para-2
  text: 90db7607c17722a8
  en:
  - Can our industry association write its own privacy code of conduct for member companies?
  - Our trade group of online retailers wants to publish shared data protection rules; are we allowed
    to, and what can they cover?
  - Can an existing sector code be updated or expanded by the association that created it?
  ar:
  - هل يجوز لاتحاد أو جمعية مهنية إعداد مدونة سلوك لحماية البيانات خاصة بأعضائها؟
  - جمعيتنا تجمع شركات التجارة الإلكترونية وعايزين نكتب قواعد موحدة للخصوصية، هل مسموح لنا وإيش المواضيع
    اللي ممكن تغطيها؟
  - هل يمكن للجهة التي أعدت مدونة السلوك تعديلها أو توسيع نطاقها لاحقاً؟
- key: gdpr:art-40:para-2:pt-a
  text: bda359353becf8f5
  en:
  - Can a sector code of conduct spell out what fair and transparent data handling means for our industry?
  - Our industry group wants common rules on being open with users about how their data is used; can a
    code cover that?
  - Is transparency in data processing something an industry code can specify?
  ar:
  - هل تستطيع مدونة سلوك قطاعية أن توضح معنى المعالجة العادلة والشفافة للبيانات في مجالنا؟
  - جمعيتنا تريد قواعد موحدة للشفافية مع المستخدمين حول استخدام بياناتهم، هل يمكن لمدونة السلوك تغطية
    ذلك؟
  - وش المقصود إن المدونة تحدد كيف نكون شفافين وعادلين في معالجة بيانات الناس؟
- key: gdpr:art-40:para-2:pt-b
  text: ca304365a4c488a4
  en:
  - Can an industry code explain when companies in our sector can rely on legitimate interest for processing?
  - Our ad-tech trade body wants shared guidance on using legitimate interest as a legal basis; is that
    something a code can address?
  - Can a code of conduct define what counts as a company's legitimate interest in a particular context?
  ar:
  - هل يمكن لمدونة سلوك أن توضح متى يجوز لشركات قطاعنا الاستناد إلى المصلحة المشروعة في المعالجة؟
  - اتحاد شركات الإعلانات عندنا يبغى يوحد فهم المصلحة المشروعة كأساس للمعالجة، هل تقدر المدونة تتناول
    هذا؟
  - ممكن المدونة تحدد إيش المصالح المشروعة للجهات المسؤولة في سياقات معينة؟
- key: gdpr:art-40:para-2:pt-c
  text: d2345685a3989c29
  en:
  - Can a sector code set rules for how members collect personal data from users?
  - Our industry body wants standard practices for what data apps can gather at signup; can a code cover
    data collection?
  - Is the way we collect customer data something an approved industry code can specify?
  ar:
  - هل يمكن لمدونة سلوك قطاعية أن تضع قواعد لكيفية جمع الأعضاء للبيانات الشخصية؟
  - جمعيتنا تبغى توحد ممارسات جمع بيانات المستخدمين عند التسجيل، هل تغطي المدونة موضوع الجمع؟
  - هل طريقة جمع بيانات العملاء ممكن تحددها مدونة سلوك للقطاع؟
- key: gdpr:art-40:para-2:pt-d
  text: f9cf108feb9afa6d
  en:
  - Can an industry code of conduct set standards for pseudonymising user data?
  - Our health-tech association wants common rules for masking identifiers in datasets; can a code address
    that?
  - Does a code of conduct allow specifying how pseudonymisation should be done in our sector?
  ar:
  - هل تستطيع مدونة سلوك أن تضع معايير موحدة لاستخدام الأسماء المستعارة أو ترميز بيانات المستخدمين؟
  - جمعية التقنية الصحية عندنا تبغى قواعد مشتركة لإخفاء المعرفات في البيانات، هل تشملها المدونة؟
  - هل يجوز تحديد طريقة التشفير الجزئي للهوية (pseudonymisation) ضمن مدونة قطاعية؟
- key: gdpr:art-40:para-2:pt-e
  text: 5282bdcc4da0ac11
  en:
  - Can a code of conduct standardise the privacy notices that companies in our sector show users?
  - Our trade group wants a common format for telling the public and customers how their data is used;
    is that allowed in a code?
  - Can an industry code specify what information must be given to data subjects?
  ar:
  - هل يمكن لمدونة سلوك أن توحد إشعارات الخصوصية التي تعرضها شركات القطاع على المستخدمين؟
  - اتحادنا يريد صيغة موحدة لإبلاغ الجمهور والعملاء بكيفية استخدام بياناتهم، هل تسمح المدونة بذلك؟
  - وش المعلومات اللي لازم تنعطى لأصحاب البيانات ممكن تحددها مدونة السلوك؟
- key: gdpr:art-40:para-2:pt-f
  text: b8f28be05aa38a21
  en:
  - Can an industry code say how companies should handle users' requests to access or delete their data?
  - Our association wants one standard process for data subject requests across members; can a code of
    conduct cover this?
  - Is the way people exercise their privacy rights something a sector code can detail?
  ar:
  - هل يمكن لمدونة سلوك قطاعية أن تحدد كيفية تعامل الشركات مع طلبات المستخدمين بالوصول إلى بياناتهم أو
    حذفها؟
  - جمعيتنا تبغى إجراء موحد لطلبات أصحاب البيانات بين الأعضاء، هل تغطيه المدونة؟
  - هل ممكن المدونة تفصّل كيف يمارس الأفراد حقوقهم في الخصوصية؟
- key: gdpr:art-40:para-2:pt-g
  text: 8b06d6b50b485706
  en:
  - Can a code of conduct set rules for protecting kids in apps and getting parental consent?
  - We run an educational app for children; can an industry code specify how to get a parent's permission?
  - Is child data protection and verifying parental consent something sector guidelines can cover?
  ar:
  - هل يمكن لمدونة سلوك أن تضع قواعد لحماية الأطفال في التطبيقات وكيفية الحصول على موافقة الوالدين؟
  - عندنا تطبيق تعليمي للأطفال، هل تقدر مدونة قطاعية تحدد طريقة أخذ إذن ولي الأمر؟
  - هل المعلومات الموجهة للأطفال وحمايتهم ممكن تنظمها مدونة سلوك؟
- key: gdpr:art-40:para-2:pt-h
  text: a59c6240f7363ac0
  en:
  - Can a sector code spell out the technical and organisational security measures members should adopt?
  - Our fintech association wants common baseline security controls for data protection by design; can
    a code cover that?
  - Can a code of conduct detail how companies show they are accountable and keep data secure?
  ar:
  - هل يمكن لمدونة سلوك قطاعية أن تحدد الإجراءات الأمنية التقنية والتنظيمية التي على الأعضاء اعتمادها؟
  - اتحاد التقنية المالية عندنا يريد حداً أدنى موحداً لضوابط الأمان والخصوصية من التصميم، هل تغطيه المدونة؟
  - هل تستطيع المدونة تفصيل كيف تثبت الشركات مسؤوليتها وتؤمّن البيانات؟
- key: gdpr:art-40:para-2:pt-i
  text: 6b2b809d9fca1330
  en:
  - Can an industry code set out how members report data breaches to regulators and tell affected users?
  - Our association wants a shared breach response procedure; can a code of conduct cover notifying authorities
    and customers?
  - Is the process of announcing a data leak something sector rules can be specified for?
  ar:
  - هل يمكن لمدونة سلوك أن تحدد كيف يبلغ الأعضاء الجهات الرقابية والمستخدمين عند حدوث خرق للبيانات؟
  - جمعيتنا تبغى إجراء موحد للتعامل مع تسريب البيانات وإبلاغ العملاء والجهة الرقابية، هل تشمله المدونة؟
  - هل يجوز أن تنظم مدونة قطاعية آلية الإبلاغ عن اختراق البيانات؟
- key: gdpr:art-40:para-2:pt-j
  text: b45e62eefd8e561a
  en:
  - Can a code of conduct set rules for sending personal data to servers or partners outside the EU?
  - Our cloud industry group wants common standards for international data transfers; can a code address
    that?
  - Is cross-border data transfer something an industry code can specify?
  ar:
  - هل يمكن لمدونة سلوك أن تضع قواعد لنقل البيانات الشخصية إلى خوادم أو شركاء خارج الاتحاد الأوروبي؟
  - مجموعة شركات الحوسبة السحابية عندنا تبغى معايير موحدة لنقل البيانات دولياً، هل تغطيها المدونة؟
  - هل يمكن لمدونة قطاعية أن تنظم نقل البيانات عبر الحدود؟
- key: gdpr:art-40:para-2:pt-k
  text: b9424664862224d2
  en:
  - Can a code of conduct set up an out-of-court way to settle user privacy complaints against members?
  - Our association wants a mediation process for customer data disputes; is that allowed, and can users
    still go to court or a regulator?
  - Does using an industry dispute resolution scheme take away a person's right to complain to the authority
    or sue?
  ar:
  - هل يمكن لمدونة سلوك أن تنشئ آلية لتسوية شكاوى الخصوصية بين المستخدمين والأعضاء خارج المحكمة؟
  - جمعيتنا تريد نظام وساطة لنزاعات بيانات العملاء، هل هذا جائز وهل يظل حق المستخدم في اللجوء للقضاء أو
    الجهة الرقابية؟
  - هل يسقط حق الشخص في الشكوى للهيئة أو رفع دعوى إذا استخدمنا آلية تسوية النزاعات في المدونة؟
- key: gdpr:art-40:para-3
  text: 932f1dc86906140b
  en:
  - We're a non-EU company outside GDPR's scope; can we sign up to an approved code of conduct to receive
    EU personal data?
  - What do non-EU processors have to commit to if they use a code of conduct as a safeguard for data
    transfers?
  - Can a code of conduct replace other transfer mechanisms for a US vendor receiving European customer
    data?
  ar:
  - شركتنا خارج الاتحاد الأوروبي وغير خاضعة للائحة، هل نقدر ننضم لمدونة سلوك معتمدة لاستقبال بيانات أوروبية؟
  - ما الذي يجب أن تلتزم به الجهات غير الأوروبية عند الاعتماد على مدونة سلوك كضمانة لنقل البيانات؟
  - هل تصلح مدونة السلوك المعتمدة كضمانة لنقل بيانات العملاء الأوروبيين إلى مزود خدمة في أمريكا؟
- key: gdpr:art-40:para-4
  text: a6540368194ca26a
  en:
  - Who checks that companies actually follow the code of conduct they signed up to?
  - Does having a code of conduct stop the data protection authority from investigating us?
  - What must an industry code include so compliance by its members can be monitored?
  ar:
  - من الذي يراقب التزام الشركات بمدونة السلوك التي انضمت إليها؟
  - هل انضمامنا لمدونة سلوك يمنع هيئة حماية البيانات من التحقيق معنا؟
  - ما الذي يجب أن تتضمنه المدونة حتى يمكن مراقبة التزام الأعضاء بها؟
- key: gdpr:art-40:para-5
  text: 195d53cce0715126
  en:
  - Our association drafted a privacy code; who do we send it to for approval?
  - What does the regulator do when we submit a draft code of conduct, and when will it approve?
  - We want to update our existing industry code; do we need to get the changes approved again?
  ar:
  - جمعيتنا أعدّت مسودة مدونة سلوك للخصوصية، لمن نرسلها للموافقة؟
  - ماذا تفعل الجهة الرقابية عندما نقدم مسودة المدونة ومتى توافق عليها؟
  - نبغى نعدل مدونة القطاع الحالية، هل لازم تعتمد التعديلات من جديد؟
- key: gdpr:art-40:para-6
  text: 42cb87a449cb236a
  en:
  - After a national code of conduct is approved, does the regulator publish it?
  - Our code only covers companies in one country; what happens once it gets approved?
  - Where can I find a registered code of conduct that applies only within a single member state?
  ar:
  - بعد اعتماد مدونة سلوك وطنية، هل تقوم الجهة الرقابية بنشرها؟
  - مدونتنا تخص شركات في دولة واحدة فقط، ماذا يحدث بعد الموافقة عليها؟
  - أين أجد مدونة سلوك مسجلة تخص دولة عضو واحدة فقط؟
- key: gdpr:art-40:para-7
  text: f3209901c7c5572e
  en:
  - Our code of conduct covers companies in several EU countries; does it need European-level review before
    approval?
  - When does the European Data Protection Board give an opinion on a draft code?
  - Who evaluates a cross-border industry code before the national regulator approves it?
  ar:
  - مدونتنا تشمل شركات في عدة دول أوروبية، هل تحتاج مراجعة على المستوى الأوروبي قبل الاعتماد؟
  - متى يصدر المجلس الأوروبي لحماية البيانات رأيه في مسودة مدونة السلوك؟
  - من يقيّم مدونة قطاعية عابرة للحدود قبل موافقة الجهة الوطنية عليها؟
- key: gdpr:art-40:para-8
  text: 370da78521f2daba
  en:
  - After the Board says a multi-country code complies, what happens next?
  - Does the Board's positive opinion on a code go to the European Commission?
  - What is the step after a cross-border code of conduct gets a favourable opinion?
  ar:
  - بعد أن يقرر المجلس الأوروبي أن مدونة متعددة الدول مطابقة، ما الخطوة التالية؟
  - هل يُرفع رأي المجلس الإيجابي بشأن المدونة إلى المفوضية الأوروبية؟
  - ما الذي يحدث بعد حصول مدونة عابرة للحدود على رأي مؤيد؟
- key: gdpr:art-40:para-9
  text: 297ba7a4896ec362
  en:
  - How can a code of conduct become valid across the whole EU?
  - Can the European Commission make an approved code apply EU-wide?
  - What procedure does the Commission use to give a code general validity?
  ar:
  - كيف تصبح مدونة السلوك سارية في الاتحاد الأوروبي كله؟
  - هل تستطيع المفوضية الأوروبية جعل مدونة معتمدة صالحة على مستوى الاتحاد؟
  - ما الإجراء الذي تتبعه المفوضية لمنح المدونة صلاحية عامة؟
- key: gdpr:art-40:para-10
  text: 4a3bf77c85cce5de
  en:
  - Who makes sure that EU-wide valid codes of conduct are publicised?
  - Will the Commission announce codes that have been given general validity?
  - Where would I hear about codes that apply across the whole Union?
  ar:
  - من المسؤول عن الإعلان عن مدونات السلوك ذات الصلاحية العامة في الاتحاد؟
  - هل ستنشر المفوضية المدونات التي منحت صلاحية عامة؟
  - كيف أعرف بالمدونات السارية على مستوى الاتحاد كله؟
- key: gdpr:art-40:para-11
  text: 2e7fe27b8087ae43
  en:
  - Is there a public list of all approved GDPR codes of conduct?
  - Where can I look up approved codes, amendments and extensions to pick one for my company?
  - Who maintains the register of approved codes of conduct?
  ar:
  - هل توجد قائمة عامة بكل مدونات السلوك المعتمدة؟
  - وين ألقى المدونات المعتمدة وتعديلاتها عشان أختار وحدة لشركتي؟
  - من الجهة التي تحتفظ بسجل مدونات السلوك المعتمدة؟
- key: gdpr:art-41:para-1
  text: c80b9bb0c253fa95
  en:
  - Can an independent organization check whether companies follow an industry data-protection code of
    conduct we signed up to, or does only the regulator do that?
  - We want to become the body that monitors compliance with a privacy code for our sector. What do we
    need to have and who approves us?
  - Does the data protection authority still keep its own enforcement powers if a private monitoring body
    oversees a code of conduct?
  ar:
  - هل يمكن لجهة مستقلة غير الجهة الرقابية أن تراقب التزام الشركات بمدونة سلوك لحماية البيانات انضممنا
    إليها؟
  - نرغب في أن نصبح الجهة التي تراقب الالتزام بمدونة سلوك خاصة بقطاعنا، فما الذي نحتاجه ومن يعتمدنا؟
  - شو لازم يكون عندنا عشان نراقب التزام الشركات بكود سلوك الخصوصية؟ وهل لازم موافقة من هيئة حماية البيانات؟
- key: gdpr:art-41:para-2
  text: 4cdadb9988d4db9e
  en:
  - What conditions must an organization meet to be accredited as a monitor of a data protection code
    of conduct?
  - We're a consultancy wanting to audit app companies against an approved privacy code. What does the
    regulator check before accrediting us?
  - What is the full list of requirements a code monitoring body has to satisfy?
  ar:
  - ما الشروط التي يجب أن تستوفيها الجهة كي يتم اعتمادها لمراقبة الالتزام بمدونة سلوك حماية البيانات؟
  - نحن شركة استشارات ونريد تدقيق شركات التطبيقات وفق مدونة سلوك معتمدة، فما الذي تتحقق منه السلطة قبل
    اعتمادنا؟
  - إيش الشروط اللي لازم نستوفيها عشان ناخذ اعتماد كجهة مراقبة لكود السلوك؟
- key: gdpr:art-41:para-2:pt-a
  text: e24fc1e87b44342c
  en:
  - Our company wants to monitor a fintech privacy code but also sells consulting to fintechs. Does independence
    matter for accreditation?
  - What kind of expertise must a code monitoring body show to get accredited?
  ar:
  - شركتنا تريد مراقبة مدونة سلوك لشركات التقنية المالية وفي نفس الوقت نبيع لها خدمات استشارية، هل الاستقلالية
    مهمة للاعتماد؟
  - شو نوع الخبرة اللي لازم نثبتها عشان نتعتمد كجهة مراقبة؟
- key: gdpr:art-41:para-2:pt-b
  text: 427921aaee5eeafa
  en:
  - What internal procedures must a code monitoring body have to check if a company can join the code
    and keep following it?
  - We're setting up a body to oversee a privacy code for online shops. Do we need a process for checking
    members' eligibility and ongoing compliance?
  ar:
  - ما الإجراءات الداخلية التي يجب أن تضعها جهة المراقبة لتقييم أهلية الشركات للانضمام للمدونة ومتابعة
    التزامها؟
  - هل يجب على جهة مراقبة مدونة السلوك أن تراجع عمل المدونة بشكل دوري؟
  - نؤسس جهة تشرف على مدونة خصوصية للمتاجر الإلكترونية، هل لازم يكون عندنا آلية لفحص أهلية الأعضاء ومتابعة
    التزامهم؟
- key: gdpr:art-41:para-2:pt-c
  text: 1b8f9ccf5dbad173
  en:
  - A user wants to complain that an app company is not following the privacy code it signed. Does the
    monitoring body have to handle that complaint?
  - Do code monitoring bodies have to publish how their complaints process works?
  - What complaint-handling setup does a body need in order to get accredited for monitoring a code?
  ar:
  - مستخدم يريد تقديم شكوى بأن شركة تطبيقات لا تلتزم بمدونة السلوك التي انضمت إليها، هل على جهة المراقبة
    معالجة الشكوى؟
  - هل يجب على جهات مراقبة مدونات السلوك أن تعلن للجمهور كيف تعمل إجراءات الشكاوى لديها؟
  - وش نظام الشكاوى اللي لازم تنشئه الجهة عشان تتعتمد لمراقبة كود السلوك؟
- key: gdpr:art-41:para-2:pt-d
  text: fbc4d6da9e9c6247
  en:
  - Can a body that monitors a privacy code also have business ties with the companies it monitors?
  - Our monitoring body is owned partly by members of the code. Could that block our accreditation?
  ar:
  - هل يجوز لجهة تراقب مدونة سلوك الخصوصية أن تكون لها علاقات تجارية مع الشركات التي تراقبها؟
  - جهة المراقبة عندنا مملوكة جزئياً لأعضاء في المدونة، هل ممكن هذا يمنع اعتمادنا؟
- key: gdpr:art-41:para-3
  text: 0bd92ee1ac96e73b
  en:
  - Who decides the accreditation criteria for code monitoring bodies, and does the EU Board see them
    first?
  - Before a national regulator publishes its requirements for accrediting code monitors, does it need
    EU-level review?
  - Why are accreditation standards for monitoring bodies similar across EU countries?
  ar:
  - من يضع معايير اعتماد جهات مراقبة مدونات السلوك، وهل يطلع عليها المجلس الأوروبي لحماية البيانات أولاً؟
  - هل يجب أن تعرض السلطة الوطنية مسودة متطلبات اعتماد جهات المراقبة على مستوى الاتحاد الأوروبي قبل إقرارها؟
  - ليش معايير اعتماد جهات مراقبة المدونات متقاربة بين دول الاتحاد الأوروبي؟
- key: gdpr:art-41:para-4
  text: 186aeb68d4f4cd83
  en:
  - Can a code monitoring body kick our company out of the privacy code if we break its rules?
  - We were suspended from an industry privacy code. Does the monitoring body have to tell the regulator
    why?
  - What action can a monitoring body take against a member that violates the code, and does that stop
    the regulator from fining too?
  ar:
  - هل تستطيع جهة مراقبة مدونة السلوك استبعاد شركتنا من المدونة إذا خالفنا قواعدها؟
  - تم تعليق عضويتنا في مدونة سلوك الخصوصية، هل يجب على جهة المراقبة إبلاغ السلطة بالأسباب؟
  - شو الإجراءات اللي تقدر جهة المراقبة تاخذها ضد عضو مخالف للكود، وهل هذا يمنع السلطة من فرض غرامات؟
- key: gdpr:art-41:para-5
  text: 705315a5125ae4c4
  en:
  - When can the regulator take away a monitoring body's accreditation?
  - If the body that monitors our industry's privacy code stops meeting the standards, what happens to
    its approval?
  - Can accreditation be revoked if a monitoring body itself breaks data protection rules?
  ar:
  - متى يمكن للسلطة الرقابية سحب اعتماد جهة مراقبة مدونة السلوك؟
  - إذا توقفت الجهة التي تراقب مدونة قطاعنا عن استيفاء المعايير، ماذا يحدث لاعتمادها؟
  - هل يمكن إلغاء اعتماد جهة المراقبة إذا خالفت هي نفسها قواعد حماية البيانات؟
- key: gdpr:art-41:para-6
  text: 86db10e40ac1c897
  en:
  - Do the rules on accredited code monitoring bodies apply to a government agency's data processing?
  - We're a city council app. Do we have to go through an independent monitoring body for a privacy code?
  - Are public sector bodies exempt from third-party monitoring of codes of conduct?
  ar:
  - هل تنطبق أحكام جهات مراقبة مدونات السلوك المعتمدة على معالجة البيانات التي تقوم بها جهة حكومية؟
  - نحن تطبيق تابع لبلدية، هل علينا الخضوع لجهة مراقبة مستقلة لمدونة سلوك الخصوصية؟
  - هل الجهات العامة معفاة من مراقبة مدونات السلوك من طرف ثالث؟
- key: gdpr:art-42:para-1
  text: e22a4ff8a77d32b0
  en:
  - Is there an official badge or seal our SaaS can get to show customers that our data handling follows
    EU privacy rules?
  - We're a 10-person startup worried that privacy certifications are only for big companies. Are small
    businesses considered in these schemes?
  - Who is supposed to promote the creation of privacy certification programs and trust marks in the EU?
  ar:
  - هل توجد شهادة أو ختم رسمي يثبت للعملاء أن تطبيقنا يلتزم بقواعد حماية البيانات الأوروبية؟
  - شركتنا ناشئة وصغيرة، هل تراعي برامج شهادات الخصوصية احتياجات الشركات الصغيرة والمتوسطة؟
  - ابغى أعرف هل في ختم أو شهادة خصوصية نحطها على موقعنا نثبت فيها إننا ملتزمين بالقانون؟
- key: gdpr:art-42:para-2
  text: 0ff17a25bdef37a2
  en:
  - Our vendor is based outside the EU and not directly covered by GDPR. Can they use a certification
    to prove they protect data we send them?
  - We transfer customer data from our app to a processor in a third country. Can their certification
    count as a safeguard for the transfer?
  - What must a non-EU company promise if it relies on a privacy certificate for receiving personal data
    from Europe?
  ar:
  - مزود الخدمة عندنا خارج الاتحاد الأوروبي وغير خاضع للائحة، هل يقدر يستخدم شهادة لإثبات حماية البيانات
    التي نرسلها له؟
  - عند نقل بيانات العملاء إلى جهة في دولة ثالثة، هل يمكن اعتماد شهادتها كضمانة مناسبة للنقل؟
  - شركة برا أوروبا تبي تستخدم شهادة عشان تستلم بيانات أوروبية، ايش لازم تتعهد فيه؟
- key: gdpr:art-42:para-3
  text: 2535f0b9e6a70c66
  en:
  - Are we forced to get a privacy certification for our app, or is it optional?
  - Is the process for getting a data protection certificate supposed to be open and transparent?
  ar:
  - هل الحصول على شهادة حماية البيانات لتطبيقنا إلزامي أم اختياري؟
  - هل يجب أن تكون إجراءات منح شهادة حماية البيانات شفافة ومتاحة للجميع؟
  - يعني لازم اطلع شهادة خصوصية ولا عادي لو ما طلعتها؟
- key: gdpr:art-42:para-4
  text: c0143ffad000a285
  en:
  - If our online shop gets a privacy certificate, are we protected from fines if we later breach the
    rules?
  - Does having a data protection seal stop the regulator from investigating our company?
  - We got certified, so can we relax about our own GDPR duties as a controller?
  ar:
  - إذا حصل متجرنا الإلكتروني على شهادة خصوصية، هل يحمينا ذلك من الغرامات لو خالفنا القواعد لاحقًا؟
  - هل وجود ختم حماية البيانات يمنع الجهة الرقابية من التحقيق معنا؟
  - خذنا الشهادة، يعني خلاص نرتاح ومسؤوليتنا عن الالتزام تسقط؟
- key: gdpr:art-42:para-5
  text: d0a6bfe57ff9891f
  en:
  - Who actually hands out data protection certificates, and based on whose standards?
  - What is the European Data Protection Seal and how does a company end up with it?
  - Can the data protection authority itself certify our product, or does it have to be a private certifier?
  ar:
  - من هي الجهة التي تمنح شهادات حماية البيانات وعلى أي معايير تعتمد؟
  - ما هو ختم حماية البيانات الأوروبي وكيف يمكن لشركة الحصول عليه؟
  - هل تستطيع سلطة حماية البيانات نفسها إصدار الشهادة لنا أم يجب أن تكون جهة خاصة؟
- key: gdpr:art-42:para-6
  text: 9de4bec815ba4a92
  en:
  - We're applying for a privacy certification. What info and system access do we have to give the auditor?
  - Can a certification body ask to look inside our processing systems during the assessment?
  - Do we need to hand over everything the certifier asks for when our clinic app goes through certification?
  ar:
  - نتقدم للحصول على شهادة خصوصية، ما المعلومات والوصول الذي يجب أن نقدمه للمدقق؟
  - هل يحق لجهة الاعتماد الاطلاع على أنظمة معالجة البيانات لدينا أثناء التقييم؟
  - وقت نسوي التدقيق للشهادة، لازم نعطي الجهة كل اللي تطلبه من معلومات ودخول للأنظمة؟
- key: gdpr:art-42:para-7
  text: 748a7dfa9c982089
  en:
  - How long is a data protection certificate valid before we have to renew it?
  - Can our certification be taken away if we change how our app processes data and no longer meet the
    criteria?
  - Is renewing our privacy certificate automatic, or do we have to meet the same conditions again?
  ar:
  - كم مدة صلاحية شهادة حماية البيانات قبل أن نحتاج إلى تجديدها؟
  - هل يمكن سحب الشهادة منا إذا غيّرنا طريقة معالجة البيانات في تطبيقنا ولم نعد نستوفي المعايير؟
  - وش مدة الشهادة وهل تتجدد لوحدها ولا لازم نثبت الشروط من جديد؟
- key: gdpr:art-42:para-8
  text: fb67cd3612f1c8bc
  en:
  - Where can I look up the list of all approved privacy certifications and seals?
  - How can I find which certification schemes exist before choosing one for my company?
  ar:
  - أين أجد قائمة بجميع شهادات وأختام حماية البيانات المعتمدة؟
  - كيف أعرف أي برامج الشهادات موجودة قبل ما أختار وحدة لشركتي؟
- key: gdpr:art-43:para-1
  text: e5132ed1af3dd1fe
  en:
  - Who is allowed to issue and renew a GDPR privacy certification for my app, and who checks that they're
    qualified?
  - We want a data protection seal for our online shop. Does the certifier have to tell the regulator
    before giving it to us?
  - How do certification companies get approved to hand out data protection certificates in an EU country?
  ar:
  - من هي الجهات المخوّلة بإصدار وتجديد شهادة حماية البيانات لتطبيقنا، ومن يعتمدها؟
  - هل يجب على جهة التصديق إبلاغ السلطة الرقابية قبل منح شهادة الخصوصية لمتجرنا الإلكتروني؟
  - مين اللي يعتمد الشركات اللي تعطي شهادات حماية البيانات؟ السلطة ولا جهة الاعتماد الوطنية؟
- key: gdpr:art-43:para-1:pt-a
  text: ace4b3883b045629
  en:
  - Can the data protection regulator itself accredit a certification body that would certify our software?
  - Which authority's accreditation counts if a certifier wants to work in our country, the privacy regulator's?
  - Is accreditation directly by the supervisory authority a valid route for a certifier?
  ar:
  - هل يمكن للسلطة الرقابية لحماية البيانات أن تعتمد بنفسها جهة التصديق التي ستمنح شهادة لبرنامجنا؟
  - هل اعتماد جهة التصديق من السلطة المختصة وحدها كافٍ لتكون مؤهلة؟
  - الجهة اللي تعطينا شهادة الخصوصية ممكن تكون معتمدة من هيئة حماية البيانات مباشرة؟
- key: gdpr:art-43:para-1:pt-b
  text: 0d5ce0e15edcc328
  en:
  - Can a certifier be accredited by the national accreditation body instead of the privacy regulator?
  - What standard must a certifier meet if accredited through the national accreditation body, such as
    ISO 17065?
  - Does the privacy regulator add its own extra requirements for certifiers accredited by the national
    accreditation body?
  ar:
  - هل يمكن أن تكون جهة التصديق معتمدة من هيئة الاعتماد الوطنية بدل سلطة حماية البيانات؟
  - ما المعيار المطلوب من جهة التصديق المعتمدة عبر هيئة الاعتماد الوطنية، مثل ISO 17065؟
  - هل تضيف سلطة حماية البيانات شروطاً إضافية على جهات التصديق المعتمدة من هيئة الاعتماد؟
- key: gdpr:art-43:para-2
  text: d4eeaae651cfcbe2
  en:
  - What must a company prove before it can be accredited to certify other businesses' data protection?
  - We're starting a consultancy that wants to issue privacy certificates. What are the conditions for
    getting accredited?
  - What checks are there on whether a privacy certifier is trustworthy and properly set up?
  ar:
  - ما الشروط التي يجب أن تستوفيها شركة كي تُعتمد لمنح شهادات حماية البيانات؟
  - نحن شركة استشارات ونريد إصدار شهادات خصوصية، ما متطلبات الاعتماد؟
  - شنو لازم تثبت الشركة عشان تصير معتمدة تعطي شهادات حماية البيانات؟
- key: gdpr:art-43:para-2:pt-a
  text: 9a4dfe70055504c0
  en:
  - Does a certifier have to prove it is independent and knows the subject before being accredited?
  - Our auditing firm wants to certify mobile apps for privacy. What do we need to show the regulator
    about independence and expertise?
  - Who decides whether a certification body is independent and expert enough?
  ar:
  - هل يجب على جهة التصديق إثبات استقلاليتها وخبرتها قبل اعتمادها؟
  - شركة التدقيق لدينا تريد منح شهادات خصوصية للتطبيقات، ماذا نثبت للسلطة بشأن الاستقلال والخبرة؟
  - مين يقرر إذا كانت جهة التصديق مستقلة وعندها خبرة كافية؟
- key: gdpr:art-43:para-2:pt-b
  text: 892b420061148248
  en:
  - Does a certifier have to commit to the approved certification criteria to get accredited?
  - Can a certification body make up its own criteria for a privacy seal, or must it follow approved ones?
  - Which criteria must an accredited certifier promise to follow when assessing our product?
  ar:
  - هل يجب أن تتعهد جهة التصديق بالالتزام بمعايير الشهادة المعتمدة كي يتم اعتمادها؟
  - هل يمكن لجهة التصديق وضع معاييرها الخاصة لختم الخصوصية أم يجب اتباع معايير معتمدة؟
  - أي معايير لازم تلتزم فيها الجهة المعتمدة وهي تقيّم منتجنا؟
- key: gdpr:art-43:para-2:pt-c
  text: 1653001368b6d6ee
  en:
  - Must a certifier have a process for issuing, reviewing and withdrawing privacy seals?
  - Does a certification body need to re-check companies after giving them a data protection mark?
  - What procedures must a certifier have in place before accreditation regarding granting and taking
    back certificates?
  ar:
  - هل يجب أن يكون لدى جهة التصديق إجراءات لإصدار ختم الخصوصية ومراجعته وسحبه؟
  - هل على جهة التصديق مراجعة الشركات دورياً بعد منحها علامة حماية البيانات؟
  - ما الإجراءات المطلوبة من الجهة المانحة للشهادة بخصوص الإصدار والمراجعة والسحب؟
- key: gdpr:art-43:para-2:pt-d
  text: fc02e42c6fef8bae
  en:
  - If I think a company with a privacy seal isn't actually following it, who can I complain to and must
    that be public?
  - Does a certifier have to run a complaints process that users can see?
  - A customer says our certified app doesn't live up to its seal. Does the certifier have to handle that
    complaint?
  ar:
  - إذا شككت أن شركة حاصلة على ختم خصوصية لا تلتزم به، لمن أشتكي وهل يجب أن تكون الجهة معلنة؟
  - هل يجب على جهة التصديق أن يكون لديها نظام شكاوى شفاف للمستخدمين؟
  - عميل يقول إن تطبيقنا المعتمد لا يطبق الشهادة فعلاً، هل على جهة التصديق معالجة هالشكوى؟
- key: gdpr:art-43:para-2:pt-e
  text: 8f2bf3d8c78f0a9c
  en:
  - Can a company that also sells us consulting be the one certifying our privacy compliance?
  - Does a certification body have to show it has no conflict of interest?
  - What happens if a certifier's other business creates a conflict with its certifying role?
  ar:
  - هل يمكن لشركة تبيعنا الاستشارات أن تكون هي نفسها من تمنحنا شهادة الخصوصية؟
  - هل يجب على جهة التصديق أن تثبت عدم وجود تضارب مصالح؟
  - كيف يتعامل الاعتماد مع جهة تصديق أعمالها الأخرى تتعارض مع دورها؟
- key: gdpr:art-43:para-3
  text: 760b787aa4d14735
  en:
  - On what basis is a privacy certifier accredited, and who approves those requirements?
  - Do accreditation requirements for certifiers through the national accreditation body go beyond the
    general accreditation rules?
  - Who sets the requirements a company must meet to become an accredited data protection certifier?
  ar:
  - على أي أساس يتم اعتماد جهات التصديق على الخصوصية ومن يقرّ هذه المتطلبات؟
  - هل تكون متطلبات الاعتماد عبر هيئة الاعتماد الوطنية إضافية على القواعد العامة؟
  - من يحدد الشروط التي يجب أن تستوفيها جهة لتصبح معتمدة لمنح شهادات حماية البيانات؟
- key: gdpr:art-43:para-4
  text: cb64499472b1318a
  en:
  - If a certifier gives us a privacy certificate, are we still responsible for GDPR compliance?
  - How long does a certifier's accreditation last before it must be renewed?
  - Who is liable for a wrong assessment, the certification body or our company, if we got a seal?
  ar:
  - إذا منحتنا جهة التصديق شهادة خصوصية، هل نبقى مسؤولين عن الامتثال للائحة؟
  - كم مدة صلاحية اعتماد جهة التصديق قبل أن يجب تجديده؟
  - من المسؤول عن التقييم الخاطئ، جهة التصديق أم شركتنا الحاصلة على الختم؟
- key: gdpr:art-43:para-5
  text: 9d6ffb132a942555
  en:
  - Does the certifier have to tell the regulator why it gave or pulled our privacy certificate?
  - Will the data protection authority see the reasons for our certification being granted or withdrawn?
  - Our seal was withdrawn. Is the certifier required to explain this to the authorities?
  ar:
  - هل على جهة التصديق إبلاغ السلطة الرقابية بأسباب منح شهادتنا أو سحبها؟
  - هل ستطّلع سلطة حماية البيانات على أسباب منح أو سحب شهادة الخصوصية؟
  - تم سحب ختمنا، هل الجهة ملزمة تشرح الأسباب للسلطات؟
- key: gdpr:art-43:para-6
  text: 254ef9a6cf61b847
  en:
  - Where can I find the published criteria for getting a data protection certification?
  - Does the regulator have to publish certification requirements in a way that's easy to find?
  - Do national authorities send certification criteria to the European Data Protection Board?
  ar:
  - أين أجد المعايير المنشورة للحصول على شهادة حماية البيانات؟
  - هل يجب على السلطة نشر متطلبات الشهادة بشكل يسهل الوصول إليه؟
  - هل ترسل السلطات الوطنية معايير الاعتماد إلى المجلس الأوروبي لحماية البيانات؟
- key: gdpr:art-43:para-7
  text: 94bc63f1d891e221
  en:
  - Can a certification body lose its accreditation, and when?
  - Our certifier broke the rules. Can the regulator cancel its accreditation?
  - What if a certifier stops meeting the conditions after being accredited, who can revoke it?
  ar:
  - هل يمكن سحب اعتماد جهة التصديق ومتى يحدث ذلك؟
  - جهة التصديق التي نتعامل معها خالفت القواعد، هل يمكن للسلطة إلغاء اعتمادها؟
  - اذا الجهة ما عادت تستوفي الشروط بعد الاعتماد، مين يقدر يلغي اعتمادها؟
- key: gdpr:art-43:para-8
  text: 2cd80047ad1ec772
  en:
  - Can the European Commission set more detailed requirements for data protection certification schemes?
  - Who can specify extra requirements for privacy certification mechanisms through delegated acts?
  - Is the Commission allowed to adopt delegated rules on what privacy certification schemes must include?
  ar:
  - هل يمكن للمفوضية الأوروبية تحديد متطلبات تفصيلية لآليات اعتماد حماية البيانات؟
  - من يملك صلاحية تحديد متطلبات إضافية لآليات شهادات الخصوصية عبر أفعال مفوضة؟
  - هل يحق للمفوضية إصدار قواعد مفوضة بشأن ما يجب أن تتضمنه أنظمة شهادات الخصوصية؟
- key: gdpr:art-43:para-9
  text: e0c320c8f6498d31
  en:
  - Can the Commission set technical standards for privacy seals and marks?
  - Who can create mechanisms to promote and recognise data protection seals across the EU?
  - Are there EU-level technical rules for data protection certification that may be adopted later?
  ar:
  - هل يمكن للمفوضية وضع معايير تقنية لأختام وعلامات حماية البيانات؟
  - من يستطيع وضع آليات لتشجيع والاعتراف بأختام حماية البيانات في الاتحاد الأوروبي؟
  - فيه قواعد تقنية على مستوى الاتحاد لشهادات حماية البيانات ممكن تصدر لاحقاً؟
- key: gdpr:art-44
  text: 0509c89b8ca1b980
  en:
  - Our app's servers are in the US and we're sending EU users' data there. Do we have to meet any special
    conditions first?
  - If we use a cloud provider outside Europe, and that provider passes the data on to a subcontractor
    in another country, are we still responsible for keeping the protection level?
  - Can I just ship customer data to a third-party analytics tool based outside the EU without any checks?
  ar:
  - نحن ننقل بيانات مستخدمين أوروبيين إلى خوادم خارج الاتحاد الأوروبي، فما الشروط العامة التي يجب استيفاؤها
    قبل إجراء هذا النقل؟
  - هل يشترط أن يبقى مستوى حماية بيانات الأفراد قائمًا عندما يعاد نقل البيانات من الدولة الثالثة إلى جهة
    أو دولة أخرى؟
  - يا جماعة عندنا تطبيق وبدنا نبعت بيانات العملاء لشركة برّا أوروبا، لازم نعمل شي قبل ولا عادي؟
- key: gdpr:art-45:para-1
  text: 24eb93d06db1d6dc
  en:
  - Can my app send EU users' data to a server in a country the European Commission has approved without
    extra paperwork or permission?
  - We want to host our customer database in a non-EU country; does it matter whether that country is
    on the EU's approved list?
  - Do we need to ask a data protection authority for approval before transferring user data to a country
    with an adequacy decision?
  ar:
  - هل يجوز لتطبيقنا نقل بيانات المستخدمين الأوروبيين إلى دولة قررت المفوضية الأوروبية أن مستوى حمايتها
    كافٍ دون الحصول على إذن خاص؟
  - هل يكفي أن تكون الدولة التي نستضيف فيها بيانات عملائنا معتمدة من المفوضية الأوروبية حتى نتمكن من نقل
    البيانات إليها؟
  - يعني لو السيرفر حقنا في بلد معتمد من الاتحاد الأوروبي، نحتاج موافقة من أحد قبل ما ننقل البيانات ولا
    لا؟
- key: gdpr:art-45:para-2
  text: a89f1a05d74dfc5e
  en:
  - What does the EU look at when deciding whether a non-EU country protects personal data well enough?
  - How does the European Commission judge if a country's privacy protection is adequate before approving
    data transfers to it?
  - Why would a country's surveillance laws or privacy regulator matter for whether we can send it our
    users' data?
  ar:
  - ما هي العناصر التي تنظر فيها المفوضية الأوروبية عند تقييم كفاية مستوى حماية البيانات في دولة غير أوروبية؟
  - على أي أساس تقرر المفوضية أن بلداً ما يوفر حماية كافية للبيانات الشخصية؟
  - ليش بعض الدول تنقبل لنقل البيانات وبعضها لا؟ وش المعايير اللي يشوفونها؟
- key: gdpr:art-45:para-2:pt-a
  text: accf8616a112aee9
  en:
  - Does a country's rule of law, government access to data and ability for people to sue count when judging
    if it's safe to send our users' data there?
  - If a country lets its security agencies access personal data, can that affect whether it's approved
    for EU data transfers?
  - Do onward transfers and the right to complain to a court in the destination country factor into an
    adequacy assessment?
  ar:
  - هل تؤخذ سيادة القانون وصلاحيات الجهات الحكومية في الاطلاع على البيانات بعين الاعتبار عند تقييم كفاية
    الحماية في دولة ما؟
  - هل يؤثر وجود سبل انتصاف قضائية للأفراد وقواعد لإعادة نقل البيانات إلى دولة أخرى على اعتماد الدولة
    لنقل البيانات؟
  - لو الحكومة في البلد تقدر تدخل على بيانات الناس بسهولة، هل هذا يأثر على اعتماد البلد عند الاتحاد الأوروبي؟
- key: gdpr:art-45:para-2:pt-b
  text: 0aa7aff612f9c885
  en:
  - Does the destination country need an independent privacy regulator for the EU to approve it for data
    transfers?
  - Must a country have a data protection authority with enforcement powers that cooperates with EU regulators
    to be considered adequate?
  - Is it relevant that users abroad can get help from a local privacy authority when deciding if a country
    is safe to send data to?
  ar:
  - هل يشترط وجود جهة رقابية مستقلة لحماية البيانات في الدولة المستقبلة حتى تعتمدها المفوضية الأوروبية؟
  - هل يُنظر إلى صلاحيات الجهة الرقابية وتعاونها مع سلطات الدول الأعضاء عند تقييم كفاية الحماية؟
  - هل لازم يكون في البلد هيئة مستقلة تحمي البيانات وتساعد الناس عشان تعتبره الاتحاد الأوروبي آمن؟
- key: gdpr:art-45:para-2:pt-c
  text: b30e431337b29243
  en:
  - Do a country's international privacy treaties count toward being approved for EU data transfers?
  - Does joining data protection conventions or regional privacy frameworks help a country get an adequacy
    finding?
  - When the EU evaluates a country's privacy level, does it look at binding agreements the country has
    signed?
  ar:
  - هل تُحتسب الاتفاقيات الدولية الملزمة التي وقّعتها الدولة في مجال حماية البيانات عند تقييم كفاية الحماية؟
  - هل انضمام دولة إلى اتفاقيات أو منظومات إقليمية لحماية البيانات يؤثر في قرار اعتمادها؟
  - البلد اللي وقّع اتفاقيات دولية للخصوصية، هل يفيده هذا عند الاتحاد الأوروبي في قرار الكفاية؟
- key: gdpr:art-45:para-3
  text: 5a653efdc3e200ef
  en:
  - Who formally decides that a country or just one sector in it offers adequate data protection, and
    how is that decision made?
  - How often does the EU re-check a country that's on the approved list for data transfers?
  - Can an adequacy decision cover only part of a country, like a specific sector or territory, and where
    do I find out what it covers?
  ar:
  - من الجهة التي تصدر قرار أن دولة أو قطاعاً معيناً فيها يوفر مستوى حماية كافياً، وبأي أداة؟
  - كم مرة تُراجع المفوضية الأوروبية قرار الكفاية الخاص بدولة معتمدة؟
  - هل ممكن يكون القرار يشمل قطاع معين أو جزء من البلد بس؟ وين أعرف نطاقه؟
- key: gdpr:art-45:para-4
  text: b6cca3246dcc1e3c
  en:
  - Does the EU keep watching countries already approved for data transfers to see if things change?
  - Are older approvals made before the GDPR still being monitored by the Commission?
  - Who keeps track of legal changes in an approved country that could affect our data transfers?
  ar:
  - هل تراقب المفوضية الأوروبية باستمرار التطورات في الدول المعتمدة التي قد تؤثر على قرارات الكفاية؟
  - هل تشمل مراقبة المفوضية القرارات القديمة الصادرة قبل اللائحة العامة لحماية البيانات؟
  - مين يتابع التغيرات القانونية في البلد المعتمد اللي ممكن تأثر على نقل بياناتنا؟
- key: gdpr:art-45:para-5
  text: 98e72ef92e881301
  en:
  - What happens if the EU decides a country on the approved list no longer protects data well enough?
  - If an adequacy decision is withdrawn, does it affect transfers we already made earlier?
  ar:
  - ماذا يحدث إذا قررت المفوضية أن دولة معتمدة لم تعد توفر مستوى حماية كافياً للبيانات؟
  - هل يؤثر إلغاء قرار الكفاية على عمليات النقل التي تمت سابقاً؟
- key: gdpr:art-45:para-5:sub-2
  text: e5ea5a30a530ee41
  en:
  - Can the EU pull an adequacy approval immediately in an urgent situation?
  - Is there a fast-track way for the Commission to suspend a country's data transfer approval?
  - If a country's privacy protection suddenly collapses, how quickly can the EU act on it?
  ar:
  - هل يمكن للمفوضية إلغاء قرار الكفاية فوراً في حالة الاستعجال؟
  - هل هناك إجراء سريع لتعليق اعتماد دولة لنقل البيانات في الحالات الطارئة؟
  - لو انهارت حماية البيانات في بلد فجأة، قد إيش بسرعة يتحرك الاتحاد الأوروبي؟
- key: gdpr:art-45:para-6
  text: a94e16475200734e
  en:
  - After the EU finds a country is no longer adequate, does it talk to that country to fix the problem?
  - Does the Commission negotiate with a country whose approval was suspended?
  ar:
  - بعد أن تقرر المفوضية أن دولة لم تعد كافية، هل تتشاور معها لمعالجة المشكلة؟
  - هل توجد عملية تفاوض مع الدولة التي أُلغي أو عُلّق اعتمادها لتصحيح الوضع؟
  - لما الاتحاد الأوروبي يسحب اعتماد بلد، هل يتفاوض معاهم عشان يصلحوا الوضع؟
- key: gdpr:art-45:para-7
  text: df0128ccc3cabdeb
  en:
  - If a country loses its adequacy status, can we still transfer data there using other safeguards like
    standard contractual clauses?
  - Does a withdrawn approval mean we must stop sending all user data to that country?
  - What are our options for moving data to a country whose approval was revoked?
  ar:
  - إذا فقدت دولة اعتماد الكفاية، هل يمكننا الاستمرار في نقل البيانات إليها بضمانات أخرى مثل البنود التعاقدية؟
  - هل إلغاء قرار الكفاية يعني أن علينا وقف إرسال كل بيانات المستخدمين إلى تلك الدولة؟
  - لو انسحب الاعتماد عن بلد، وش الخيارات المتاحة عشان نكمل نقل البيانات له؟
- key: gdpr:art-45:para-8
  text: 2340f9fbc6d6f74d
  en:
  - Where can I find the official list of countries approved for EU personal data transfers?
  - How do I check whether a country we want to host in is currently approved or has lost approval?
  - Does the EU publish which countries are no longer considered adequate?
  ar:
  - أين أجد القائمة الرسمية للدول المعتمدة لنقل البيانات الشخصية من الاتحاد الأوروبي؟
  - كيف أتحقق من أن الدولة التي نريد الاستضافة فيها ما زالت معتمدة أو فقدت اعتمادها؟
  - هل تنشر المفوضية قائمة بالدول التي لم تعد توفر حماية كافية؟
- key: gdpr:art-45:para-9
  text: 2af143f9de23b7f3
  en:
  - Are country approvals granted under the old 1995 data protection directive still valid today?
  - We rely on an old adequacy decision from before the GDPR; is it still in force?
  - Until when do older adequacy decisions stay valid?
  ar:
  - هل ما زالت قرارات الكفاية الصادرة بموجب التوجيه الأوروبي القديم لعام 1995 سارية؟
  - نعتمد على قرار اعتماد قديم صدر قبل اللائحة العامة لحماية البيانات، هل ما زال ساري المفعول؟
  - إلى متى تبقى قرارات الكفاية القديمة سارية؟
- key: gdpr:art-46:para-1
  text: 2f2a51006c64c945
  en:
  - Our app wants to send EU user data to servers in a country with no adequacy decision. What do we need
    in place first?
  - Can a company move personal data abroad if there's no official approval for that country, and what
    must users still be able to do?
  - Are we allowed to use a cloud vendor outside Europe if we can't rely on an adequacy decision?
  ar:
  - هل يجوز لنا نقل بيانات مستخدمين أوروبيين إلى خادم في دولة ما عندها قرار كفاية، وما الضمانات المطلوبة؟
  - ما الشروط اللازمة لتحويل البيانات الشخصية إلى دولة ثالثة عند غياب قرار كفاية، وهل يجب أن يملك الأفراد
    حقوقاً قابلة للتنفيذ؟
  - نبغى نرسل بيانات عملائنا لمزود خدمة برا أوروبا وما في قرار كفاية، شو لازم نسوي عشان يكون النقل قانوني؟
- key: gdpr:art-46:para-2
  text: 2c32fa4fea57c423
  en:
  - Which transfer safeguards can we use for sending data outside the EU without asking the data protection
    regulator for permission?
  - We're a SaaS startup and want to avoid waiting for regulator sign-off for international transfers.
    Which options don't need it?
  - What is the list of ready-to-use mechanisms for legitimizing cross-border data transfers without special
    approval?
  ar:
  - ما هي آليات الضمانات التي تتيح نقل البيانات خارج الاتحاد الأوروبي دون الحصول على إذن خاص من هيئة الرقابة؟
  - شركتنا ناشئة وما نبي ننتظر موافقة الجهة المنظمة على نقل البيانات للخارج، أي طرق ما تحتاج تصريح؟
  - وش الخيارات الجاهزة اللي أقدر أستخدمها عشان أنقل بيانات العملاء برا الاتحاد الأوروبي بدون إذن من الجهة؟
- key: gdpr:art-46:para-2:pt-a
  text: f8b0083074ce3c19
  en:
  - Two government agencies need to share citizens' data with a body abroad. Is a binding agreement between
    them enough as a safeguard?
  - Can public bodies rely on a legally binding instrument between them for international data transfers
    without regulator approval?
  - Our public-sector platform exchanges data with a foreign authority. What kind of document covers the
    transfer safeguard?
  ar:
  - جهتان حكوميتان تريدان تبادل بيانات المواطنين مع جهة أجنبية، هل يكفي صك ملزم قانوناً بينهما كضمانة
    للنقل؟
  - هل يمكن للهيئات العامة الاعتماد على اتفاق ملزم وقابل للتنفيذ لنقل البيانات دولياً دون إذن من الجهة
    الرقابية؟
  - إحنا جهة حكومية ونبغى نشارك بيانات مع جهة برا البلد، أي نوع وثيقة تغطي الضمانات؟
- key: gdpr:art-46:para-2:pt-b
  text: 8a988d4704dbaf0f
  en:
  - Our multinational group wants to move employee and customer data between its offices worldwide. Can
    internal company rules cover that?
  - Do binding corporate rules count as a valid safeguard for transfers within a corporate group?
  - Can we use one internal policy across all our subsidiaries instead of signing contracts for each data
    transfer?
  ar:
  - مجموعتنا متعددة الجنسيات تريد نقل بيانات الموظفين والعملاء بين فروعها، هل تكفي قواعد داخلية ملزمة
    للشركة؟
  - هل تعتبر القواعد المؤسسية الملزمة ضمانة صالحة لنقل البيانات داخل المجموعة؟
  - ممكن نستخدم سياسة داخلية وحدة لكل الشركات التابعة بدل ما نوقع عقود لكل نقل بيانات؟
- key: gdpr:art-46:para-2:pt-c
  text: 53c99773f8a4ee47
  en:
  - What are SCCs and can we just sign the EU's ready-made contract with our US vendor to transfer data?
  - Is using the standard contractual clauses published by the European Commission enough to legalize
    sending data abroad?
  - A customer asked how we protect data sent to our offshore support team. Can we say we use the Commission's
    template clauses?
  ar:
  - ما هي البنود التعاقدية النموذجية، وهل يكفي توقيع النموذج الجاهز من المفوضية الأوروبية مع مزودنا الأمريكي؟
  - هل استخدام البنود النموذجية لحماية البيانات التي أصدرتها المفوضية الأوروبية يكفي لإضفاء الشرعية على
    نقل البيانات للخارج؟
  - عميلنا سأل كيف نحمي البيانات اللي نرسلها لفريق الدعم برا، نقدر نقول نستخدم عقود المفوضية الجاهزة؟
- key: gdpr:art-46:para-2:pt-d
  text: a2a76e3a1ebd58e3
  en:
  - Can we use a data protection authority's own template clauses for transfers, and do they need anything
    else to be valid?
  - Are standard clauses written by a national regulator acceptable as a transfer safeguard if the Commission
    approves them?
  - Our company is in one EU country and the local regulator published model transfer clauses. Can we
    rely on them for sending data abroad?
  ar:
  - هل يمكننا استخدام بنود نموذجية أعدتها هيئة حماية البيانات الوطنية لنقل البيانات، وهل تحتاج إلى اعتماد
    آخر؟
  - هل تُعد البنود القياسية التي تضعها الجهة الرقابية مقبولة كضمانة للنقل إذا وافقت عليها المفوضية؟
  - الجهة المنظمة عندنا نشرت عقود نموذجية للنقل الدولي، نقدر نعتمد عليها لما نرسل بيانات برا؟
- key: gdpr:art-46:para-2:pt-e
  text: c85482a6b6b283a5
  en:
  - Can joining an approved industry code of conduct help us legally transfer data to a vendor outside
    the EU?
  - If our overseas partner follows an approved code of conduct, what else must they commit to for the
    transfer to be allowed?
  - Is adhering to a sector code of conduct alone enough as a transfer safeguard, or do we need binding
    promises too?
  ar:
  - هل الانضمام إلى مدونة سلوك معتمدة في قطاعنا يساعد على نقل البيانات قانونياً إلى مزود خارج الاتحاد
    الأوروبي؟
  - إذا كان شريكنا في الخارج يلتزم بمدونة سلوك معتمدة، ما الذي يجب أن يتعهد به أيضاً ليُسمح بالنقل؟
  - هل يكفي الالتزام بمدونة سلوك القطاع وحده كضمانة للنقل ولا نحتاج تعهدات ملزمة كمان؟
- key: gdpr:art-46:para-2:pt-f
  text: b96636116bd27ede
  en:
  - Our offshore processor has a privacy certification. Can that serve as the safeguard for sending them
    EU data?
  - Does an approved data protection certificate or seal let us transfer data to a non-EU company?
  - What must a foreign recipient promise in addition to holding a certification for the transfer to be
    valid?
  ar:
  - المعالج الخارجي عندنا حاصل على شهادة خصوصية، هل تصلح كضمانة لإرسال بيانات أوروبية إليه؟
  - هل تسمح لنا آلية اعتماد أو ختم معتمد لحماية البيانات بنقل البيانات إلى شركة خارج الاتحاد الأوروبي؟
  - شنو لازم يتعهد المستلم الأجنبي زيادة على الشهادة عشان يكون النقل سليم؟
- key: gdpr:art-46:para-3
  text: 8ee840b4cbbef97a
  en:
  - Which transfer safeguards do need the regulator's approval before we can send data abroad?
  - If we write our own custom contract for international data transfer, do we need permission from the
    authority first?
  - Are there transfer mechanisms beyond the standard ones that only work with regulator authorisation?
  ar:
  - ما هي ضمانات النقل الدولي التي تتطلب موافقة مسبقة من هيئة الرقابة؟
  - إذا صغنا عقداً خاصاً بنا لنقل البيانات للخارج، هل نحتاج إذناً من الجهة المختصة أولاً؟
  - فيه طرق ثانية لنقل البيانات غير الجاهزة تحتاج تصريح من الجهة المنظمة؟
- key: gdpr:art-46:para-3:pt-a
  text: 5398b1c6c6aeaed9
  en:
  - Can we negotiate our own contract with an overseas data recipient as a transfer safeguard, and what
    approval is needed?
  - We drafted a custom data transfer agreement with our analytics vendor abroad. Is that acceptable?
  - Does a bespoke contract between a processor and a recipient in a third country work as a safeguard?
  ar:
  - هل يمكننا التفاوض على عقد خاص مع مستلم البيانات في الخارج كضمانة للنقل، وما الموافقة المطلوبة؟
  - كتبنا اتفاقية نقل بيانات مخصصة مع مزود التحليلات في الخارج، هل هذا مقبول؟
  - هل العقد المخصص بين المعالج والمستلم في دولة ثالثة يُعتبر ضمانة كافية؟
- key: gdpr:art-46:para-3:pt-b
  text: 139afa57db80e546
  en:
  - Our public agency is drafting an administrative arrangement with a foreign authority for data sharing.
    What must it contain?
  - Can public bodies use non-binding administrative arrangements for international data transfer, and
    what rights must they include?
  - Do administrative agreements between government departments need regulator authorisation for data
    transfers abroad?
  ar:
  - جهتنا الحكومية تعد ترتيباً إدارياً مع سلطة أجنبية لتبادل البيانات، ما الذي يجب أن يتضمنه؟
  - هل يمكن للجهات العامة استخدام ترتيبات إدارية لنقل البيانات دولياً وما الحقوق التي يجب أن تتضمنها؟
  - الاتفاقيات الإدارية بين الدوائر الحكومية لنقل البيانات للخارج هل تحتاج إذن من الجهة الرقابية؟
- key: gdpr:art-46:para-4
  text: 785add7cedfbcbf1
  en:
  - After we ask the regulator to authorise our custom transfer contract, will other EU regulators weigh
    in?
  - Does the data protection authority have to coordinate with other European authorities before approving
    a bespoke transfer arrangement?
  - Why is our transfer approval taking so long, does it go through an EU-wide review process?
  ar:
  - بعد طلب إذن الجهة الرقابية لعقد النقل المخصص، هل ستشارك فيه هيئات أوروبية أخرى؟
  - هل يجب على هيئة حماية البيانات التنسيق مع السلطات الأوروبية الأخرى قبل الموافقة على ترتيب نقل مخصص؟
  - ليش موافقة النقل الدولي تأخذ وقت طويل، هل تمر على مراجعة على مستوى الاتحاد الأوروبي؟
- key: gdpr:art-46:para-5
  text: a21b658f2675f7ba
  en:
  - We have a data transfer authorisation granted under the old 1995 directive. Is it still valid?
  - Do old standard contractual clauses approved under the previous EU data law still work today?
  - Our legacy transfer contracts predate the GDPR. Do we have to redo them right away?
  ar:
  - لدينا إذن لنقل البيانات صدر بموجب التوجيه الأوروبي القديم لعام 1995، هل ما زال ساري المفعول؟
  - هل ما زالت البنود التعاقدية النموذجية المعتمدة في ظل القانون الأوروبي السابق صالحة اليوم؟
  - عقود نقل البيانات القديمة عندنا سابقة للائحة العامة، هل لازم نعيد كتابتها فوراً؟
- key: gdpr:art-47:para-1
  text: 50c83ac8b036beba
  en:
  - Who has to sign off on our company's internal global data transfer rules before we can use them to
    move user data between our offices?
  - We're a multinational group and want one set of internal privacy rules for sharing customer data across
    subsidiaries. What does the regulator need to see to approve it?
  - Do we need approval from a data protection authority for our intra-group data sharing policy, and
    how is it approved?
  ar:
  - ما الشروط التي يجب أن تتوفر في القواعد الملزمة للشركات حتى توافق عليها هيئة حماية البيانات؟
  - شركتنا لها فروع في دول كثيرة ونبي نعتمد سياسة داخلية موحدة لنقل بيانات العملاء بين الفروع، مين لازم
    يوافق عليها؟
  - هل تحتاج سياسة نقل البيانات داخل مجموعة الشركات إلى موافقة السلطة الرقابية وكيف تتم؟
- key: gdpr:art-47:para-1:pt-a
  text: dfaa7d93297f92f3
  en:
  - Do our internal global privacy rules have to bind every subsidiary and our staff too, or just the
    parent company?
  - One of our group companies says the group's data policy doesn't apply to them. Can that be allowed
    under approved internal transfer rules?
  - Does the group's intra-company data protection policy need to be legally enforceable against employees
    as well?
  ar:
  - هل لازم تكون قواعد الخصوصية الداخلية للمجموعة ملزمة قانونياً لكل الشركات التابعة والموظفين؟
  - احدى الشركات التابعة عندنا تقول إن سياسة البيانات ما تنطبق عليها، هل هذا مسموح؟
  - هل يجب أن تُطبَّق القواعد الملزمة على جميع أعضاء المجموعة وموظفيهم وتُنفَّذ عليهم؟
- key: gdpr:art-47:para-1:pt-b
  text: c65191baf5c84bfd
  en:
  - Do our group's internal data transfer rules need to give users rights they can actually enforce?
  - Can a customer enforce our company-wide privacy policy against us, or is it just an internal guideline?
  ar:
  - هل يجب أن تمنح قواعد المجموعة الداخلية للمستخدمين حقوقاً يستطيعون المطالبة بها فعلاً؟
  - ينفع العميل يطالب بتطبيق سياسة الخصوصية الداخلية حقتنا ولا هي بس توجيهات داخلية؟
- key: gdpr:art-47:para-1:pt-c
  text: 83202ed37376d113
  en:
  - Besides being binding and giving users rights, what else must our group's internal transfer rules
    contain to get approved?
  - If our group privacy rules miss some of the required items, can they still be approved?
  ar:
  - غير كونها ملزمة وتمنح حقوقاً، ما الذي يجب أن تتضمنه قواعد المجموعة حتى تتم الموافقة عليها؟
  - لو نقصت قواعدنا الداخلية بعض العناصر المطلوبة، هل ممكن تنقبل؟
- key: gdpr:art-47:para-2
  text: 621738024d9ddad9
  en:
  - What topics must we cover when drafting our global group data protection rules?
  - I'm writing the internal privacy rulebook for all our subsidiaries. What's the minimum it has to include?
  - What's the minimum content list for binding company-wide rules for transferring personal data outside
    the EU?
  ar:
  - ما المواضيع التي يجب تغطيتها عند صياغة قواعد حماية البيانات الملزمة لمجموعة الشركات؟
  - أكتب دليل الخصوصية الداخلي لكل الفروع، ايش الحد الأدنى اللي لازم أحطه فيه؟
  - ما هو الحد الأدنى لمحتوى القواعد الملزمة للشركات المتعلقة بنقل البيانات الشخصية خارج الاتحاد الأوروبي؟
- key: gdpr:art-47:para-2:pt-a
  text: f2b93e0ab0c9b771
  en:
  - Do our group rules need to list every company in the group with contact details?
  - Should we describe our corporate structure in the internal data transfer policy?
  - Who exactly has to be named in our binding group privacy rules?
  ar:
  - هل يجب أن تذكر قواعد المجموعة كل شركة فيها مع بيانات التواصل؟
  - هل نشرح هيكل الشركة في سياسة نقل البيانات الداخلية؟
  - من الذي يجب ذكره بالتحديد في القواعد الملزمة لمجموعتنا؟
- key: gdpr:art-47:para-2:pt-b
  text: 065dac13bff430c2
  en:
  - What details about our data flows must be written in the group rules, like data types, purposes and
    destination countries?
  - We send customer and HR data from our EU office to our offices in India and the US. Do we have to
    describe those transfers in our rules?
  - Do binding group rules need to say which categories of people's data we move and why?
  ar:
  - ما تفاصيل نقل البيانات التي يجب كتابتها في قواعد المجموعة مثل أنواع البيانات والأغراض والدول؟
  - نرسل بيانات العملاء والموظفين من مكتبنا الأوروبي لمكاتبنا في الهند وأمريكا، لازم نوصف هالتحويلات في
    القواعد؟
  - هل يجب أن تحدد القواعد فئات البيانات وأصحابها والدول المستقبلة؟
- key: gdpr:art-47:para-2:pt-c
  text: 9efed300582fc0d9
  en:
  - Do our group privacy rules have to state that they are binding both inside the company and toward
    outsiders?
  - How do we show that our internal data policy is legally binding and not just a guideline?
  - Must the rules say they're enforceable externally, e.g. by users, and not only internally?
  ar:
  - هل يجب أن تنص قواعد الخصوصية على أنها ملزمة داخل الشركة وخارجها؟
  - كيف نثبت أن سياسة البيانات الداخلية ملزمة قانونياً وليست مجرد إرشادات؟
  - هل لازم القواعد تبين إنها ملزمة للأطراف الخارجية مو بس داخلياً؟
- key: gdpr:art-47:para-2:pt-d
  text: 138c4be931e53bb4
  en:
  - Which data protection principles, like minimisation and retention limits, must our group rules spell
    out?
  - Do our company-wide rules need to cover security, legal basis and sensitive data handling?
  - What do the rules need to say about passing data on to companies outside the group?
  ar:
  - ما مبادئ حماية البيانات مثل تقليل البيانات ومدد الاحتفاظ التي يجب أن تفصلها قواعد المجموعة؟
  - هل لازم تغطي قواعدنا الداخلية الأمان والأساس القانوني والبيانات الحساسة؟
  - ايش لازم تقول القواعد عن إرسال البيانات لشركات برا المجموعة؟
- key: gdpr:art-47:para-2:pt-e
  text: 12d9345333d00f98
  en:
  - What user rights, like objecting to automated decisions or complaining to a court, must our group
    rules describe?
  - Do our internal rules need to explain how people can exercise their rights and get compensation?
  - A user wants to complain about how our group handles their data abroad. What must the rules say about
    their options?
  ar:
  - ما حقوق المستخدمين مثل رفض القرارات الآلية والشكوى للمحكمة التي يجب أن تذكرها القواعد؟
  - هل يجب أن تشرح قواعدنا الداخلية كيف يمارس الناس حقوقهم ويحصلون على تعويض؟
  - مستخدم يبي يشتكي على طريقة تعاملنا مع بياناته في فروعنا برا، ايش لازم تقول القواعد عن خياراته؟
- key: gdpr:art-47:para-2:pt-f
  text: 6f478b1fa89754a5
  en:
  - If our non-EU subsidiary breaks the group rules, is our EU company responsible for the damage?
  - Can our EU entity avoid liability for a foreign affiliate's breach, and how?
  - Who pays when a group member outside Europe violates the binding rules?
  ar:
  - إذا خالفت شركتنا التابعة خارج أوروبا القواعد، هل تتحمل الشركة الأوروبية المسؤولية؟
  - هل تقدر الشركة الأوروبية تتخلص من المسؤولية عن مخالفة فرع أجنبي وكيف؟
  - من يتحمل التعويض عندما يخالف عضو في المجموعة خارج الاتحاد القواعد الملزمة؟
- key: gdpr:art-47:para-2:pt-g
  text: 9263b909bab02c7c
  en:
  - How do we tell users about our group's binding rules beyond the normal privacy notice?
  - Do we have to inform people specifically about their rights and liability under our group rules?
  - What must our rules say about how users get information on them?
  ar:
  - كيف نعرّف المستخدمين بقواعد المجموعة الملزمة زيادة عن إشعار الخصوصية العادي؟
  - هل يجب إبلاغ الناس بحقوقهم والمسؤولية بموجب قواعد المجموعة؟
  - ما الذي يجب أن تقوله القواعد عن طريقة إيصال المعلومات عنها لأصحاب البيانات؟
- key: gdpr:art-47:para-2:pt-h
  text: 3aecb372405dcc51
  en:
  - Who in the group should be responsible for monitoring compliance with the rules, training and complaints?
  - Do we need a DPO or someone similar to oversee our group privacy rules?
  - What duties should the person overseeing our company-wide data rules have?
  ar:
  - من المسؤول داخل المجموعة عن مراقبة الالتزام بالقواعد والتدريب والشكاوى؟
  - هل نحتاج مسؤول حماية بيانات أو شخص مماثل للإشراف على قواعد مجموعتنا؟
  - ما مهام الشخص المكلف بالإشراف على الالتزام بالقواعد الملزمة؟
- key: gdpr:art-47:para-2:pt-i
  text: cf2faf987e22522f
  en:
  - Do our group data rules need a complaint process for users?
  - How should we set up a way for people to complain under our internal global privacy rules?
  - Is a complaints procedure mandatory in binding corporate rules?
  ar:
  - هل تحتاج قواعد بياناتنا الداخلية إلى إجراء لتقديم الشكاوى؟
  - كيف نجهز طريقة للناس يشتكون فيها بموجب قواعد الخصوصية العالمية حقتنا؟
  - هل إجراءات الشكاوى إلزامية في القواعد الملزمة للشركات؟
- key: gdpr:art-47:para-2:pt-j
  text: cc55804d6100656b
  en:
  - How do we check that all our subsidiaries actually follow the group privacy rules, like audits?
  - Who should receive the audit results of our group data compliance checks?
  - Do we have to let the regulator see our internal data protection audit results?
  ar:
  - كيف نتحقق أن كل شركاتنا التابعة تلتزم فعلاً بقواعد الخصوصية، مثل التدقيق؟
  - من يجب أن يستلم نتائج تدقيق الالتزام بحماية البيانات داخل المجموعة؟
  - هل لازم نعطي الجهة الرقابية نتائج التدقيق الداخلي لحماية البيانات إذا طلبتها؟
- key: gdpr:art-47:para-2:pt-k
  text: 1515f91ee600dcfa
  en:
  - We updated our group data protection rules. Do we need to tell the regulator?
  - How should we log changes to our binding company-wide privacy rules?
  - Do the rules need a process for reporting amendments to the authority?
  ar:
  - عدّلنا قواعد حماية البيانات في المجموعة، هل لازم نبلغ الجهة الرقابية؟
  - كيف نسجّل التغييرات على قواعد الخصوصية الملزمة لشركتنا؟
  - هل يجب أن تتضمن القواعد آلية للإبلاغ عن التعديلات للسلطة؟
- key: gdpr:art-47:para-2:pt-l
  text: 9619b2a4ebe10547
  en:
  - How should our group cooperate with the data protection regulator under our binding rules?
  - Do we have to share our compliance check results with the supervisory authority?
  - What cooperation process with the regulator must be written into our group privacy rules?
  ar:
  - كيف يجب أن تتعاون مجموعتنا مع الجهة الرقابية بموجب القواعد الملزمة؟
  - هل علينا مشاركة نتائج فحوصات الالتزام مع السلطة الرقابية؟
  - ما آلية التعاون مع الجهة الرقابية التي يجب كتابتها في قواعد المجموعة؟
- key: gdpr:art-47:para-2:pt-m
  text: ad99e375ea24aa15
  en:
  - Our subsidiary abroad got a government order to hand over user data that could undermine our group
    rules. Must we report it to the regulator?
  - What should our rules say about foreign laws that conflict with our privacy commitments?
  - Do we need a mechanism to alert the authority when a country's law makes it hard to follow the group
    rules?
  ar:
  - فرعنا في الخارج جاه أمر حكومي بتسليم بيانات المستخدمين وممكن يضعف قواعدنا، هل نبلغ الجهة الرقابية؟
  - ماذا يجب أن تنص قواعدنا عن القوانين الأجنبية التي تتعارض مع التزامات الخصوصية؟
  - هل نحتاج آلية لإبلاغ السلطة عندما يعيق قانون دولة ما الالتزام بقواعد المجموعة؟
- key: gdpr:art-47:para-2:pt-n
  text: 6b867da602a6b5eb
  en:
  - Which employees in our group need data protection training under the rules?
  - Do staff who regularly handle customer data need privacy training across all our subsidiaries?
  - Is training mandatory for support agents who access personal data under our group rules?
  ar:
  - أي موظفين في المجموعة يحتاجون تدريب حماية البيانات بموجب القواعد؟
  - هل الموظفون الذين يتعاملون مع بيانات العملاء باستمرار يحتاجون تدريباً على الخصوصية في كل الفروع؟
  - هل التدريب إلزامي لموظفي الدعم الذين يصلون للبيانات الشخصية حسب قواعد المجموعة؟
- key: gdpr:art-47:para-3
  text: 39de1d9b74e79422
  en:
  - Is there a standard format for submitting binding corporate rules information to the regulator?
  - Can the European Commission set the procedure for how companies and authorities exchange information
    about group transfer rules?
  - Where can I find official formats for exchanging info on company-wide data transfer rules?
  ar:
  - هل يوجد نموذج موحد لتقديم معلومات القواعد الملزمة للشركات إلى الجهة الرقابية؟
  - هل تستطيع المفوضية الأوروبية تحديد إجراءات تبادل المعلومات بين الشركات والسلطات بشأن قواعد المجموعة؟
  - وين ألقى الصيغ الرسمية لتبادل المعلومات عن قواعد نقل البيانات داخل المجموعة؟
- key: gdpr:art-48
  text: b70dd237c8943b82
  en:
  - A US court just ordered our SaaS company to hand over a customer's EU user data. Do we have to comply
    right away?
  - Can a foreign government agency force us to send them personal data of European users just by issuing
    a subpoena or order?
  - When does a non-EU court order to disclose user data become valid for us, for example through a mutual
    legal assistance treaty?
  ar:
  - وصلنا أمر من محكمة في دولة خارج الاتحاد الأوروبي تطلب بيانات مستخدمين أوروبيين، فهل يجب علينا تنفيذه
    مباشرة؟
  - هل يجوز لنا الاستجابة لقرار جهة حكومية أجنبية بتسليم البيانات الشخصية دون وجود اتفاقية دولية أو معاهدة
    مساعدة قانونية؟
  - جاني أمر من محكمة أمريكية يطلب بيانات عملائنا في أوروبا، أسلمهم البيانات ولا لازم أتأكد من شي قبل؟
- key: gdpr:art-49:para-1
  text: be7657c219c92e6a
  en:
  - Our app sends EU user data to a server in a country with no adequacy decision and we have no SCCs
    or BCRs. Are there any cases where we can still transfer it?
  - What are the fallback grounds for sending personal data abroad when no standard safeguards are in
    place?
  - Can we move customer data to a non-EU vendor if we have no other transfer mechanism, and under what
    conditions only?
  ar:
  - ما هي الحالات الاستثنائية التي تسمح لنا بنقل بيانات المستخدمين الأوروبيين إلى دولة ثالثة عند غياب
    قرار كفاية وضمانات مناسبة؟
  - هل يجوز لتطبيقنا إرسال البيانات الشخصية إلى خادم خارج الاتحاد الأوروبي إذا لم يكن لدينا أي آلية نقل
    معتمدة؟
  - عندنا مستخدمين من أوروبا وسيرفرنا في بلد ما عليه قرار كفاية ولا عندنا عقود SCC، فهل في أي استثناءات
    تخلينا ننقل البيانات؟
- key: gdpr:art-49:para-1:pt-a
  text: 4c22d27e927b806d
  en:
  - Can we rely on user consent to send their data to a country without adequacy or safeguards, and what
    must we tell them first?
  - Is a simple 'I agree' checkbox enough for an international data transfer in our signup flow?
  - Do we have to warn users about the risks before they consent to their data going to a non-adequate
    country?
  ar:
  - هل يكفي موافقة المستخدم لنقل بياناته إلى دولة بلا قرار كفاية، وما الذي يجب أن نخبره به قبل ذلك؟
  - هل يجوز الاعتماد على مربع موافقة عادي في التطبيق لنقل البيانات دولياً دون ضمانات؟
  - لازم أقول للمستخدم عن المخاطر قبل ما يوافق على نقل بياناته برا أوروبا؟ ولا بس أخليه يضغط موافق؟
- key: gdpr:art-49:para-1:pt-b
  text: d7a0ce1ebf38f423
  en:
  - A customer books a trip in our app and we must send their details to a hotel in a non-adequate country.
    Is that transfer allowed?
  - Can we transfer data abroad because it's needed to deliver the service the user signed up for?
  - A user asks for a quote before buying and we need to share their data with a overseas partner to prepare
    it. Is that covered?
  ar:
  - عميل يحجز رحلة عبر تطبيقنا ونحتاج إرسال بياناته إلى فندق في دولة بلا قرار كفاية، هل هذا النقل جائز؟
  - هل يجوز نقل البيانات للخارج لأنه ضروري لتنفيذ العقد مع المستخدم؟
  - واحد طلب عرض سعر قبل الشراء وبدنا نبعت بياناته لشريك برا البلد عشان نجهز العرض، هل هذا مسموح؟
- key: gdpr:art-49:para-1:pt-c
  text: beced34183ec0a72
  en:
  - We have a contract with a third-party company for the benefit of our customer, such as an overseas
    insurer. Can we send customer data there?
  - Can a transfer abroad be justified by a contract between us and another business made in the user's
    interest?
  - Our online shop uses a foreign courier under a contract arranged for the buyer's benefit. Can we pass
    the buyer's data to them without other safeguards?
  ar:
  - لدينا عقد مع شركة أخرى لمصلحة عميلنا مثل شركة تأمين في الخارج، هل يمكننا إرسال بيانات العميل إليها؟
  - هل يمكن تبرير النقل الدولي بعقد بيننا وبين طرف آخر أُبرم لمصلحة صاحب البيانات؟
  - متجرنا يشتغل مع شركة شحن أجنبية بعقد لصالح المشتري، نقدر نعطيهم بياناته بدون ضمانات ثانية؟
- key: gdpr:art-49:para-1:pt-d
  text: 594d282ca904b583
  en:
  - Can we send personal data abroad for an important public interest reason, like helping with a public
    health investigation?
  - When does public interest justify transferring user data to a non-adequate country?
  - A foreign authority asks our health app for data to fight an outbreak. Can the public interest exception
    cover that?
  ar:
  - هل يمكننا نقل بيانات شخصية للخارج لأسباب مصلحة عامة مهمة مثل التحقيق في مسألة صحية عامة؟
  - متى تبرر المصلحة العامة نقل بيانات المستخدمين إلى دولة بلا قرار كفاية؟
  - جهة أجنبية طلبت من تطبيقنا الصحي بيانات لمكافحة وباء، هل استثناء المصلحة العامة ينطبق؟
- key: gdpr:art-49:para-1:pt-e
  text: fb679911a81d5685
  en:
  - We're being sued abroad and need to hand over customer data to our overseas lawyers. Can we transfer
    it?
  - Can personal data be sent to another country to defend or bring a legal claim?
  - A court proceeding in a non-EU country requires us to produce user records. Is there a transfer ground
    for that?
  ar:
  - نواجه دعوى قضائية في الخارج ونحتاج إرسال بيانات العملاء لمحامينا هناك، هل يجوز النقل؟
  - هل يمكن نقل البيانات الشخصية إلى دولة أخرى لرفع دعوى أو الدفاع عنها؟
  - في قضية بدولة خارج أوروبا وطلبوا منا سجلات المستخدمين، فيه سبب قانوني ننقل عليه البيانات؟
- key: gdpr:art-49:para-1:pt-f
  text: 080d4dd7e3cdc8b2
  en:
  - A user in our health app is unconscious and a foreign hospital needs their data to treat them. Can
    we send it?
  - Can we transfer someone's data abroad to save their life if they can't consent?
  - Is there an emergency exception for sending data overseas when a person is incapable of agreeing and
    their life is at risk?
  ar:
  - مستخدم في تطبيقنا الصحي فاقد الوعي ومستشفى أجنبي يحتاج بياناته لعلاجه، هل يجوز إرسالها؟
  - هل يمكن نقل بيانات شخص إلى الخارج لإنقاذ حياته إذا كان عاجزاً عن الموافقة؟
  - فيه استثناء للطوارئ لنقل البيانات برا البلد لما الشخص ما يقدر يوافق وحياته بخطر؟
- key: gdpr:art-49:para-1:pt-g
  text: cc3dd6dee848bd4d
  en:
  - Our service pulls records from a public company register and passes them to a client in a non-adequate
    country. Is that allowed?
  - Can we transfer data taken from an official public register to a recipient abroad?
  - What conditions apply to sending data from a public register that anyone with a legitimate interest
    can search?
  ar:
  - خدمتنا تسحب بيانات من سجل شركات عام وترسلها لعميل في دولة بلا قرار كفاية، هل هذا مسموح؟
  - هل يجوز نقل بيانات مأخوذة من سجل رسمي متاح للجمهور إلى مستلم في الخارج؟
  - شو الشروط لنقل بيانات من سجل عام يقدر أي حد له مصلحة مشروعة يطلع عليه؟
- key: gdpr:art-49:para-1:sub-2
  text: 941967f82d373aa5
  en:
  - None of the usual transfer grounds fit our case. Can we still send data abroad for our compelling
    business interests, and what must we do?
  - Do we need to tell the regulator and the user if we make a one-off transfer based on our legitimate
    interests?
  - 'What are the limits on a last-resort transfer: how many people, how often, and what safeguards?'
  ar:
  - ولا واحد من أسس النقل المعتادة ينطبق على حالتنا، هل يمكننا النقل بناءً على مصلحتنا المشروعة القاهرة
    وما المطلوب منا؟
  - هل علينا إبلاغ الجهة الرقابية والمستخدم عند إجراء نقل لمرة واحدة بناءً على مصلحتنا المشروعة؟
  - 'شو حدود النقل كحل أخير: كم شخص، كم مرة، وأي ضمانات لازم نوفرها؟'
- key: gdpr:art-49:para-2
  text: a377d9664e6d046c
  en:
  - Can we export the whole contents of a public register to a partner abroad?
  - If a register is only open to people with a legitimate interest, when can we send data from it overseas?
  - We want to bulk-transfer a public database of records to a non-EU client. Is there a limit on how
    much?
  ar:
  - هل يجوز تصدير كامل محتوى سجل عام إلى شريك في الخارج؟
  - إذا كان السجل متاحاً فقط لأصحاب المصلحة المشروعة، فمتى يجوز نقل بياناته إلى الخارج؟
  - نبي ننقل قاعدة بيانات سجل عام كاملة لعميل برا أوروبا، فيه حد للكمية؟
- key: gdpr:art-49:para-3
  text: 60f41b7e3ab274a9
  en:
  - We are a public authority exercising official powers. Can we use consent or contract necessity to
    send data abroad?
  - Do the consent and contract exceptions for international transfers apply to government bodies acting
    in their official role?
  - Can a public agency use the legitimate-interest last-resort transfer route?
  ar:
  - نحن جهة حكومية نمارس صلاحياتنا العامة، هل يمكننا الاستناد إلى الموافقة أو العقد لنقل البيانات إلى
    الخارج؟
  - هل تنطبق استثناءات الموافقة والعقد في النقل الدولي على الجهات العامة أثناء ممارسة سلطتها؟
  - هل يجوز لجهة عامة استخدام مسار المصلحة المشروعة القاهرة كحل أخير للنقل؟
- key: gdpr:art-49:para-4
  text: 64068ebe2aabfc70
  en:
  - Who decides what counts as a public interest for transferring data abroad? Can a foreign country's
    law be enough?
  - Can we claim public interest for a transfer just because we think it's important?
  - Does the public interest ground need to be backed by EU or national law that applies to us?
  ar:
  - من يحدد ما يعتبر مصلحة عامة لنقل البيانات إلى الخارج؟ وهل يكفي قانون دولة أجنبية؟
  - هل يمكننا الادعاء بوجود مصلحة عامة للنقل لمجرد أننا نراه مهماً؟
  - هل يجب أن تكون المصلحة العامة مستندة إلى قانون أوروبي أو قانون الدولة العضو الذي نخضع له؟
- key: gdpr:art-49:para-5
  text: d8608be8eef084dd
  en:
  - Can an EU country ban sending certain types of data, like health records, to non-adequate countries?
  - Are there national rules that restrict transferring specific categories of data abroad even without
    adequacy?
  - Does a member state have to tell the Commission if it limits certain data transfers?
  ar:
  - هل يمكن لدولة عضو في الاتحاد الأوروبي منع نقل أنواع معينة من البيانات مثل السجلات الصحية إلى دول بلا
    قرار كفاية؟
  - هل توجد قوانين وطنية تقيد نقل فئات محددة من البيانات للخارج حتى مع غياب قرار الكفاية؟
  - هل يجب على الدولة العضو إبلاغ المفوضية عند وضع قيود على نقل بيانات معينة؟
- key: gdpr:art-49:para-6
  text: eeecd457b8351fd6
  en:
  - Do we have to write down our assessment and safeguards when we do an exceptional transfer on legitimate
    interests?
  - Where should we record why we sent data abroad under the last-resort route?
  - Does our processing records log need to include the safeguards for a one-off international transfer?
  ar:
  - هل يجب أن نوثق تقييمنا والضمانات عند إجراء نقل استثنائي بناءً على المصلحة المشروعة؟
  - أين نسجل سبب إرسال البيانات للخارج وفق مسار الحل الأخير؟
  - هل يلزم إدراج الضمانات الخاصة بنقل دولي لمرة واحدة في سجل أنشطة المعالجة؟
- key: gdpr:art-50
  text: 7072dec31a9b1ec6
  en:
  - What are regulators and the European Commission supposed to do about data protection when companies
    and data move across borders to non-EU countries?
  - We run an app with servers and users in several countries; do privacy authorities work with foreign
    counterparts on enforcement?
  - Is there any official effort to coordinate privacy rules between the EU and other countries or international
    bodies?
  ar:
  - ما هي الخطوات التي يجب على المفوضية الأوروبية وسلطات حماية البيانات اتخاذها مع الدول غير الأوروبية
    والمنظمات الدولية؟
  - تطبيقنا عنده مستخدمين في كذا دولة، هل جهات حماية البيانات تتعاون مع جهات برا الاتحاد الأوروبي؟
  - هل يوجد تعاون دولي رسمي بين الاتحاد الأوروبي والدول الأخرى لتطبيق قواعد حماية البيانات الشخصية؟
- key: gdpr:art-50:pt-a
  text: 869b2daa87a363e5
  en:
  - Are there mechanisms being built so privacy regulators in different countries can enforce data protection
    laws together?
  - Our online shop is based outside the EU and gets complaints from EU customers; is there a framework
    for regulators to cooperate on enforcement?
  - Do authorities have to create ways of working across borders to make privacy enforcement effective?
  ar:
  - هل يتعين على السلطات تطوير آليات للتعاون الدولي من أجل إنفاذ تشريعات حماية البيانات الشخصية بفعالية؟
  - شركتنا خارج أوروبا وعملاء أوروبيين اشتكوا علينا، هل في آلية تخلي الجهات الرقابية تتعاون مع بعض؟
  - كيف تتعاون الجهات الرقابية في دول مختلفة عشان تطبق قوانين الخصوصية بشكل فعال؟
- key: gdpr:art-50:pt-b
  text: aeb7ded2cac22e83
  en:
  - Can an EU data protection authority pass a complaint about our company to a regulator in another country,
    or ask them to investigate?
  - A user complained about our app to their local regulator but we are based abroad; can regulators share
    information and help each other investigate?
  - What safeguards apply when privacy authorities exchange information or help each other in cross-border
    cases?
  ar:
  - هل يمكن لسلطة حماية البيانات إحالة شكوى ضد شركتنا إلى سلطة في دولة أخرى أو طلب المساعدة في التحقيق؟
  - مستخدم قدّم شكوى عن تطبيقنا عند الجهة في بلده ونحن في دولة ثانية، هل الجهات تتبادل المعلومات وتساعد
    بعض في التحقيق؟
  - ما الضمانات المطلوبة عند تبادل السلطات الرقابية للمعلومات والمساعدة المتبادلة في قضايا عابرة للحدود؟
- key: gdpr:art-50:pt-c
  text: 2a3210802409b1e9
  en:
  - Do privacy regulators involve companies, NGOs or industry groups when working on international enforcement
    cooperation?
  - Can our startup take part in talks with authorities about cross-border privacy enforcement?
  - Are stakeholders consulted in efforts to improve global cooperation on data protection enforcement?
  ar:
  - هل تُشرك السلطات الشركات والجهات المعنية في النقاشات والأنشطة الخاصة بالتعاون الدولي في إنفاذ حماية
    البيانات؟
  - نبغى نشارك كشركة ناشئة في نقاشات مع الجهات الرقابية عن تطبيق الخصوصية عبر الحدود، هل هذا وارد؟
  - هل يتم إشراك أصحاب المصلحة في جهود تعزيز التعاون الدولي لإنفاذ قوانين البيانات؟
- key: gdpr:art-50:pt-d
  text: c98cbd634d18d9ab
  en:
  - Do authorities share and publish information about privacy laws and practices across countries, including
    when different countries' laws conflict?
  - Is there an effort to document and exchange knowledge on how different countries handle data protection?
  ar:
  - هل تتبادل السلطات وتوثّق معلومات عن قوانين وممارسات حماية البيانات بين الدول، بما فيها تنازع الاختصاص؟
  - هل هناك جهد لتوثيق وتبادل الخبرات حول طريقة تعامل الدول المختلفة مع حماية البيانات؟
- key: gdpr:art-51:para-1
  text: 11f2cf237b9be3b7
  en:
  - Who is the official body in each EU country that checks whether companies like my app are following
    the data protection rules?
  - We're launching a SaaS in several European countries and want to know who we'd deal with if there's
    a privacy complaint or investigation. Is there a government regulator for this?
  - Can a country have more than one independent data protection regulator, and what is their job?
  ar:
  - ما هي الجهة الرسمية المستقلة في كل دولة أوروبية التي تراقب تطبيق قواعد حماية البيانات الشخصية؟
  - نطلق تطبيقًا في عدة دول أوروبية ونريد أن نعرف من هي السلطة التي ستراقب التزامنا بخصوصية البيانات وتحمي
    حقوق الأفراد.
  - مين الجهة الحكومية اللي تتابع شركات زي شركتنا في موضوع حماية البيانات في كل دولة بالاتحاد الأوروبي؟
- key: gdpr:art-51:para-2
  text: 2fed5c5e6e8d7fa9
  en:
  - Do data protection regulators in different EU countries work together so the rules are applied the
    same way for my app?
  - If we operate in France and Germany, will the two privacy regulators coordinate or could they give
    us conflicting answers?
  - Does the European Commission work with national privacy authorities to keep enforcement consistent?
  ar:
  - هل تتعاون الجهات الرقابية لحماية البيانات في دول الاتحاد الأوروبي فيما بينها لتطبيق القواعد بشكل موحد؟
  - شركتنا تعمل في أكثر من دولة أوروبية، فهل نخشى من اختلاف تفسير سلطات حماية البيانات بين دولة وأخرى؟
  - يعني الجهات اللي تراقب الخصوصية في كل دولة بتتعاون مع بعض ومع المفوضية عشان يطبقوا نفس الشي؟
- key: gdpr:art-51:para-3
  text: 846d8a0d13a4b98c
  en:
  - Some countries have several privacy regulators, so who speaks for that country at the EU-level data
    protection board?
  - How does a country with multiple data protection authorities make sure all of them follow the EU consistency
    procedure?
  - We're building a compliance dashboard for EU regulators; for a country with regional authorities,
    which one is the single representative on the European Board?
  ar:
  - إذا كان في الدولة الأوروبية أكثر من سلطة لحماية البيانات، فمن يمثلها في المجلس الأوروبي لحماية البيانات؟
  - كيف تضمن الدولة العضو التزام سلطاتها الرقابية المتعددة بآلية الاتساق الأوروبية؟
  - ألمانيا فيها جهات رقابية كثيرة، فمين اللي يمثلها في المجلس الأوروبي وكيف يلتزم الباقي؟
- key: gdpr:art-51:para-4
  text: e658b1344de2d5eb
  en:
  - Do EU countries have to tell the Commission about their national data protection laws, and by when?
  - Our legal tracker follows national privacy laws in Europe; are countries required to report later
    amendments to those laws to the EU?
  - When a member state changes its local data protection rules, does it have to inform Brussels right
    away?
  ar:
  - هل يجب على الدول الأعضاء إبلاغ المفوضية الأوروبية بقوانينها الوطنية المتعلقة بحماية البيانات وفي أي
    موعد؟
  - نتابع القوانين الوطنية للخصوصية في أوروبا، فهل تلتزم الدول بإخطار المفوضية بأي تعديل لاحق دون تأخير؟
  - لو دولة أوروبية عدّلت قانونها المحلي للخصوصية، لازم تخبر المفوضية فورًا ولا لا؟
- key: gdpr:art-52:para-1
  text: c34edacba9176642
  en:
  - Can a data protection regulator be told by the government how to handle a complaint against our app?
  - Does the data protection authority have to be fully independent when it investigates companies like
    ours?
  - We're a startup under investigation by a privacy regulator; is the regulator allowed to act without
    outside pressure?
  ar:
  - هل يجب أن تكون سلطة حماية البيانات مستقلة تماماً عند التحقيق في شكوى ضد تطبيقنا؟
  - هل تستطيع الحكومة توجيه الجهة الرقابية على الخصوصية في كيفية ممارسة صلاحياتها؟
  - هي الجهة اللي تراقب حماية البيانات مستقلة ولا ممكن حد يأثر عليها؟ عندنا تحقيق على متجرنا الإلكتروني
- key: gdpr:art-52:para-2
  text: d98e8adfbe4bff25
  en:
  - Can a minister or a big company tell a privacy regulator's board members what decision to make?
  - Are the people who run the data protection authority allowed to take orders from anyone?
  - Is indirect pressure on a privacy regulator's leadership, like lobbying, allowed when they're deciding
    on our case?
  ar:
  - هل يجوز لأي جهة أن تعطي تعليمات لأعضاء سلطة حماية البيانات بشأن قرار يخص شركتنا؟
  - هل يجب أن يبقى أعضاء الجهة الرقابية بعيدين عن أي تأثير خارجي مباشر أو غير مباشر؟
  - ممكن حد يضغط على مسؤولين هيئة حماية البيانات عشان يغيّروا قرارهم؟ ولا ممنوع؟
- key: gdpr:art-52:para-3
  text: b9db876a6048d463
  en:
  - Can a privacy regulator's board member also work as a consultant for tech companies while in office?
  - A regulator official sits on the advisory board of a company we compete with; is that allowed?
  ar:
  - هل يجوز لعضو سلطة حماية البيانات أن يعمل في وظيفة أخرى أثناء مدة ولايته؟
  - هل يمنع على أعضاء الجهة الرقابية ممارسة أي عمل لا يتفق مع واجباتهم حتى لو كان بدون أجر؟
  - موظف كبير بهيئة حماية البيانات يشتغل استشاري لشركات تقنية جنب وظيفته، هل هذا مسموح؟
- key: gdpr:art-52:para-4
  text: 69f207c8167f671b
  en:
  - Does the government have to give the data protection authority enough money and staff to do its job?
  - Who makes sure the privacy regulator has the technical resources and offices to work with other countries'
    regulators?
  - Our national privacy regulator is understaffed and slow; does the state have a duty to fund it properly?
  ar:
  - هل يجب على الدولة أن توفر لسلطة حماية البيانات الموارد البشرية والتقنية والمالية الكافية؟
  - هل تلتزم الدول الأعضاء بتمويل الجهة الرقابية بما يكفي للتعاون مع السلطات الأخرى والمشاركة في المجلس
    الأوروبي؟
  - الجهة اللي تراقب الخصوصية عندنا ناقصها موظفين وميزانية، هل الدولة ملزمة توفرلها كل شي؟
- key: gdpr:art-52:para-5
  text: 4f5c5cb3ffcb833c
  en:
  - Who hires and manages the employees of a data protection authority?
  - Can a government ministry direct the staff of the privacy regulator?
  - Does a privacy regulator get to pick its own staff, or are they assigned by the state?
  ar:
  - هل تختار سلطة حماية البيانات موظفيها بنفسها؟
  - من له حق توجيه موظفي الجهة الرقابية، أعضاؤها فقط أم جهات أخرى؟
  - موظفين هيئة حماية البيانات يتبعون مين بالشغل؟ الوزارة ولا رئيس الهيئة؟
- key: gdpr:art-52:para-6
  text: 2627472d8e7c6640
  en:
  - Is a data protection authority's budget public, and is it separate from other state budgets?
  - Can the finance ministry audit the privacy regulator in a way that limits its independence?
  - How is a privacy regulator's spending supervised without hurting its independence?
  ar:
  - هل يجب أن تكون ميزانية سلطة حماية البيانات سنوية ومنفصلة وعلنية؟
  - هل تخضع الجهة الرقابية لرقابة مالية دون المساس باستقلالها؟
  - ميزانية هيئة حماية البيانات لازم تكون معلنة ومستقلة ولا ممكن تدخل ضمن ميزانية الدولة؟
- key: gdpr:art-53:para-1
  text: 96f00c6e318df87a
  en:
  - How are the heads or board members of a country's data protection regulator supposed to be picked?
  - We're setting up a national privacy watchdog and need to know if the officials can be chosen behind
    closed doors or whether the process must be open.
  - Who is allowed to appoint the people who run the data protection authority in an EU country?
  ar:
  - كيف يتم تعيين أعضاء هيئة حماية البيانات الرقابية في الدولة العضو وهل يجب أن تكون الإجراءات شفافة؟
  - مين اللي يعيّن المسؤولين في جهة حماية البيانات عندنا؟ وهل لازم يكون التعيين علني وواضح؟
  - هل يجوز أن يُعيَّن أعضاء الجهة الرقابية لحماية البيانات بإجراء غير معلن؟
- key: gdpr:art-53:para-1:pt-1
  text: 6ca6619badb7632a
  en:
  - Can a country's legislature be the one that appoints the members of its data protection authority?
  - Is it allowed for lawmakers to vote in the people who head the privacy regulator?
  - Our national assembly wants to choose the data protection commissioners itself. Is that an acceptable
    way to appoint them?
  ar:
  - هل يجوز أن يقوم البرلمان بتعيين أعضاء سلطة حماية البيانات؟
  - البرلمان عندنا يبي يختار أعضاء هيئة حماية البيانات بنفسه، هل هذا مسموح؟
  - هل يُعد تعيين أعضاء الجهة الرقابية عن طريق المجلس النيابي طريقة مقبولة وفق اللائحة؟
- key: gdpr:art-53:para-1:pt-2
  text: 1c26d0c1ee5e5036
  en:
  - Can the government appoint the members of the national data protection regulator?
  - Is it OK for a ministry or cabinet to pick who sits on the privacy authority?
  - Does EU law let the executive branch name the data protection supervisors in a country?
  ar:
  - هل يمكن للحكومة أن تعيّن أعضاء الهيئة الرقابية لحماية البيانات؟
  - الحكومة عندنا هي اللي تختار أعضاء جهة حماية البيانات، هل هذا قانوني؟
  - هل يسمح النظام بأن تقوم السلطة التنفيذية بتسمية أعضاء سلطة حماية البيانات؟
- key: gdpr:art-53:para-1:pt-3
  text: a05999df52cc51ca
  en:
  - Can a president or monarch formally appoint the members of the data protection authority?
  - Is appointment by the head of State a valid route for choosing privacy regulator members?
  - In our country the president signs off the appointment of data protection supervisors. Is that permitted?
  ar:
  - هل يجوز أن يعيّن رئيس الدولة أعضاء سلطة حماية البيانات؟
  - عندنا الرئيس هو اللي يوقّع تعيين أعضاء هيئة حماية البيانات، هل هذا مسموح؟
  - هل التعيين بواسطة رأس الدولة طريقة صحيحة لاختيار أعضاء الجهة الرقابية؟
- key: gdpr:art-53:para-1:pt-4
  text: 7801a5faea7f467e
  en:
  - Can an independent committee, not the government or parliament, appoint data protection authority
    members?
  - Is it allowed for a separate independent body set up by national law to select the privacy regulator's
    members?
  - What if our national law gives a special independent panel the job of appointing the data protection
    supervisors?
  ar:
  - هل يجوز أن تقوم هيئة مستقلة بتعيين أعضاء سلطة حماية البيانات بدل البرلمان أو الحكومة؟
  - لو القانون المحلي عطى لجنة مستقلة صلاحية اختيار أعضاء جهة حماية البيانات، هل هذا مقبول؟
  - هل يمكن لجهة مستقلة يحددها قانون الدولة العضو أن تتولى تعيين أعضاء الجهة الرقابية؟
- key: gdpr:art-53:para-2
  text: 4e9a7f9d8c161692
  en:
  - What background or skills must someone have to sit on a data protection regulator?
  - Do members of the privacy authority need to be experts in personal data protection?
  - We're drafting the hiring criteria for our national data protection commissioners. What qualifications
    should they have?
  ar:
  - ما المؤهلات والخبرات المطلوبة فيمن يكون عضوًا في سلطة حماية البيانات؟
  - هل لازم يكون عضو هيئة حماية البيانات عنده خبرة في مجال خصوصية البيانات؟
  - هل يشترط أن يتمتع عضو الجهة الرقابية بكفاءة ومهارات في حماية البيانات الشخصية لأداء مهامه؟
- key: gdpr:art-53:para-3
  text: f124e50c46e8bd79
  en:
  - When does a data protection authority member's time in the job come to an end?
  - Can a privacy regulator member just quit, or does their role end only when their term runs out?
  - What are the ways a data protection commissioner's duties stop, like retirement or end of term?
  ar:
  - متى تنتهي مهام عضو سلطة حماية البيانات؟
  - عضو هيئة حماية البيانات قدّم استقالته، هل هذا يعتبر إنهاءً لمهامه؟
  - ما الحالات التي تنتهي فيها ولاية عضو الجهة الرقابية مثل انتهاء المدة أو التقاعد الإجباري؟
- key: gdpr:art-53:para-4
  text: 7ba034e3e4af8823
  en:
  - Under what circumstances can a data protection authority member be fired?
  - Can the government remove a privacy regulator's commissioner just because they disagree with their
    decisions?
  - A data protection supervisor has stopped meeting the requirements for the job. Can they be dismissed?
  ar:
  - في أي حالات يجوز عزل عضو سلطة حماية البيانات من منصبه؟
  - هل تقدر الحكومة تفصل عضو هيئة حماية البيانات لمجرد إنها مو راضية عن قراراته؟
  - هل يجوز إقالة عضو الجهة الرقابية إذا ارتكب سوء سلوك جسيم أو لم يعد مستوفيًا لشروط المنصب؟
- key: gdpr:art-54:para-1
  text: 5ba75b878dcaa627
  en:
  - What does each EU country have to set up in its own national law about its data protection regulator?
  - We're launching our app in several EU countries and want to know who decides how the privacy watchdog
    is created and run. Is that left to each country?
  - Why do the rules about who runs the data protection authority differ from one EU country to another?
  ar:
  - ما الذي يجب على كل دولة عضو في الاتحاد الأوروبي أن تنص عليه في قانونها بشأن هيئة حماية البيانات؟
  - نشغّل تطبيقنا في عدة دول أوروبية ونبغى نعرف مين يحدد كيف تتشكل جهة الرقابة على الخصوصية، هل كل دولة
    لها قانونها؟
  - ليش تختلف قواعد تعيين وإدارة هيئة حماية البيانات من دولة لدولة في أوروبا؟
- key: gdpr:art-54:para-1:pt-a
  text: bce4a7f5dfddb475
  en:
  - Does a country need a specific law to create its data protection regulator, or can it just exist informally?
  - Who legally sets up the privacy authority that oversees my company's app in an EU country?
  - Our startup wants to know if the national data protection agency is created by statute in each member
    state.
  ar:
  - هل يلزم أن تنشأ هيئة حماية البيانات في كل دولة أوروبية بقانون وطني؟
  - مين اللي ينشئ جهة الرقابة على الخصوصية اللي تراقب تطبيقنا في دولة أوروبية؟
  - كيف تتأسس السلطة الرقابية لحماية البيانات في كل دولة عضو من الناحية القانونية؟
- key: gdpr:art-54:para-1:pt-b
  text: 4aaf720945c25462
  en:
  - I'm curious whether there are requirements on the background or expertise of the people who regulate
    our online shop's data practices.
  ar:
  - هل توجد شروط على خبرة وكفاءة الأشخاص الذين يتولون الإشراف على ممارسات البيانات في شركتنا؟
- key: gdpr:art-54:para-1:pt-c
  text: 14e1e19204de9c42
  en:
  - Does national law have to lay out the procedure for appointing the people who oversee privacy compliance?
  ar:
  - هل لازم القانون الوطني يحدد إجراءات تعيين المسؤولين عن الرقابة على الخصوصية؟
- key: gdpr:art-54:para-1:pt-d
  text: fc34a24ea47b97bb
  en:
  - How long can a member of an EU data protection authority serve in office?
  - Is there a minimum term length for the people running the privacy regulator, so they stay independent?
  - Why were some first appointments after May 2016 allowed to be shorter than four years?
  ar:
  - كم مدة ولاية عضو هيئة حماية البيانات في الاتحاد الأوروبي؟
  - هل في حد أدنى لمدة بقاء المسؤول في جهة الرقابة على الخصوصية عشان يضل مستقل؟
  - لماذا سُمح بأن تكون بعض التعيينات الأولى بعد مايو 2016 أقصر من أربع سنوات؟
- key: gdpr:art-54:para-1:pt-e
  text: 06235fc85fe15bea
  en:
  - Can a data protection authority member be reappointed after their term ends?
  - Is there a limit on how many terms a privacy regulator's member can serve?
  - Does the national law decide whether regulators can be reappointed for another term?
  ar:
  - هل يمكن إعادة تعيين عضو هيئة حماية البيانات بعد انتهاء ولايته؟
  - في حد لعدد المرات اللي ممكن يتعين فيها المسؤول بجهة الخصوصية؟
  - هل يقرر القانون الوطني إن كان يجوز تجديد ولاية أعضاء السلطة الرقابية وكم مرة؟
- key: gdpr:art-54:para-1:pt-f
  text: 2dae255d2f5b03b7
  en:
  - Can a privacy regulator's staff take side jobs or gifts from tech companies they supervise?
  - What rules stop members of a data protection authority from taking conflicting jobs even after they
    leave?
  - Do national laws set out what happens when a regulator's employee leaves, and what they can't do afterward?
  ar:
  - هل يجوز لموظفي هيئة حماية البيانات العمل مع شركات تقنية أو قبول هدايا منها؟
  - ما القواعد التي تمنع أعضاء الهيئة من أعمال متعارضة حتى بعد انتهاء خدمتهم؟
  - وش الممنوع على موظف جهة الخصوصية يسويه بعد ما يترك الوظيفة؟
- key: gdpr:art-54:para-2
  text: 3075de256d248e8e
  en:
  - Will the regulator's staff keep confidential the business information we hand over during an investigation?
  - Someone reported our app to the data protection authority. Can the regulator reveal who they are?
  - Does the duty of confidentiality for privacy regulators continue after they leave their job?
  ar:
  - هل سيحافظ موظفو هيئة حماية البيانات على سرية المعلومات التي نقدمها لهم أثناء التحقيق؟
  - شخص بلّغ عن تطبيقنا لهيئة الخصوصية، هل تقدر الجهة تكشف هويته؟
  - هل يستمر واجب السرية المهنية على موظفي جهة الرقابة بعد انتهاء عملهم؟
- key: gdpr:art-55:para-1
  text: 4b5a2457d68f7597
  en:
  - Our app has users in Germany and France but we're based in Ireland. Which data protection regulator
    can act against us on its own country's soil?
  - Does each EU country's data protection authority only have power inside its own borders?
  - A regulator in Spain contacted our online shop about a customer complaint. Do they have authority
    over us to enforce privacy rules there?
  ar:
  - ما هي حدود صلاحية سلطة حماية البيانات في كل دولة أوروبية، هل تقتصر على أراضي دولتها فقط؟
  - عندنا تطبيق مستخدمينه في ألمانيا وفرنسا، هل كل جهة رقابية هناك تقدر تحاسبنا على أراضي بلدها؟
  - وصلنا إيميل من هيئة حماية البيانات في إسبانيا، يعني لها صلاحية علينا ولا لا؟
- key: gdpr:art-55:para-2
  text: 80f1bbd8f440934d
  en:
  - We run a municipal services portal for a city council that processes residents' data under a legal
    obligation. Which regulator oversees us, and does the lead authority system apply?
  - Our company processes data because a law requires it, for example tax reporting. Do we deal only with
    the regulator of that country instead of a lead authority?
  - Our startup builds software for a public hospital that handles data for a public-interest task. Does
    the one-stop-shop approach apply or only the local regulator?
  ar:
  - نحن جهة حكومية نعالج بيانات المواطنين بموجب التزام قانوني، أي سلطة رقابية تختص بنا وهل ينطبق نظام
    السلطة الرئيسية؟
  - شركتنا تعالج بيانات لأن القانون يلزمها مثل التقارير الضريبية، هل نتعامل فقط مع هيئة حماية البيانات
    في تلك الدولة؟
  - شغالين على نظام لمستشفى حكومي، وهل الجهة الرقابية هي بس اللي في بلد المستشفى ولا في جهة رئيسية ثانية؟
- key: gdpr:art-55:para-3
  text: 1da3bd153b18568c
  en:
  - We build case management software for courts. Does the data protection regulator supervise how judges'
    rulings and case data are processed?
  - Is a court's handling of personal data while deciding a case outside the data protection authority's
    oversight?
  - A user complained to the regulator about a court's use of their data in a trial. Can the regulator
    investigate that?
  ar:
  - نطور نظام إدارة قضايا للمحاكم، هل تراقب سلطة حماية البيانات معالجة البيانات أثناء الفصل في القضايا؟
  - هل تخرج معالجة المحكمة للبيانات الشخصية أثناء عملها القضائي عن رقابة هيئة حماية البيانات؟
  - واحد اشتكى للهيئة على المحكمة لأنها استخدمت بياناته بالمحاكمة، تقدر الهيئة تحقق بالموضوع هذا؟
- key: gdpr:art-56:para-1
  text: fca26ad484127beb
  en:
  - Our SaaS company has offices in Ireland and Spain but runs one platform for all of Europe. Which country's
    data protection regulator is the main one for us?
  - How is the lead regulator decided for a company that processes user data across several EU countries?
  - We only have a single office in the EU but customers in many member states. Does the regulator where
    that office is take the lead on our cross-border data handling?
  ar:
  - شركتنا لديها مكتب رئيسي في إيرلندا وعملاء في عدة دول أوروبية، أي جهة رقابية تكون هي الجهة الرئيسية
    المسؤولة عن معالجة بياناتنا عبر الحدود؟
  - كيف يتم تحديد السلطة الإشرافية الرئيسية لشركة تعالج بيانات مستخدمين في عدة دول من الاتحاد الأوروبي؟
  - عندنا مكتب واحد بس في أوروبا وتطبيقنا يشتغل في كل الدول، هل جهة حماية البيانات في بلد المكتب هي اللي
    تتولى الموضوع؟
- key: gdpr:art-56:para-2
  text: edbe65c967f8a060
  en:
  - A user in Austria complained about our app to the local data protection office, but the issue only
    affects Austrian users. Can that local regulator handle it itself instead of the lead one?
  - Can a national regulator investigate a complaint about our online shop if it only concerns our branch
    in that country?
  - Our company is based in another country, but a data problem hit only customers in one member state.
    Could that state's regulator deal with it directly?
  ar:
  - مستخدم في النمسا قدّم شكوى ضد تطبيقنا لدى الجهة المحلية والمشكلة تخص مستخدمي النمسا فقط، هل تستطيع
    هذه الجهة معالجتها بنفسها دون الجهة الرئيسية؟
  - هل يجوز لجهة حماية البيانات في دولة ما أن تنظر في شكوى تتعلق فقط بفرعنا في تلك الدولة؟
  - شركتنا مقرها في دولة ثانية بس المشكلة أثرت على زبائن في بلد واحد بس، يعني جهة هذاك البلد تقدر تتصرف
    مباشرة؟
- key: gdpr:art-56:para-3
  text: ae99075d1944381f
  en:
  - A local regulator received a complaint about our app that only affects its country. Does it have to
    tell the lead regulator, and how long does the lead one have to decide whether to take over?
  - How many weeks does the lead data protection authority have to decide if it will handle a local case?
  - When the lead regulator decides whether to take over a local complaint, does it consider whether we
    have an office in that country?
  ar:
  - جهة محلية تلقت شكوى عن تطبيقنا تخص بلدها فقط، هل يجب عليها إبلاغ السلطة الرئيسية وكم المدة المتاحة
    للأخيرة لتقرر أنها ستتولى القضية؟
  - كم أسبوعاً تملك السلطة الإشرافية الرئيسية لتقرر هل تنظر في قضية محلية أم لا؟
  - هل تأخذ السلطة الرئيسية بعين الاعتبار وجود فرع لشركتنا في بلد الشكوى عند قرارها بتولي القضية؟
- key: gdpr:art-56:para-4
  text: 2abcd6a4827b22b3
  en:
  - The lead regulator took over a complaint first raised in another country. Can the local regulator
    still have a say in the outcome?
  - If the lead authority handles a case that a local authority reported, can the local one send its own
    proposed decision?
  - After the lead regulator agrees to handle a local complaint about our service, which process is followed
    and how much weight does the local regulator's draft get?
  ar:
  - السلطة الرئيسية قررت تولي شكوى وردت أصلاً في دولة أخرى، هل يبقى للجهة المحلية رأي في النتيجة؟
  - إذا تولت السلطة الرئيسية قضية أبلغت عنها سلطة محلية، هل يمكن للأخيرة تقديم مشروع قرار خاص بها؟
  - لما الجهة الرئيسية توافق تتولى شكوى محلية على خدمتنا، وش الإجراء المتبع وكم وزن مسودة الجهة المحلية؟
- key: gdpr:art-56:para-5
  text: c3ce6c754d113a3c
  en:
  - The lead regulator declined to take a complaint about our app that only concerns one country. Who
    deals with it now?
  - If the main data protection authority doesn't want to handle a local case, does the local authority
    investigate it itself?
  - Our company got a local complaint and the lead regulator passed on it. What procedures will the local
    regulator follow, including working with other authorities?
  ar:
  - السلطة الرئيسية رفضت النظر في شكوى عن تطبيقنا تخص بلداً واحداً فقط، من يتعامل معها الآن؟
  - إذا لم ترغب الجهة الرئيسية بمعالجة قضية محلية، هل تتولاها الجهة المحلية بنفسها؟
  - شركتنا وصلتها شكوى محلية والسلطة الرئيسية تنازلت عنها، أي إجراءات ستتبعها الجهة المحلية وكيف تتعاون
    مع السلطات الأخرى؟
- key: gdpr:art-56:para-6
  text: 34047c38bb46ce7d
  en:
  - Who do we talk to as our single point of contact with regulators when we process data in many EU countries?
  - Do we have to deal with every country's data protection authority separately, or just one?
  - We're getting questions from several EU regulators about our cross-border app. Should all communication
    go through one authority?
  ar:
  - مع من نتواصل كجهة اتصال وحيدة مع الجهات الرقابية عندما نعالج بيانات في عدة دول أوروبية؟
  - هل علينا التعامل مع كل جهة حماية بيانات في كل دولة على حدة أم مع جهة واحدة فقط؟
  - وصلتنا أسئلة من أكثر من جهة رقابية أوروبية بخصوص تطبيقنا العابر للحدود، هل يكون كل التواصل عبر جهة
    وحدة؟
- key: gdpr:art-57:para-1
  text: f193e4358bb91326
  en:
  - What are the things a data protection regulator in my country is supposed to do for businesses and
    users?
  - We're launching an app in the EU and want to understand what the privacy watchdog actually does day
    to day.
  - Is the data protection authority only there to fine companies or does it have other jobs too?
  ar:
  - ما هي المهام التي تتولاها سلطة حماية البيانات في كل دولة تجاه الشركات والمستخدمين؟
  - إيش بالضبط شغل الجهة الرقابية لحماية البيانات؟ بس تغرّم الشركات ولا لها أدوار ثانية؟
  - نخطط لإطلاق تطبيقنا في أوروبا ونريد معرفة نطاق صلاحيات ومهام الجهة الإشرافية على أراضيها.
- key: gdpr:art-57:para-1:pt-a
  text: 9b338e4acfacc504
  en:
  - Who checks that my online shop actually follows the privacy rules and makes us comply?
  - Does the data protection regulator have the job of enforcing the rules against companies like my SaaS
    startup?
  - Are we going to be monitored by a regulator for compliance with GDPR?
  ar:
  - من الجهة التي تراقب التزام متجري الإلكتروني بقواعد حماية البيانات وتفرضها علينا؟
  - هل من مهام الجهة الإشرافية متابعة تطبيق اللائحة على الشركات الناشئة مثل شركتنا؟
  - مين اللي يراقب إن تطبيقنا ماشي على قواعد الخصوصية ويجبرنا نلتزم؟
- key: gdpr:art-57:para-1:pt-b
  text: a144c43eebb83c54
  en:
  - Does the privacy authority run awareness campaigns about data risks, especially for kids using apps?
  - Our app is used by children; will the regulator pay special attention to things aimed at minors?
  - Is the regulator supposed to educate the public about their privacy rights?
  ar:
  - هل تنفذ سلطة حماية البيانات حملات توعية للجمهور بمخاطر معالجة البيانات وحقوقهم؟
  - تطبيقنا موجه للأطفال، هل تعطي الجهة الرقابية اهتماماً خاصاً للأنشطة الموجهة للصغار؟
  - هل الجهة المختصة مطلوب منها توعية الناس بحقوقهم في الخصوصية؟
- key: gdpr:art-57:para-1:pt-c
  text: ffa9597ea3741bb2
  en:
  - Does the data protection authority advise the government and parliament on new laws affecting privacy?
  - Can the regulator be asked by ministries for advice on administrative measures that affect people's
    data rights?
  - Who advises lawmakers when a new national law touches personal data protection?
  ar:
  - هل تقدم سلطة حماية البيانات المشورة للحكومة والبرلمان بشأن تشريعات تمس الخصوصية؟
  - هل يمكن للوزارات أخذ رأي الجهة الرقابية في إجراءات إدارية تؤثر على حقوق الأفراد في بياناتهم؟
  - مين يستشيره المشرّعون لما يصدر قانون جديد يخص حماية البيانات الشخصية؟
- key: gdpr:art-57:para-1:pt-d
  text: aa2827e2f6e0e278
  en:
  - Does the regulator help companies and vendors understand what their privacy obligations are?
  - We're a small processor and don't know our duties; is the authority supposed to raise awareness for
    businesses like us?
  - Is there official outreach to controllers and processors about GDPR duties?
  ar:
  - هل تساعد الجهة الإشرافية الشركات ومقدمي الخدمات على فهم التزاماتهم في حماية البيانات؟
  - نحن شركة صغيرة ما نعرف واجباتنا كمعالج بيانات، هل من دور الجهة توعيتنا؟
  - هل هناك توعية رسمية للمسؤولين عن المعالجة والمعالجين بالتزاماتهم؟
- key: gdpr:art-57:para-1:pt-e
  text: 3ef8adb420e1f67b
  en:
  - A user of our app asked how to exercise their data rights and wants to talk to the regulator; will
    the authority give them info?
  - Can an individual ask the data protection authority to explain their rights over their personal data?
  - If a customer lives in another EU country, can the authorities work together to help them with their
    rights?
  ar:
  - مستخدم لتطبيقنا يسأل كيف يمارس حقوقه في بياناته، هل تقدم السلطة له المعلومات عند الطلب؟
  - هل يحق للفرد أن يطلب من جهة حماية البيانات شرح حقوقه المتعلقة ببياناته؟
  - وش يصير لو العميل في دولة أوروبية ثانية، هل تتعاون الجهات لمساعدته في حقوقه؟
- key: gdpr:art-57:para-1:pt-f
  text: d47fd787dd87a57b
  en:
  - A customer filed a complaint against my company with the regulator; what will the authority do with
    it?
  - Will the complainant be told how the investigation is going and what the result was?
  - Can a consumer group file a privacy complaint on behalf of users, and does the authority have to handle
    it?
  ar:
  - عميل قدّم شكوى ضد شركتي لدى جهة حماية البيانات، كيف ستتعامل معها؟
  - هل يجب على الجهة إبلاغ صاحب الشكوى بتقدم التحقيق ونتيجته خلال مدة معقولة؟
  - هل تنظر السلطة في شكوى مقدمة من جمعية أو منظمة نيابة عن المستخدمين؟
- key: gdpr:art-57:para-1:pt-g
  text: c54d39e4ba6fe88a
  en:
  - Our app has users in several EU countries; do the regulators share information and help each other?
  - Do data protection authorities coordinate so the rules are applied the same way everywhere?
  - Can one country's privacy regulator ask another for help in a case about us?
  ar:
  - تطبيقنا له مستخدمون في عدة دول أوروبية، هل تتبادل الجهات الرقابية المعلومات وتتعاون؟
  - هل تنسق سلطات حماية البيانات فيما بينها لتطبيق اللائحة بشكل موحد؟
  - شلون تتعاون الجهة في بلد مع جهة بلد ثاني في قضية تخص شركة؟
- key: gdpr:art-57:para-1:pt-h
  text: 467effd9e681017b
  en:
  - Can the regulator open an investigation into us because another authority or a public body tipped
    them off?
  - Does the authority investigate companies even without a user complaint?
  ar:
  - هل يمكن للجهة الرقابية فتح تحقيق معنا بناءً على معلومات من سلطة أخرى أو جهة عامة؟
  - هل تحقق السلطة مع الشركات حتى بدون شكوى من مستخدم؟
- key: gdpr:art-57:para-1:pt-i
  text: c1314e4c230cc6f0
  en:
  - Does the regulator keep an eye on new tech like AI and ad tracking practices?
  - Is the authority supposed to follow changes in technology and business practices that affect privacy?
  - Why might the regulator suddenly focus on a new product trend like our app's tracking feature?
  ar:
  - هل تتابع الجهة الرقابية التقنيات الجديدة وممارسات التسويق التي تؤثر على الخصوصية؟
  - هل من مهام السلطة رصد تطورات تقنية المعلومات والاتصالات والممارسات التجارية؟
  - ليش ممكن الجهة تركّز فجأة على ميزة جديدة مثل التتبع في تطبيقنا؟
- key: gdpr:art-57:para-1:pt-j
  text: a4cced2833d17e3e
  en:
  - Who issues the official standard contract templates for hiring a processor or sending data abroad?
  - Does the national authority adopt SCCs for transferring data outside the EU?
  ar:
  - من الجهة التي تعتمد نماذج العقود القياسية لاستخدام معالج بيانات أو نقل البيانات للخارج؟
  - هل تعتمد السلطة الوطنية بنود SCC لنقل البيانات خارج أوروبا؟
- key: gdpr:art-57:para-1:pt-k
  text: 86359680356a072b
  en:
  - Is there an official list from the regulator of processing that requires a DPIA?
  - Does the authority maintain a list of cases where a privacy impact assessment is mandatory?
  ar:
  - هل تصدر الجهة الرقابية قائمة رسمية بأنواع المعالجة التي تتطلب تقييم الأثر؟
  - هل تحتفظ السلطة بقائمة بالحالات التي يجب فيها تقييم الأثر على حماية البيانات؟
- key: gdpr:art-57:para-1:pt-l
  text: d3bb51ac5d2ed31c
  en:
  - Our DPIA showed high risk we can't reduce; will the regulator give us advice on that processing?
  - Does the authority advise on high-risk processing after an impact assessment?
  ar:
  - تقييم الأثر عندنا أظهر مخاطر عالية لا نستطيع تخفيفها، هل ستقدم الجهة الرقابية المشورة؟
  - هل تقدم الجهة نصائح بشأن عمليات المعالجة التي تستلزم استشارة مسبقة؟
- key: gdpr:art-57:para-1:pt-m
  text: 63a2661a7adfaee3
  en:
  - Our industry association wants to write a privacy code of conduct; will the regulator approve it?
  - Does the authority encourage and review sector codes of conduct for data protection?
  - Who gives an opinion on a code of conduct for app developers' privacy practices?
  ar:
  - اتحاد قطاعنا يريد إعداد مدونة سلوك لحماية البيانات، هل ستعتمدها الجهة الرقابية؟
  - هل تشجع السلطة مدونات السلوك القطاعية وتبدي رأيها فيها؟
  - من يقدّم الرأي ويوافق على مدونة سلوك تخص ممارسات الخصوصية؟
- key: gdpr:art-57:para-1:pt-n
  text: 4afe24e6b2638205
  en:
  - We want a privacy seal for our product; does the regulator encourage certification schemes and approve
    their criteria?
  - Who approves the criteria for data protection certifications and trust marks?
  - Can the authority set up or support privacy certification we could use to show compliance?
  ar:
  - نريد ختم خصوصية لمنتجنا، هل تشجع الجهة الرقابية آليات الاعتماد وتوافق على معاييرها؟
  - من يوافق على معايير شهادات حماية البيانات والأختام؟
  - هل تدعم السلطة إنشاء شهادات خصوصية يمكننا استخدامها لإثبات الامتثال؟
- key: gdpr:art-57:para-1:pt-o
  text: 4848d32f9adcba3b
  en:
  - We hold a privacy certification; will the authority periodically review it?
  - Can a data protection certificate we received be re-checked by the regulator later?
  - Does the regulator do regular reviews of issued certifications?
  ar:
  - حصلنا على شهادة خصوصية، هل ستراجعها الجهة الرقابية دورياً؟
  - هل يمكن للسلطة إعادة فحص شهادة حماية البيانات التي منحت لنا لاحقاً؟
  - هل تجري الجهة مراجعة دورية للشهادات الصادرة؟
- key: gdpr:art-57:para-1:pt-p
  text: 83999ad542d91733
  en:
  - We want to become a certification or code-monitoring body; where are the accreditation requirements
    published?
  - Does the authority write and publish the criteria for bodies that monitor codes or certify privacy?
  ar:
  - نريد أن نصبح جهة منح شهادات أو مراقبة مدونات سلوك، أين تُنشر شروط الاعتماد؟
  - هل تصيغ السلطة وتنشر متطلبات اعتماد الهيئات التي تراقب المدونات أو تمنح شهادات الخصوصية؟
- key: gdpr:art-57:para-1:pt-q
  text: 750562e6aedfd843
  en:
  - Who actually accredits a company that wants to issue privacy certifications?
  - Does the data protection authority carry out the accreditation of code monitoring bodies?
  - We applied to be an accredited certification body; is the regulator the one that grants it?
  ar:
  - من الذي يمنح الاعتماد لشركة ترغب بإصدار شهادات حماية البيانات؟
  - هل تتولى السلطة إجراء اعتماد الهيئات المراقبة لمدونات السلوك وهيئات الاعتماد؟
  - قدمنا طلباً لنكون جهة منح شهادات معتمدة، هل الجهة الرقابية هي من تمنحه؟
- key: gdpr:art-57:para-1:pt-r
  text: 242498f8005db90a
  en:
  - We use custom contract terms for sending data abroad; does the authority need to authorise them?
  - Who approves ad hoc data transfer contract clauses that aren't the standard ones?
  - Do we need the regulator's sign-off on our own bespoke transfer clauses?
  ar:
  - نستخدم بنوداً تعاقدية مخصصة لنقل البيانات للخارج، هل تحتاج لإذن من الجهة الرقابية؟
  - من يرخّص البنود التعاقدية غير القياسية لنقل البيانات؟
  - هل نحتاج موافقة السلطة على بنودنا الخاصة بنقل البيانات؟
- key: gdpr:art-57:para-1:pt-s
  text: 50e32f66bdcf1751
  en:
  - Our multinational group wants BCRs for intra-group data transfers; who approves them?
  - Does the data protection authority sign off on binding corporate rules?
  ar:
  - مجموعتنا متعددة الجنسيات تريد قواعد ملزمة للشركات لنقل البيانات بين فروعها، من يعتمدها؟
  - هل تتولى سلطة حماية البيانات الموافقة على القواعد المؤسسية الملزمة؟
- key: gdpr:art-57:para-1:pt-t
  text: 53b2ebb450c97724
  en:
  - Does each national regulator take part in the work of the European Data Protection Board?
  - Do national privacy authorities contribute to EU-level coordination body activities?
  - Is it part of the regulator's job to help the Board with its work?
  ar:
  - هل تشارك كل سلطة وطنية في أعمال المجلس الأوروبي لحماية البيانات؟
  - هل تساهم سلطات الخصوصية الوطنية في أنشطة هيئة التنسيق على مستوى الاتحاد؟
  - هل من مهام الجهة الرقابية المساهمة في أنشطة المجلس؟
- key: gdpr:art-57:para-1:pt-u
  text: 499e4d5f37b0dd43
  en:
  - Does the regulator keep a record of violations and the corrective actions it took against companies?
  - Will our past privacy breach and any penalty be logged by the authority?
  - Do authorities keep internal records of infringements?
  ar:
  - هل تحتفظ الجهة الرقابية بسجل داخلي للمخالفات والإجراءات التصحيحية المتخذة ضد الشركات؟
  - هل ستسجل السلطة مخالفتنا السابقة والعقوبة إن وجدت؟
  - هل تحتفظ السلطات بسجلات داخلية بالانتهاكات؟
- key: gdpr:art-57:para-1:pt-v
  text: 19c57be405ee42f7
  en:
  - Can the regulator take on other privacy-related duties not specifically listed?
  - Is the authority's role limited to a fixed list or does it cover any task connected to personal data
    protection?
  - What catch-all responsibilities does the data protection authority have?
  ar:
  - هل يمكن للجهة الرقابية تولي مهام أخرى تتعلق بحماية البيانات غير المذكورة تحديداً؟
  - هل دور السلطة محصور بقائمة محددة أم يشمل أي مهمة مرتبطة بحماية البيانات الشخصية؟
  - ما المهام العامة الأخرى التي قد تُسند لجهة حماية البيانات؟
- key: gdpr:art-57:para-2
  text: de63f0036493618e
  en:
  - How can a user submit a privacy complaint to the regulator, is there an online form?
  - Can people complain to the authority electronically or only on paper?
  - Does the regulator have to make it easy for users of our app to file a complaint?
  ar:
  - كيف يقدم المستخدم شكوى خصوصية للجهة الرقابية، هل يوجد نموذج إلكتروني؟
  - هل يمكن تقديم الشكوى للسلطة إلكترونياً أم ورقياً فقط؟
  - هل يجب على الجهة تسهيل تقديم الشكاوى لمستخدمي تطبيقنا؟
- key: gdpr:art-57:para-3
  text: 4300223f4c8da0ba
  en:
  - Does it cost anything for a user to file a complaint with the data protection authority?
  - Our DPO contacted the regulator; will we be charged for their help?
  - Is using the regulator's services free for individuals?
  ar:
  - هل يدفع المستخدم رسوماً لتقديم شكوى لدى سلطة حماية البيانات؟
  - مسؤول حماية البيانات عندنا تواصل مع الجهة الرقابية، هل ستُفرض علينا رسوم؟
  - هل خدمات الجهة الرقابية مجانية للأفراد؟
- key: gdpr:art-57:para-4
  text: 281d3d7cd7775bc1
  en:
  - A person keeps sending the regulator the same repeated requests; can the authority refuse or charge
    a fee?
  - Can the regulator turn down a request it considers abusive, and who has to prove it?
  - When can the authority charge for handling a request, and what must it base the fee on?
  ar:
  - شخص يكرر نفس الطلبات على الجهة الرقابية، هل يحق لها الرفض أو فرض رسوم؟
  - هل تستطيع السلطة رفض طلب تعتبره تعسفياً، ومن يتحمل عبء إثبات ذلك؟
  - متى يجوز للجهة فرض رسوم على معالجة طلب وعلى أي أساس تُحسب؟
- key: gdpr:art-58:para-1
  text: d93e0ee605ab73a4
  en:
  - What kinds of investigative powers does a data protection regulator have over companies running apps?
  - Our SaaS got a letter from the privacy authority; what can they actually do to investigate us?
  - Is there a full list of ways a data protection authority can check up on us?
  ar:
  - ما هي صلاحيات التحقيق التي تملكها سلطة حماية البيانات تجاه الشركات التي تدير تطبيقات؟
  - وصلنا خطاب من هيئة الخصوصية، وش اللي تقدر تسويه عشان تحقق معنا؟
  - شو الصلاحيات اللي عند جهة حماية البيانات عشان تفتش على شركتنا؟
- key: gdpr:art-58:para-1:pt-a
  text: 2f7491dd0afbbfbd
  en:
  - The privacy regulator sent our startup a request for documents and details about how we process user
    data; do we have to answer?
  - Can a data protection authority force my company to hand over information, even if our processor or
    EU rep is the one holding it?
  - Is it mandatory to reply when the regulator asks for information about our app's data handling?
  ar:
  - أرسلت هيئة حماية البيانات طلبا لمعلومات عن معالجتنا لبيانات المستخدمين، هل يجب علينا الرد؟
  - هل يحق للسلطة الرقابية أن تلزم الشركة أو ممثلها في الاتحاد الأوروبي بتزويدها بالمعلومات؟
  - جاني طلب معلومات من الجهة الرقابية على الخصوصية، لازم أرد عليهم ولا أتجاهله؟
- key: gdpr:art-58:para-1:pt-b
  text: e6aaf60442aab953
  en:
  - Can the privacy regulator come and audit our company's data protection practices?
  - What does it mean if the regulator opens an investigation as an audit on our app?
  ar:
  - هل يحق لسلطة حماية البيانات إجراء تدقيق على ممارسات شركتنا في حماية البيانات؟
  - يعني ممكن الجهة الرقابية تسوي أوديت على تطبيقنا بدون ما نطلب؟
- key: gdpr:art-58:para-1:pt-c
  text: b4abf2a938efc047
  en:
  - Can the regulator re-check a privacy certification our product already received?
  - We hold a data protection certificate for our platform; can the authority review it later?
  - Who can review whether a GDPR certification was properly issued?
  ar:
  - هل تستطيع السلطة الرقابية مراجعة شهادة خصوصية حصل عليها منتجنا مسبقا؟
  - عندنا شهادة حماية بيانات لمنصتنا، هل يمكن للهيئة أن تعيد فحصها لاحقا؟
  - هل الشهادة اللي أخذناها للخصوصية ممكن الجهة تراجعها وتدقق فيها؟
- key: gdpr:art-58:para-1:pt-d
  text: 8ba91db351f584e6
  en:
  - Will the regulator formally tell us if it thinks our app broke the data protection rules?
  - Can the authority notify a company about a suspected violation before deciding anything?
  - We got a notice saying we may have infringed privacy rules; is the regulator allowed to send that?
  ar:
  - هل تُبلغنا السلطة الرقابية رسميا إذا اعتقدت أن تطبيقنا خالف قواعد حماية البيانات؟
  - هل يحق للهيئة إخطار الشركة بمخالفة مزعومة قبل أي قرار؟
  - وصلنا إشعار إننا يمكن خالفنا قواعد الخصوصية، هل من حقهم يرسلونه؟
- key: gdpr:art-58:para-1:pt-e
  text: cb6a38dac73ee3e8
  en:
  - Can the data protection authority demand access to all the personal data in our database?
  - The regulator wants to see user records stored by our processor too; can they get access?
  - Do we have to give inspectors access to our systems' personal data and related info during an investigation?
  ar:
  - هل يحق لسلطة حماية البيانات طلب الوصول إلى جميع البيانات الشخصية في قاعدة بياناتنا؟
  - الجهة الرقابية تبي تشوف سجلات المستخدمين عند مزود الخدمة كمان، هل لها هذا الحق؟
  - هل علينا تمكين المفتشين من الاطلاع على البيانات الشخصية والمعلومات اللازمة أثناء التحقيق؟
- key: gdpr:art-58:para-1:pt-f
  text: 9c0058bf147bd09d
  en:
  - Can regulators physically enter our office or data center and inspect our servers?
  - Does the privacy authority have the right to access our premises and computers during an investigation?
  - Inspectors showed up at our clinic wanting to look at our IT equipment; is that allowed?
  ar:
  - هل يحق للسلطة الرقابية دخول مكاتبنا أو مركز البيانات وفحص الخوادم؟
  - هل لهيئة حماية البيانات حق الدخول إلى مقراتنا وأجهزة المعالجة أثناء التحقيق؟
  - جا مفتشين لعيادتنا ويبون يفحصون أجهزتنا، هل هذا من حقهم؟
- key: gdpr:art-58:para-2
  text: 2a709c94d478353e
  en:
  - What penalties and corrective actions can a privacy regulator take against my company?
  - If our app is found non-compliant, what can the data protection authority force us to do?
  - Is there a list of enforcement measures the regulator can use besides fines?
  ar:
  - ما هي الإجراءات التصحيحية والعقوبات التي يمكن لسلطة حماية البيانات اتخاذها ضد شركتي؟
  - إذا تبين أن تطبيقنا مخالف، ماذا تستطيع الهيئة أن تفرض علينا؟
  - وش أنواع الإجراءات اللي تقدر الجهة الرقابية تسويها ضدنا غير الغرامات؟
- key: gdpr:art-58:para-2:pt-a
  text: 2f85d39038620b95
  en:
  - We plan to launch a new feature that may break privacy rules; can the regulator warn us beforehand?
  - Can the authority issue a warning about processing we haven't started yet?
  - What happens if the regulator thinks our upcoming tracking feature is likely to violate the rules?
  ar:
  - ننوي إطلاق ميزة جديدة قد تخالف قواعد الخصوصية، هل تستطيع الهيئة تحذيرنا مسبقا؟
  - هل يمكن للسلطة الرقابية إصدار تحذير بشأن معالجة لم تبدأ بعد؟
  - لو الجهة شافت إن خاصية التتبع اللي بنطلقها غالبا مخالفة، شو ممكن تسوي؟
- key: gdpr:art-58:para-2:pt-b
  text: 48994b2addf1cab6
  en:
  - Can the regulator just formally reprimand us for a privacy violation without a fine?
  - What is a reprimand from a data protection authority and when can it be given?
  - We already broke the rules with our newsletter database; could the outcome be only an official rebuke?
  ar:
  - هل تستطيع السلطة الرقابية توجيه توبيخ رسمي لنا على مخالفة الخصوصية دون غرامة؟
  - ما هو التوبيخ الذي تصدره هيئة حماية البيانات ومتى يُوجَّه؟
  - خالفنا القواعد في قاعدة بيانات النشرة البريدية، ممكن تكون النتيجة مجرد توبيخ رسمي؟
- key: gdpr:art-58:para-2:pt-c
  text: 4d5e320aed18ab0d
  en:
  - A user complained that we ignored their request to see or delete their data; can the regulator force
    us to comply?
  - Can the authority order my company to honor a customer's data rights request?
  - What if we keep refusing a user's access request and they go to the regulator?
  ar:
  - شكا مستخدم أننا تجاهلنا طلبه للاطلاع على بياناته أو حذفها، هل تستطيع الهيئة إلزامنا بتنفيذه؟
  - هل يمكن للسلطة الرقابية أن تأمر شركتي بتلبية طلب عميل يمارس حقوقه؟
  - لو ضلينا نرفض طلب مستخدم يبي بياناته وراح للجهة الرقابية، وش يصير؟
- key: gdpr:art-58:para-2:pt-d
  text: ffdad6b83d926e00
  en:
  - Can the regulator tell us to fix our data processing within a deadline?
  - The authority gave us 60 days to make our app compliant; can they set such a deadline and dictate
    how?
  - Can a privacy regulator order specific changes to how our system processes data?
  ar:
  - هل تستطيع السلطة الرقابية أن تأمرنا بتصحيح معالجة البيانات خلال مهلة محددة؟
  - منحتنا الهيئة 60 يوما لجعل تطبيقنا متوافقا، هل يحق لها تحديد المهلة وطريقة التصحيح؟
  - هل يمكن لجهة حماية البيانات فرض تعديلات معينة على طريقة معالجة نظامنا للبيانات؟
- key: gdpr:art-58:para-2:pt-e
  text: 868a996ae1c202f0
  en:
  - We had a data leak and didn't tell our users; can the regulator make us notify them?
  - Can the authority order a company to inform affected customers about a breach?
  - If our app got hacked and we stayed quiet, what can the data protection authority force us to do?
  ar:
  - حصل تسريب لبيانات عندنا ولم نخبر المستخدمين، هل تستطيع الهيئة إلزامنا بإبلاغهم؟
  - هل يحق للسلطة الرقابية أن تأمر الشركة بإبلاغ المتضررين من خرق البيانات؟
  - تطبيقنا اخترق وسكتنا، وش تقدر الجهة الرقابية تجبرنا عليه؟
- key: gdpr:art-58:para-2:pt-f
  text: 78a231f67bb89e7b
  en:
  - Can the regulator ban us from processing personal data altogether?
  - Could our app be forced to stop collecting user data temporarily or permanently?
  - What if the authority orders a processing ban on our analytics feature?
  ar:
  - هل يمكن لسلطة حماية البيانات منعنا من معالجة البيانات الشخصية نهائيا؟
  - هل يمكن إجبار تطبيقنا على إيقاف جمع بيانات المستخدمين مؤقتا أو بشكل دائم؟
  - لو أصدرت الجهة أمر بحظر المعالجة على ميزة التحليلات عندنا، هل هذا ممكن؟
- key: gdpr:art-58:para-2:pt-g
  text: 7167c6e3e6413de7
  en:
  - Can the regulator order us to correct or delete user data and tell the companies we shared it with?
  - The authority says we must erase a customer's data and inform our partners who received it; is that
    within its powers?
  - Can a privacy regulator force us to restrict processing of someone's data?
  ar:
  - هل تستطيع الهيئة أن تأمرنا بتصحيح بيانات مستخدم أو حذفها وإبلاغ الجهات التي شاركناها معها؟
  - تقول السلطة إن علينا مسح بيانات عميل وإخطار شركائنا الذين استلموها، هل هذا ضمن صلاحياتها؟
  - هل يحق للجهة الرقابية إلزامنا بتقييد معالجة بيانات شخص ما؟
- key: gdpr:art-58:para-2:pt-h
  text: 8b0efd92c28f06f4
  en:
  - Can a regulator cancel a privacy certification our company holds?
  - What if the certification body should not have certified a product; can the authority stop or revoke
    it?
  - Can the authority tell a certifier not to issue a data protection certificate to us?
  ar:
  - هل تستطيع السلطة الرقابية سحب شهادة خصوصية تحملها شركتنا؟
  - إذا لم تعد شروط الشهادة متحققة، هل يمكن للهيئة إلغاءها أو منع إصدارها؟
  - هل يحق للجهة الرقابية أن تأمر جهة الاعتماد بعدم منحنا شهادة حماية بيانات؟
- key: gdpr:art-58:para-2:pt-i
  text: 6a51d23408f9b5e0
  en:
  - Can the regulator fine us, and can it do so instead of or on top of other measures?
  - Is a GDPR fine imposed in addition to corrective orders or only alone?
  ar:
  - هل تستطيع السلطة الرقابية فرض غرامة علينا، سواء بدل الإجراءات الأخرى أو معها؟
  - هل الغرامة تُفرض بالإضافة للأوامر التصحيحية ولا بدلا منها؟
- key: gdpr:art-58:para-2:pt-j
  text: 5606f485438772ba
  en:
  - Can the regulator stop us from sending user data to a vendor in another country?
  - Our servers are in a non-EU country; can the authority suspend data transfers there?
  - Can data flows to a cloud provider abroad be ordered to stop?
  ar:
  - هل تستطيع السلطة الرقابية إيقاف إرسالنا بيانات المستخدمين إلى مزود في بلد آخر؟
  - خوادمنا في دولة خارج الاتحاد الأوروبي، هل يمكن للهيئة تعليق نقل البيانات إليها؟
  - ممكن الجهة تأمر بوقف تدفق البيانات لمزود سحابي برا البلاد؟
- key: gdpr:art-58:para-3
  text: f96f2bf33db58d6f
  en:
  - What approval and advisory roles does a data protection authority have for businesses?
  - Which things can a privacy regulator authorise or give advice on for companies like ours?
  - Where can we turn to the regulator for guidance or permission about data processing?
  ar:
  - ما هي صلاحيات الترخيص والإرشاد التي تملكها سلطة حماية البيانات تجاه الشركات؟
  - ما الأمور التي تستطيع الهيئة الرقابية الموافقة عليها أو تقديم المشورة بشأنها لشركات مثلنا؟
  - وين نقدر نرجع للجهة الرقابية عشان نطلب إرشاد أو موافقة بخصوص معالجة البيانات؟
- key: gdpr:art-58:para-3:pt-a
  text: 1a75135c8e70cc53
  en:
  - We ran a risk assessment showing high risk for our new feature; will the regulator advise us?
  - Does the authority give guidance when we consult it before launching risky processing?
  - Can we ask the data protection authority for advice before starting a risky project?
  ar:
  - أجرينا تقييم مخاطر أظهر خطورة عالية لميزتنا الجديدة، هل ستقدم لنا الهيئة المشورة؟
  - هل تقدم السلطة الرقابية إرشادا عندما نستشيرها قبل بدء معالجة عالية المخاطر؟
  - نقدر نطلب نصيحة الجهة الرقابية قبل ما نبدأ مشروع فيه مخاطر على البيانات؟
- key: gdpr:art-58:para-3:pt-b
  text: 69664d7e6aa4492e
  en:
  - Can the privacy authority publish opinions or advise the government and the public on data protection
    issues?
  - Can a regulator give an opinion on a draft law about personal data even if nobody asked?
  - Who advises parliament and the public on privacy matters?
  ar:
  - هل يحق لسلطة حماية البيانات إصدار آراء للحكومة والبرلمان والجمهور بشأن حماية البيانات؟
  - هل تستطيع الهيئة إبداء رأي في مشروع قانون يخص البيانات الشخصية دون أن يطلبه أحد؟
  - مين اللي ينصح البرلمان والناس في أمور الخصوصية؟
- key: gdpr:art-58:para-3:pt-c
  text: cb1f74be5a6bf15b
  en:
  - In some countries our health app needs prior permission from the regulator; can the authority grant
    it?
  - Can the authority approve certain processing in advance if national law requires authorisation?
  - Do we need the regulator's authorisation for processing under a public interest task in our country?
  ar:
  - في بعض الدول يحتاج تطبيقنا الصحي إلى إذن مسبق من الهيئة، هل تستطيع منحه؟
  - هل يمكن للسلطة الرقابية الموافقة مسبقا على معالجة معينة إذا اشترط قانون الدولة ذلك؟
  - هل نحتاج ترخيص الجهة الرقابية لمعالجة بيانات لمهمة عامة حسب قانون بلدنا؟
- key: gdpr:art-58:para-3:pt-d
  text: 257c00733c4587e1
  en:
  - Our industry association wrote a code of conduct for data handling; can the regulator approve it?
  - Who gives an opinion on a draft privacy code of conduct?
  - Can the authority sign off on codes of conduct for our sector?
  ar:
  - وضعت جمعية قطاعنا مدونة سلوك لمعالجة البيانات، هل تستطيع الهيئة اعتمادها؟
  - من يبدي الرأي في مشروع مدونة سلوك خاصة بالخصوصية؟
  - هل يحق للجهة الرقابية الموافقة على مدونات السلوك الخاصة بقطاعنا؟
- key: gdpr:art-58:para-3:pt-e
  text: 924accd1a0d73f03
  en:
  - We want to become a body that certifies companies for privacy; can the regulator accredit us?
  - Who accredits certification bodies for data protection?
  - Can the authority approve an organization to issue privacy certificates?
  ar:
  - نريد أن نصبح جهة تمنح شهادات خصوصية للشركات، هل تستطيع الهيئة اعتمادنا؟
  - من يعتمد جهات إصدار شهادات حماية البيانات؟
  - هل يمكن للسلطة الرقابية الموافقة على مؤسسة لتصدر شهادات الخصوصية؟
- key: gdpr:art-58:para-3:pt-f
  text: 067e03cee43decf2
  en:
  - Can the regulator itself issue a privacy certification for our product?
  - Who approves the criteria used for data protection certificates?
  - Does the data protection authority hand out certifications directly?
  ar:
  - هل تستطيع السلطة الرقابية نفسها إصدار شهادة خصوصية لمنتجنا؟
  - من يوافق على معايير شهادات حماية البيانات؟
  - هل تمنح هيئة حماية البيانات الشهادات بشكل مباشر؟
- key: gdpr:art-58:para-3:pt-g
  text: 2e280f98e6e3149a
  en:
  - Can the regulator adopt standard contract clauses for processors or for international data transfers?
  - Where do the standard data protection clauses we sign with vendors come from, can an authority adopt
    them?
  - Is the authority able to write standard clauses we can use in our vendor agreements?
  ar:
  - هل تستطيع السلطة الرقابية اعتماد بنود تعاقدية قياسية لمعالجي البيانات أو لنقل البيانات دوليا؟
  - من أين تأتي بنود حماية البيانات القياسية التي نوقعها مع الموردين، وهل تعتمدها الهيئة؟
  - هل تقدر الجهة تضع بنود نموذجية نستخدمها في عقود الموردين؟
- key: gdpr:art-58:para-3:pt-h
  text: 9acbb195e4816964
  en:
  - We drafted custom contract terms for sending data abroad; can the regulator authorise them?
  - Can the authority approve our own bespoke transfer clauses instead of the standard ones?
  - Do ad hoc contractual clauses for international transfers need the regulator's approval?
  ar:
  - صغنا بنودا تعاقدية خاصة لنقل البيانات للخارج، هل تستطيع الهيئة الموافقة عليها؟
  - هل يمكن للسلطة الرقابية اعتماد بنودنا المخصصة بدل البنود القياسية؟
  - هل البنود التعاقدية الخاصة بنقل البيانات دوليا تحتاج موافقة الجهة الرقابية؟
- key: gdpr:art-58:para-3:pt-i
  text: 538a9f07b1aa4dde
  en:
  - Our public agency wants to transfer data abroad using an administrative arrangement; can the regulator
    authorise it?
  - Can the authority approve non-binding arrangements between public bodies for data transfers?
  - Who authorises administrative arrangements for international data sharing?
  ar:
  - جهتنا الحكومية تريد نقل بيانات للخارج عبر ترتيب إداري، هل تستطيع الهيئة الموافقة عليه؟
  - هل يمكن للسلطة الرقابية اعتماد ترتيبات إدارية بين جهات عامة لنقل البيانات؟
  - مين يوافق على الترتيبات الإدارية لمشاركة البيانات دوليا؟
- key: gdpr:art-58:para-3:pt-j
  text: 598f8c9d0b1a9944
  en:
  - Our multinational group wants internal rules for sharing data between subsidiaries; who approves them?
  - Can the regulator approve binding corporate rules?
  ar:
  - مجموعتنا متعددة الجنسيات تريد قواعد داخلية لمشاركة البيانات بين الشركات التابعة، من يعتمدها؟
  - هل تستطيع السلطة الرقابية اعتماد القواعد المؤسسية الملزمة؟
- key: gdpr:art-58:para-4
  text: b5422ee0a3a2c333
  en:
  - If the regulator takes action against us, do we have a right to challenge it in court?
  - Are there limits and fair-process protections on how the data protection authority uses its powers?
  - Can we appeal a decision by the privacy authority?
  ar:
  - إذا اتخذت الهيئة إجراء ضدنا، هل لنا حق الطعن فيه أمام القضاء؟
  - هل توجد ضمانات وقيود على طريقة استخدام سلطة حماية البيانات لصلاحياتها؟
  - هل نقدر نستأنف قرار صادر عن جهة حماية البيانات؟
- key: gdpr:art-58:para-5
  text: a6d482d2c153a3a1
  en:
  - Can the data protection authority take a company to court for breaking the rules?
  - Does the regulator have the power to report violations to prosecutors or start legal proceedings?
  - Could our privacy violation be sent to the judicial authorities?
  ar:
  - هل تستطيع سلطة حماية البيانات مقاضاة شركة خالفت القواعد؟
  - هل تملك الهيئة صلاحية إحالة المخالفات إلى القضاء أو رفع دعاوى؟
  - هل ممكن تُحال مخالفتنا للخصوصية إلى السلطات القضائية؟
- key: gdpr:art-58:para-6
  text: 619a059d0a62b1db
  en:
  - Can our country give its data protection regulator extra powers beyond those in the regulation?
  - Might the local authority have more enforcement powers than the standard list?
  - Are national governments allowed to add more regulator powers, and is there any limit?
  ar:
  - هل يمكن لدولتنا منح هيئة حماية البيانات صلاحيات إضافية تتجاوز المذكورة في اللائحة؟
  - هل ممكن تكون للسلطة المحلية صلاحيات إنفاذ أكثر من القائمة المعتادة؟
  - هل تسمح اللائحة للدول بإضافة صلاحيات للجهة الرقابية، وهل هناك قيد على ذلك؟
- key: gdpr:art-59
  text: ccc849985afddd8c
  en:
  - Where can I find the yearly report from a data protection regulator showing which kinds of violations
    were reported and what penalties or corrective actions they used?
  - Our startup wants to see how strict the privacy authority has been lately. Do they have to publish
    an annual summary of their work that the public can read?
  - Who besides the public gets a copy of the data protection authority's annual activity report, like
    parliament or the government?
  ar:
  - هل تلتزم هيئة حماية البيانات بإصدار تقرير سنوي عن أعمالها، وهل يتضمن أنواع المخالفات والإجراءات التي
    اتخذتها؟
  - كمدير منتج في شركة ناشئة، أين أطلع على التقرير السنوي للجهة الرقابية لمعرفة أنواع المخالفات المبلّغ
    عنها والتدابير المتخذة؟
  - هل التقرير السنوي حق بتاع هيئة حماية البيانات منشور للناس؟ ومين بيستلمه غير الجمهور، زي البرلمان والحكومة؟
- key: gdpr:art-60:para-1
  text: 3992f2bbd28eb4d9
  en:
  - Our company runs an app in several EU countries and a cross-border privacy case is open. Do the regulators
    have to work together and share information with each other?
  - Is the main data protection regulator supposed to try to reach agreement with the other countries'
    regulators before deciding on our case?
  ar:
  - هل يجب على الجهة الرقابية الرئيسية أن تتعاون مع الجهات الرقابية المعنية في الدول الأخرى وتتبادل معها
    المعلومات في قضية عابرة للحدود؟
  - شركتنا تشغل تطبيقاً في عدة دول أوروبية وفُتح تحقيق بخصوصنا، هل السلطات تحاول الوصول إلى توافق فيما
    بينها قبل القرار؟
  - هل الهيئة الرئيسية لازم تشارك كل المعلومات مع باقي الهيئات في الدول الثانية لما يكون عندنا قضية؟
- key: gdpr:art-60:para-2
  text: 6cf5e5fa4b8c6035
  en:
  - Can the lead regulator ask a regulator in another country for help investigating our company's branch
    there?
  - Our processor is in another EU country. Can the authorities run a joint investigation on them?
  - Can the main privacy authority check whether a fine or order against a company is being followed in
    a different member state?
  ar:
  - هل يمكن للجهة الرقابية الرئيسية أن تطلب مساعدة جهة رقابية في دولة أخرى للتحقيق مع فرع شركتنا هناك؟
  - مزود الخدمة (المعالج) عندنا موجود في دولة أوروبية أخرى، هل تستطيع السلطات إجراء عمليات مشتركة للتحقيق
    معه؟
  - وشلون تتابع الهيئة الرئيسية تنفيذ قرار على شركة موجودة في دولة ثانية؟ تقدر تطلب مساعدة من هيئتها؟
- key: gdpr:art-60:para-3
  text: 7bce483082452292
  en:
  - After a regulator opens a cross-border case against us, does it have to send its proposed decision
    to the other countries' regulators before finalizing?
  - How quickly must the lead authority share case details with other concerned regulators?
  - Do other EU data protection authorities get to comment on a draft decision about our app before it
    is issued?
  ar:
  - هل يجب على الجهة الرقابية الرئيسية إرسال مسودة القرار إلى الجهات المعنية الأخرى لأخذ رأيها قبل إصدار
    القرار بحقنا؟
  - ما مدى سرعة مشاركة الهيئة الرئيسية للمعلومات عن القضية مع باقي الهيئات المعنية؟
  - يعني قبل ما يطلع قرار على تطبيقنا، لازم الهيئات في الدول الثانية تشوف المسودة وتعطي رأيها؟
- key: gdpr:art-60:para-4
  text: 2276a25fac57797a
  en:
  - What happens if another country's regulator objects to the lead authority's draft decision on our
    case within a few weeks?
  - How long do other regulators have to object to a draft decision, and where does the dispute go if
    the lead authority rejects the objection?
  - The lead authority thinks another regulator's objection isn't valid. Does the case go to the European
    Data Protection Board?
  ar:
  - ماذا يحدث إذا اعترضت جهة رقابية من دولة أخرى على مسودة قرار الجهة الرئيسية في قضيتنا خلال أسابيع؟
  - كم مدة الاعتراض المتاحة للجهات الأخرى على مسودة القرار، وإلى أين يذهب الخلاف إذا رفضت الجهة الرئيسية
    الاعتراض؟
  - لو الهيئة الرئيسية شافت إن اعتراض هيئة ثانية مو وجيه أو مو مسبّب، القضية تروح لآلية الاتساق؟
- key: gdpr:art-60:para-5
  text: 1e168d65eef5acd3
  en:
  - If the lead regulator accepts another authority's objection, does it have to issue a revised draft,
    and how long do others have to respond?
  - Our case decision is being reworked after an objection. How much time do the other regulators get
    to review the new draft?
  - Is there a shorter deadline for objecting to an updated draft decision?
  ar:
  - إذا قبلت الجهة الرئيسية اعتراض جهة أخرى، هل عليها تقديم مسودة معدلة وكم المدة المتاحة للاعتراض عليها؟
  - قرار قضيتنا يُعاد صياغته بعد اعتراض، كم يوماً أو أسبوعاً تُمنح الجهات الأخرى لمراجعة المسودة الجديدة؟
  - هل في مهلة أقصر للاعتراض على المسودة المعدلة؟
- key: gdpr:art-60:para-6
  text: 0e4390bc8b0998b1
  en:
  - If no other regulator objects to the draft decision in time, is everyone bound by it?
  - When does a draft decision on our company become agreed by all the concerned authorities?
  - What does silence from the other EU regulators mean after the lead authority circulates its draft?
  ar:
  - إذا لم تعترض أي جهة رقابية على مسودة القرار في الوقت المحدد، هل تصبح ملزمة للجميع؟
  - متى تعتبر مسودة القرار بحق شركتنا متفقاً عليها من كل الجهات المعنية؟
  - شو يعني لو ما اعترض أحد من الهيئات الأوروبية الثانية خلال المهلة على مسودة القرار؟
- key: gdpr:art-60:para-7
  text: 7d55e3bc20146318
  en:
  - Who gets formally notified of the final decision in a cross-border privacy case, and where is it sent
    at our company?
  - After a user complaint across borders, who tells the complainant about the outcome?
  - Does the lead regulator have to tell the European Data Protection Board and other authorities about
    its decision and the reasons?
  ar:
  - من الذي يُبلَّغ رسمياً بالقرار النهائي في قضية خصوصية عابرة للحدود، وإلى أي مقر في شركتنا يرسل؟
  - بعد شكوى مستخدم من دولة أخرى، من يخبر الشاكي بنتيجة القرار؟
  - هل على الجهة الرئيسية إبلاغ المجلس الأوروبي لحماية البيانات والجهات الأخرى بالقرار مع ملخص الوقائع
    والأسباب؟
- key: gdpr:art-60:para-8
  text: 027cdf8b8e86e21f
  en:
  - A user's privacy complaint against our app was rejected. Which regulator issues the decision and who
    is told?
  - If a complaint is dismissed, does the lead authority still issue the decision or the user's local
    regulator?
  - Will we be informed if a complaint against us gets thrown out?
  ar:
  - شكوى مستخدم ضد تطبيقنا تم رفضها، أي جهة رقابية تصدر القرار ومن يتم إبلاغه؟
  - عند رفض الشكوى، هل تصدر الجهة الرئيسية القرار أم جهة بلد المشتكي؟
  - لو انرفضت شكوى ضدنا، هل راح تبلغنا الهيئة بالموضوع؟
- key: gdpr:art-60:para-9
  text: 58e5c9acf268446b
  en:
  - A complaint is partly rejected and partly upheld against our company. Is there one decision or several?
  - Who issues and sends which decision when part of a user's complaint is dismissed and another part
    leads to action against the controller?
  - In a split outcome, who informs the complainant and who informs us as the company?
  ar:
  - شكوى ضد شركتنا رُفض جزء منها وقُبل جزء آخر، هل يصدر قرار واحد أم عدة قرارات؟
  - من يصدر ويبلّغ أي قرار عندما يُرفض جزء من الشكوى ويُتخذ إجراء بشأن جزء آخر ضد المتحكم؟
  - لو القرار مقسوم، مين يبلّغ الشاكي ومين يبلّغنا كشركة؟
- key: gdpr:art-60:para-10
  text: fdc6968752536284
  en:
  - We received a final decision from the lead regulator. Do we have to apply it across all our EU offices
    and sites?
  - After a regulator's decision, what do we need to report back about the measures we took?
  - Does a decision in one country force our whole company to change how data is processed in all EU branches?
  ar:
  - استلمنا قراراً نهائياً من الجهة الرقابية الرئيسية، هل يجب تطبيقه على جميع فروعنا في الاتحاد الأوروبي؟
  - بعد صدور قرار الجهة الرقابية، ماذا يجب أن نُبلغها به عن الإجراءات التي اتخذناها؟
  - هل قرار صادر في بلد واحد يلزم شركتنا كلها تغيّر طريقة معالجة البيانات في كل الفروع؟
- key: gdpr:art-60:para-11
  text: cfbe07eb22f5201e
  en:
  - Can a regulator act fast without waiting for the normal cooperation process if users are in urgent
    danger?
  - Our app has a data leak harming users in another country. Is there an emergency route for a local
    authority to step in?
  - In exceptional cases, what procedure applies if a concerned regulator thinks immediate action is needed
    to protect people?
  ar:
  - هل يمكن لجهة رقابية أن تتصرف بسرعة دون انتظار إجراءات التعاون المعتادة إذا كان الأفراد في خطر عاجل؟
  - تطبيقنا تعرض لتسريب بيانات يضر مستخدمين في دولة أخرى، هل هناك مسار طارئ لتدخل الجهة المحلية؟
  - في الحالات الاستثنائية، أي إجراء يُطبق إذا رأت جهة معنية حاجة ملحة للتحرك لحماية أصحاب البيانات؟
- key: gdpr:art-60:para-12
  text: bd57dec7617de398
  en:
  - How do EU data protection authorities exchange case information with each other, by email or a set
    format?
  - Do regulators have to use a standard template when sharing information about a cross-border case?
  - Are the authorities required to share case documents electronically?
  ar:
  - كيف تتبادل سلطات حماية البيانات الأوروبية معلومات القضايا فيما بينها، وهل بوسيلة إلكترونية وبصيغة
    موحدة؟
  - هل يجب على الجهات الرقابية استخدام نموذج موحد عند تبادل المعلومات في قضية عابرة للحدود؟
  - هل الهيئات ملزمة تتبادل ملفات القضية إلكترونياً وبشكل قياسي؟
- key: gdpr:art-61:para-1
  text: edd4e661237a784e
  en:
  - Do data protection regulators in different EU countries have to help each other when a company's app
    affects users in several countries?
  - Can one country's privacy authority ask another to carry out an inspection or investigation of a company
    on our behalf?
  - Our startup is under investigation in two EU countries; do the regulators share information with each
    other?
  ar:
  - هل يجب على سلطات حماية البيانات في دول الاتحاد الأوروبي المختلفة أن تتبادل المعلومات والمساعدة عند
    التحقيق مع شركة؟
  - هل تستطيع سلطة رقابية في دولة أن تطلب من سلطة دولة أخرى إجراء تفتيش أو تحقيق بشأن شركة؟
  - لو تطبيقنا عليه شكوى في أكثر من دولة أوروبية، هل الجهات تتبادل المعلومات عنا بينها؟
- key: gdpr:art-61:para-2
  text: ca3da277ccc496ea
  en:
  - How long does a data protection authority have to answer another authority's request for help?
  - If a regulator asks another regulator for details on an investigation into our company, what's the
    deadline to reply?
  - Can a regulator share the progress of its investigation of our service with a foreign counterpart
    who asked for it?
  ar:
  - كم المدة المتاحة للسلطة الرقابية للرد على طلب مساعدة من سلطة رقابية أخرى؟
  - هل يجب على السلطة الرد على طلب سلطة أخرى خلال شهر من استلامه؟
  - كم يوم عندهم يردون على طلب جهة ثانية تبي معلومات عن التحقيق؟
- key: gdpr:art-61:para-3
  text: 43ce2c0d877bf911
  en:
  - What must a regulator include when it sends a mutual assistance request to another authority?
  - Can the information one data protection authority gets from another be reused for a different case
    against our company?
  - Does a request between authorities need to explain why it's being made?
  ar:
  - ما المعلومات التي يجب أن يتضمنها طلب المساعدة بين السلطات الرقابية؟
  - هل يجوز استخدام المعلومات المتبادلة بين السلطات لغرض غير الذي طُلبت من أجله؟
  - هل لازم الطلب بين الجهات الرقابية يذكر السبب والغرض منه؟
- key: gdpr:art-61:para-4
  text: 5ad67c3138927cc7
  en:
  - When can a data protection authority say no to another authority's request for assistance?
  - A regulator was asked to act on something outside its remit; can it decline?
  - Can an authority refuse to help another one if doing so would break its own national law?
  ar:
  - متى يحق للسلطة الرقابية رفض طلب المساعدة من سلطة أخرى؟
  - هل تستطيع السلطة أن ترفض الطلب إذا كان الموضوع خارج اختصاصها؟
  - هل يمكن رفض التعاون مع جهة رقابية أخرى إذا كان يخالف قانون بلدها؟
- key: gdpr:art-61:para-4:pt-a
  text: de3bb34113e4962f
  en:
  - Can a data protection authority decline a help request because the topic isn't something it has power
    over?
  - A regulator was asked to take a measure it isn't authorised to carry out; may it refuse?
  - Is lack of jurisdiction a valid reason to refuse a request from another EU privacy regulator?
  ar:
  - هل يجوز للسلطة رفض طلب المساعدة لأن الموضوع ليس من اختصاصها؟
  - طُلب من سلطة رقابية تنفيذ إجراء لا تملك صلاحيته، هل لها أن ترفض؟
  - هل عدم الاختصاص سبب مقبول لرفض طلب من سلطة خصوصية أوروبية أخرى؟
- key: gdpr:art-61:para-4:pt-b
  text: 75d26952d420bf66
  en:
  - Can an authority refuse a request from another regulator because complying would violate the law it
    must follow?
  - If helping another country's regulator would break national law, is that a valid ground to say no?
  - Is it allowed to decline a cross-border request when carrying it out would infringe EU rules?
  ar:
  - هل يجوز للسلطة رفض طلب سلطة أخرى إذا كان تنفيذه سيخالف القانون الذي تخضع له؟
  - لو مساعدة جهة من دولة ثانية تخالف قانون بلدنا، هل نقدر نرفض؟
  - هل يُسمح برفض طلب عابر للحدود إذا كان تنفيذه ينتهك قواعد الاتحاد الأوروبي؟
- key: gdpr:art-61:para-5
  text: 258398116e8a04d3
  en:
  - Does the authority that received a help request have to report back on what it did?
  - If a regulator turns down another regulator's request, does it have to explain why?
  - Must an authority give updates on progress while it's still working on a request from another authority?
  ar:
  - هل يجب على السلطة التي استلمت طلب المساعدة أن تُبلغ الجهة الطالبة بالنتائج أو بسير العمل؟
  - هل يلزم تبرير رفض طلب المساعدة المقدم من سلطة رقابية أخرى؟
  - لو رفضت الجهة الطلب، لازم تقول للطرف الثاني ليش؟
- key: gdpr:art-61:para-6
  text: ea70aa3696d01755
  en:
  - How do data protection authorities exchange information with each other, on paper or electronically?
  - Is there a standard format regulators use when sharing information in cross-border cases?
  - Do authorities normally send requested information digitally?
  ar:
  - بأي وسيلة تتبادل السلطات الرقابية المعلومات فيما بينها، ورقية أم إلكترونية؟
  - هل هناك صيغة موحدة تستخدمها السلطات عند تبادل المعلومات في القضايا العابرة للحدود؟
  - الجهات الرقابية ترسل المعلومات بشكل إلكتروني عادةً ولا لا؟
- key: gdpr:art-61:para-7
  text: bcd1257552299025
  en:
  - Can a regulator charge another regulator a fee for helping with a cross-border case?
  - Who pays the costs when one authority does work for another in an investigation of our app?
  - Can authorities agree to reimburse each other for unusual expenses of helping?
  ar:
  - هل يجوز لسلطة رقابية أن تتقاضى رسومًا مقابل مساعدة سلطة أخرى؟
  - من يتحمل التكاليف عندما تنفذ سلطة إجراءً لصالح سلطة أخرى؟
  - هل ممكن الجهات تتفق على تعويض بعضها عن مصاريف خاصة في ظروف استثنائية؟
- key: gdpr:art-61:para-8
  text: aed3c96c0850675d
  en:
  - What can a regulator do if another authority doesn't answer its help request within a month?
  - Can a national authority impose a temporary measure on a company if a foreign authority stays silent
    on its request?
  - Does a missed deadline between authorities let the European Data Protection Board step in urgently?
  ar:
  - ماذا تفعل السلطة الرقابية إذا لم ترد عليها سلطة أخرى خلال شهر؟
  - هل يحق للسلطة اتخاذ إجراء مؤقت داخل بلدها إذا تأخر رد السلطة الأخرى؟
  - هل يعتبر التأخر عن الرد سببًا للحصول على قرار عاجل من المجلس الأوروبي لحماية البيانات؟
- key: gdpr:art-61:para-9
  text: 59e3e8918da6bcd9
  en:
  - Who decides the format and procedures regulators use for mutual assistance?
  - Can the European Commission set rules on how authorities exchange information electronically?
  ar:
  - من يحدد شكل وإجراءات المساعدة المتبادلة بين السلطات الرقابية؟
  - هل يمكن للمفوضية الأوروبية وضع قواعد لتبادل المعلومات إلكترونيًا بين السلطات؟
- key: gdpr:art-62:para-1
  text: b0a8d477adca9bde
  en:
  - Can data protection regulators from different EU countries team up to investigate a company together?
  - Our app got a complaint and we heard inspectors from several countries might come to audit us at once.
    Is that allowed?
  - Do officials from another EU country's privacy authority get to take part in enforcement actions against
    a business?
  ar:
  - هل يجوز للجهات الرقابية لحماية البيانات في عدة دول أوروبية أن تجري تحقيقات مشتركة مع بعضها؟
  - هل ممكن يجي مفتشين من أكثر من دولة أوروبية يفتشون على شركتنا مع بعض؟
  - تطبيقنا عليه شكوى، وسمعنا إن سلطات الخصوصية في دول ثانية ممكن تشارك في الإجراءات، هل هذا صحيح؟
- key: gdpr:art-62:para-2
  text: 5a73a72c4e923bbf
  en:
  - Our online shop has branches in Germany, France and Spain. Can each country's regulator join an investigation
    into us?
  - Who has to invite the other countries' data protection authorities to a joint investigation, and how
    fast must they answer if one asks to join?
  - Thousands of our app users in several EU countries were affected by a data leak. Do their local regulators
    have a right to take part in the inquiry?
  ar:
  - متجرنا الإلكتروني له فروع في عدة دول أوروبية، هل يحق لكل جهة رقابية فيها المشاركة في التحقيق معنا؟
  - من الجهة المسؤولة عن دعوة سلطات الدول الأخرى للعمليات المشتركة، وهل يجب أن ترد بسرعة على طلب المشاركة؟
  - شكو الهيئة اللي في بلد ثاني تقدر تطلب تشارك بالتحقيق لو مستخدمين تطبيقنا في دول كثيرة تضرروا؟
- key: gdpr:art-62:para-3
  text: 9031e5777eacf915
  en:
  - Can a foreign privacy inspector actually use investigative powers on our premises during a joint investigation?
  - When officials from another EU country help investigate a company, whose national law do they have
    to follow and who must be present?
  - Can a visiting regulator's staff run their own inspection of our servers without the local authority
    supervising?
  ar:
  - هل يحق لمفتش من دولة أوروبية أخرى استخدام صلاحيات التحقيق داخل شركتنا أثناء تحقيق مشترك؟
  - عند مشاركة موظفين من هيئة دولة أخرى في التحقيق، لأي قانون يخضعون ومن لازم يكون حاضر معهم؟
  - هل ممكن موظفين زوار من هيئة بلد ثاني يفتشون سيرفراتنا بدون إشراف الهيئة المحلية؟
- key: gdpr:art-62:para-4
  text: 12bdafff40ea82ef
  en:
  - If a visiting regulator's staff accidentally damage our systems during a joint inspection, which country
    is responsible?
  - Who is liable for harm caused by foreign data protection officials working in another member state
    during a joint operation?
  - Our clinic's equipment was broken by inspectors from another EU country's authority. Whom do we claim
    against?
  ar:
  - لو موظفو هيئة أجنبية أضروا بأنظمتنا أثناء تفتيش مشترك، أي دولة تتحمل المسؤولية؟
  - من يتحمل المسؤولية عن الأضرار التي يسببها موظفو سلطة رقابية من دولة أخرى أثناء عملية مشتركة؟
  - جهازنا في العيادة تضرر بسبب مفتشين من هيئة دولة أوروبية ثانية، على مين نرفع المطالبة؟
- key: gdpr:art-62:para-5
  text: 25f144a3b700e8dc
  en:
  - Who pays compensation to a person harmed by a foreign inspector during a joint operation, and can
    that country get the money back?
  - If staff from one country's regulator cause damage in another EU country, does their home country
    have to reimburse the host?
  - Will the country where the damage happened treat our compensation claim like one caused by its own
    officials?
  ar:
  - من يدفع التعويض لشخص تضرر من مفتش أجنبي أثناء عملية مشتركة، وهل تسترجع الدولة المبلغ؟
  - إذا تسبب موظفو هيئة دولة في ضرر داخل دولة أوروبية أخرى، هل على دولتهم أن تعوض الدولة المضيفة؟
  - وين نطالب بالتعويض، وهل يعاملون طلبنا مثل الضرر اللي يسببه موظفوهم هم؟
- key: gdpr:art-62:para-6
  text: a6c5dafe6d4a109c
  en:
  - Can EU countries bill each other for damage caused by their regulators' staff in joint operations?
  - Are member states allowed to claim back costs from each other for harm done during a joint inspection,
    other than the reimbursement case?
  - Does a country's right to pursue third parties for damage survive the rule that states don't seek
    reimbursement from each other?
  ar:
  - هل يجوز للدول الأوروبية أن تطالب بعضها بتعويض الأضرار التي سببها موظفو هيئاتها في العمليات المشتركة؟
  - هل تتنازل الدول عن استرداد التكاليف من بعضها عن أضرار التفتيش المشترك ما عدا حالة السداد للأضرار بأشخاص
    في أراضيها؟
  - هل يبقى حق الدولة في مطالبة أطراف ثالثة قائماً رغم الامتناع عن مطالبة الدول الأخرى؟
- key: gdpr:art-62:para-7
  text: 1678fa4bfa56a445
  en:
  - What happens if the lead regulator doesn't invite other countries to a joint investigation within
    a month?
  - Can another country's privacy authority take temporary action against a company if the lead authority
    ignores a request to join an operation?
  - Is an urgent EU Board opinion automatically justified when a regulator stays silent on a joint operation
    for a month?
  ar:
  - ماذا يحدث إذا لم تدعُ الجهة الرئيسية الدول الأخرى للعملية المشتركة خلال شهر؟
  - هل يمكن لهيئة خصوصية في دولة أخرى اتخاذ إجراء مؤقت ضد شركة إذا تجاهلت الهيئة المختصة طلب المشاركة؟
  - لو الهيئة سكتت شهر كامل عن طلب المشاركة، هل تعتبر الحاجة المستعجلة لرأي المجلس الأوروبي متحققة تلقائياً؟
- key: gdpr:art-63
  text: 96db850f7213276e
  en:
  - Why do data protection regulators in different EU countries have to work together instead of each
    deciding on their own for our app?
  - We run a SaaS product used in many EU countries; how do authorities make sure the privacy rules are
    applied the same way everywhere?
  - Can the European Commission get involved when national privacy regulators coordinate on a case about
    our service?
  ar:
  - ما الهدف من تعاون هيئات حماية البيانات في دول الاتحاد الأوروبي فيما بينها وإلى جانب المفوضية الأوروبية؟
  - تطبيقنا يعمل في عدة دول أوروبية، كيف تضمن السلطات الرقابية أن يُطبَّق نظام حماية البيانات بشكل موحد
    في جميع هذه الدول؟
  - يعني ليش الجهات الرقابية في دول أوروبا لازم تتعاون مع بعض؟ هل ممكن كل دولة تقرر لحالها بخصوص تطبيقنا؟
- key: gdpr:art-64:para-1
  text: f432683763cb72c9
  en:
  - When does the EU board of data protection regulators have to give an opinion on something a national
    regulator plans to decide?
  - Our national regulator is about to approve something like a code of conduct or BCRs for companies;
    does it need to go to the European board first?
  - Which kinds of draft decisions by a data protection authority must be sent to the EDPB for review?
  ar:
  - متى يجب على المجلس الأوروبي لحماية البيانات أن يصدر رأياً بشأن قرار تنوي هيئة الرقابة الوطنية اتخاذه؟
  - ما هي أنواع مشاريع القرارات التي يجب على سلطة الإشراف إحالتها إلى المجلس الأوروبي قبل اعتمادها؟
  - شركتنا قدمت طلب اعتماد وهالطلب عند الهيئة الوطنية، هل لازم يمر على المجلس الأوروبي قبل ما يوافقون
    عليه؟
- key: gdpr:art-64:para-1:pt-a
  text: 81f617efc8269e5f
  en:
  - Our regulator is drafting a list of processing activities that require a DPIA; does that list go to
    the EDPB?
  - Does the European board review a national list of what kinds of app features need an impact assessment?
  - We want to know whether the list of DPIA-required processing in our country has been checked at EU
    level.
  ar:
  - هل قائمة العمليات التي تتطلب تقييم أثر حماية البيانات تُعرض على المجلس الأوروبي قبل اعتمادها؟
  - الهيئة عندنا تعد قائمة بأنواع المعالجة اللي لازم لها DPIA، هل لازم المجلس الأوروبي يعطي رأيه فيها؟
  - هل يراجع المجلس الأوروبي القائمة الوطنية للأنشطة التي تستلزم تقييم الأثر قبل نشرها؟
- key: gdpr:art-64:para-1:pt-b
  text: 455daf66a5bce0d1
  en:
  - Our industry group wrote a code of conduct; does the EDPB have to give an opinion before the regulator
    approves it?
  - If we amend or extend an approved code of conduct, does the change need a European board opinion?
  ar:
  - هل يصدر المجلس الأوروبي رأياً قبل أن توافق الهيئة على مشروع مدونة سلوك أعدّها قطاعنا؟
  - إذا عدّلنا مدونة قواعد السلوك المعتمدة أو وسّعنا نطاقها، هل يلزم رأي المجلس الأوروبي؟
  - وين يروح مشروع كود أوف كوندكت اللي كتبناه؟ هل يمر على المجلس الأوروبي؟
- key: gdpr:art-64:para-1:pt-c
  text: ab08addec5080276
  en:
  - We want to become an accredited certification body for privacy seals; does the EDPB weigh in on the
    accreditation requirements?
  - Does the European board review the criteria used for a data protection certification scheme before
    the regulator approves them?
  - Who checks the requirements for accrediting a code monitoring body or certifier before the national
    authority signs off?
  ar:
  - هل يصدر المجلس الأوروبي رأياً في متطلبات اعتماد جهات المصادقة على حماية البيانات؟
  - نبي نصير جهة إصدار شهادات خصوصية، هل المجلس الأوروبي يراجع شروط الاعتماد؟
  - هل تُعرض معايير الاعتماد لشهادة حماية البيانات على المجلس الأوروبي قبل الموافقة عليها؟
- key: gdpr:art-64:para-1:pt-d
  text: da9bab1e061f7840
  en:
  - The regulator is setting standard contractual clauses for data transfers or for processor contracts;
    does the EDPB have to give an opinion?
  - Do standard data protection clauses drafted by a national authority get reviewed by the European board
    first?
  - We rely on regulator-issued standard clauses for our vendor contracts; was the EU board involved in
    them?
  ar:
  - هل يصدر المجلس الأوروبي رأياً عندما تحدد الهيئة الوطنية بنوداً تعاقدية نموذجية لحماية البيانات؟
  - البنود النموذجية لعقود المعالج ونقل البيانات، هل تمر على المجلس الأوروبي قبل اعتمادها؟
  - هل تحتاج الهيئة لرأي المجلس الأوروبي قبل تحديد بنود قياسية لعقود معالجي البيانات؟
- key: gdpr:art-64:para-1:pt-e
  text: 69ed5dea336eff16
  en:
  - We submitted our own custom contract clauses for sending data abroad; will the EU board give an opinion
    before the regulator authorises them?
  - Does a regulator's authorisation of ad hoc contractual clauses for data transfers need an EDPB opinion?
  - Our company-specific transfer contract needs regulator approval; does it get sent to the European
    board?
  ar:
  - هل يجب أن يصدر المجلس الأوروبي رأياً قبل أن تأذن الهيئة ببنود تعاقدية خاصة لنقل البيانات خارج الاتحاد؟
  - قدمنا عقداً مخصصاً لنقل البيانات لبلد ثالث، هل يمر على المجلس الأوروبي؟
  - شركتنا كتبت بنود عقد خاصة فينا للتحويل الدولي، هل الهيئة لازم تاخذ رأي المجلس قبل الموافقة؟
- key: gdpr:art-64:para-1:pt-f
  text: a1077f6acb2a654e
  en:
  - Our multinational group applied for binding corporate rules; does the EDPB need to give an opinion
    before approval?
  - Do BCRs for intra-group data transfers get reviewed by the European board?
  - How does the BCR approval process involve the EU-level board?
  ar:
  - هل يصدر المجلس الأوروبي رأياً قبل اعتماد القواعد المؤسسية الملزمة لمجموعتنا الدولية؟
  - قدمت شركتنا طلب BCR، هل يراجعه المجلس الأوروبي قبل الموافقة؟
  - هل تمر القواعد الملزمة للشركات لنقل البيانات داخل المجموعة عبر المجلس الأوروبي؟
- key: gdpr:art-64:para-2
  text: f2bd7296dd8069c0
  en:
  - Can a regulator or the Commission ask the EDPB to look at an issue affecting users in several EU countries?
  - A national authority isn't helping another regulator on a cross-border case; can someone ask the European
    board to step in?
  - Who can ask the board for an opinion on a general question that has effects in more than one member
    state?
  ar:
  - هل يمكن لأي سلطة رقابية أو للمفوضية أن تطلب من المجلس الأوروبي فحص مسألة تؤثر في عدة دول أعضاء؟
  - إذا رفضت هيئة وطنية التعاون في قضية عابرة للحدود، من يستطيع أن يطلب رأي المجلس؟
  - مين يقدر يطلب من المجلس الأوروبي رأي بخصوص موضوع عام يخص أكثر من دولة؟
- key: gdpr:art-64:para-3
  text: d06c0306015f1387
  en:
  - How long does the European board have to issue its opinion, and can the deadline be extended?
  - What majority does the EDPB need to adopt an opinion, and what if a member stays silent on the draft?
  - Will the board give an opinion if it has already ruled on the same matter?
  ar:
  - كم مدة المهلة المتاحة للمجلس الأوروبي لإصدار رأيه، وهل يمكن تمديدها؟
  - ما الأغلبية المطلوبة لاعتماد رأي المجلس، وماذا لو سكت أحد الأعضاء ولم يعترض؟
  - هل يصدر المجلس رأياً إذا كان قد أصدر رأياً سابقاً في نفس المسألة؟
- key: gdpr:art-64:para-4
  text: d464ece0a71ba8d6
  en:
  - What must a regulator send to the EDPB when it asks for an opinion, and in what form?
  - Does the national authority have to pass along the facts, reasons and other regulators' views to the
    board quickly?
  - Can a regulator submit its draft decision to the European board on paper, or must it be electronic?
  ar:
  - ما المعلومات التي يجب أن ترسلها السلطة الرقابية إلى المجلس الأوروبي عند طلب الرأي وبأي صيغة؟
  - هل يجب إرسال ملخص الوقائع ومبررات القرار وآراء السلطات الأخرى إلى المجلس إلكترونياً؟
  - لازم الهيئة ترسل للمجلس الأوروبي المسودة والأسباب بسرعة وبنموذج موحد، صح؟
- key: gdpr:art-64:para-5
  text: 96b6d2af5e76b5f7
  en:
  - What does the chair of the European board do after receiving a request for an opinion?
  - Who passes the submitted information on to the board members and the Commission, and are translations
    provided?
  - Is the EDPB's opinion published once it's issued?
  ar:
  - ماذا يفعل رئيس المجلس الأوروبي بعد استلام طلب إصدار رأي؟
  - من يُبلغ أعضاء المجلس والمفوضية بالمعلومات المقدمة، وهل تُوفَّر ترجمات؟
  - هل يُنشر رأي المجلس الأوروبي للعموم بعد صدوره؟
- key: gdpr:art-64:para-5:pt-a
  text: fb77533af7d48246
  en:
  - Who circulates the information a regulator submitted to the other board members and the Commission?
  - Does the board secretariat translate the documents for members when needed?
  - How fast must the chair share a submitted draft with the other EU regulators?
  ar:
  - من يوزع المعلومات التي قدمتها السلطة الرقابية على أعضاء المجلس والمفوضية؟
  - هل توفر أمانة المجلس الأوروبي ترجمة للمستندات عند الحاجة؟
  - خلال كم يجب على الرئيس إبلاغ أعضاء المجلس بالمعلومات المقدمة إلكترونياً؟
- key: gdpr:art-64:para-5:pt-b
  text: 9b765f5f8c2fb300
  en:
  - Who tells the national regulator and the Commission about the board's opinion?
  - Does the EDPB make its opinions public?
  ar:
  - من يُبلغ السلطة الرقابية والمفوضية برأي المجلس الأوروبي؟
  - هل ينشر المجلس الأوروبي آراءه للعموم؟
- key: gdpr:art-64:para-6
  text: d8f016e1a863f16e
  en:
  - Can the regulator finalise its draft decision while the European board is still preparing its opinion?
  - Is the national authority blocked from adopting its decision during the board's review period?
  - Our approval is waiting on an EU board opinion; can the regulator sign off before that period ends?
  ar:
  - هل يجوز للسلطة الرقابية اعتماد مشروع قرارها بينما المجلس الأوروبي ما زال يعدّ رأيه؟
  - هل تُمنع الهيئة الوطنية من اعتماد القرار خلال مهلة مراجعة المجلس؟
  - طلبنا ينتظر رأي المجلس الأوروبي، هل تقدر الهيئة توافق قبل انتهاء المدة؟
- key: gdpr:art-64:para-7
  text: f98dec7db0cfa1dc
  en:
  - After the board gives its opinion, how long does the regulator have to say whether it keeps or changes
    its draft?
  - Does the national authority have to take the EDPB's opinion into account?
  - What does a regulator have to send the board chair after receiving the opinion?
  ar:
  - بعد صدور رأي المجلس الأوروبي، كم أسبوعاً أمام السلطة الرقابية لتعلن تمسكها بمشروع قرارها أو تعديله؟
  - هل يجب على الهيئة الوطنية أن تأخذ رأي المجلس بأقصى اعتبار؟
  - ماذا يجب أن ترسله السلطة إلى رئيس المجلس بعد استلام الرأي؟
- key: gdpr:art-64:para-8
  text: 043d26948fc55ef9
  en:
  - What happens if the national regulator doesn't want to follow the European board's opinion?
  - Can a regulator reject the EDPB's opinion, and what procedure kicks in then?
  - If the authority disagrees with the board and gives its reasons, does the dispute go further?
  ar:
  - ماذا يحدث إذا رفضت السلطة الرقابية الوطنية اتباع رأي المجلس الأوروبي؟
  - هل يمكن للهيئة مخالفة رأي المجلس كلياً أو جزئياً وما الإجراء الذي يُطبق عندها؟
  - إذا الهيئة ما بغت تلتزم برأي المجلس وقدمت أسبابها، وش يصير بعدين؟
- key: gdpr:art-65:para-1
  text: c0d4c3d96d82283b
  en:
  - When does the EU data protection board step in and make a binding decision between national regulators
    handling a cross-border case?
  - Our company operates in several EU countries and the regulators disagree about our case. Who settles
    it?
  ar:
  - متى يصدر المجلس الأوروبي لحماية البيانات قراراً ملزماً في نزاع بين الجهات الرقابية الوطنية؟
  - شركتنا تشتغل في أكثر من دولة أوروبية والجهات الرقابية مختلفة على قضيتنا، مين يحسم الموضوع؟
  - هل يستطيع المجلس الأوروبي إلزام السلطة الرئيسية بقرار موحد لضمان تطبيق متسق للائحة في الحالات الفردية؟
- key: gdpr:art-65:para-1:pt-a
  text: 18a860e3a88464fb
  en:
  - Another country's data regulator objected to the lead regulator's draft decision on our app and was
    ignored. What happens next?
  - If the lead authority rejects an objection as irrelevant, does the European board decide whether our
    app actually breached the rules?
  - What does the board's binding decision cover when a concerned regulator raised a reasoned objection
    to the draft ruling against us?
  ar:
  - اعترضت سلطة رقابية في دولة أخرى على مشروع قرار السلطة الرئيسية بخصوص تطبيقنا ولم يؤخذ باعتراضها، ماذا
    يحدث بعد ذلك؟
  - إذا رفضت السلطة الرئيسية الاعتراض لأنه غير وجيه أو غير مسبّب، هل يفصل المجلس في وجود مخالفة من عدمها؟
  - شو يغطي قرار المجلس لما سلطة معنية تقدم اعتراض مسبب على مسودة القرار؟
- key: gdpr:art-65:para-1:pt-b
  text: b543fb5759e80676
  en:
  - Two EU regulators each say they're the right one for our company's main establishment. Who decides?
  - How is it resolved when countries disagree about where our business's main establishment is for data
    protection purposes?
  - Our startup has offices in two EU states and regulators argue over which one leads our case; can the
    board settle it?
  ar:
  - جهتان رقابيتان أوروبيتان كل واحدة تقول إنها المختصة بمقرنا الرئيسي، من يحسم ذلك؟
  - كيف يُحل الخلاف بين الدول حول تحديد المنشأة الرئيسية لشركتنا؟
  - عندنا مكتبين في دولتين أوروبيتين والجهات تتجادل مين المسؤول عن قضيتنا، المجلس يقدر يحسمها؟
- key: gdpr:art-65:para-1:pt-c
  text: 169555d507fbdcaf
  en:
  - What if a national regulator skips asking the European board for its opinion or ignores that opinion?
    Can anyone take it to the board?
  - Can the European Commission or another regulator bring a matter to the board when a regulator didn't
    follow the board's opinion?
  - A regulator ignored the board's opinion on our data transfer tool case; is there a way to escalate
    it?
  ar:
  - ماذا لو لم تطلب السلطة المختصة رأي المجلس أو تجاهلت رأيه، هل يمكن رفع الأمر إليه؟
  - هل تستطيع المفوضية الأوروبية أو سلطة معنية إحالة المسألة إلى المجلس إذا لم تتبع سلطة رأيه؟
- key: gdpr:art-65:para-2
  text: b80b1f561082f76a
  en:
  - How long does the board have to issue a binding decision after a dispute is referred to it?
  - How many board votes are needed for a binding decision, and can the deadline be extended for a complicated
    case?
  - Who receives the board's dispute decision and is it legally binding on the regulators, with reasons
    given?
  ar:
  - كم المدة المتاحة للمجلس لإصدار قرار ملزم بعد إحالة النزاع إليه؟
  - ما الأغلبية المطلوبة لقرار المجلس وهل يمكن تمديد المهلة إذا كانت القضية معقدة؟
  - لمن يوجَّه قرار المجلس وهل هو مسبّب وملزم للسلطات؟
- key: gdpr:art-65:para-3
  text: 872964f56049f0e4
  en:
  - What happens if the board can't reach a two-thirds majority within the deadline in a dispute?
  - If board members are evenly split on a cross-border case, who has the deciding vote?
  - Is there an extra deadline after the extended period for the board to decide by simple majority?
  ar:
  - ماذا يحدث إذا لم يتمكن المجلس من تحقيق أغلبية الثلثين خلال المهلة؟
  - إذا انقسمت أصوات أعضاء المجلس بالتساوي من يرجّح القرار؟
  - هل توجد مهلة إضافية بعد انتهاء الشهرين ليقرر المجلس بالأغلبية البسيطة؟
- key: gdpr:art-65:para-4
  text: e35f04625ce9f12d
  en:
  - While our case is with the European board, can the national regulators issue their own ruling against
    us?
  - Can a concerned regulator fine us on the same matter while the board dispute is pending?
  ar:
  - أثناء نظر قضيتنا لدى المجلس الأوروبي، هل يجوز للسلطات الوطنية إصدار قرارها الخاص ضدنا؟
  - تقدر سلطة معنية تفرض علينا غرامة بنفس الموضوع وقضيتنا عند المجلس؟
- key: gdpr:art-65:para-5
  text: 220b6ed5eb771a6f
  en:
  - Who tells the regulators and the Commission about the board's binding decision, and how quickly?
  - When will the board's dispute decision be made public on its website?
  - Will our company's case decision be published before the national regulator issues its final decision?
  ar:
  - من يبلّغ السلطات والمفوضية بقرار المجلس الملزم وبأي سرعة؟
  - متى يُنشر قرار المجلس في النزاع على موقعه الإلكتروني؟
  - هل سيُنشر قرار قضية شركتنا قبل أن تصدر السلطة المحلية قرارها النهائي؟
- key: gdpr:art-65:para-6
  text: 890967f522c2cb4b
  en:
  - After the board decides, how long does the lead regulator have to issue its final decision on our
    company?
  - What must the regulator's final decision to us include regarding the board's ruling?
  - Does the regulator have to tell the board when it notified us and the complainant of the final decision?
  ar:
  - بعد قرار المجلس، كم مهلة السلطة الرئيسية لإصدار قرارها النهائي بحق شركتنا؟
  - ما الذي يجب أن يتضمنه القرار النهائي من إشارة إلى قرار المجلس؟
  - لازم السلطة تبلّغ المجلس بتاريخ إبلاغنا والشاكي بالقرار النهائي؟
- key: gdpr:art-66:para-1
  text: 849ca48ad3e2815b
  en:
  - Can a national data protection regulator impose a temporary ban on our app's data processing right
    away, without waiting for the EU-wide cooperation process, if users are at serious risk?
  - Our app is under an emergency order from a data protection authority in one country. How long can
    that interim measure last and where does it apply?
  - Does a regulator that takes urgent provisional action have to tell other EU regulators and the European
    Board about it and explain why?
  ar:
  - هل يحق للجهة الرقابية لحماية البيانات في دولة ما أن تتخذ إجراءً مؤقتاً فورياً ضد تطبيقنا دون انتظار
    آلية التعاون الأوروبية إذا كان هناك خطر عاجل على المستخدمين؟
  - شو المدة القصوى للإجراء المؤقت الطارئ اللي تفرضه هيئة حماية البيانات على شركتنا، وهل يسري بس داخل
    بلدها؟
  - هل يجب على الجهة الرقابية التي تتخذ تدابير مؤقتة عاجلة إبلاغ الجهات الرقابية الأخرى والمجلس الأوروبي
    والمفوضية بالإجراء وأسبابه؟
- key: gdpr:art-66:para-2
  text: 0c1525767cbcb4c7
  en:
  - A regulator already imposed a temporary measure on our platform. Can it now ask the European Board
    for a fast ruling to make a permanent one?
  - After an emergency interim order against a company, how can the authority get a quick binding decision
    from the EU board for final measures?
  - Does the regulator have to give reasons when asking the Board for an urgent opinion after taking provisional
    action?
  ar:
  - هيئة حماية البيانات فرضت إجراءً مؤقتاً على منصتنا، هل يمكنها أن تطلب من المجلس الأوروبي رأياً أو قراراً
    عاجلاً لاعتماد إجراءات نهائية؟
  - كيف تحصل الجهة الرقابية بعد اتخاذ تدبير مؤقت طارئ على قرار ملزم سريع من المجلس الأوروبي؟
  - وين يروح الطلب لو الهيئة بدها إجراءات نهائية بسرعة بعد القرار المؤقت، وهل لازم تبرر طلبها؟
- key: gdpr:art-66:para-3
  text: a75615da34890609
  en:
  - Our company's lead regulator is doing nothing about a dangerous data leak affecting users. Can another
    EU regulator push for urgent action through the Board?
  - If the competent data protection authority fails to act in an urgent situation, can a different authority
    ask the European Board for an urgent binding decision?
  - What must a regulator include when asking the Board for urgent intervention because another authority
    hasn't acted on a risk to people's data?
  ar:
  - الجهة الرقابية المختصة ما تتحرك بخصوص تسريب بيانات خطير يمس المستخدمين، هل تستطيع جهة رقابية أخرى
    في الاتحاد الأوروبي طلب تدخل عاجل من المجلس الأوروبي؟
  - هل يجوز لأي سلطة رقابية أن تطلب رأياً أو قراراً ملزماً عاجلاً من المجلس إذا لم تتخذ السلطة المختصة
    إجراءً مناسباً في حالة طارئة؟
  - شو لازم تذكر الهيئة في طلبها للمجلس لما تشتكي إن هيئة ثانية ما تصرفت بسرعة كفاية؟
- key: gdpr:art-66:para-4
  text: c23a90b96b553a1f
  en:
  - How quickly does the European Board have to issue an urgent decision on an emergency data protection
    case?
  - What vote is needed for the Board to adopt an urgent binding decision, and is it different from the
    usual procedure?
  - We're waiting on an EU urgent ruling about our product's data processing. What is the deadline for
    it?
  ar:
  - كم المدة التي يجب أن يصدر خلالها المجلس الأوروبي لحماية البيانات قراراً عاجلاً في حالة طارئة؟
  - ما الأغلبية المطلوبة لاعتماد الرأي أو القرار الملزم العاجل في المجلس، وهل تختلف عن الإجراء العادي؟
  - احنا مستنيين حكم عاجل من الاتحاد الأوروبي بخصوص معالجة البيانات في منتجنا، كم أسبوع بياخذ؟
- key: gdpr:art-67
  text: ccbbd8358fac69a6
  en:
  - Who decides how EU data protection regulators must share information electronically with each other
    and with the European Data Protection Board?
  - We're building a case-handling tool for a national privacy regulator. Is there an official standard
    format for exchanging case data with other authorities?
  - Can the European Commission set binding technical rules for how supervisory authorities send documents
    to each other electronically, and how are those rules adopted?
  ar:
  - هل يحق للمفوضية الأوروبية تحديد الطريقة الإلكترونية لتبادل المعلومات بين سلطات الرقابة وبين المجلس
    الأوروبي لحماية البيانات؟
  - نطوّر نظامًا لإدارة القضايا لجهة رقابية على حماية البيانات، فهل يوجد نموذج موحّد رسمي لتبادل المعلومات
    مع السلطات الأخرى؟
  - هل المفوضية الأوروبية هي اللي تحدد شكل تبادل الملفات والمعلومات إلكترونيًا بين الجهات الرقابية؟ وكيف
    تعتمد هالقواعد؟
- key: gdpr:art-68:para-1
  text: df2e305e30475531
  en:
  - Is the EU body that coordinates data protection regulators an official EU entity with its own legal
    identity?
  - We're writing a vendor doc and need to know what the EDPB legally is. Can it sue or be sued on its
    own?
  - Who set up the board that issues GDPR guidelines, and what's its legal status?
  ar:
  - ما هي الطبيعة القانونية للمجلس الأوروبي لحماية البيانات وهل يتمتع بشخصية قانونية؟
  - هل المجلس الأوروبي لحماية البيانات هيئة تابعة للاتحاد الأوروبي وله كيان قانوني مستقل؟
  - شو هو المجلس الأوروبي لحماية البيانات بالضبط؟ جهة رسمية وإلا مجرد لجنة؟
- key: gdpr:art-68:para-2
  text: c19ac7986d6c5056
  en:
  - Who speaks officially on behalf of the EU data protection board?
  - If we need to contact the EDPB as a company, who formally represents it?
  - Is there a single person who represents the board externally?
  ar:
  - من الذي يمثل المجلس الأوروبي لحماية البيانات رسمياً؟
  - مين اللي بيمثّل المجلس الأوروبي لحماية البيانات لما نبغى نراسلهم؟
  - هل يمثل المجلس رئيسه أمام الجهات الخارجية؟
- key: gdpr:art-68:para-3
  text: 9cd3544aac4dcd8c
  en:
  - Who are the members of the EDPB? Does each country's data protection authority get a seat?
  - Does the EU's own data protection supervisor sit on the board together with national regulators?
  - Can a national regulator send a deputy instead of its head to the board?
  ar:
  - من هم أعضاء المجلس الأوروبي لحماية البيانات؟
  - هل يحضر رئيس هيئة حماية البيانات في كل دولة عضو أم يمكن أن ينوب عنه ممثل؟
  - وش تركيبة المجلس الأوروبي لحماية البيانات؟ كل دولة لها مقعد؟
- key: gdpr:art-68:para-4
  text: 3a00e02f0de3ffd1
  en:
  - Our country has several data protection regulators, for example one per region. Who sits on the EU
    board for it?
  - How does a member state with multiple supervisory authorities choose its single representative at
    the board?
  - What happens to board membership when a country has more than one data protection authority?
  ar:
  - إذا كان في الدولة العضو أكثر من هيئة رقابية لحماية البيانات، فمن يمثلها في المجلس؟
  - كيف يتم تعيين ممثل مشترك عندما تتعدد السلطات الرقابية في بلد واحد؟
  - عندنا في البلد أكثر من جهة تراقب حماية البيانات، مين يروح للمجلس الأوروبي يمثلهم؟
- key: gdpr:art-68:para-5
  text: 4c312d9cf6801812
  en:
  - Does the European Commission get to vote at the EDPB?
  - Can the Commission attend EDPB meetings, and must the board keep it informed of what it does?
  - Who from the Commission takes part in the board's work?
  ar:
  - هل يحق للمفوضية الأوروبية التصويت في المجلس الأوروبي لحماية البيانات؟
  - هل تستطيع المفوضية حضور اجتماعات المجلس ومتابعة أنشطته؟
  - المفوضية تحضر اجتماعات المجلس؟ وهل لها صوت ولا بس تحضر؟
- key: gdpr:art-68:para-6
  text: c58a70eb0fcb627e
  en:
  - In a dispute between national regulators that goes to the board, can the EU's own data supervisor
    vote?
  - When is the EDPS allowed to vote on a binding board decision?
  - Does the EU data protection supervisor vote on cross-border disputes about our app, or only on EU
    institution rules?
  ar:
  - متى يحق للمشرف الأوروبي على حماية البيانات التصويت في قرارات المجلس عند حل النزاعات؟
  - هل يصوت المشرف الأوروبي في كل قرارات تسوية الخلافات أم فقط في ما يخص مؤسسات الاتحاد؟
  - لما يوصل خلاف بين الجهات الرقابية للمجلس، هل المشرف الأوروبي له صوت؟
- key: gdpr:art-69:para-1
  text: 2956a9e2270e0ac6
  en:
  - Is the European Data Protection Board supposed to be independent when it issues guidance or settles
    disputes between national regulators?
  - We're worried that a regulator body's opinion on our cross-border app might be influenced by politics.
    Does the EU board have to act independently?
  - Does the EDPB have to work autonomously when carrying out its tasks and powers?
  ar:
  - هل يجب أن يعمل المجلس الأوروبي لحماية البيانات بشكل مستقل عند أداء مهامه وممارسة صلاحياته؟
  - هل المجلس الأوروبي لحماية البيانات مستقل في قراراته وإرشاداته ولا يتأثر بأحد؟
  - المجلس الأوروبي حق حماية البيانات، هل يشتغل باستقلالية ولا أحد يتحكم فيه؟
- key: gdpr:art-69:para-2
  text: 61f548b30ccf1a48
  en:
  - Can a government or a big tech company tell the EU data protection board what decision to make on
    our app's case?
  - Does the EDPB take orders from anyone, or ask anyone for instructions, when it does its work?
  - Is there any exception to the board not taking instructions, like when the European Commission asks
    it for an opinion?
  ar:
  - هل يجوز لأي جهة أن تعطي تعليمات للمجلس الأوروبي لحماية البيانات أو أن يطلبها هو عند أداء مهامه؟
  - ما الاستثناء من منع تلقي التعليمات عن المجلس، وهل طلبات المفوضية الأوروبية تعتبر استثناء؟
  - يعني أحد يقدر يوجّه المجلس الأوروبي أو يأمره يقرر شي معين؟ ولا هو ما ياخذ أوامر من أحد؟
- key: gdpr:art-70:para-1
  text: 39c393ca77f13db8
  en:
  - Which EU body makes sure data protection rules are applied the same way across all countries?
  - We operate our app in several EU countries and want to know who keeps the interpretation of privacy
    rules consistent between regulators.
  - What are the main jobs of the European body that coordinates national privacy regulators?
  ar:
  - ما الجهة الأوروبية المسؤولة عن ضمان تطبيق قواعد حماية البيانات بشكل موحد في جميع الدول الأعضاء؟
  - ما هي المهام الرئيسية للمجلس الأوروبي لحماية البيانات الذي ينسق عمل الجهات الرقابية الوطنية؟
  - مين الجهة اللي توحّد تفسير قوانين الخصوصية بين الدول الأوروبية؟ عندي تطبيق شغال في كذا دولة
- key: gdpr:art-70:para-1:pt-a
  text: 0cc32bb6cbb454a7
  en:
  - Does the EU board oversee how national regulators apply the rules in the consistency procedure, or
    do national authorities still handle their own cases?
  - Our company got an opinion in a multi-country data case. Is the central board checking that the rules
    were applied correctly?
  ar:
  - من الذي يراقب التطبيق الصحيح للائحة في حالات التعاون بين الجهات الرقابية الوطنية عند وجود نزاع بينها؟
  - هل يحل المجلس الأوروبي محل الجهة الرقابية الوطنية عند مراجعة قضية عابرة للحدود؟
  - لو صار خلاف بين جهتين رقابيتين بخصوص تطبيقنا، مين يراجع ويتأكد إن القانون انطبق صح؟
- key: gdpr:art-70:para-1:pt-b
  text: 245e6f55245b76fc
  en:
  - Who advises the European Commission when new privacy law changes are being proposed?
  - Is there an EU body that gives expert input on any data protection issue across the Union?
  - Can the board weigh in if the Commission wants to change the GDPR?
  ar:
  - من الجهة التي تقدم المشورة للمفوضية الأوروبية بشأن أي تعديل مقترح على لائحة حماية البيانات؟
  - هل هناك هيئة أوروبية تقدم رأيًا للمفوضية في أي مسألة تتعلق بحماية البيانات الشخصية؟
  - مين يعطي المفوضية الأوروبية نصيحة لما يبغون يغيّرون قانون الخصوصية؟
- key: gdpr:art-70:para-1:pt-c
  text: 33604192a472f3ba
  en:
  - Who advises on the forms and procedure for sharing information about binding corporate rules between
    companies and regulators?
  - We're a group of companies preparing BCRs for internal data sharing. Who helps define the format for
    exchanging that information with authorities?
  - Does the EU board have a role in the paperwork process for binding corporate rules?
  ar:
  - من يقدم المشورة للمفوضية بشأن شكل وإجراءات تبادل المعلومات المتعلقة بالقواعد المؤسسية الملزمة؟
  - هل للمجلس الأوروبي دور في إجراءات وأوراق الـ BCR؟
- key: gdpr:art-70:para-1:pt-d
  text: 106ec01750f15ec8
  en:
  - Is there official guidance on how to remove links and copies of personal data from public platforms
    when a user asks for deletion?
  - A user asked us to delete their data and we had already published it on a public forum. Where can
    I find EU guidelines on removing copies and links?
  - Who issues best practices for erasing replicated personal data from publicly available services?
  ar:
  - هل توجد إرشادات رسمية حول حذف الروابط ونسخ البيانات الشخصية من الخدمات المتاحة للعموم؟
  - طلب منا مستخدم حذف بياناته بعد أن نشرناها على منصة عامة، فأين أجد التوجيهات الأوروبية بشأن إزالة النسخ
    والروابط؟
  - وين ألقى إرشادات أوروبية عن مسح الروابط والنسخ المكررة من بيانات الشخص لما يطلب حذفها؟
- key: gdpr:art-70:para-1:pt-e
  text: 745c776b109e9422
  en:
  - Can the EU board look into any question about how the privacy rules apply and publish guidance on
    it?
  - We're unsure how a GDPR rule applies to our app. Who produces the recommendations and best practices
    regulators follow?
  ar:
  - هل يستطيع المجلس الأوروبي دراسة أي مسألة تخص تطبيق اللائحة وإصدار إرشادات بشأنها؟
  - من الجهة التي تصدر التوصيات وأفضل الممارسات لتوضيح النقاط الغامضة في اللائحة، وهل يمكن للمفوضية أن
    تطلب ذلك؟
  - ما فهمت كيف ينطبق بند معين من القانون على تطبيقنا، مين اللي يطلع إرشادات رسمية توضحه؟
- key: gdpr:art-70:para-1:pt-f
  text: f04962aec5c31cd2
  en:
  - Is there official guidance on when automated decisions and profiling are allowed in our credit-scoring
    app?
  - Where can I find EU guidelines on the conditions for decisions based on profiling?
  - Who clarifies the criteria for automated profiling decisions that affect users?
  ar:
  - هل توجد إرشادات رسمية حول متى يُسمح بالقرارات المبنية على التنميط الآلي في تطبيق تقييم ائتماني؟
  - أين أجد التوجيهات الأوروبية الخاصة بشروط وضوابط القرارات القائمة على التنميط؟
  - مين يوضح المعايير للقرارات الآلية والبروفايلينج اللي تأثر على المستخدمين؟
- key: gdpr:art-70:para-1:pt-g
  text: 8f8e67f24eec7977
  en:
  - Is there official guidance on what counts as a personal data breach and how fast we must notify?
  - Our database was exposed. Where do I find EU guidance on deciding if we must report the breach and
    what counts as undue delay?
  - Who publishes best practices on when a controller or processor has to notify a data breach?
  ar:
  - هل توجد إرشادات رسمية عن ما يُعد خرقًا للبيانات الشخصية وعن المدة المقبولة للإبلاغ عنه؟
  - تعرضت قاعدة بياناتنا للتسريب، فأين أجد التوجيهات الأوروبية لتحديد ما إذا كان يجب الإبلاغ وما معنى
    التأخير غير المبرر؟
  - وين ألقى إرشادات عن متى لازم نبلغ عن اختراق البيانات وكم المدة المسموحة؟
- key: gdpr:art-70:para-1:pt-h
  text: a485f11ec6de618b
  en:
  - Where can I find guidance on when a data breach is risky enough that we must tell the affected users?
  - Is there an official EU guide on high-risk breaches for notifying individuals?
  ar:
  - أين أجد إرشادات حول متى يكون خرق البيانات عالي الخطورة بحيث يجب إبلاغ الأشخاص المتأثرين؟
  - فيه دليل أوروبي رسمي يوضح متى الاختراق يعتبر خطر عالي ولازم نخبر المستخدمين؟
- key: gdpr:art-70:para-1:pt-i
  text: a5f6a625a775d31d
  en:
  - Is there EU guidance on the requirements for transferring data abroad under binding corporate rules?
  - Our group wants to send customer data to affiliates outside the EU using BCRs. Where are the detailed
    criteria?
  - Who clarifies the extra requirements for BCRs used by controllers and by processors?
  ar:
  - هل توجد إرشادات أوروبية بشأن متطلبات نقل البيانات خارج الاتحاد استنادًا إلى القواعد المؤسسية الملزمة؟
  - تريد مجموعتنا نقل بيانات العملاء إلى شركات تابعة خارج أوروبا عبر BCR، فأين أجد المعايير التفصيلية؟
  - مين يوضح الشروط الإضافية للـ BCR سواء للمتحكم أو المعالج؟
- key: gdpr:art-70:para-1:pt-j
  text: d53efd912dc17567
  en:
  - Is there official guidance on sending personal data abroad using the exceptions like user consent?
  - Our app needs to send data to a country without an adequacy decision in specific cases. Where are
    the criteria explained?
  - Who publishes best practices on the derogations for international data transfers?
  ar:
  - هل توجد إرشادات رسمية حول نقل البيانات إلى الخارج بالاستناد إلى الاستثناءات مثل موافقة المستخدم؟
  - يحتاج تطبيقنا إلى إرسال بيانات إلى دولة ليس لها قرار كفاية في حالات محددة، فأين تُشرح المعايير؟
  - مين ينشر إرشادات عن استثناءات نقل البيانات الدولية؟
- key: gdpr:art-70:para-1:pt-k
  text: 768182992e8ce6ee
  en:
  - How do regulators decide on fines and corrective measures, is there a common guide for them?
  - We want to understand how much we could be fined. Are there EU guidelines that authorities use to
    set penalties?
  - Who drafts guidelines for national regulators on using their powers and calculating administrative
    fines?
  ar:
  - كيف تقرر الجهات الرقابية الغرامات والإجراءات التصحيحية، وهل هناك دليل موحد لها؟
  - نريد أن نفهم حجم الغرامة المحتملة، فهل توجد إرشادات أوروبية تعتمدها السلطات لتحديد العقوبات؟
  - مين يعدّ إرشادات للجهات الرقابية الوطنية حول استخدام صلاحياتها وحساب الغرامات الإدارية؟
- key: gdpr:art-70:para-1:pt-l
  text: 057cd8b3089405c2
  en:
  - Does the EU board check whether its own guidelines work in practice?
  - Are the published privacy guidelines and best practices reviewed over time?
  - Who evaluates how guidelines are actually being used by companies and regulators?
  ar:
  - هل يراجع المجلس الأوروبي مدى نجاح إرشاداته في التطبيق العملي؟
  - هل تتم مراجعة إرشادات حماية البيانات وأفضل الممارسات المنشورة مع الوقت؟
  - مين يقيّم كيف تُطبَّق الإرشادات فعليًا من الشركات والجهات الرقابية؟
- key: gdpr:art-70:para-1:pt-m
  text: 86a7936834a2449c
  en:
  - Is there a common procedure for users to report a privacy violation to regulators in different EU
    countries?
  - A customer wants to file a complaint about our app. Is there EU guidance on standard complaint procedures?
  - Who sets best practices for how individuals report GDPR infringements?
  ar:
  - هل توجد إجراءات موحدة ليبلغ الأفراد عن انتهاكات الخصوصية لدى الجهات الرقابية في دول مختلفة؟
  - عميل يريد تقديم شكوى ضد تطبيقنا، فهل توجد إرشادات أوروبية لإجراءات الشكاوى الموحدة؟
  - مين يحدد أفضل الممارسات لكيفية إبلاغ الأفراد عن مخالفات قانون حماية البيانات؟
- key: gdpr:art-70:para-1:pt-n
  text: 1923b87e43735da2
  en:
  - Is there an EU body encouraging industry codes of conduct and privacy certification seals?
  - We want our app to get a data protection seal. Who promotes these certification schemes?
  - Who pushes the creation of codes of conduct for our industry's data handling?
  ar:
  - هل هناك جهة أوروبية تشجع إعداد مدونات السلوك وآليات الاعتماد وأختام حماية البيانات؟
  - نريد أن يحصل تطبيقنا على ختم لحماية البيانات، فمن يشجع هذه الآليات؟
  - مين اللي يحفّز إنشاء مدونات سلوك لقطاعنا وشهادات الخصوصية؟
- key: gdpr:art-70:para-1:pt-o
  text: fe044cd059d68af1
  en:
  - Who approves the criteria for data protection certifications for software products?
  - Where can I find a public list of certified privacy seals and certified companies, including those
    outside the EU?
  - Is there an official register of GDPR certification mechanisms I can check before buying a certified
    service?
  ar:
  - من يعتمد معايير شهادات حماية البيانات للمنتجات البرمجية؟
  - أين أجد قائمة علنية بأختام الخصوصية المعتمدة والشركات الحاصلة عليها، بما فيها خارج الاتحاد؟
  - هل يوجد سجل رسمي لآليات الاعتماد يمكنني مراجعته قبل التعاقد مع خدمة معتمدة؟
- key: gdpr:art-70:para-1:pt-p
  text: 7d5c86ba1e7dc8e2
  en:
  - We want to become a certification body for privacy. Which EU body approves the accreditation requirements?
  - Does the EU board sign off on the standards for accrediting certification bodies?
  ar:
  - من يوافق على متطلبات اعتماد جهات منح شهادات حماية البيانات؟
  - نريد أن نصبح جهة إصدار شهادات خصوصية، فأي هيئة أوروبية توافق على متطلبات الاعتماد؟
- key: gdpr:art-70:para-1:pt-q
  text: dc71b018c62f130a
  en:
  - Who gives the Commission an opinion on certification requirements?
  - Does the EU board advise on the rules for certification schemes that the Commission may set?
  ar:
  - من يقدم للمفوضية رأيًا بشأن متطلبات الاعتماد والشهادات؟
  - هل يقدم المجلس الأوروبي المشورة حول قواعد آليات الاعتماد التي قد تضعها المفوضية؟
- key: gdpr:art-70:para-1:pt-r
  text: 4fdd958729aeac2d
  en:
  - Who gives an opinion on the standardized icons used to show privacy information to users?
  - We want to use icons in our privacy notice. Is there an EU body consulted about those icons?
  - Does the board advise on visual symbols for explaining data practices?
  ar:
  - من يقدم رأيًا حول الأيقونات الموحدة المستخدمة لعرض معلومات الخصوصية للمستخدمين؟
  - نريد استخدام أيقونات في إشعار الخصوصية، فهل هناك جهة أوروبية تُستشار بشأنها؟
  - هل يقدم المجلس مشورة حول الرموز المرئية لشرح ممارسات البيانات؟
- key: gdpr:art-70:para-1:pt-s
  text: c5456d10b62a2b79
  en:
  - Who advises the Commission on whether a non-EU country has adequate data protection for transfers?
  - If the Commission is reviewing whether a country still counts as safe for data transfers, does the
    board get involved?
  - Is the board given the documents and correspondence with a third country's government when adequacy
    is assessed?
  ar:
  - من يقدم المشورة للمفوضية حول ما إذا كانت دولة خارج الاتحاد توفر حماية كافية لنقل البيانات؟
  - إذا كانت المفوضية تراجع ما إذا كانت دولة ما لا تزال آمنة لنقل البيانات، فهل يشارك المجلس؟
  - هل تزوّد المفوضية المجلس بالوثائق والمراسلات مع حكومة الدولة الثالثة عند تقييم الكفاية؟
- key: gdpr:art-70:para-1:pt-t
  text: bb8dff070a630ab0
  en:
  - Who issues binding decisions when national privacy regulators can't agree on a cross-border case?
  - Our regulator sent a draft decision about us to the EU level. Who issues the opinion on it?
  - Can the EU board make a binding decision in an urgent case involving a company operating in several
    countries?
  ar:
  - من يصدر القرارات الملزمة عندما لا تتفق الجهات الرقابية الوطنية في قضية عابرة للحدود؟
  - أرسلت الجهة الرقابية مشروع قرار بشأننا إلى المستوى الأوروبي، فمن يصدر الرأي حوله؟
  - هل يستطيع المجلس الأوروبي إصدار قرار ملزم في حالة مستعجلة تخص شركة تعمل في عدة دول؟
- key: gdpr:art-70:para-1:pt-u
  text: 039a6cc34da86ffb
  en:
  - Is there an EU body that helps national privacy regulators share information and best practices?
  - Does the board encourage cooperation between regulators in different countries?
  - How do data protection authorities in the EU exchange knowledge with each other?
  ar:
  - هل هناك جهة أوروبية تساعد الجهات الرقابية الوطنية على تبادل المعلومات وأفضل الممارسات؟
  - هل يشجع المجلس التعاون بين الجهات الرقابية في دول مختلفة؟
  - كيف تتبادل سلطات حماية البيانات في أوروبا المعرفة فيما بينها؟
- key: gdpr:art-70:para-1:pt-v
  text: 2737fb92dd1e4a35
  en:
  - Do EU privacy regulators have shared training programs or staff exchanges?
  - Can regulators swap personnel with authorities from non-EU countries?
  - Who organizes joint training for data protection regulators?
  ar:
  - هل لدى الجهات الرقابية الأوروبية برامج تدريب مشتركة أو تبادل للموظفين؟
  - هل يمكن للجهات الرقابية تبادل الموظفين مع سلطات من خارج الاتحاد؟
  - مين ينظم تدريب مشترك لموظفي هيئات حماية البيانات؟
- key: gdpr:art-70:para-1:pt-w
  text: 3a0ebb17d2de1a32
  en:
  - Does the EU board share knowledge about privacy law with regulators around the world?
  - Is there international exchange of documentation about data protection practice between regulators?
  - How do EU authorities collaborate with foreign privacy regulators?
  ar:
  - هل يتبادل المجلس الأوروبي المعرفة حول قانون الخصوصية مع الجهات الرقابية حول العالم؟
  - هل يوجد تبادل دولي للوثائق حول ممارسات حماية البيانات بين الجهات الرقابية؟
  - كيف تتعاون السلطات الأوروبية مع هيئات الخصوصية في دول أخرى؟
- key: gdpr:art-70:para-1:pt-x
  text: afa7e1c4e52b8255
  en:
  - Who gives an opinion on a code of conduct drafted by an industry association across the EU?
  - Our trade group wrote a EU-wide code of conduct for data handling. Who reviews it?
  - Does the board comment on codes of conduct that apply at Union level?
  ar:
  - من يصدر رأيًا بشأن مدونة سلوك أعدتها جمعية قطاعية على مستوى الاتحاد الأوروبي؟
  - أعدت جمعيتنا المهنية مدونة سلوك لمعالجة البيانات على مستوى أوروبا، فمن يراجعها؟
  - هل يعلّق المجلس على مدونات السلوك المطبقة على مستوى الاتحاد؟
- key: gdpr:art-70:para-1:pt-y
  text: 56f289438cf9161c
  en:
  - Is there a public database of privacy decisions made by regulators and courts in cross-border cases?
  - Where can I search past rulings from the consistency procedure to see how similar cases ended?
  - Who keeps an online register of regulator and court decisions on consistency matters?
  ar:
  - هل توجد قاعدة بيانات علنية بقرارات الجهات الرقابية والمحاكم في القضايا العابرة للحدود؟
  - أين أبحث في القرارات السابقة لآلية الاتساق لأرى كيف انتهت قضايا مشابهة؟
  - من يحتفظ بسجل إلكتروني عام لقرارات الجهات الرقابية والمحاكم في مسائل الاتساق؟
- key: gdpr:art-70:para-2
  text: a8c5e57b482933eb
  en:
  - Can the Commission set a deadline when it asks the board for advice?
  - If the Commission needs urgent input on a privacy issue, how fast must the board respond?
  - Is there a time limit on the board's advice when the matter is pressing?
  ar:
  - هل يمكن للمفوضية تحديد مهلة زمنية عندما تطلب المشورة من المجلس؟
  - إذا احتاجت المفوضية رأيًا عاجلًا بشأن مسألة خصوصية، فكم الوقت المتاح للمجلس للرد؟
  - هل هناك مدة محددة لتقديم المشورة عندما يكون الموضوع مستعجلًا؟
- key: gdpr:art-70:para-3
  text: 764a3cae38bd8adb
  en:
  - Are the board's guidelines and opinions published for everyone to read?
  - Where do I find the board's recommendations, and who else receives them?
  - Does the board send its opinions to the Commission and make them public?
  ar:
  - هل تُنشر إرشادات المجلس وآراؤه للعموم ليطلع عليها الجميع؟
  - أين أجد توصيات المجلس، ولمن تُرسل أيضًا؟
  - هل يرسل المجلس آراءه إلى المفوضية ويجعلها علنية؟
- key: gdpr:art-70:para-4
  text: 9c06ee047ba77b2f
  en:
  - Can companies and other stakeholders comment on draft guidelines before they're finalized?
  - Does the board hold public consultations on its guidance, and are the results published?
  - We want to give feedback on a draft EU privacy guideline. Is there a consultation window?
  ar:
  - هل يمكن للشركات وأصحاب المصلحة التعليق على مسودات الإرشادات قبل اعتمادها؟
  - هل يجري المجلس مشاورات علنية حول إرشاداته وهل تُنشر نتائجها؟
  - نبغى نعطي ملاحظاتنا على مسودة إرشادات خصوصية أوروبية، هل فيه فترة استشارة؟
- key: gdpr:art-71:para-1
  text: 5db752653be4a34a
  en:
  - Does the EU data protection board publish a yearly report on how personal data privacy is doing, and
    who gets a copy of it?
  - We're a SaaS company wondering where to find the official annual overview of privacy protection across
    Europe and beyond. Is it public?
  - Does the yearly privacy report from the EU authorities also look at what's happening with data handling
    in non-EU countries and international bodies?
  ar:
  - هل يصدر المجلس الأوروبي لحماية البيانات تقريراً سنوياً عن حماية الأشخاص في معالجة بياناتهم، ومن الجهات
    التي يُرسل إليها؟
  - هل التقرير السنوي عن حماية البيانات الشخصية منشور للعموم ولا بس للجهات الرسمية؟ أبغى أرجع له لتطبيقنا
  - وين ألاقي التقرير السنوي حق الاتحاد الأوروبي عن الخصوصية، وهل يغطي الدول خارج الاتحاد والمنظمات الدولية؟
- key: gdpr:art-71:para-2
  text: 792caeb49d1fc7a5
  en:
  - Will the annual privacy report from the EU board say anything about how its guidelines and best practices
    are actually being applied in practice?
  - We follow the EU privacy guidelines for our app. Is there an official yearly review of how those recommendations
    and best practices work in reality?
  - Does the yearly report cover the binding decisions the board made in disputes between national regulators?
  ar:
  - هل يتضمن التقرير السنوي للمجلس الأوروبي مراجعة لكيفية تطبيق الإرشادات والتوصيات وأفضل الممارسات عملياً؟
  - هل التقرير السنوي يذكر القرارات الملزمة اللي أصدرها المجلس في الخلافات بين الجهات الرقابية؟
  - ابي اعرف هل فيه تقرير كل سنة يقيّم تطبيق الإرشادات الأوروبية على أرض الواقع، عشان نعرف وش نمشي عليه
    في شركتنا
- key: gdpr:art-72:para-1
  text: 37877f69706ec047
  en:
  - How many votes does the EU data protection board need to pass a decision, and is a plain majority
    enough?
  - We're waiting on a ruling from the European data protection board that affects our app. Does it just
    need more than half of its members to agree?
  - Are there cases where the board's decisions need more than a simple majority of members?
  ar:
  - كم عدد الأصوات اللازمة لاتخاذ قرار في المجلس الأوروبي لحماية البيانات، وهل تكفي الأغلبية البسيطة؟
  - هل يكفي أن يوافق أكثر من نصف أعضاء المجلس الأوروبي لحماية البيانات حتى يصدر القرار الذي يخص تطبيقنا؟
  - شلون يتخذ المجلس الأوروبي لحماية البيانات قراراته؟ يعني يكفي النص زائد واحد ولا يحتاج أكثر؟
- key: gdpr:art-72:para-2
  text: f97e372b5366d58b
  en:
  - Who writes the internal rules of the European data protection board, and what vote does it take to
    adopt them?
  - Can the board set up how it works day to day by itself, or does someone else decide that for it?
  - What majority is needed for the data protection board to approve its own rules of procedure?
  ar:
  - من الذي يضع القواعد الإجرائية الداخلية للمجلس الأوروبي لحماية البيانات، وما الأغلبية المطلوبة لاعتمادها؟
  - هل يستطيع المجلس الأوروبي لحماية البيانات تنظيم ترتيباته التشغيلية بنفسه أم تحدده جهة أخرى؟
  - كيف يمرّرون قواعد عمل المجلس الأوروبي؟ لازم ثلثين الأعضاء ولا يكفي أقل؟
- key: gdpr:art-73:para-1
  text: dc6a5f1b04af42b7
  en:
  - How does the EU data protection board pick its president and the two vice presidents?
  - Who decides who leads the European body that coordinates privacy regulators, and what vote is needed?
  - We're following the EU privacy board's leadership changes for our app's compliance. Do the chair and
    deputies come from among the board's own members?
  ar:
  - كيف يتم انتخاب رئيس المجلس الأوروبي لحماية البيانات ونائبيه؟
  - هل يُنتخب رئيس المجلس ونائباه من بين أعضاء المجلس نفسه وبأي أغلبية يتم ذلك؟
  - مين اللي يختار رئيس مجلس حماية البيانات الأوروبي ونوابه؟ وكم عدد النواب؟
- key: gdpr:art-73:para-2
  text: 029b4bcb93e120fe
  en:
  - How long does the head of the EU data protection board serve before a new one is chosen?
  - Can the same person be chair of the EU privacy board for more than two terms?
  - Our company tracks the EU privacy regulators' leadership. How many years is a deputy chair's term
    and can it be renewed?
  ar:
  - كم مدة ولاية رئيس المجلس الأوروبي لحماية البيانات ونائبيه؟
  - هل يجوز تجديد ولاية رئيس المجلس أو نائبيه أكثر من مرة واحدة؟
  - كم سنة يقعد رئيس مجلس الخصوصية الأوروبي في منصبه؟ وهل ممكن ينتخبوه مرة ثانية؟
- key: gdpr:art-74:para-1
  text: c9f6131b48ee5b2f
  en:
  - Who is responsible for running the EU data protection board's meetings, scheduling them and setting
    what gets discussed?
  - Our company's cross-border case is going before the EU board and we want to know what the board's
    chair actually does.
  - What is the list of duties of the person who chairs the European data protection board?
  ar:
  - ما المهام التي يتولاها رئيس المجلس الأوروبي لحماية البيانات؟
  - من الذي يحدد جدول أعمال اجتماعات المجلس ويدعو إليها ويتابع إنجاز أعماله؟
  - شو بالضبط شغل رئيس مجلس حماية البيانات الأوروبي؟ أبغى أفهم دوره.
- key: gdpr:art-74:para-1:pt-a
  text: fbe37515d937083a
  en:
  - Who calls the meetings of the EU data protection board and decides what is on the agenda?
  - We want a topic about our app's data processing discussed at the EU board. Who sets the agenda?
  - Does the chair of the EU data protection board schedule its meetings?
  ar:
  - من الجهة التي تدعو إلى اجتماعات المجلس الأوروبي لحماية البيانات وتعد جدول أعماله؟
  - مين اللي يحدد موعد اجتماعات المجلس الأوروبي لحماية البيانات ويجهز جدول الأعمال؟
  - نبي نعرف مين يحط الموضوعات في أجندة اجتماع مجلس حماية البيانات، هل هو الرئيس؟
- key: gdpr:art-74:para-1:pt-b
  text: eff5989fabb43e89
  en:
  - After the EU board settles a dispute between regulators about our app, who tells the regulators involved
    about the decision?
  - Who informs the lead regulator and the other concerned regulators when the board adopts a binding
    decision?
  - Our online shop is waiting on a dispute resolution decision from the EU board. Who passes it on to
    the authorities?
  ar:
  - من يتولى إبلاغ السلطة الرقابية الرئيسية والسلطات المعنية بالقرارات التي يعتمدها المجلس في حالات النزاع؟
  - متجرنا الإلكتروني ينتظر قرار المجلس في نزاع بين الجهات الرقابية، فمن يبلغ هذه الجهات بالقرار؟
  - مين يبلّغ الجهة الرقابية الرئيسية والجهات المعنية لما المجلس يصدر قراره الملزم؟
- key: gdpr:art-74:para-1:pt-c
  text: 982d212f8fa62ca9
  en:
  - Who makes sure the EU board handles things on time, especially cross-border cases needing a consistent
    approach?
  - Our cross-border complaint seems stuck at the EU level. Whose job is it to keep the board's work on
    schedule?
  - Is the chair responsible for timely work in the consistency mechanism between data regulators?
  ar:
  - من يضمن أن ينجز المجلس الأوروبي مهامه في الوقت المناسب، خصوصاً في آلية الاتساق؟
  - شكوانا العابرة للحدود متأخرة على مستوى المجلس الأوروبي، على مين مسؤولية متابعة سير العمل بوقته؟
  - وش دور الرئيس في ضمان إن آلية الاتساق بين الجهات الرقابية تمشي بدون تأخير؟
- key: gdpr:art-74:para-2
  text: 10dda741bb8425b2
  en:
  - How are duties divided between the board's chair and its deputy chairs?
  - Where can I find out which tasks the deputy chair handles instead of the chair at the EU data protection
    board?
  - Who decides how work is split between the chair and deputies, and in which document?
  ar:
  - كيف يتم توزيع المهام بين رئيس المجلس ونوابه؟
  - في أي وثيقة يحدد المجلس الأوروبي لحماية البيانات اختصاصات الرئيس مقابل نواب الرئيس؟
  - مين يقرر تقسيم الشغل بين الرئيس ونوابه في المجلس، وين أطلع على هالتفاصيل؟
- key: gdpr:art-75:para-1
  text: da5e5463e9a68a9b
  en:
  - Who provides the administrative staff and office support for the EU board of data protection regulators?
  - We're trying to understand who backs the European Data Protection Board behind the scenes. Is it its
    own independent team or part of another EU body?
  - Is the EDPB's secretariat run by the EDPS or is it a separate organisation?
  ar:
  - من الجهة التي توفر الأمانة العامة للمجلس الأوروبي لحماية البيانات؟
  - هل أمانة المجلس الأوروبي لحماية البيانات تابعة للمراقب الأوروبي لحماية البيانات؟
  - مين اللي يدير السكرتارية حق مجلس حماية البيانات الأوروبي؟ هل هي جهة مستقلة ولا تابعة لجهة ثانية؟
- key: gdpr:art-75:para-2
  text: 86f0af3abf5cae14
  en:
  - Who gives orders to the staff that support the EDPB, the Chair or the EDPS?
  - Can the data protection supervisor's management tell the EDPB secretariat what to do?
  - If we're writing about how the EDPB works, whose instructions does its secretariat follow?
  ar:
  - لأوامر من يخضع موظفو أمانة المجلس الأوروبي لحماية البيانات؟
  - هل يستطيع المراقب الأوروبي لحماية البيانات توجيه تعليمات لأمانة المجلس؟
  - مين يعطي التعليمات لسكرتارية مجلس حماية البيانات، رئيس المجلس ولا جهة ثانية؟
- key: gdpr:art-75:para-3
  text: 5b7fe436c1da6e73
  en:
  - Do the EDPS employees working for the EDPB report to the same managers as their other EDPS colleagues?
  - Is there a separation between staff doing EDPB work and staff doing the supervisor's own work to avoid
    conflicts?
  - Worried that the same people advise the EDPB and the EDPS, is that allowed or must the reporting lines
    be separate?
  ar:
  - هل موظفو المراقب الأوروبي الذين يعملون لصالح المجلس يتبعون نفس التسلسل الإداري لباقي الموظفين؟
  - هل يجب الفصل في خطوط الإبلاغ بين موظفي مهام المجلس وموظفي مهام المراقب الأوروبي؟
  - يعني الموظفين اللي يشتغلون للمجلس الأوروبي لازم يكون لهم مدير غير مدير شغل المراقب الأوروبي؟
- key: gdpr:art-75:para-4
  text: 37dc4029b0c92ae7
  en:
  - Is there a public document setting out how the EDPB and the EDPS work together on staff and support?
  - Do the EDPB and EDPS have to publish a memorandum on their cooperation?
  ar:
  - هل توجد مذكرة تفاهم منشورة تنظم التعاون بين المجلس الأوروبي لحماية البيانات والمراقب الأوروبي؟
  - هل يلزم المجلس والمراقب الأوروبي بنشر مذكرة تفاهم حول شروط تعاونهما؟
  - فيه اتفاق معلن بين مجلس حماية البيانات والمراقب الأوروبي يحدد كيف يتعاونون وبخصوص الموظفين؟
- key: gdpr:art-75:para-5
  text: 92080a0e446020b4
  en:
  - What kind of help does the EDPB secretariat give to the Board?
  - Does the secretariat only handle admin, or does it also do research and analysis for the Board?
  - What support, like logistics and analysis, do the EDPB's staff provide?
  ar:
  - ما أنواع الدعم التي تقدمها الأمانة العامة للمجلس الأوروبي لحماية البيانات؟
  - هل تقتصر مهمة الأمانة على الأعمال الإدارية أم تشمل التحليل والدعم اللوجستي أيضاً؟
  - وش نوع المساعدة اللي تقدمها السكرتارية للمجلس، تحليل وإدارة وتنظيم؟
- key: gdpr:art-75:para-6
  text: fafd6779a4d6e34c
  en:
  - What are the main responsibilities of the EDPB secretariat?
  - Who actually handles the paperwork, meetings and publications for the EDPB?
  - Which tasks does the secretariat of the EU data protection board take care of day to day?
  ar:
  - ما هي المسؤوليات الرئيسية للأمانة العامة للمجلس الأوروبي لحماية البيانات؟
  - من الذي يتولى الأعمال اليومية والاجتماعات والنشر في المجلس الأوروبي لحماية البيانات؟
  - إيش المهام اللي تسويها سكرتارية مجلس حماية البيانات بشكل عام؟
- key: gdpr:art-75:para-6:pt-a
  text: fa164dadaff67492
  en:
  - Who handles the routine running of the EDPB from day to day?
  - Which body manages the ongoing daily business of the European data protection board?
  - Is the secretariat in charge of the EDPB's everyday operations?
  ar:
  - من يتولى تسيير الأعمال اليومية للمجلس الأوروبي لحماية البيانات؟
  - هل الأمانة هي المسؤولة عن العمليات اليومية المعتادة للمجلس؟
  - مين اللي يمشي شغل المجلس الأوروبي يوم بيوم؟
- key: gdpr:art-75:para-6:pt-b
  text: 22b4e15d88605e62
  en:
  - Who coordinates communication between EDPB members, its Chair and the European Commission?
  - Who passes messages between national regulators on the Board and the Commission?
  - Is the secretariat the contact point linking Board members, the Chair and the Commission?
  ar:
  - من ينسق التواصل بين أعضاء المجلس ورئيسه والمفوضية الأوروبية؟
  - هل الأمانة هي حلقة الوصل بين أعضاء المجلس الأوروبي ورئيسه والمفوضية؟
  - مين المسؤول عن المراسلات بين أعضاء المجلس والرئيس والمفوضية الأوروبية؟
- key: gdpr:art-75:para-6:pt-c
  text: bf3acae4c8ab6048
  en:
  - Who answers the public and other EU institutions on behalf of the EDPB?
  - If a citizen or company wants to contact the EDPB, who handles outside communication?
  - Who is responsible for the EDPB's public relations and contacts with other EU bodies?
  ar:
  - من يتولى التواصل مع الجمهور والمؤسسات الأخرى نيابة عن المجلس الأوروبي لحماية البيانات؟
  - إذا أردت مراسلة المجلس الأوروبي لحماية البيانات، من الجهة التي تتعامل مع الاتصالات الخارجية؟
  - مين يرد على الناس والجهات الأوروبية الثانية باسم المجلس؟
- key: gdpr:art-75:para-6:pt-d
  text: 7e6ecba206652f71
  en:
  - Who is in charge of the electronic tools the EDPB uses to communicate internally and externally?
  - Who manages the digital systems and online communication channels for the Board?
  - Does the secretariat handle the IT and electronic communication of the EDPB?
  ar:
  - من المسؤول عن الوسائل الإلكترونية للتواصل الداخلي والخارجي في المجلس الأوروبي لحماية البيانات؟
  - هل تدير الأمانة أنظمة الاتصال الإلكتروني الخاصة بالمجلس؟
  - مين اللي يتولى الأنظمة والقنوات الإلكترونية للتواصل في المجلس الأوروبي؟
- key: gdpr:art-75:para-6:pt-e
  text: 51ebac0acda06736
  en:
  - Who translates EDPB documents into other languages?
  - Who is responsible for translating the Board's relevant information for different member states?
  - Is translation of EDPB materials done by its secretariat?
  ar:
  - من المسؤول عن ترجمة وثائق المجلس الأوروبي لحماية البيانات؟
  - هل تتولى الأمانة ترجمة المعلومات ذات الصلة الخاصة بالمجلس؟
  - مين يترجم المعلومات والوثائق حق المجلس الأوروبي للغات الثانية؟
- key: gdpr:art-75:para-6:pt-f
  text: b9958746142be2db
  en:
  - Who organises the EDPB plenary meetings and writes up what follows afterwards?
  - Who prepares the agenda and follow-up for the Board's meetings?
  - Is the secretariat responsible for setting up EDPB meetings and following up on them?
  ar:
  - من يحضّر اجتماعات المجلس الأوروبي لحماية البيانات ويتابع نتائجها؟
  - هل الأمانة مسؤولة عن الإعداد للاجتماعات والمتابعة بعدها؟
  - مين يجهز اجتماعات المجلس ويتابع اللي يصير بعدها؟
- key: gdpr:art-75:para-6:pt-g
  text: 640d15f5a30dcc80
  en:
  - Who drafts and publishes EDPB guidelines, opinions and dispute decisions?
  - Which team prepares and publishes the Board's opinions and binding dispute settlement decisions?
  ar:
  - من يعد ويصيغ وينشر آراء وقرارات المجلس الأوروبي لحماية البيانات؟
  - من المسؤول عن تحضير قرارات تسوية النزاعات بين سلطات الرقابة ونشرها؟
  - مين يكتب وينشر الآراء والقرارات اللي يعتمدها المجلس في خلافات الجهات الرقابية؟
- key: gdpr:art-76:para-1
  text: 85c1d4faf3fc3800
  en:
  - Can the EU data protection board keep its meetings secret, or are its discussions always public?
  - We're waiting on a joint opinion from the EU privacy regulators' board about our app. Will what they
    debate internally be kept confidential?
  - Who decides whether the board's deliberations stay private, and where are the rules on that set?
  ar:
  - هل يحق للمجلس الأوروبي لحماية البيانات أن يجعل مداولاته سرية أم أنها دائماً علنية؟
  - نحن ننتظر رأيًا من مجلس حماية البيانات الأوروبي بخصوص تطبيقنا، فهل تبقى نقاشاتهم الداخلية سرية؟
  - شلون أعرف إذا اجتماعات مجلس حماية البيانات سرية؟ ومين يقرر هالشي؟
- key: gdpr:art-76:para-2
  text: 666d7eb40086fe86
  en:
  - Can I request copies of documents that were given to the data protection board's members or its experts?
  - Which rules decide whether the public can see papers that outside experts or third parties submitted
    to the EU privacy board?
  - Our company sent a submission to the EU data protection board. Could someone else get access to it
    through a public access request?
  ar:
  - هل يمكنني طلب الاطلاع على الوثائق المقدمة إلى أعضاء مجلس حماية البيانات الأوروبي أو خبرائه؟
  - ما القواعد التي تحكم وصول الجمهور إلى المستندات التي قدمتها أطراف ثالثة إلى المجلس الأوروبي لحماية
    البيانات؟
  - شركتنا بعتت ملف للمجلس الأوروبي لحماية البيانات، ممكن أي حد يطلب يشوفه ولا لأ؟
- key: gdpr:art-77:para-1
  text: 428a3fdeb7f63023
  en:
  - A user thinks our app mishandled their personal data and wants to report us to a data protection regulator.
    Where are they allowed to file that complaint?
  - Can someone complain to the privacy authority in the country where they work or live, even if our
    company is based in another EU country?
  - If a customer files a regulator complaint against us, does that stop them from also suing us or using
    other legal routes?
  ar:
  - هل يحق للمستخدم أن يقدم شكوى إلى هيئة حماية البيانات إذا شعر أن تطبيقنا انتهك خصوصية بياناته، وفي
    أي دولة يمكنه ذلك؟
  - عميل عايش في بلد غير البلد اللي شركتنا مسجلة فيه، يقدر يشتكي علينا عند جهة حماية البيانات في بلده؟
  - هل تقديم شكوى لدى سلطة الرقابة يمنع صاحب البيانات من اللجوء إلى القضاء أو أي وسيلة انتصاف أخرى ضدنا؟
- key: gdpr:art-77:para-2
  text: ee8a07122f3c9ef3
  en:
  - A user complained about our shop to the data protection authority. Does the authority have to keep
    them updated on how it's going?
  - After a regulator handles a privacy complaint, must it tell the person the result and that they can
    go to court?
  - What does a complainant get to know from the regulator about their privacy complaint, and can they
    challenge the decision in court?
  ar:
  - قدّم مستخدم شكوى ضد منصتنا لدى هيئة حماية البيانات، هل تلتزم الهيئة بإبلاغه بتطورات الشكوى ونتيجتها؟
  - هل على سلطة الرقابة أن تعلم مقدم الشكوى بإمكانية اللجوء إلى القضاء بعد البت في شكواه؟
  - واحد قدم شكوى على تطبيقنا عند الجهة المختصة بالخصوصية، لازم تخبره وين وصلت الشكوى وشو النتيجة؟
- key: gdpr:art-78:para-1
  text: 3da8685222b8d91a
  en:
  - The data protection regulator issued a binding decision against our company. Can we take it to court?
  - Can a person challenge in court a final decision a privacy authority made about them, even if they
    could also use other appeals?
  - We got fined by the data protection agency for how our app handles user data. Do we have any right
    to contest that before a judge?
  ar:
  - هل يحق للشركة الطعن أمام القضاء في قرار ملزم صادر عن هيئة حماية البيانات بحقها؟
  - جاني قرار نهائي من هيئة حماية البيانات وما أبغى أقبله، أقدر أرفع قضية في المحكمة؟
  - هل يمكن للفرد اللجوء إلى المحكمة ضد قرار سلطة الرقابة حتى لو كانت هناك طرق إدارية أخرى للتظلم؟
- key: gdpr:art-78:para-2
  text: 037a2f4e7622ca4a
  en:
  - I filed a complaint with the data protection authority about an online shop and heard nothing back
    for months. Can I go to court?
  - How long can the regulator take to update me on my privacy complaint before I'm allowed to sue them?
  - The authority never dealt with my complaint about my bank leaking my data. What can I do legally?
  ar:
  - قدمت شكوى لهيئة حماية البيانات ولم يصلني أي رد منذ أكثر من ثلاثة أشهر، هل أستطيع اللجوء للقضاء؟
  - قدمت شكوى على التطبيق وما حد رد علي من الجهة المسؤولة، شو أسوي؟ أقدر أشتكي عليهم في المحكمة؟
  - ما الحق المتاح لصاحب البيانات إذا تجاهلت سلطة الرقابة شكواه ولم تبلغه بمستجداتها؟
- key: gdpr:art-78:para-3
  text: a84c40c2bfb73281
  en:
  - Which country's court do I sue in if I want to challenge a data protection regulator's decision?
  - Our company is in Germany but the regulator that ruled against us is in Ireland. Where do we file
    the case?
  - Do I have to go to the regulator's home country courts to appeal its decision on my privacy complaint?
  ar:
  - في أي محكمة يجب رفع الدعوى ضد هيئة حماية البيانات؟
  - شركتنا في فرنسا والجهة الرقابية اللي أصدرت القرار في أيرلندا، وين نقدم القضية؟
  - هل ترفع الدعوى على سلطة الرقابة أمام محاكم الدولة التي تتبعها هذه السلطة؟
- key: gdpr:art-78:para-4
  text: e618544fd347dc2d
  en:
  - A court case challenges a regulator decision that followed an EU-wide board opinion. Does the regulator
    have to give the court that opinion?
  - If the privacy authority's decision was based on a European Data Protection Board ruling, who gives
    that ruling to the judge?
  - We're appealing a cross-border privacy decision in court. Will the EDPB's earlier opinion be part
    of the case file?
  ar:
  - هل يجب على سلطة الرقابة أن تحيل إلى المحكمة رأي المجلس الأوروبي الذي سبق قرارها عند الطعن فيه؟
  - نطعن في قرار هيئة الخصوصية وكان قبله رأي من مجلس حماية البيانات الأوروبي، مين يرسله للمحكمة؟
  - لو القرار مبني على رأي من المجلس الأوروبي، هل الجهة ترسل هالرأي للقاضي تلقائياً؟
- key: gdpr:art-79:para-1
  text: b3e9f135c98fb4eb
  en:
  - A user says our app mishandled their data and wants to sue us. Can they go to court even if they already
    complained to the data protection regulator?
  - Do people have to wait for a regulator's decision before taking a company to court over a privacy
    violation?
  - What right does a customer have to get a court remedy if they think our online shop processed their
    personal data unlawfully?
  ar:
  - هل يحق للمستخدم رفع دعوى قضائية ضد شركتنا إذا رأى أن بياناته الشخصية عولجت بشكل مخالف للائحة، حتى
    لو قدّم شكوى لهيئة الرقابة؟
  - هل يجب على الشخص انتظار قرار الجهة الرقابية قبل أن يلجأ إلى المحكمة بسبب انتهاك خصوصيته؟
  - واحد من عملاء التطبيق يقول إننا خالفنا حقوقه في بياناته وبده يرفع علينا قضية، هل يقدر يروح للمحكمة
    مباشرة ولا لازم يشتكي أول؟
- key: gdpr:art-79:para-2
  text: 7561b9bf8ebab03f
  en:
  - Which country's courts can a user sue us in if our company is based in one EU country and the user
    lives in another?
  - Can a customer file a data protection lawsuit in their own home country instead of where our company
    is established?
  - Does a user have the option to sue a government agency in their home country's courts over how it
    handled their data?
  ar:
  - في أي دولة يمكن رفع دعوى ضد شركتنا بخصوص البيانات الشخصية إذا كان مقرنا في دولة أوروبية والمستخدم
    يقيم في دولة أخرى؟
  - هل يستطيع المستخدم رفع الدعوى أمام محاكم بلد إقامته المعتادة بدل بلد المقر الذي تأسست فيه الشركة المسؤولة
    عن البيانات؟
  - وين ممكن العميل يرفع علينا قضية بخصوص بياناته، في بلدنا ولا في بلده؟ وهل الجهات الحكومية لها وضع مختلف؟
- key: gdpr:art-80:para-1
  text: 7b927b7eb213af26
  en:
  - Can a user ask a privacy advocacy nonprofit to file a complaint against our app for them instead of
    doing it themselves?
  - A consumer group says it is acting for one of our customers over a data misuse issue. Are we required
    to deal with an organisation like that, and what kind of group qualifies?
  - Can an NGO represent someone in going to court or claiming damages over how our platform handled their
    data?
  ar:
  - هل يحق للمستخدم أن يوكّل جمعية غير ربحية تعنى بحماية البيانات لتقديم شكوى ضد تطبيقنا نيابة عنه؟
  - ما هي الشروط التي يجب أن تتوفر في المنظمة أو الجمعية حتى يجوز لها تمثيل صاحب البيانات أمام الجهة الرقابية
    والمحاكم والمطالبة بالتعويض؟
  - واحد من عملائنا وكّل جمعية تدافع عن الخصوصية تشتكي علينا، هل هذا مسموح وتقدر تطالب بتعويض عنه كمان؟
- key: gdpr:art-80:para-2
  text: 76c1d8553bf1bd20
  en:
  - Can a privacy NGO file a complaint against our company with the data protection authority even if
    no affected user asked it to?
  - Our country might let advocacy groups sue on their own when they think users' privacy rights were
    violated. Does the law allow that without a user's authorisation?
  - A digital rights association reported our app to the regulator without any customer's consent. Is
    that possible?
  ar:
  - هل يجوز لمنظمة معنية بحماية الخصوصية أن تقدم شكوى ضد شركتنا لدى هيئة حماية البيانات دون تفويض من أي
    مستخدم متضرر؟
  - هل يمكن للدول الأعضاء أن تسمح للجمعيات برفع دعاوى أمام المحاكم ضد جهة المعالجة بصفة مستقلة عن أصحاب
    البيانات؟
  - فيه جمعية قدمت بلاغ على تطبيقنا عند الجهة المختصة وما حد من المستخدمين وكّلها، هل هذا قانوني؟
- key: gdpr:art-81:para-1
  text: f14deb056585e560
  en:
  - We're being sued in a German court over how our app handles user data, and I think the same complaint
    is also in a French court. What is the first court supposed to do about that?
  - Does a judge have to check with a court in another EU country if there's a parallel case about the
    same data processing by our company?
  - Our SaaS company faces similar data lawsuits in two EU countries. Is one court expected to reach out
    to the other to confirm the case exists?
  ar:
  - تم رفع دعوى ضدنا في محكمة بدولة أوروبية بسبب معالجة بيانات مستخدمي تطبيقنا، وعندنا معلومات عن دعوى
    مماثلة في دولة أخرى، فهل يجب على المحكمة التواصل مع المحكمة الأخرى للتأكد؟
  - هل يلزم القاضي بالاتصال بمحكمة في دولة عضو أخرى للتحقق من وجود قضية موازية بخصوص نفس معالجة البيانات
    من نفس الشركة؟
  - المحكمة عندها خبر إن فيه قضية ثانية على شركتنا بنفس موضوع البيانات في دولة ثانية، لازم تكلم المحكمة
    هناك وتتأكد ولا لا؟
- key: gdpr:art-81:para-2
  text: 734855b02faea819
  en:
  - Users sued our online shop in two EU countries over the same data processing. Can the later court
    pause its case while the first one goes on?
  - Can a judge freeze a data-privacy lawsuit against our company because an identical case is already
    pending in another member state?
  - We're worried about fighting duplicate lawsuits over the same customer data in different EU countries.
    Is there a way for one case to be put on hold?
  ar:
  - رُفعت علينا دعويان في دولتين أوروبيتين بسبب نفس معالجة بيانات العملاء، فهل يجوز للمحكمة التي رُفعت
    أمامها الدعوى لاحقاً أن توقف النظر فيها؟
  - هل يمكن لمحكمة أن تعلّق نظر دعوى حماية بيانات ضد الشركة لأن دعوى بنفس الموضوع قائمة أمام محكمة في
    دولة عضو أخرى؟
  - عندنا قضيتين على نفس الشركة بخصوص البيانات في بلدين مختلفين، ممكن المحكمة الثانية توقف قضيتها وتنتظر
    الأولى؟
- key: gdpr:art-81:para-3
  text: 4460e278ddd5005d
  en:
  - Our clinic app is being sued twice over the same data processing in the EU. Can we ask the second
    court to drop its case so everything is handled in one place?
  - When can a court decline to hear a data protection case because the first court can combine the actions
    under its own law?
  - If duplicate first-instance lawsuits about our data handling are in two countries, can one party ask
    a court to step aside in favor of the earlier court?
  ar:
  - تم رفع دعوى ثانية على عيادتنا بنفس موضوع معالجة البيانات في دولة أخرى، هل يمكننا أن نطلب من المحكمة
    الثانية التخلي عن النظر فيها لتُجمع القضايا في مكان واحد؟
  - متى يجوز لمحكمة أن تتنحى عن الاختصاص في قضية بيانات لأن المحكمة التي رُفعت أمامها الدعوى أولاً تستطيع
    ضم الدعاوى؟
  - أنا طرف في قضيتين على نفس موضوع البيانات، ينفع أطلب من المحكمة الأحدث ترفض تنظر فيها وتنضم للمحكمة
    الأولى؟
- key: gdpr:art-82:para-1
  text: 3ef6029edec612e7
  en:
  - Can a user sue our app for money if a data leak caused them stress or lost money?
  - Do people have a right to be paid back when our company mishandles their personal data and they suffer
    harm?
  - A customer says our data breach left them anxious but they lost no money. Can they still claim compensation?
  ar:
  - هل يحق للمستخدم المطالبة بتعويض إذا تسبب تسريب بياناته في ضرر مادي أو معنوي له؟
  - وش الحق اللي عند الشخص لو تطبيقنا سرّب بياناته وتضرر نفسياً؟ يقدر يطلب فلوس؟
  - عميل في متجرنا الإلكتروني تضرر من مخالفة في معالجة بياناته، هل يستحق تعويضاً من الشركة أو من مزود
    الخدمة؟
- key: gdpr:art-82:para-2
  text: e75e0431fd47a1ec
  en:
  - If we use a third-party vendor to process user data and something goes wrong, are we liable as the
    owner of the app?
  - When is a cloud or SaaS provider that handles our customers' data held responsible for damage?
  - Our contractor processed user data in a way we never told them to. Is it on them or on us?
  ar:
  - هل تتحمل الشركة المسؤولية عن الضرر إذا كانت معالجة البيانات مخالفة للائحة؟
  - متى يكون مزود الخدمة اللي يعالج بيانات عملائنا مسؤول عن الضرر؟
  - المبرمج الخارجي استخدم بيانات المستخدمين بطريقة غير اللي طلبناها، مين يتحمل المسؤولية أنا ولا هو؟
- key: gdpr:art-82:para-3
  text: 66cd73b457406a12
  en:
  - How can our company avoid paying compensation after a data incident if it wasn't our fault?
  - Can we get out of liability for a user's damage by proving we had nothing to do with what caused it?
  - What do we need to show to escape responsibility when a customer claims harm from a breach involving
    our system?
  ar:
  - كيف نتهرب من دفع التعويض إذا حصل تسريب وما كان لنا أي دور فيه؟
  - هل تُعفى الشركة من المسؤولية إذا أثبتت أنها غير مسؤولة إطلاقاً عن الحادثة التي سببت الضرر؟
  - ليش ما أدفع تعويض لو أثبتت إن الحادث مو بسببي؟ وش لازم أثبت؟
- key: gdpr:art-82:para-4
  text: 20b27cea4b4c0656
  en:
  - Our app and our analytics vendor both handled the data that leaked. Can the user demand the full amount
    from just one of us?
  - If several companies share responsibility for a breach, does each one owe the whole compensation to
    the affected person?
  - A user sued only our payment processor for a shared-processing leak. Can they be made to pay everything?
  ar:
  - إذا اشترك أكثر من طرف في معالجة البيانات وحصل ضرر، هل يمكن مطالبة أي منهم بكامل التعويض؟
  - تطبيقنا ومزود التحليلات كلاهما عالج البيانات اللي تسربت، هل المستخدم يقدر يطلب التعويض كله من واحد
    بس؟
  - لو كذا شركة مشتركة في نفس المعالجة وصار ضرر، كل وحدة تدفع كل المبلغ ولا بس حصتها؟
- key: gdpr:art-82:para-5
  text: 234fe88d2fa0dd8e
  en:
  - We paid the whole compensation to a user for a breach partly caused by our vendor. Can we get money
    back from them?
  - How do we recover our share from a partner company after paying a data-breach claim in full?
  - Can a company that paid out the entire damages claim reimburse itself from other parties in the same
    processing?
  ar:
  - دفعنا التعويض كاملاً للمستخدم والمورّد كان سبباً جزئياً في التسريب، هل نقدر نرجع عليه بجزء من المبلغ؟
  - هل يحق لمن دفع كامل التعويض أن يطالب الأطراف الأخرى بحصتهم من المسؤولية؟
  - دفعت التعويض لحالي عن خرق شاركني فيه طرف ثاني، كيف أسترجع نصيبه؟
- key: gdpr:art-82:para-6
  text: 45fa300cf4861329
  en:
  - Which court can a user go to if they want to claim compensation for misuse of their data?
  - Where can a customer file a lawsuit against our company over a privacy violation?
  - In what country's courts would a compensation case about personal data be heard?
  ar:
  - أي محكمة يرفع فيها المتضرر دعوى التعويض عن مخالفة بياناته الشخصية؟
  - وين يقدر العميل يرفع قضية علينا بسبب انتهاك الخصوصية؟
  - ما هي المحاكم المختصة بنظر دعوى التعويض عن ضرر معالجة البيانات في دولة عضو؟
- key: gdpr:art-83:para-1
  text: ea52bc0cfe8bacd8
  en:
  - Does a privacy fine have to match the size of the violation and the company, or can it be a flat amount?
  - We're a small app company worried a fine could be set so high it wipes us out; is there a rule that
    fines must be proportionate?
  ar:
  - ما المعايير العامة التي تلتزم بها السلطة الرقابية عند فرض غرامة على شركة برمجيات بسبب مخالفة حماية
    البيانات؟
  - هل يجب أن تكون الغرامة متناسبة مع حجم المخالفة وأن تكون رادعة في كل حالة على حدة؟
  - الجهة الرقابية بتفرض غرامات على تطبيقنا، هل لازم تكون الغرامة معقولة ومناسبة لحجم المخالفة ولا ممكن
    تكون أي رقم؟
- key: gdpr:art-83:para-2
  text: f999edf12f948319
  en:
  - If our online shop leaks customer data, can the regulator just give a warning or order a fix instead
    of fining us, or can it do both?
  - What does a data protection authority look at when deciding whether to fine us and how much?
  - Can a fine be added on top of other orders like a ban on processing, or does it replace them?
  ar:
  - هل تستطيع السلطة الرقابية فرض غرامة إضافة إلى الإجراءات التصحيحية الأخرى أو بدلاً منها عند تسرب بيانات
    عملاء متجرنا؟
  - ما العوامل التي تؤخذ في الاعتبار عند تقرير فرض غرامة على شركة وتحديد مبلغها في كل حالة؟
  - لو صار عندنا خرق بيانات، هل ممكن ياخذوا منا غرامة وكمان يطلبوا نصلّح الوضع، ولا واحد منهم بس؟
- key: gdpr:art-83:para-2:pt-a
  text: dac87ec8c13e7694
  en:
  - Does it make a difference to the fine if our data breach hit 50 users versus 5 million users?
  - Will a long-running privacy violation in our app be punished more heavily than a short one?
  - How does the regulator weigh how serious our violation was, considering what the data was used for
    and how much harm users suffered?
  ar:
  - هل يفرق في مبلغ الغرامة أن يكون الخرق أثّر على 50 مستخدماً أو على ملايين المستخدمين؟
  - هل المخالفة التي استمرت شهوراً في تطبيقنا تُعاقَب أشد من مخالفة قصيرة؟
  - كيف تقيّم السلطة جسامة المخالفة بحسب طبيعتها ومدتها وحجم الضرر الذي لحق بالمستخدمين؟
- key: gdpr:art-83:para-2:pt-b
  text: 482239e585d280c0
  en:
  - Is the fine lower if our developer made an honest mistake rather than us deliberately ignoring privacy
    rules?
  - Does it matter for the penalty whether we knew we were breaking the rules or were just careless?
  - We knowingly kept collecting data after users opted out; will that make the fine worse?
  ar:
  - هل تكون الغرامة أخف إذا كان الخرق نتيجة خطأ غير مقصود من المطور وليس تعمداً؟
  - هل يؤثر كون المخالفة متعمدة أو ناتجة عن إهمال على مبلغ الغرامة؟
  - استمرينا نجمع بيانات المستخدمين بعد ما رفضوا عن قصد، هل هذا يزيد العقوبة؟
- key: gdpr:art-83:para-2:pt-c
  text: 8b2d29d958d7e428
  en:
  - If we quickly compensate users and help them protect themselves after a breach, will that reduce our
    fine?
  - Does the regulator give credit for steps we take to limit harm to affected customers?
  - What can our support team do right after a data leak to look better when a fine is decided?
  ar:
  - إذا عوّضنا المستخدمين وساعدناهم بسرعة بعد التسرب، هل يخفف ذلك الغرامة؟
  - هل تأخذ السلطة بالاعتبار الإجراءات التي اتخذناها لتقليل الضرر على المتضررين؟
  - شو نسوي بعد تسريب بيانات عشان نقلل الضرر ويخف علينا الغرامة؟
- key: gdpr:art-83:para-2:pt-d
  text: 0586986507e877b3
  en:
  - Does having good security like encryption and access controls help us when a regulator decides how
    responsible we are?
  - If we built privacy by design into our product but still had a breach, does that lower the fine?
  - Will skipping basic security measures in our app make our fine bigger?
  ar:
  - هل وجود إجراءات أمنية جيدة مثل التشفير وضبط الصلاحيات يخفف مسؤوليتنا عند تحديد الغرامة؟
  - إذا طبقنا الخصوصية بالتصميم في منتجنا ومع ذلك حصل خرق، هل يقلل هذا الغرامة؟
  - لو أهملنا الإجراءات الأمنية الأساسية في التطبيق، هل ترتفع الغرامة علينا؟
- key: gdpr:art-83:para-2:pt-e
  text: 46f7082c22be8c45
  en:
  - We were already sanctioned for a privacy issue last year; will that make a new fine heavier?
  - Does a clean compliance record help us when a fine is being decided?
  - Do earlier violations by our company count against us if a regulator investigates again?
  ar:
  - سبق أن عوقبنا على مخالفة خصوصية العام الماضي، هل يزيد ذلك من غرامة مخالفة جديدة؟
  - هل يُحتسب سجل الامتثال النظيف لصالحنا عند تقرير الغرامة؟
  - هل تؤثر المخالفات السابقة لشركتنا على العقوبة إذا حققت السلطة معنا مرة أخرى؟
- key: gdpr:art-83:para-2:pt-f
  text: 799d3dac4fd0d99d
  en:
  - Will being cooperative and responsive to the data protection authority during an investigation lower
    our fine?
  - Does fixing the problem together with the regulator count in our favor?
  - Is it risky to stall or ignore the regulator's questions when we're under investigation?
  ar:
  - هل يخفف التعاون مع السلطة الرقابية أثناء التحقيق من قيمة الغرامة؟
  - هل يُحسب لصالحنا أن نعالج المخالفة بالتنسيق مع الجهة الرقابية؟
  - هل التأخر في الرد على أسئلة الجهة الرقابية أثناء التحقيق يضرنا؟
- key: gdpr:art-83:para-2:pt-g
  text: 502a4d6e2ec6689c
  en:
  - Is the fine higher if the leaked data was health records or payment details rather than just emails?
  - Does the type of data our app collects affect how harshly we'd be fined?
  - We process sensitive info like medical data at our clinic app; does that raise our fine risk?
  ar:
  - هل تكون الغرامة أكبر إذا كانت البيانات المسربة سجلات صحية أو بيانات دفع بدل البريد الإلكتروني فقط؟
  - هل نوع البيانات التي يجمعها تطبيقنا يؤثر على شدة الغرامة؟
  - تطبيق عيادتنا يعالج بيانات طبية حساسة، هل هذا يرفع خطر الغرامة؟
- key: gdpr:art-83:para-2:pt-h
  text: d48cc4beabb34f8f
  en:
  - If we report our own data breach to the regulator ourselves, will that reduce the fine compared to
    them finding out from a journalist?
  - Does it matter how the authority learned about our violation, like a user complaint versus our own
    notification?
  - Should we proactively tell the regulator about a privacy mistake to get a lighter penalty?
  ar:
  - إذا بلّغنا السلطة بالخرق بأنفسنا، هل يخفف ذلك الغرامة مقارنة بأن تعلم به من الإعلام؟
  - هل يفرق في العقوبة كيف عرفت السلطة بالمخالفة، عبر شكوى مستخدم أو عبر إبلاغنا؟
  - شو الأفضل نبلغ الجهة الرقابية عن غلطنا بنفسنا عشان تكون العقوبة أخف؟
- key: gdpr:art-83:para-2:pt-i
  text: a35953f5ae7a44e1
  en:
  - The regulator already ordered us to fix something and now there's a new issue on the same topic; does
    our compliance with that order matter for the fine?
  - If we followed all the earlier corrective orders from the authority, does that help us?
  - What happens to our fine if we ignored a previous order about the same data processing?
  ar:
  - سبق أن أمرتنا السلطة بتصحيح أمر ما ثم ظهرت مخالفة في الموضوع نفسه، هل يؤثر التزامنا بالأمر السابق
    على الغرامة؟
  - هل يفيدنا أننا نفذنا كل الأوامر التصحيحية السابقة من السلطة؟
  - ماذا يحدث لغرامتنا إذا تجاهلنا أمراً سابقاً يخص نفس معالجة البيانات؟
- key: gdpr:art-83:para-2:pt-j
  text: 5196d15b0b445cf7
  en:
  - Does following an approved code of conduct for our industry help reduce a privacy fine?
  - If our product has a privacy certification, will the regulator take that into account when fining
    us?
  - Is it worth getting certified for data protection to lower our fine exposure?
  ar:
  - هل الالتزام بمدونة سلوك معتمدة في قطاعنا يخفف الغرامة؟
  - إذا كان منتجنا حاصلاً على شهادة خصوصية معتمدة، هل تراعي السلطة ذلك عند فرض الغرامة؟
  - هل يستاهل نحصل على شهادة حماية بيانات عشان نقلل خطر الغرامات؟
- key: gdpr:art-83:para-2:pt-k
  text: a3bd5698905c22c4
  en:
  - If we made money from misusing user data, will the regulator count those profits when setting the
    fine?
  - Are there other things beyond the listed factors that can make a fine heavier or lighter?
  - Does saving costs by skipping compliance make our penalty worse?
  ar:
  - إذا ربحنا مالاً من إساءة استخدام بيانات المستخدمين، هل تُحتسب هذه الأرباح عند تحديد الغرامة؟
  - هل توجد عوامل أخرى غير المذكورة قد تشدد الغرامة أو تخففها؟
  - هل توفير التكاليف بتجاهل الامتثال يزيد من عقوبتنا؟
- key: gdpr:art-83:para-3
  text: b2d49f498b1faa51
  en:
  - Our one faulty feature broke several privacy rules at once; do we get fined separately for each?
  - Is there a cap when a single data processing activity violates multiple provisions?
  - If the same sign-up flow violates consent and transparency rules, is the total fine limited to the
    worst one?
  ar:
  - ميزة واحدة في تطبيقنا خالفت عدة قواعد خصوصية معاً، هل نُغرَّم عن كل مخالفة على حدة؟
  - هل يوجد سقف للغرامة عندما تنتهك عملية معالجة واحدة عدة أحكام؟
  - لو نفس خطوات التسجيل خالفت الموافقة والشفافية، هل المجموع محدود بأشد مخالفة؟
- key: gdpr:art-83:para-4
  text: 8b20d5802436aa9b
  en:
  - What's the maximum fine if we fail to do security measures or a data protection impact assessment?
  - What is the lower tier of privacy fines, 10 million euros or 2% of turnover?
  - If we don't notify a breach on time or don't keep processing records, how big can the fine be?
  ar:
  - ما أقصى غرامة إذا لم نطبق الإجراءات الأمنية أو لم نجرِ تقييم أثر حماية البيانات؟
  - 'ما هي الشريحة الأدنى من الغرامات: عشرة ملايين يورو أو 2% من الإيرادات؟'
  - كم ممكن تكون الغرامة لو تأخرنا في الإبلاغ عن خرق أو ما احتفظنا بسجلات المعالجة؟
- key: gdpr:art-83:para-4:pt-a
  text: a97a26b4ee730bd2
  en:
  - What's the fine ceiling if our company, as controller or processor, ignores privacy by design, security,
    breach notification or DPO duties?
  - Is the maximum penalty lower for not having a processor contract or not appointing a data protection
    officer?
  - Do fines for children's consent rules fall under the 10 million euro tier?
  ar:
  - ما سقف الغرامة إذا أخلّت شركتنا كمسؤول أو معالج بالخصوصية بالتصميم أو الأمن أو الإبلاغ عن الخرق أو
    مهام مسؤول حماية البيانات؟
  - هل الغرامة القصوى أقل عند عدم وجود عقد مع المعالج أو عدم تعيين مسؤول حماية بيانات؟
  - هل غرامات قواعد موافقة الأطفال ضمن شريحة العشرة ملايين يورو؟
- key: gdpr:art-83:para-4:pt-b
  text: ea435e942532f95e
  en:
  - We run a privacy certification body; what fine can we face if we don't meet our duties?
  - Can a certification company be fined for failing its obligations when issuing data protection certificates?
  - What is the maximum penalty for a certifier that breaks accreditation rules?
  ar:
  - نحن جهة منح شهادات حماية البيانات، ما الغرامة المحتملة إذا أخللنا بالتزاماتنا؟
  - هل يمكن تغريم جهة إصدار الشهادات إذا قصّرت في واجباتها؟
  - ما الحد الأقصى للغرامة على جهة اعتماد تخالف قواعد الاعتماد؟
- key: gdpr:art-83:para-4:pt-c
  text: e6c096d057f1486d
  en:
  - Our organization monitors a code of conduct; can we be fined if we fail our monitoring duties?
  - What's the fine for a code-of-conduct monitoring body that doesn't act on members' violations?
  - Are bodies that supervise industry privacy codes subject to the 10 million euro tier?
  ar:
  - جهتنا تراقب الالتزام بمدونة سلوك، هل يمكن تغريمنا إذا قصّرنا في مهام الرقابة؟
  - ما الغرامة على جهة مراقبة مدونة السلوك إذا لم تتحرك ضد مخالفات الأعضاء؟
  - هل الجهات التي تراقب مدونات الخصوصية تخضع لشريحة العشرة ملايين يورو؟
- key: gdpr:art-83:para-5
  text: e68bdc8dce4262ed
  en:
  - What's the maximum GDPR fine, 20 million euros or 4% of global turnover?
  - Which privacy violations get the highest tier of fines?
  - How is the fine calculated for a big company, is it the higher of a fixed amount or a share of worldwide
    revenue?
  ar:
  - 'ما أعلى غرامة ممكنة: عشرون مليون يورو أو 4% من الإيرادات العالمية؟'
  - أي مخالفات الخصوصية تُعاقَب بأعلى شريحة من الغرامات؟
  - كيف تُحسب الغرامة على شركة كبيرة، هل هي الأعلى بين مبلغ ثابت ونسبة من الإيرادات السنوية العالمية؟
- key: gdpr:art-83:para-5:pt-a
  text: 0a9bfff125fd3ca0
  en:
  - What fine can we get for processing data without a legal basis or collecting invalid consent?
  - Is using sensitive data like health info without permission in the top fine tier?
  - We tracked users with a pre-ticked consent box; how high could the fine go?
  ar:
  - ما الغرامة المحتملة لمعالجة البيانات دون أساس قانوني أو بموافقة غير صالحة؟
  - هل استخدام البيانات الحساسة كالصحية دون إذن ضمن أعلى شريحة غرامات؟
  - تتبعنا المستخدمين بخانة موافقة محددة مسبقاً، إلى كم قد تصل الغرامة؟
- key: gdpr:art-83:para-5:pt-b
  text: aa56d1adff89d340
  en:
  - What's the fine if we ignore a user's request to delete or export their data?
  - Can we be heavily fined for not answering access requests or not honoring opt-outs?
  - Is failing to give a transparent privacy notice punished at the highest level?
  ar:
  - ما الغرامة إذا تجاهلنا طلب مستخدم بحذف بياناته أو الحصول على نسخة منها؟
  - هل يمكن تغريمنا غرامة كبيرة لعدم الرد على طلبات الوصول أو احترام رفض التسويق؟
  - هل عدم تقديم إشعار خصوصية واضح يُعاقَب بأعلى مستوى؟
- key: gdpr:art-83:para-5:pt-c
  text: 26c63ccf7c661780
  en:
  - What fine applies if we send EU users' data to servers in the US without a valid transfer mechanism?
  - Is using a non-EU cloud provider without safeguards punishable at the top fine level?
  - How risky is it to transfer customer data to our offshore team without proper safeguards?
  ar:
  - ما الغرامة إذا أرسلنا بيانات مستخدمين أوروبيين إلى خوادم في أمريكا دون آلية نقل صحيحة؟
  - هل استخدام مزود سحابي خارج أوروبا دون ضمانات يستحق أعلى شريحة غرامة؟
  - ما خطورة تحويل بيانات العملاء لفريقنا في الخارج دون ضمانات مناسبة؟
- key: gdpr:art-83:para-5:pt-d
  text: b27c5060b07c8f5f
  en:
  - Can we be fined heavily for breaking national rules on employee data or freedom of expression that
    a country adopted under the regulation?
  - Do local-law obligations on things like employment data processing carry the high fine tier?
  - Is breaching a member state's specific data rules for HR systems fined at 20 million euros?
  ar:
  - هل يمكن تغريمنا بشدة إذا خالفنا قواعد وطنية بشأن بيانات الموظفين أو حرية التعبير سنّتها دولة بموجب
    اللائحة؟
  - هل التزامات القانون المحلي مثل معالجة بيانات التوظيف تخضع لشريحة الغرامة العليا؟
  - هل مخالفة قواعد دولة عضو الخاصة بأنظمة الموارد البشرية تُغرَّم بعشرين مليون يورو؟
- key: gdpr:art-83:para-5:pt-e
  text: 386b31b2be22e701
  en:
  - What happens if we keep processing after the regulator ordered us to stop?
  - Can we be fined if we refuse to give the authority access to our systems during an audit?
  - Is ignoring a regulator's data flow suspension order punished at the top level?
  ar:
  - ماذا يحدث إذا واصلنا المعالجة بعد أن أمرتنا السلطة بالتوقف؟
  - هل يمكن تغريمنا إذا رفضنا منح السلطة إمكانية الوصول إلى أنظمتنا أثناء التدقيق؟
  - هل تجاهل أمر السلطة بتعليق تدفق البيانات يُعاقَب بأعلى مستوى؟
- key: gdpr:art-83:para-6
  text: 74757b08e87d218e
  en:
  - What's the penalty if we don't comply with an order from the data protection authority?
  - If the regulator told us to fix our cookie banner and we didn't, how much could we be fined?
  - Is defying a corrective order treated as seriously as the biggest privacy violations?
  ar:
  - ما العقوبة إذا لم نمتثل لأمر صادر عن سلطة حماية البيانات؟
  - إذا أمرتنا السلطة بتعديل شريط الكوكيز ولم نفعل، كم قد تبلغ الغرامة؟
  - هل عدم تنفيذ أمر تصحيحي يُعامل بنفس خطورة أكبر مخالفات الخصوصية؟
- key: gdpr:art-83:para-7
  text: 047fdaf19a5c88ce
  en:
  - Can a government agency or public school be fined for privacy violations?
  - Who decides whether public bodies get fined, the EU or each country?
  - We build software for a municipality; are public authorities exempt from data protection fines?
  ar:
  - هل يمكن تغريم جهة حكومية أو مدرسة عامة بسبب مخالفات الخصوصية؟
  - من يقرر هل تُغرَّم الجهات العامة، الاتحاد الأوروبي أم كل دولة؟
  - نطوّر برمجيات لبلدية، هل السلطات العامة معفاة من غرامات حماية البيانات؟
- key: gdpr:art-83:para-8
  text: 42c257a7f02493a3
  en:
  - Do we have the right to appeal in court if a regulator fines us?
  - What procedural protections do companies have before a data protection fine is imposed?
  - Can we challenge a privacy fine and get a fair hearing?
  ar:
  - هل يحق لنا الطعن أمام القضاء إذا فرضت علينا السلطة غرامة؟
  - ما الضمانات الإجرائية التي تتمتع بها الشركات قبل فرض غرامة حماية البيانات؟
  - هل نقدر نعترض على غرامة الخصوصية ونحصل على محاكمة عادلة؟
- key: gdpr:art-83:para-9
  text: 8c4de88ff7261390
  en:
  - In a country where the regulator can't issue fines itself, who imposes the penalty?
  - Can courts impose data protection fines when the national legal system has no administrative fines?
  - Do fines still have to be effective and dissuasive if a court imposes them instead of the authority?
  ar:
  - في دولة لا تستطيع السلطة فيها فرض الغرامات بنفسها، من يفرض العقوبة؟
  - هل يمكن للمحاكم فرض غرامات حماية البيانات إذا لم يعرف النظام القانوني غرامات إدارية؟
  - هل يجب أن تبقى الغرامة فعالة ورادعة حتى لو فرضتها المحكمة بدل السلطة؟
- key: gdpr:art-84:para-1
  text: 2d9e28bd0aa1d34d
  en:
  - Besides the big administrative fines, can a country set other kinds of punishments for breaking data
    protection rules, like criminal penalties?
  - Our SaaS leaked customer data in a way that the regulator can't fine under the main fine rules. Could
    we still face some other sanction under national law?
  - What standard must the penalties that EU countries set themselves meet, and do they have to actually
    be enforced?
  ar:
  - هل يحق لكل دولة في الاتحاد الأوروبي أن تضع عقوبات أخرى غير الغرامات الإدارية على مخالفة قواعد حماية
    البيانات؟
  - تطبيقنا خالف قواعد الخصوصية بطريقة ما تنطبق عليها الغرامات الإدارية الكبيرة، فهل ممكن تنفرض علينا
    عقوبة ثانية بموجب القانون المحلي؟
  - شو لازم تكون صفات العقوبات اللي بتحطها الدول على مخالفات حماية البيانات، وهل لازم تنفذها فعلاً؟
- key: gdpr:art-84:para-2
  text: 7abb9c51fb8a3ba2
  en:
  - Do EU countries have to tell the European Commission about their own national penalty rules for privacy
    violations?
  - We run an online shop in several EU countries and want to know whether local penalty laws can change.
    Do governments have to report changes to Brussels?
  - What was the deadline for member states to report their national data protection penalty provisions,
    and what about later amendments?
  ar:
  - هل يجب على الدول الأعضاء إبلاغ المفوضية الأوروبية بقوانينها الوطنية الخاصة بعقوبات مخالفة حماية البيانات؟
  - ما هو الموعد النهائي الذي كان على الدول لإخطار المفوضية بأحكام العقوبات، وهل يلزم إخطارها بأي تعديل
    لاحق؟
  - يعني لو دولة عدلت قانون العقوبات عندها على الخصوصية، لازم تخبر الاتحاد الأوروبي فوراً ولا لا؟
- key: gdpr:art-85:para-1
  text: 0e61eafdebe9f681
  en:
  - We run a news app and publish stories that name private people. Does privacy law still apply to us,
    or is there a balance with press freedom?
  - Who decides how data protection gets balanced against free speech, the EU or each country's own law?
  - Does my blog or poetry-sharing platform get any special treatment under privacy rules because it's
    creative or academic writing?
  ar:
  - هل يوجد توازن بين حماية البيانات الشخصية وحرية التعبير للتطبيقات الصحفية، ومن يحدده؟
  - نحن منصة نشر أبحاث أكاديمية وفيها أسماء أشخاص، هل قانون الخصوصية يطبق علينا بنفس الشكل؟
- key: gdpr:art-85:para-2
  text: 992cf7b9161e4abf
  en:
  - Are journalism apps exempt from things like user consent, access requests and deletion requests under
    GDPR?
  - We publish a literary magazine online and someone asked us to erase their name from an article. Do
    we have to follow the usual data subject rules?
  - Can a news site skip rules on sending data abroad or appointing processors if it's for journalism,
    and when are such exemptions allowed?
  ar:
  - هل يجوز إعفاء الموقع الصحفي من حقوق أصحاب البيانات مثل الحذف والاطلاع إذا كان ذلك ضروريا لحرية التعبير؟
  - أي أجزاء من اللائحة يمكن للدول استثناء الأعمال الصحفية أو الفنية أو الأدبية منها؟
  - واحد طلب نحذف اسمه من مقالة عندنا في المدونة، لازم ننفذ طلبه ولا في استثناء للكتابة الصحفية؟
- key: gdpr:art-85:para-3
  text: dc5ddb651a477081
  en:
  - Do countries have to tell the European Commission about their press-freedom exemptions to privacy
    rules?
  - If a country changes its media exemption law, does it have to report that update to the EU?
  ar:
  - هل يجب على الدول إبلاغ المفوضية الأوروبية بقوانينها التي تستثني الصحافة من بعض أحكام حماية البيانات؟
  - إذا عدلت دولة قانون الاستثناءات الإعلامية، هل تلتزم بإخطار الاتحاد الأوروبي فورا؟
  - وين ألاقي الاستثناءات اللي أقرتها بلدي للصحافة والتعبير الفني؟ هل الدول لازم تبلغ بروكسل فيها؟
- key: gdpr:art-86
  text: 4c00f246619cda69
  en:
  - We build a portal for a city council that publishes meeting minutes and permits with citizens' names
    in them. Are we allowed to release that personal data when someone requests public records?
  - How do freedom-of-information or public records rules fit together with privacy law when a government
    document contains people's personal details?
  - Our company runs a public service under contract and a journalist asked for documents that mention
    individuals. Can we hand over those personal details, and which rules decide that?
  ar:
  - نحن نطوّر منصة لبلدية تنشر محاضر الاجتماعات والتراخيص وفيها أسماء مواطنين، فهل يجوز الإفصاح عن هذه
    البيانات الشخصية عند طلب الاطلاع على الوثائق الرسمية؟
  - كيف يتم التوفيق بين حق الجمهور في الاطلاع على الوثائق الرسمية وحق الأفراد في حماية بياناتهم الشخصية
    الواردة فيها؟
  - شركتنا تدير خدمة عامة بتكليف من الدولة وجاءنا طلب من صحفي لمستندات فيها بيانات أفراد، هل نقدر نعطيه
    ياها ولا لا؟ وأي قانون نرجع له؟
- key: gdpr:art-87
  text: 1448a06a112407d0
  en:
  - Can each EU country set its own extra rules for using national ID numbers like a social security or
    citizen number in my app's user records?
  - We want to use customers' national ID numbers as the login or unique identifier in our online shop.
    What safeguards do we need to have in place?
  - Why do the rules on collecting a national ID number differ between France and Germany for my clinic
    booking software?
  ar:
  - هل يحق لكل دولة في الاتحاد الأوروبي أن تضع شروطاً خاصة لاستخدام رقم الهوية الوطنية أو أي معرّف عام
    في تطبيقي؟
  - ما الضمانات الواجب توفيرها لحماية حقوق الأشخاص إذا استخدمت رقم الهوية الوطنية كمعرّف للمستخدمين في
    نظامنا؟
  - يا جماعة تطبيقنا يطلب رقم الهوية من العملاء، هل قوانين كل بلد أوروبي ممكن تختلف عن بعض في هالموضوع
    وشو لازم نعمله؟
- key: gdpr:art-88:para-1
  text: 1bc1709222b8ae70
  en:
  - Can a country have its own stricter rules on how my HR software handles employee data, like for hiring
    or firing?
  - We're building a payroll and staff management app for companies in several EU countries. Might local
    labor laws or union agreements add extra rules on processing employee data?
  - Are national laws or collective agreements allowed to set specific rules for monitoring staff, workplace
    safety records or diversity data?
  ar:
  - هل يحق لكل دولة أن تضع قواعد خاصة بها لمعالجة بيانات الموظفين في نظام الموارد البشرية، مثل التوظيف
    وإنهاء العقد؟
  - نطوّر تطبيقاً لإدارة الرواتب وشؤون الموظفين لشركات في عدة دول أوروبية، فهل يمكن لقوانين العمل المحلية
    أو الاتفاقيات الجماعية أن تضيف قواعد على بيانات العاملين؟
  - وين ألاقي قواعد أخص للموظفين؟ يعني القانون المحلي أو اتفاقية النقابة ممكن يحط شروط زيادة على بيانات
    الموظفين ولا لأ؟
- key: gdpr:art-88:para-2
  text: 93a5a22ad2cdb0e5
  en:
  - What protections must national employee data rules include when a company uses staff monitoring software
    like screen tracking or CCTV?
  - Our company shares employee records between subsidiaries in different countries. Do local rules have
    to include safeguards for that?
  - Do national workplace data rules have to require transparency toward employees and protect their dignity?
  ar:
  - ما الضمانات التي يجب أن تتضمنها القواعد الوطنية عند استخدام برامج مراقبة الموظفين مثل تتبع الشاشة
    أو الكاميرات؟
  - شركتنا تنقل بيانات الموظفين بين الشركات التابعة في دول مختلفة، فهل يجب أن تتضمن القواعد المحلية ضمانات
    لذلك؟
  - لو عندنا نظام مراقبة للموظفين، شو لازم تحمي القواعد الخاصة؟ مثلاً الشفافية وكرامة الموظف؟
- key: gdpr:art-88:para-3
  text: d3d1562607e79d51
  en:
  - Do EU countries have to tell the European Commission about their employee data privacy laws?
  - Is there a deadline for countries to report their workplace data rules to the Commission, and what
    about later changes?
  ar:
  - هل يجب على الدول الأوروبية إبلاغ المفوضية الأوروبية بقوانينها الخاصة بخصوصية بيانات الموظفين؟
  - هل هناك موعد نهائي لإخطار المفوضية بالقواعد الوطنية لبيانات العمل، وماذا عن التعديلات اللاحقة؟
- key: gdpr:art-89:para-1
  text: 9b7e1f95c75c616f
  en:
  - We're collecting user data for a university research study through our app. What protections do we
    need to put in place for participants?
  - Can we use pseudonymised data instead of real identities for our analytics and research, and when
    are we required to do so?
  - If our statistics project works just as well with anonymous data, are we allowed to keep the identifiable
    data anyway?
  ar:
  - ما هي الضمانات التقنية والتنظيمية المطلوبة عند معالجة بيانات المستخدمين لأغراض البحث العلمي أو الإحصاء؟
  - هل يجب علينا استخدام الأسماء المستعارة (التجزئة الوهمية) للبيانات في أبحاثنا إذا كان ذلك يحقق الغرض؟
  - احنا عاملين دراسة إحصائية على بيانات عملاء التطبيق، لازم نشيل هويات الناس لو نقدر نوصل لنفس النتيجة
    بدونها؟
- key: gdpr:art-89:para-2
  text: 4509dce7a5654b61
  en:
  - Can national law let researchers skip things like access, correction, restriction or objection requests
    for a scientific study?
  - We run statistics on customer data and someone objects to processing. Are there exceptions to honoring
    that for statistical work?
  ar:
  - هل يجوز استثناء الباحثين من حقوق الوصول والتصحيح والتقييد والاعتراض عندما تعطل هذه الحقوق الدراسة
    العلمية؟
  - واحد من المشاركين في دراستنا طلب يشوف بياناته أو يعدلها، بس هذا بيخرب نتايج البحث، نقدر نرفض؟
  - متى يسمح القانون الوطني بتقييد حقوق أصحاب البيانات في البحث التاريخي أو الإحصائي؟
- key: gdpr:art-89:para-3
  text: b8382319b910d27d
  en:
  - We're a public archive digitising records. Can we limit data subject rights like portability or notification
    of erasure?
  - Which user rights can be waived for archiving in the public interest that can't be for ordinary research?
  - Someone asked our historical archive to restrict or port their data. Do we have to comply, or can
    the law exempt us?
  ar:
  - نحن أرشيف عام ونرقمن سجلات قديمة، هل يمكن استثناؤنا من حقوق مثل نقل البيانات والإخطار بالمحو؟
  - ما هي الحقوق التي يمكن تقييدها لأغراض الأرشفة للمصلحة العامة ولا تُقيَّد في البحث العادي؟
  - واحد طلب من الأرشيف عندنا ينقل بياناته أو يوقف معالجتها، لازم نلبي ولا في استثناء؟
- key: gdpr:art-89:para-4
  text: 83f644a38b58d598
  en:
  - Our data is used for both research and for marketing. Do the research exemptions from user rights
    cover the marketing use too?
  - If we process data partly for a scientific study and partly for another business purpose, which part
    gets the exemption?
  - Can we refuse a deletion or access request across all our uses just because one use is research?
  ar:
  - نستخدم نفس البيانات للبحث وللتسويق، هل استثناءات البحث من حقوق الأفراد تشمل الاستخدام التسويقي؟
  - إذا كانت المعالجة لغرض بحثي وغرض تجاري آخر في الوقت نفسه، على أي جزء تنطبق الاستثناءات؟
  - عندنا بيانات نستخدمها للبحث وكمان لأغراض ثانية، هل أقدر أرفض طلبات المستخدمين على كل الاستخدامات بحجة
    البحث؟
- key: gdpr:art-90:para-1
  text: 999ad92d4c14eabf
  en:
  - We run a law-firm client portal and our lawyers are bound by professional confidentiality. Can a country
    give the data protection regulator special rules for inspecting our systems?
  - Can national law limit what the privacy regulator can demand or access from companies that hold secrets
    like doctors or lawyers do, and does that only cover data obtained through that confidential work?
  - Our healthcare app handles patient info covered by medical secrecy. Could the regulator's investigation
    powers be adjusted for us so confidentiality and data protection both fit?
  ar:
  - هل يحق لدولة عضو أن تضع قواعد خاصة تحدد صلاحيات هيئة حماية البيانات تجاه جهات ملزمة بالسر المهني مثل
    المحامين والأطباء؟
  - تطبيقنا يتعامل مع بيانات مرضى خاضعة للسر الطبي، هل يمكن تقييد وصول الجهة الرقابية إلى هذه البيانات
    بقواعد وطنية، وهل تقتصر القواعد على البيانات التي حصلنا عليها من عملنا السري؟
  - يعني لو شغلي فيه سرية مهنية، مثلاً مكتب محاماة عندي تطبيق، الجهة الرقابية بتقدر تفتش وتطلب بياناتي
    عادي ولا في قواعد خاصة؟
- key: gdpr:art-90:para-2
  text: 9f7c9accab1b7de9
  en:
  - Do countries have to tell the European Commission about their special confidentiality rules for regulator
    powers, and by when?
  - If a country changes its rules on how the data protection authority deals with professional secrecy,
    must it report that update?
  - We're checking where to find a country's professional-secrecy exceptions for data regulators. Are
    those rules officially reported to the EU?
  ar:
  - هل يجب على كل دولة عضو إبلاغ المفوضية الأوروبية بالقواعد الخاصة التي وضعتها بشأن السر المهني وصلاحيات
    هيئة الحماية، ومتى؟
  - إذا عدّلت دولة عضو قواعدها المتعلقة بالسر المهني وصلاحيات الجهة الرقابية، فهل عليها إخطار المفوضية
    بالتعديل فوراً؟
  - هل الدول لازم تبلّغ الاتحاد الأوروبي بالاستثناءات اللي حاطتها للسرية المهنية قدام جهة حماية البيانات؟
- key: gdpr:art-91:para-1
  text: 980ac8e7a8414426
  en:
  - We build an app for a church network that already had its own internal privacy rulebook before the
    EU rules came in. Can they keep using it?
  - Can a religious community keep applying its own data protection rules instead of the standard ones,
    and what do those rules need to meet?
  - Our parish member database follows old church privacy regulations from before 2018. Do we have to
    throw them out or just update them?
  ar:
  - نطور تطبيقاً لشبكة كنائس لديها لائحة خصوصية داخلية قديمة قبل صدور اللائحة الأوروبية، هل يجوز لها الاستمرار
    في تطبيقها؟
  - هل يحق لجمعية دينية أن تبقي قواعدها الخاصة بحماية البيانات الشخصية بشرط مواءمتها مع اللائحة الأوروبية؟
  - عندنا جمعية دينية بتستخدم قواعد خصوصية خاصة فيها من قبل، لازم نلغيها ولا نعدلها بس عشان تتوافق مع
    القانون الأوروبي؟
- key: gdpr:art-91:para-2
  text: 711edfb13c196394
  en:
  - Who oversees a church or religious group that uses its own data protection rules, and can it be a
    dedicated regulator?
  - Our mosque's donor management software runs under the community's own privacy code. Do they still
    answer to an independent data protection authority?
  - Can a religious organisation have its own special data protection supervisor instead of the national
    one, and what conditions must it meet?
  ar:
  - من يشرف على كنيسة أو جهة دينية تطبق قواعدها الخاصة لحماية البيانات، وهل يمكن أن تكون جهة رقابية مخصصة
    لها؟
  - هل تخضع الجمعية الدينية التي لديها لائحة خصوصية خاصة بها لرقابة سلطة مستقلة، وما الشروط المطلوبة في
    هذه السلطة؟
  - الكنيسة اللي نشتغل معاها عندها قواعد خصوصية خاصة، مين يراقبها؟ ممكن يكون عندها جهة رقابة خاصة فيها
    ولا لازم الجهة الوطنية؟
- key: gdpr:art-92:para-1
  text: 7885e20190b2c778
  en:
  - We rely on a rule the Commission issued as a secondary act; where do the limits on that power come
    from?
  - Can the Commission just add detailed privacy requirements for our app on its own authority?
  ar:
  - هل تقدر المفوضية الأوروبية تضيف متطلبات خصوصية جديدة من نفسها؟ وكيف تتحدد حدود هالصلاحية؟
- key: gdpr:art-92:para-2
  text: 699c94cf2ad3ac25
  en:
  - How long does the Commission's power to issue extra rules on privacy icons and certification last?
  - Is there an expiry date on the Commission's authority to set standard icons for privacy notices in
    our app?
  - Since when has the Commission had this delegated power for certification mechanisms and standardized
    icons?
  ar:
  - كم مدة تفويض المفوضية الأوروبية بإصدار قواعد الرموز الموحدة وآليات الاعتماد، وهل لها تاريخ انتهاء؟
  - منذ أي تاريخ أُعطيت المفوضية صلاحية إصدار أعمال مفوضة بخصوص الشهادات والرموز؟
  - هل هالصلاحية للمفوضية مفتوحة بدون مدة محددة ولا لها نهاية؟
- key: gdpr:art-92:para-3
  text: 1fa15649c8fd12eb
  en:
  - Can the European Parliament or Council take away the Commission's power to make delegated rules on
    privacy icons or certification?
  - If the delegation is revoked, do the rules already adopted for our product stop applying?
  - When does a decision to revoke the Commission's delegated power take effect?
  ar:
  - هل يحق للبرلمان الأوروبي أو المجلس سحب التفويض الممنوح للمفوضية لإصدار أعمال مفوضة؟
  - إذا أُلغي التفويض، هل تبقى الأعمال المفوضة التي صدرت سابقاً سارية على منتجنا؟
  - وقتاش يصير قرار سحب التفويض ساري المفعول؟ يعني بعد النشر بيوم ولا بعدين؟
- key: gdpr:art-92:para-4
  text: 78e6a634cdc22b22
  en:
  - When the Commission adopts a delegated act, who does it have to tell?
  - Does the Commission have to inform Parliament and Council at the same time about a new privacy rule?
  ar:
  - عندما تعتمد المفوضية عملاً مفوضاً، لمن يجب أن تبلغه وبأي طريقة؟
  - هل يجب على المفوضية إخطار البرلمان والمجلس في الوقت نفسه بالقاعدة الجديدة؟
  - المفوضية لما تصدر قاعدة جديدة، لازم تبلّغ البرلمان والمجلس مع بعض ولا كل واحد لحاله؟
- key: gdpr:art-92:para-5
  text: 2280deba8a1b1102
  en:
  - When does a new delegated rule from the Commission on icons or certification actually become effective?
  - How long do Parliament and Council have to object to a Commission rule before it takes effect?
  - Can the objection window be extended, so a rule we're preparing for might be delayed?
  ar:
  - متى يدخل العمل المفوض الصادر عن المفوضية حيز النفاذ فعلياً؟
  - كم مدة الاعتراض المتاحة للبرلمان والمجلس قبل أن تسري القاعدة الجديدة؟
  - هل ممكن تتمدد فترة الاعتراض؟ يعني القاعدة اللي نستناها ممكن تتأخر؟
- key: gdpr:art-93:para-1
  text: 9ef90c67c31780fd
  en:
  - Which committee helps the European Commission when it makes implementing decisions on data protection,
    like deciding which countries are safe for transfers?
  - We run a SaaS and want to know who supports the Commission when it adopts implementing rules affecting
    our data transfers. Is there a formal committee?
  - Is the committee assisting the Commission under the data protection rules an ordinary comitology committee
    under the general EU rules on implementing powers?
  ar:
  - ما هي اللجنة التي تساعد المفوضية الأوروبية عند اعتماد قرارات تنفيذية تخص حماية البيانات؟
  - نحن شركة برمجيات ونريد معرفة هل توجد لجنة رسمية تدعم المفوضية في إصدار القواعد التنفيذية المتعلقة
    بنقل البيانات، وعلى أي لائحة تستند؟
  - مين اللجنة اللي تساعد المفوضية الأوروبية لما تصدر قرارات تنفيذية عن حماية البيانات؟ وهل هي لجنة عادية
    حسب قواعد الاتحاد؟
- key: gdpr:art-93:para-2
  text: c076ab1071a60d22
  en:
  - Which EU procedure applies when the Commission adopts an implementing act and the examination procedure
    is the one referred to?
  - Does the standard examination procedure for implementing acts apply when the data protection rules
    point to this paragraph?
  ar:
  - ما الإجراء الذي يُطبق عندما تعتمد المفوضية قراراً تنفيذياً ويتم الإحالة إلى هذه الفقرة؟
  - شو الإجراء اللي ينطبق لما القرار التنفيذي يحيل على هذي الفقرة، هل هو إجراء الفحص العادي؟
- key: gdpr:art-93:para-3
  text: 4f46e8911f600674
  en:
  - What happens when the Commission needs to adopt an immediate implementing act on data protection because
    of urgency, such as suspending a transfer arrangement our company relies on?
  - Which procedure covers urgent Commission decisions that apply immediately in data protection, and
    how does it relate to the normal examination procedure?
  - Can the Commission adopt a data protection implementing act right away without waiting for the committee
    vote in urgent cases?
  ar:
  - ماذا يحدث عندما تحتاج المفوضية إلى اعتماد قرار تنفيذي فوري في حماية البيانات لأسباب ملحّة، كتعليق
    ترتيب نقل بيانات تعتمد عليه شركتنا؟
  - ما الإجراء الذي يغطي القرارات العاجلة للمفوضية التي تسري فوراً، وكيف يرتبط بإجراء الفحص المعتاد؟
  - هل المفوضية تقدر تصدر قرار تنفيذي فوراً بدون ما تنتظر تصويت اللجنة لو الحالة مستعجلة؟
- key: gdpr:art-94:para-1
  text: 9dd874ebf0709df6
  en:
  - Is the old 1995 EU data protection directive still in force, or has it been replaced?
  - Our privacy policy still cites the old EU data protection directive from the 90s. Is that outdated?
  - From what date did the previous EU data protection rules stop applying?
  ar:
  - هل التوجيه الأوروبي القديم لحماية البيانات لعام 1995 ما زال ساريًا أم تم إلغاؤه؟
  - ما هو التاريخ الذي توقف فيه العمل بالتوجيه السابق الخاص بحماية البيانات الشخصية في الاتحاد الأوروبي؟
  - موقعنا لسا يذكر القانون الأوروبي القديم من التسعينات في سياسة الخصوصية، هو لسا شغال ولا انلغى؟
- key: gdpr:art-94:para-2
  text: ee89810a4f4c1d39
  en:
  - Our old contracts mention the 1995 data protection directive. Do those references now point to the
    GDPR?
  - A vendor agreement cites the Article 29 Working Party. Who does that mean now?
  - Which body replaced the Article 29 Working Party for guidance on data protection in our app?
  ar:
  - عقودنا القديمة تشير إلى توجيه حماية البيانات لعام 1995، فهل تُعتبر هذه الإشارات الآن إشارة إلى اللائحة
    العامة لحماية البيانات؟
  - من هي الجهة التي حلّت محل مجموعة العمل المادة 29 في المسائل المتعلقة بحماية البيانات؟
  - في اتفاقية قديمة مع مزود خدمة مكتوب فيها مجموعة العمل حسب المادة 29، هل نقرأها الحين على أنها المجلس
    الأوروبي لحماية البيانات؟
- key: gdpr:art-95
  text: 67acd08fc1959982
  en:
  - We run a small VoIP and messaging service for the public. Do we have to follow extra data protection
    duties on top of the telecom privacy rules that already cover the same thing?
  - Our company is a telecom provider offering internet and SMS to consumers across the EU. If the ePrivacy
    rules already set an obligation for traffic data, does GDPR add another one on top?
  - Does GDPR pile new requirements onto public electronic communications providers where the older e-privacy
    directive already has specific rules with the same goal?
  ar:
  - نحن شركة اتصالات تقدم خدمة الإنترنت والرسائل النصية للعموم في الاتحاد الأوروبي. هل يفرض علينا النظام
    العام لحماية البيانات التزامات إضافية في المسائل التي تنظمها أصلاً توجيه الخصوصية الإلكترونية؟
  - هل يُحمّل اللائحة مقدمي خدمات الاتصالات الإلكترونية المتاحة للجمهور واجبات جديدة عندما تكون هناك التزامات
    خاصة بالهدف نفسه في التوجيه 2002/58؟
  - عندنا تطبيق مكالمات ورسائل للناس، وفيه قواعد خصوصية الاتصالات القديمة. هل لازم نطبق التزامات زيادة
    من GDPR على نفس الشي ولا القواعد الخاصة هي اللي تمشي؟
- key: gdpr:art-96
  text: e853b226dd207540
  en:
  - Our company relies on an old data-transfer treaty that a EU country signed with a non-EU country back
    in 2015. Is it still valid, or do we need to redo everything?
  - Do bilateral agreements on sending personal data abroad that were signed before the GDPR came into
    effect still apply?
  - When does an older government agreement on sharing user data with another country stop being valid,
    and what condition did it have to meet?
  ar:
  - هل الاتفاقيات الدولية التي أبرمتها دولة عضو قبل مايو 2016 بخصوص نقل البيانات الشخصية إلى دول خارج
    الاتحاد الأوروبي ما زالت سارية المفعول؟
  - تطبيقنا يرسل بيانات المستخدمين إلى دولة ثالثة بناءً على اتفاقية قديمة قبل 2016، هل نقدر نكمل نعتمد
    عليها ولا لازم نغيّر شي؟
  - متى تنتهي صلاحية الاتفاقية القديمة لنقل البيانات للخارج، وشو الشرط اللي لازم تحققه عشان تظل شغالة؟
- key: gdpr:art-97:para-1
  text: 24ff9f6b2e7f4f52
  en:
  - How often does the EU Commission review the data protection rules, and are the results published?
  - We're planning our product's privacy roadmap for the next few years. Is there a regular scheduled
    evaluation of the EU data protection law that could change our obligations?
  - Can I read the official periodic report that the EU gives to Parliament and the Council about how
    the privacy regulation is working?
  ar:
  - كل كم سنة تقوم المفوضية الأوروبية بتقييم ومراجعة لائحة حماية البيانات، وهل تنشر تقاريرها للعامة؟
  - نخطط لتطوير تطبيقنا على المدى البعيد، فهل هناك مراجعة دورية رسمية للائحة الخصوصية الأوروبية قد تغيّر
    التزاماتنا؟
  - كل كم سنة يطلعون تقرير عن تطبيق قانون الخصوصية الأوروبي؟ وهل أقدر أقراه علنًا؟
- key: gdpr:art-97:para-2
  text: 82b2c1aecdeab2ad
  en:
  - What parts of the EU privacy law does the Commission look at most closely when it reviews how the
    law is working?
  - Our SaaS sends user data abroad and works with regulators in several countries. Which areas are specifically
    checked in the official periodic review?
  - Which topics are the focus whenever the EU evaluates the data protection regulation?
  ar:
  - ما هي الجوانب التي تركّز عليها المفوضية الأوروبية بشكل خاص عند مراجعة تطبيق لائحة حماية البيانات؟
  - تطبيقنا يرسل بيانات المستخدمين إلى خارج أوروبا ونتعامل مع عدة جهات رقابية، فما المحاور التي يفحصها
    التقييم الدوري تحديدًا؟
  - شو الأشياء اللي بتركز عليها المفوضية لما تراجع قانون الخصوصية؟
- key: gdpr:art-97:para-2:pt-a
  text: d8084f1090c370a0
  en:
  - Does the EU review check whether the list of countries approved for receiving personal data is working
    well?
  - We store customer data on servers outside the EU and depend on an adequacy decision. Could that decision
    be re-examined in the periodic review?
  - Are older adequacy decisions from before the current regulation also reviewed when the Commission
    evaluates international data transfers?
  ar:
  - هل تشمل مراجعة المفوضية فحص قرارات الكفاية للدول المسموح نقل البيانات الشخصية إليها؟
  - نعتمد على قرار كفاية لتخزين بيانات عملائنا على خوادم خارج الاتحاد الأوروبي، فهل يمكن إعادة النظر فيه
    ضمن التقييم الدوري؟
  - هل المراجعة بتشمل كمان قرارات الدول القديمة اللي انعملت قبل القانون الحالي لنقل البيانات برا أوروبا؟
- key: gdpr:art-97:para-2:pt-b
  text: 5d6645e97cf528d9
  en:
  - Does the Commission's periodic review look at how national data protection authorities cooperate with
    each other?
  - Our app operates in several EU countries and we deal with multiple regulators. Is the consistency
    between them part of the official evaluation?
  - Is the one-stop-shop and regulator coordination mechanism reviewed by the EU periodically?
  ar:
  - هل تشمل المراجعة الدورية للمفوضية تقييم تعاون سلطات حماية البيانات الوطنية فيما بينها وتناسق قراراتها؟
  - يعمل تطبيقنا في عدة دول أوروبية ونتعامل مع أكثر من جهة رقابية، فهل يدخل التنسيق بينها ضمن التقييم
    الرسمي؟
  - هل آلية التعاون بين الجهات الرقابية في الدول الأوروبية بتنراجع بشكل دوري؟
- key: gdpr:art-97:para-3
  text: 3bf69576c78c815b
  en:
  - Can the EU Commission ask national regulators for information when it prepares its review of the privacy
    law?
  - Could the Commission demand data from member states about how privacy rules are being applied in practice?
  - Our local data protection authority was contacted for input on the law's evaluation. Is the Commission
    allowed to request that?
  ar:
  - هل يحق للمفوضية الأوروبية أن تطلب معلومات من الدول الأعضاء والسلطات الرقابية أثناء إعداد تقرير مراجعة
    اللائحة؟
  - هل تستطيع المفوضية أن تطلب من الدول الأعضاء بيانات عن كيفية تطبيق قواعد الخصوصية عمليًا؟
  - الجهة الرقابية عندنا انطلب منها معلومات عشان تقييم القانون، هل المفوضية تقدر تطلب هيك؟
- key: gdpr:art-97:para-4
  text: ae25d045187d67f6
  en:
  - Whose opinions does the Commission have to consider when it reviews the data protection regulation?
  - Do industry feedback and findings from the European Parliament count when the EU evaluates the privacy
    law?
  - As a startup, can our input influence the periodic review, or does the Commission only consider certain
    bodies and sources?
  ar:
  - ما هي الآراء والجهات التي يجب على المفوضية أخذها بالاعتبار عند تقييم لائحة حماية البيانات؟
  - هل تؤخذ مواقف البرلمان الأوروبي والمجلس ومصادر أخرى بعين الاعتبار أثناء مراجعة قانون الخصوصية؟
  - كشركة ناشئة، هل ممكن ملاحظاتنا تأثر في المراجعة الدورية ولا بس جهات معينة بتنسمع؟
- key: gdpr:art-97:para-5
  text: e7a51d40085b3950
  en:
  - Can the EU change the data protection law to keep up with new technology like AI?
  - Is the Commission allowed to propose amendments to the privacy regulation after its review?
  - We're worried the privacy rules might change soon because tech is moving fast. Is there a mechanism
    for updating the law?
  ar:
  - هل يمكن للاتحاد الأوروبي تعديل لائحة حماية البيانات لتواكب التطورات التقنية مثل الذكاء الاصطناعي؟
  - هل يحق للمفوضية اقتراح تعديلات على اللائحة بعد المراجعة؟
  - قلقانين إن قوانين الخصوصية تتغير قريب لأن التكنولوجيا تتطور بسرعة، فيه آلية لتحديث القانون؟
- key: gdpr:art-98
  text: 597e7dd01db8af31
  en:
  - Is the European Commission supposed to change other EU data protection rules so they line up with
    the main privacy regulation?
  - Our SaaS works with an EU agency as a customer, and I'm wondering whether the rules for how EU institutions
    handle personal data are going to be updated to match the general ones.
  - Will there be proposals to amend other EU laws on personal data so protection is consistent across
    the board?
  ar:
  - هل يتعين على المفوضية الأوروبية تعديل التشريعات الأوروبية الأخرى المتعلقة بحماية البيانات الشخصية
    لتتوافق مع اللائحة العامة؟
  - نقدم خدمة برمجية لمؤسسة تابعة للاتحاد الأوروبي، فهل ستُعدَّل القواعد الخاصة بمعالجة هذه المؤسسات للبيانات
    الشخصية لتتماشى مع القواعد العامة؟
  - هل المفوضية الأوروبية لازم تقترح تعديلات على القوانين الثانية الخاصة بالبيانات الشخصية عشان الحماية
    تصير موحدة؟
- key: gdpr:art-99:para-1
  text: d014209f8e1ebaea
  en:
  - How many days after being published in the EU's official journal did the data protection regulation
    become legally effective?
  - When did the GDPR officially come into force, as opposed to when companies had to actually follow
    it?
  - Our legal intern says the privacy rules were 'in force' before they applied to our app. What was the
    trigger date for entry into force?
  ar:
  - متى دخلت اللائحة العامة لحماية البيانات حيز النفاذ بعد نشرها في الجريدة الرسمية للاتحاد الأوروبي؟
  - كم يوم بعد النشر صارت لائحة حماية البيانات سارية رسمياً؟
  - هو القانون بتاع الخصوصية بدأ يسري بعد كم يوم من نشره في الجريدة الرسمية؟ يعني متى دخل حيز التنفيذ؟
- key: gdpr:art-99:para-2
  text: e1634984b0234ef5
  en:
  - From what date did my online shop have to comply with the EU data protection rules?
  - What is the deadline date after which GDPR enforcement could apply to our app's handling of user data?
  - Was there a grace period before the privacy regulation applied, and when did it end?
  ar:
  - ما هو التاريخ الذي أصبحت فيه اللائحة العامة لحماية البيانات واجبة التطبيق على الشركات؟
  - من أي تاريخ لازم يكون تطبيقنا ملتزم بقواعد الخصوصية الأوروبية؟
  - كان فيه فترة سماح قبل ما يبدأ تطبيق GDPR؟ وإمتى خلصت؟
